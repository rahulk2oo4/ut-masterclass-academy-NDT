tems:center;box-shadow:0 0 0 19px #ffffff08,0 0 0 38px #ffffff05;background:radial-gradient(circle at 40% 35%,#c1836b55,transparent 65%);font-size:32px}.art-caption{font-size:13px;color:#f5e0e4}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:26px}.stat{border:1px solid var(--line);border-radius:20px;background:#fff;padding:23px 24px 22px;min-height:174px;box-shadow:0 16px 35px #5a26300a}.stat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:#8b7c7d;font-size:14px}.stat-icon{width:40px;height:40px;border-radius:12px;background:var(--pale);color:var(--orange);display:grid;place-items:center;font-size:17px}.stat-number{font-size:34px;font-weight:850;line-height:1.2;margin:13px 0 13px;letter-spacing:-1px}.stat-foot{font-size:13px;color:#897c7d}.section-head{display:flex;justify-content:space-between;align-items:center;margin:45px 0 19px;gap:20px}.section-head h2{font-size:24px;letter-spacing:-.6px;margin:0}.text-link{border:0;background:none;color:var(--orange);font-weight:800}.method-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.method{background:#fff;border:1px solid var(--line);border-radius:19px;padding:23px;display:flex;flex-direction:column;min-height:200px}.method-tag{font-size:11px;letter-spacing:1.4px;font-weight:850;color:var(--orange)}.method h3{font-size:19px;margin:13px 0 9px}.method p{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 20px}.method .btn{margin-top:auto;align-self:flex-start;padding:12px 15px}.page-title{font-size:32px;letter-spacing:-1px;margin:6px 0 8px}.page-desc{color:var(--muted);line-height:1.65;margin:0 0 25px}.toolbar{display:flex;gap:12px;margin:22px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;background:white;padding:13px 15px;color:var(--ink)}.lesson-list{display:grid;gap:12px}.lesson-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.lesson-row h3{margin:0 0 6px;font-size:16px}.lesson-row p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.pill{background:var(--pale);color:var(--orange);border-radius:30px;padding:7px 11px;font-size:12px;font-weight:750;white-space:nowrap}.lesson-body{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;line-height:1.8}.lesson-body h3{margin-top:25px}.formula-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.formula-card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px}.formula{font-size:22px;font-weight:800;margin:15px 0;color:var(--wine)}.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.calc input{width:100px;padding:10px;border:1px solid var(--line);border-radius:9px}.result{font-weight:800;color:var(--orange);margin-top:12px}.question{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;margin-bottom:14px}.question h3{margin:0 0 15px;font-size:17px}.option{display:block;margin:10px 0;color:#66575a}.option input{margin-right:9px;accent-color:var(--orange)}.notice{padding:15px 17px;border-radius:12px;background:#fff0e5;color:var(--ink);margin:16px 0;line-height:1.6}.certificate{border:8px double #7c3044;background:white;padding:35px;text-align:center;max-width:780px;margin:10px auto}.certificate h2{font-size:31px;color:var(--wine)}.certificate .cert-name{font-size:27px;font-weight:800;margin:25px}.empty{padding:30px;text-align:center;border:1px dashed #d9bfb6;border-radius:16px;color:var(--muted);background:#fff}

<script>
const methods=[
{name:"Ultrasonic Testing (UT)",short:"UT FUNDAMENTALS",desc:"Sound waves, probes, calibration, signal interpretation and conventional ultrasonic inspection.",lessons:["Introduction to NDT","Principles of ultrasonic testing","Sound waves and propagation","Ultrasonic probes and transducers","Instrument controls and calibration","A-scan interpretation","Thickness measurement","Defects, limitations and safety"]},
{name:"Phased Array UT (PAUT)",short:"ADVANCED UT",desc:"Understand phased-array probes, beam steering, focal laws, scan plans and encoded inspection.",lessons:["PAUT fundamentals","Array probes and elements","Beam steering and focusing","Focal laws","S-scan and sectorial views","Calibration and sensitivity","Scan plans and reporting"]},
{name:"Time of Flight Diffraction (TOFD)",short:"ADVANCED UT",desc:"Learn TOFD setup, lateral waves, back-wall signals, diffraction tips and sizing concepts.",lessons:["TOFD principles","Probe arrangement","Lateral and back-wall waves","Calibration and PCS","Image interpretation","Defect sizing and limitations"]},
{name:"Radiographic Testing (RT)",short:"RADIOGRAPHY",desc:"Radiation basics, image quality, exposure variables, film/digital systems and safety.",lessons:["Radiographic principles","X-ray and gamma sources","Image quality indicators","Exposure and geometry","Film and digital radiography","Interpretation and safety"]},
{name:"Magnetic Particle Testing (MT)",short:"SURFACE METHODS",desc:"Magnetisation, field direction, particles, indications and demagnetisation.",lessons:["MT principles","Magnetic fields","Magnetisation methods","Particles and media","Indication interpretation","Limitations and safety"]},
{name:"Liquid Penetrant Testing (PT)",short:"SURFACE METHODS",desc:"Surface preparation, penetrant systems, dwell time, removal, development and evaluation.",lessons:["PT principles","Materials and penetrants","Surface preparation","Process sequence","Indication evaluation","Limitations and safety"]},
{name:"Visual Testing (VT)",short:"FOUNDATION",desc:"Visual inspection principles, lighting, viewing conditions, tools and documentation.",lessons:["Visual inspection basics","Lighting and viewing","Optical aids","Surface conditions","Acceptance and reporting"]},
{name:"Eddy Current Testing (ECT)",short:"ELECTROMAGNETIC",desc:"Electromagnetic induction, coils, impedance, lift-off, conductivity and signal analysis.",lessons:["ECT principles","Electromagnetic induction","Coils and impedance","Frequency and skin effect","Calibration and interpretation","Applications and limitations"]},
{name:"Leak Testing (LT)",short:"LEAK / INTEGRITY",desc:"Pressure, vacuum, bubble and tracer-gas methods for locating leakage paths.",lessons:["Leak testing principles","Pressure and vacuum methods","Bubble and liquid techniques","Tracer gas and detector methods","Calibration, sensitivity and procedure","Interpretation, reporting and safety"]},
{name:"Acoustic Emission Testing (AE)",short:"MONITORING",desc:"Transient elastic waves from active damage and sensor-based monitoring.",lessons:["AE fundamentals","Sources and wave propagation","Sensors and instrumentation","Sensor location and monitoring plans","Signal features and data interpretation","Applications, limitations and safety"]},
{name:"Infrared Thermography (IRT)",short:"THERMAL",desc:"Thermal radiation, emissivity, active/passive inspection and thermal patterns.",lessons:["Thermography principles","Heat transfer and emissivity","Thermal cameras and setup","Active and passive thermography","Thermogram interpretation","Applications, limitations and safety"]},
{name:"Computed and Digital Radiography (CR / DR)",short:"DIGITAL RADIOGRAPHY",desc:"Imaging plates, flat-panel detectors, image quality and digital processing.",lessons:["Digital radiography fundamentals","CR imaging plates and readers","DR detector technologies","Image acquisition and quality","Image processing and interpretation","Data management and radiation safety"]},
{name:"NDT Foundations and Method Selection",short:"CROSS-METHOD",desc:"Compare methods, discontinuities, procedures, quality systems and reporting.",lessons:["Discontinuities and defects","NDT method families","Selecting the right method","Inspection procedures and essential variables","Personnel, quality and traceability","Evaluation, reporting and ethics"]}
];
const lessonText={
"Introduction to NDT":"Non-destructive testing (NDT) evaluates a material, component or assembly without impairing its future usefulness. It supports quality assurance, maintenance and fitness-for-service decisions. Common methods include UT, RT, MT, PT, VT and ECT.",
"Principles of ultrasonic testing":"Ultrasonic testing introduces high-frequency mechanical waves into a test object and analyses reflected or transmitted energy. Changes in acoustic impedance at boundaries can produce reflections. Results depend on material, geometry, probe characteristics, coupling and instrument settings.",
"Sound waves and propagation":"Ultrasound propagates as mechanical vibration. Longitudinal waves involve particle motion parallel to propagation; shear waves involve motion perpendicular to propagation. Velocity depends on material properties and wave mode. Interfaces can cause reflection, transmission, refraction and mode conversion.",
"Ultrasonic probes and transducers":"A transducer converts electrical energy into mechanical vibration and returning vibration into an electrical signal. Probe selection considers frequency, element size, bandwidth, beam spread, near field, resolution and material attenuation. Couplant helps transfer sound across the probe-to-part interface.",
"Instrument controls and calibration":"Calibration establishes the relationship between instrument indications and known reference distances or responses. Verify range, zero, velocity and sensitivity with suitable reference blocks and documented procedures. Calibration must represent the inspection geometry and applicable code or specification.",
"A-scan interpretation":"An A-scan displays signal amplitude against time or sound path. The initial pulse, back-wall response and intermediate indications are interpreted using calibrated range, expected geometry and scan movement. Amplitude alone does not identify defect type; evaluation requires context and procedure requirements."
};

const courseBooks=[
{subtitle:"Conventional ultrasonic examination",principle:"A piezoelectric probe converts an electrical pulse into a short mechanical stress wave. The wave travels through the component and is reflected, scattered or transmitted when it meets a boundary or a change in acoustic properties. The instrument measures returning energy against time; calibrated time is related to sound path and position.",physics:"Acoustic impedance is Z = density × wave velocity. At an interface with different impedance, part of the wave is reflected and part transmitted. In pulse-echo a probe commonly transmits and receives; in through-transmission, separate transmitter and receiver probes assess energy that passes through the part.",equipment:["Flaw detector: generates pulses, receives echoes and displays an A-scan.","Probe / transducer: converts electrical and mechanical energy; frequency and element size influence beam behaviour.","Wedge and couplant: introduce sound at the intended angle and reduce air gaps.","Reference block: provides known reflectors or thicknesses for range and sensitivity checks.","Scanner / encoder: records position for encoded inspection."],workflow:["Review drawing, material, thickness, access, inspection volume and written procedure.","Prepare surface; verify instrument, probe, cables, wedge and couplant condition.","Set material velocity and range; establish zero or wedge delay as applicable.","Calibrate sensitivity using the specified reference reflector and transfer corrections where required.","Scan using required directions, overlap, index and speed while monitoring coupling and coverage.","Evaluate against procedure; record location, sound path, amplitude, dimensions and limitations."],variables:["Frequency: higher frequency can improve resolution but usually increases attenuation and sensitivity to surface condition.","Probe diameter and bandwidth affect beam spread, near field and resolution.","Poor coupling, roughness, curvature or coating can reduce transmission.","Grain size, anisotropy, attenuation and velocity influence penetration and beam direction.","Planar flaw orientation relative to the beam strongly affects detection.","Gain and gates change display sensitivity; they do not improve the physical sound field."],interpretation:"Read an A-scan in context: identify the initial pulse, expected geometry echoes and intermediate responses. Use time-of-flight and calibrated range to locate reflectors; compare amplitude only after the required calibration. Move the probe to see how a signal changes, confirm from another direction where practical, and distinguish a relevant indication from geometry, mode conversion, coupling or noise. An A-scan peak alone does not prove a particular flaw type.",example:"For a 25 mm steel thickness in pulse-echo, round-trip time t = 2d/c. With an illustrative longitudinal velocity of 5,920 m/s, t is approximately 8.45 µs. A real inspection must use the velocity and zero calibration appropriate to the actual material, temperature, probe and instrument.",limits:["Near-surface dead zones can hide shallow reflectors.","Coarse-grained, austenitic or anisotropic structures may scatter or distort the beam.","Orientation, access, geometry and coupling can create missed coverage.","Sizing and acceptance must follow the applicable procedure and code; amplitude alone is not an acceptance decision."],safety:["Follow site controls for access, work at height, electrical equipment and couplant handling.","Keep cables, water and couplant from creating slip or trip hazards."],terms:["A-scan: amplitude versus time / sound-path display.","Couplant: medium that displaces air between probe and surface.","Acoustic impedance: density multiplied by wave velocity.","Dead zone: region near the entry surface where indications may not be resolved reliably.","Transfer correction: adjustment for differences between reference and test surfaces or materials."],refs:[["TWI – Ultrasonic examination","https://www.twi-global.com/technical-knowledge/job-knowledge/ultrasonics-examination-part-3-129"],["ASNT – What is NDT?","https://www.asnt.org/what-is-nondestructive-testing"]]},
{subtitle:"Phased-array ultrasonic testing",principle:"A phased-array probe contains multiple small piezoelectric elements. The instrument fires selected elements with programmed time delays. Their wavelets combine to form a beam at a chosen angle and focus. Changing the delay law lets the system steer, focus or electronically translate the beam without physically moving a single-element probe through every angle.",physics:"Progressive delays across the aperture steer the wavefront; a curved delay pattern makes waves arrive together at a focal point. A focal law is the calculated set of element delays and active aperture for one beam. Sectorial scanning changes angle; electronic scanning moves the active aperture along the array.",equipment:["Array probe: linear group of independently addressable piezoelectric elements.","Wedge: provides coupling and controls refraction into the component.","PAUT instrument: pulser / receiver channels, delay-law generation and acquisition.","Encoder and scanner: attach scan position to each acquisition.","Calibration blocks: verify wedge delay, sensitivity, beam angle and system performance."],workflow:["Define weld geometry, material, thickness, access and target flaw orientations.","Select probe, wedge, element pitch, aperture, frequency and scan plan.","Create focal laws for required angles, depths and coverage; check physical feasibility.","Calibrate wedge delay, range, sensitivity and reference responses using the specified block.","Verify coverage and beam positions; scan with controlled index, skew, overlap and encoder settings.","Review S-scan / sectorial data with A-scan information, evaluate and document."],variables:["Element pitch and frequency influence steering range, grating lobes and beam quality.","Active aperture and number of elements influence beam width and sensitivity.","Wedge angle, velocity and temperature affect refracted angle and delay.","Focal depth and focal-law range affect beam-energy concentration.","Scan index, skew, encoder resolution and coupling determine coverage and data integrity.","Poorly chosen laws may create grating lobes, side lobes or weak sensitivity."],interpretation:"A sectorial S-scan displays many beam angles from one probe position; an electronic scan displays successive apertures or positions. Read the image with the A-scan and component geometry. Check whether an indication aligns with a plausible reflector, weld feature, root or cap, and review it across adjacent angles and scan positions. Image brightness is not a standalone defect classification.",example:"A butt-weld scan may use a sectorial set of refracted shear-wave angles to interrogate the weld volume from one side. The correct angle range, focal depth and probe placement depend on thickness, bevel design, material, access and the written procedure; no single setting suits every weld.",limits:["Images depend on a correct model, wedge data, velocity and focal laws.","Near-surface, root and cap regions may need additional probes or scan positions.","Complex geometry, anisotropy and coarse grains can degrade beam formation.","Encoded images do not remove the need for calibration, coverage verification or qualified interpretation."],safety:["Use approved electrical, mechanical and site controls for scanners and cables.","Follow couplant handling and access controls; secure equipment on elevated or curved components."],terms:["Element: an individual piezoelectric segment.","Aperture: active group of elements used for a focal law.","Focal law: programmed element delays and active aperture.","Sectorial scan: image assembled over a range of beam angles.","Grating lobe: unwanted beam energy caused by array sampling."],refs:[["TWI – What is PAUT?","https://www.twi-global.com/technical-knowledge/faqs/what-is-phased-array-ultrasonic-testing"],["TWI – PAUT beam manipulation","https://www.twi-global.com/technical-knowledge/faqs/faq-in-ultrasonic-testing-ut-how-is-the-beam-manipulated-in-a-phased-array-system"]]},
{subtitle:"Time of Flight Diffraction",principle:"TOFD is a pitch-catch ultrasonic technique. A transmitter and receiver are placed on opposite sides of a weld. The receiver records the lateral wave travelling along the near surface, the back-wall reflection and diffracted waves from discontinuity tips. Time-of-flight differences are used to estimate tip position and through-wall height.",physics:"A crack tip scatters incident ultrasound over a range of directions. Upper- and lower-tip signals can be timed relative to the lateral and back-wall signals. With known probe separation (PCS), material velocity and geometry, the instrument applies a time-of-flight model. TOFD sizing is based on arrival time, not simply signal amplitude.",equipment:["Matched transmitter and receiver probes, commonly wide-angle longitudinal-wave probes.","Wedges selected for surface and required beam spread.","TOFD instrument with suitable pulser, receiver, preamplifier and digitisation.","Scanner and encoder to maintain probe separation and record position.","Reference block / calibration arrangement for velocity, PCS, lateral-wave and range checks."],workflow:["Review weld thickness, geometry, access, material and expected flaw-height range.","Choose probe frequency, beam spread and PCS appropriate to thickness and procedure.","Position probes on opposite sides of the weld as specified.","Calibrate velocity, PCS, time base and scan position; verify lateral and back-wall responses.","Scan along the weld with consistent coupling, separation and encoder movement.","Review B-scan, identify lateral, tip-diffracted and back-wall signals, size within validated limits and report."],variables:["Probe frequency and beam spread affect tip diffraction and signal separation.","PCS and probe centring influence depth calculations and coverage.","Material velocity, temperature and anisotropy influence time-of-flight calculations.","Surface condition and coupling affect lateral-wave stability.","Thickness and near-surface / back-wall dead zones affect detectability.","Scan speed and encoder resolution affect image sampling."],interpretation:"In a typical TOFD B-scan, the lateral wave appears near the top and the back-wall signal near the bottom. A discontinuity can produce hyperbolic tip-diffraction patterns as probes pass it. Upper and lower tips may be sized from their flight times. Geometry echoes, dead zones and signal-to-noise limitations must be considered.",example:"If both upper- and lower-tip diffraction signals are resolved, their positions can be calculated and their vertical separation gives an estimate of flaw height. The calculation requires the actual probe separation, calibrated velocity and correct model; the display is not a universal sizing ruler.",limits:["Surface-breaking flaws can be obscured by the lateral-wave dead zone; near back-wall flaws can be obscured by the back-wall dead zone.","Small or unfavourably oriented flaws may produce weak diffraction.","Geometry, coarse grains and poor coupling can reduce clarity.","TOFD is commonly complemented by another method for difficult near-surface regions."],safety:["Control scanner movement and cable routing along the weld.","Apply site access, couplant and work-at-height requirements."],terms:["PCS: probe centre separation.","Lateral wave: direct near-surface wave between probes.","Back-wall wave: energy reflected from the far surface.","Tip diffraction: wave scattered from a discontinuity tip.","B-scan: cross-sectional image plotted against scan position."],refs:[["TWI – TOFD","https://www.twi-global.com/what-we-do/services-and-support/asset-management/non-destructive-testing/ndt-techniques/time-of-flight-diffraction"],["TWI – TOFD inspection paper","https://www.twi-global.com/technical-knowledge/published-papers/structural-integrity-with-time-of-flight-diffraction-tofd-ultrasonic-inspection-july-2005"]]},
{subtitle:"Film radiography and industrial radiographic testing",principle:"Radiographic testing passes X-rays or gamma rays through a component onto film or a digital detector. Different thicknesses, densities and material paths attenuate radiation differently, creating an image of transmitted intensity. Voids, inclusions or thickness changes may create contrast when size, orientation and exposure make them visible.",physics:"For a narrow monoenergetic beam, attenuation is introduced by I = I₀e^(−µx), where µ is the linear attenuation coefficient and x is path thickness. Real industrial beams are polychromatic and scatter, so exposure and contrast depend on source spectrum, material, geometry and detector response.",equipment:["X-ray set or sealed gamma source with controlled exposure operation.","Film cassette / intensifying screens or suitable digital detector.","Image quality indicator (IQI) and identification markers.","Source-to-object and object-to-detector positioning aids.","Densitometer / viewing station for film or validated digital display.","Radiation survey meter, personal dosimeters, barriers and warning systems."],workflow:["Confirm technique, material, thickness, geometry and acceptance requirements.","Select source type, energy, exposure geometry, film / detector and IQI as prescribed.","Set source-to-object and object-to-detector distances to control geometric unsharpness.","Position IQI and identification markers in the required location.","Establish a controlled radiation area and make exposure under authorised control.","Process or acquire image, assess quality, interpret indications and retain traceable records."],variables:["Radiation energy affects penetration and subject contrast.","Source size and geometric distances affect unsharpness.","Scatter reduces contrast; collimation and suitable technique reduce scatter.","Film processing or detector calibration affects image quality.","Thickness variation and IQI placement affect sensitivity.","Exposure time and source output determine adequate film density / detector signal."],interpretation:"Assess image quality before interpretation. Check identification, coverage, density or signal level, contrast, sharpness, IQI visibility and artefacts against procedure. Interpret shape, position and distribution relative to component geometry. A radiographic indication is an image feature; acceptance depends on the governing code and criteria.",example:"A gas pore in a weld may appear as a rounded dark indication on a film radiograph because the void attenuates less radiation than surrounding metal. A planar lack-of-fusion flaw may be difficult to see if its plane is unfavourably aligned with the radiation beam.",limits:["Planar flaws may be missed when orientation does not create useful thickness contrast.","Superimposition can mask indications.","Radiography requires access for source and detector and may require exclusion zones.","Large source size or poor geometry reduces sharpness."],safety:["Ionising radiation presents serious health risks. Only authorised, trained personnel may operate sources under the radiation protection programme and applicable law.","Use controlled areas, barriers, warning systems, surveys, dosimetry and emergency procedures.","Never approach or handle a source unless confirmed safe under the approved procedure."],terms:["IQI: image quality indicator demonstrating radiographic sensitivity.","Geometric unsharpness: edge blur caused by source size and imaging geometry.","Density: film darkening / optical transmission measure.","Scatter: radiation redirected within the part or surroundings.","SFD: source-to-film / detector distance."],refs:[["TWI – Radiographic quality","https://www.twi-global.com/technical-knowledge/faqs/faq-how-is-the-quality-a-radiograph-assessed"],["TWI – Radiography and IQIs","https://www.twi-global.com/technical-knowledge/job-knowledge/radiography-part-2-125"]]},
{subtitle:"Magnetic particle testing",principle:"MT detects surface and near-surface discontinuities in ferromagnetic materials. Magnetising the component creates magnetic flux. A discontinuity that interrupts the flux can cause leakage fields at the surface. Fine ferromagnetic particles applied to the surface are attracted to leakage fields and form a visible or fluorescent indication.",physics:"Flux leakage is strongest when a discontinuity is oriented approximately transverse to the magnetic field. Therefore, magnetisation in one direction may not reveal every crack orientation. Two approximately perpendicular field directions are often required for suitable coverage.",equipment:["Yoke, prods, coil, central conductor or bench unit to create the field.","AC, half-wave DC or other approved waveform depending on application.","Dry powder or wet visible / fluorescent magnetic particles.","UV-A lamp and ambient-light meter for fluorescent examination where required.","Field-strength indicator, pie gauge or other approved adequacy check.","Cleaning and demagnetisation equipment where required."],workflow:["Verify the material is ferromagnetic and define the examination area.","Clean the surface; remove coatings or contaminants that mask indications.","Choose magnetising method and direction to make likely flaws transverse to the field.","Apply particles during or after magnetisation according to the technique.","Observe under specified visible-light or UV-A conditions while maintaining the field.","Repeat in another direction if required; evaluate, record, demagnetise and protect."],variables:["Field direction relative to flaw orientation is critical.","Field strength must be adequate but excessive magnetisation can create background build-up.","AC is generally suited to surface-focused examination; rectified / DC techniques can provide greater subsurface penetration depending on procedure.","Particle type, concentration, mobility and application timing influence indications.","Surface roughness, coating, geometry and section thickness affect interpretation.","Lighting and UV-A conditions must meet the written procedure."],interpretation:"A relevant indication is a particle pattern associated with a discontinuity. Linear patterns may suggest crack-like features; rounded patterns can arise from porosity or geometry, but MT does not directly reveal the flaw itself. Evaluate shape, location, repeatability, field direction and geometry. Non-relevant patterns can arise from section changes, weld profile and local flux concentrations.",example:"A surface crack running parallel to the magnetising field may produce weak leakage and be missed. Reorienting the field approximately 90 degrees can make the same crack transverse to the field and produce a stronger particle indication.",limits:["Only ferromagnetic materials can be examined effectively.","Most sensitive to surface and near-surface discontinuities.","Thick coatings, scale, roughness and complex geometry can impair detection.","Field direction and strength must be controlled."],safety:["Follow electrical safety for magnetising equipment; inspect cables, prods and yokes.","Control UV-A exposure and ambient-light conditions; do not look directly into UV sources.","Handle particle carriers and cleaners according to safety data sheets."],terms:["Flux leakage: magnetic field escaping near a discontinuity.","Continuous technique: particles are applied while field is active.","Residual technique: particles are applied after magnetisation.","Ferromagnetic: material that can be strongly magnetised.","Demagnetisation: reducing residual magnetism when required."],refs:[["TWI – Principles of magnetic particle inspection","https://www.twi-global.com/technical-knowledge/faqs/faq-what-are-the-principles-of-magnetic-particle-inspection-mpi-in-non-destructive-examination"]]},
{subtitle:"Liquid penetrant testing",principle:"PT reveals discontinuities open to the surface in clean, non-porous materials. A liquid penetrant wets the surface and enters narrow openings by capillary action. After excess surface penetrant is removed, developer draws penetrant back out and spreads it to create a visible or fluorescent indication.",physics:"Capillary entry depends on surface tension, contact angle, viscosity, opening geometry and cleanliness. Penetrant cannot reliably reveal a flaw sealed beneath the surface. Mechanical smearing, paint, oxide, oil or residues can block an opening.",equipment:["Approved penetrant system: visible red dye or fluorescent penetrant.","Cleaner / remover compatible with the selected process.","Developer appropriate to the penetrant system, such as dry powder or non-aqueous wet developer.","Lighting: visible white light or UV-A and ambient-light controls as specified.","Timers, temperature checks and approved lint-free cloths / wash equipment."],workflow:["Pre-clean the part and dry it; ensure openings are not blocked.","Apply penetrant uniformly and allow the specified dwell time without letting it dry.","Remove excess penetrant from the surface using the correct method; do not flush it from defects.","Dry if required and apply a thin, even developer layer.","Allow development time, then inspect under specified lighting and environmental conditions.","Evaluate and record indications; post-clean and protect as required."],variables:["Surface cleanliness and open flaw mouths are essential.","Penetrant wetting, viscosity and temperature affect entry.","Dwell time depends on material, defect, process and manufacturer / procedure; it is not universal.","Excessive washing can remove penetrant from defects; insufficient removal creates background.","Developer thickness and time influence indication bleed-out.","Lighting and observer adaptation affect visible / fluorescent examination."],interpretation:"The indication is the penetrant bleed-out pattern, not a direct measurement of flaw opening or depth. Linear indications can be associated with cracks, seams or laps; rounded indications can arise from porosity. Evaluate relevant versus non-relevant patterns, location, alignment, size and specified acceptance criteria.",example:"A narrow surface crack in a clean aluminium component may retain penetrant during dwell. After careful excess removal and developer application, penetrant bleeds back out as a fine linear indication. Mechanical smearing that closes the crack mouth can make the indication weak or absent.",limits:["Only discontinuities open to the surface can be detected.","Porous, rough or contaminated surfaces may create high background.","PT does not determine flaw depth and may not reveal tightly closed or blocked defects.","Chemical compatibility must be checked."],safety:["Use suitable ventilation and PPE for cleaners, solvents and aerosols.","Keep products away from incompatible surfaces and ignition sources as specified by safety data sheets.","Dispose of chemical waste under site procedures."],terms:["Dwell time: time penetrant remains in contact with surface.","Developer: material that draws penetrant out and increases visibility.","Bleed-out: penetrant emerging from a discontinuity during development.","Wetting: ability of liquid to spread over a surface.","Relevant indication: indication attributable to a discontinuity of interest."],refs:[["TWI India – Penetrant testing process","https://www.twi-global.com/locations/india/news-and-events/news/2024/understanding-penetrant-testing-key-steps-and-benefits"],["IRICEN – NDT technical reference","https://iricen.gov.in/iricen/books_jquery/ndt_book_for_printing17022015.pdf"]]},
{subtitle:"Visual testing and examination",principle:"VT uses direct observation or optical instruments to inspect accessible surfaces and visible features. The inspector uses lighting, viewing geometry, visual acuity and suitable aids to identify surface discontinuities, dimensional deviations, corrosion, damage and workmanship conditions. VT is also an essential first examination before many other NDT methods.",physics:"Light reflected from the surface enters the eye or camera. Surface finish changes specular and diffuse reflection, while contrast, focus, viewing angle and illumination affect whether a feature can be distinguished. Direct VT requires a suitable line of sight; remote VT uses cameras, borescopes or video probes.",equipment:["Lighting with suitable intensity, direction and glare control.","Mirrors, magnifiers, measurement scales and weld gauges.","Borescope / videoscope, camera, probe and display for remote access.","Reference photographs, drawings, checklists and calibrated measuring tools.","Access equipment and surface preparation materials."],workflow:["Review inspection scope, drawing, acceptance criteria and areas of interest.","Confirm surface access and cleanliness; identify restrictions.","Check lighting, viewing distance, angle, focus and optical aids.","Inspect systematically using a defined path and adequate overlap.","Measure features with appropriate gauges and record exact locations.","Document observations, limitations, photographs and follow-up NDT."],variables:["Illumination intensity and direction; glare and shadows.","Viewing distance, angle, line of sight and magnification.","Surface cleanliness, colour, finish, coating and contrast.","Visual acuity, colour perception, fatigue and observer training.","Camera resolution, focus, field of view, distortion and probe orientation.","Access and environmental conditions."],interpretation:"Distinguish a visible surface feature from its significance. A scratch, undercut, crack-like line, corrosion pit or weld-profile variation must be assessed against component design and acceptance criteria. Record location, orientation, dimensions and image scale. VT cannot establish depth or internal extent of a hidden feature.",example:"During weld VT, the inspector checks alignment, weld profile, toe transition, visible cracks, undercut, surface porosity and dimensions using a weld gauge and the applicable drawing / criteria. A photograph without scale or location reference is not a complete measurement record.",limits:["VT is limited by line of sight, surface condition, lighting and access.","Subsurface flaws cannot be reliably detected by ordinary visual examination.","Interpretation can be subjective; use defined criteria, tools and records.","Remote tools introduce focus, distortion and field-of-view limitations."],safety:["Follow work-at-height, confined-space, electrical and hot-surface controls.","Do not place personnel or optical equipment in hazardous spaces without permits and controls."],terms:["Direct VT: examination with direct line of sight, with or without simple aids.","Remote VT: examination using cameras, borescopes or video probes.","Resolution: ability to distinguish close details.","Glare: unwanted reflected light that reduces visibility.","Weld gauge: tool for measuring specified weld dimensions."],refs:[["ASNT – Visual testing","https://www.asnt.org/what-is-nondestructive-testing/methods/visual-testing"],["ASNT – Visual testing overview","https://www.asnt.org/standards-publications/blog/ndt-method-overview-visual-testing"]]},
{subtitle:"Eddy current testing",principle:"An alternating current in a probe coil creates a changing magnetic field. Near an electrically conductive material, the field induces circulating eddy currents. Changes in conductivity, permeability, thickness, geometry, lift-off or a discontinuity change the induced currents and therefore the electrical impedance of the coil.",physics:"The coil and specimen form a coupled electromagnetic system. Instruments display impedance changes as amplitude and phase. Standard depth of penetration is commonly introduced as δ = 1/√(πfµσ) in SI units for a uniform conductor, where f is frequency, µ permeability and σ conductivity. Current density decreases with depth, so sensitivity to deep flaws reduces.",equipment:["Probe coil: absolute, differential, reflection, pencil, surface or encircling types.","Eddy-current instrument with frequency, gain, phase and impedance display controls.","Reference standards with representative notches, holes, conductivity or thickness features.","Scanner or tube pusher / rotator for encoded or tubing inspection.","Conductivity meter or lift-off standards where specified."],workflow:["Confirm material is electrically conductive and identify alloy, condition, coating and geometry.","Select probe and frequency suitable for expected flaw, thickness and access.","Balance probe and establish phase / sensitivity using a representative reference standard.","Verify response to required reference notches, holes or conductivity changes.","Scan with consistent probe orientation, lift-off and speed; maintain overlap.","Interpret amplitude and phase against calibration and nuisance signals; document."],variables:["Frequency changes penetration depth and sensitivity to small surface flaws.","Conductivity and magnetic permeability affect response and calibration transfer.","Lift-off from paint, coating, curvature or wobble changes the signal.","Edge effect and geometry transitions can resemble flaw signals.","Probe type, size, shield and orientation affect sensitivity and coverage.","Temperature and material condition can change conductivity."],interpretation:"Use amplitude and phase, not signal size alone. Balance and compare with the reference standard. Separate likely flaw responses from lift-off, edge, conductivity, geometry and permeability changes using phase behaviour, probe movement and additional frequencies or probes when required. Crack orientation relative to eddy-current flow affects detectability.",example:"A surface-breaking fatigue crack in an aluminium panel interrupts local eddy-current flow and changes coil impedance. A thin non-conductive coating produces lift-off response that may be separated by phase and suitable calibration, but coating thickness and variation still influence sensitivity.",limits:["ECT requires an electrically conductive material.","Sensitivity reduces with depth because eddy currents decay below the surface.","Ferromagnetic permeability variations can complicate inspection.","Geometry, lift-off and edge effects can mask or imitate flaws.","Crack-depth sizing is not generally reliable without a validated technique."],safety:["Inspect cables, probes and instrument power connections before use.","Use access and environmental controls; observe precautions for hot or rotating components."],terms:["Eddy current: circulating electrical current induced in a conductor.","Lift-off: distance between probe coil and test surface.","Impedance plane: display of resistance and reactance changes.","Skin depth: depth at which current density falls to a defined fraction of surface value.","Fill factor: degree to which an encircling coil fills the test component."],refs:[["TWI – Factors affecting eddy currents","https://www.twi-global.com/technical-knowledge/faqs/faq-what-factors-affect-eddy-currents"],["FHWA – Eddy current testing","https://infotechnology.fhwa.dot.gov/eddy-current-testing/"]]},
{subtitle:"Leak testing and leak-rate evaluation",principle:"Leak testing determines whether gas or liquid passes through a boundary intended to contain it. Methods apply a pressure difference and detect flow, pressure change, bubbles or tracer gas. The suitable technique depends on product, allowable leak rate, test pressure, fluid, access and required sensitivity.",physics:"A leak is a flow path through a wall, joint, seal or closure. Pressure-decay testing infers leakage from pressure change over time, but temperature changes and volume effects can create similar changes. Tracer-gas methods detect gas passing through a leak path.",equipment:["Pressure source, regulator, isolation valves and calibrated pressure gauges / transducers.","Vacuum pump and vacuum gauge for vacuum methods.","Bubble solution or immersion tank for visible bubble methods.","Tracer gas and detector suited to the method.","Calibrated reference leak for detector checks where required.","Test enclosure, plugs, seals and pressure relief devices."],workflow:["Define test boundary, allowable leak rate, medium, pressure and acceptance criteria.","Inspect seals, fittings and closures; verify gauge and detector calibration.","Select pressure, vacuum, bubble or tracer-gas method.","Pressurise or evacuate gradually, stabilise and monitor temperature and pressure.","Apply bubble solution, scan with detector or record pressure decay.","Localise and quantify indications where required; depressurise safely and report."],variables:["Test pressure / vacuum and differential pressure across the leak path.","Test volume, temperature stabilisation and gas properties.","Tracer-gas concentration, background and detector sensitivity.","Surface wetting and bubble-solution quality.","Seal configuration, fixtures and background leakage from the rig.","Detector speed, distance and local ventilation."],interpretation:"Differentiate component leakage from fittings, hoses or fixtures. Pressure decay may not locate a leak and can be affected by temperature and volume compliance. Bubble formation identifies a local path but does not necessarily quantify standard leak rate. Tracer-gas response must be compared with background and a reference leak.",example:"For a sealed assembly, pressure decay may screen for gross leakage. If a more sensitive local search is required, tracer gas and a calibrated detector may be used. Record pressure, stabilisation time, gas, detector setup and leak-rate units.",limits:["No single method covers every leak rate, fluid, geometry or pressure range.","Pressure decay can be confounded by temperature and fixture leakage.","Bubble methods require access to suspected location.","Tracer gas can be affected by background contamination and ventilation."],safety:["Do not exceed rated pressure of component, fixture, hoses or fittings.","Use guards, relief devices and remote pressurisation where required; stored pressure is hazardous.","Follow gas-cylinder and ventilation / asphyxiation precautions."],terms:["Leak rate: quantity passing through a leak per unit time under stated conditions.","Pressure decay: inferring leakage from pressure reduction over time.","Tracer gas: detectable gas introduced to reveal a leak path.","Reference leak: calibrated leak used to verify a detector.","Background: detector response not caused by the component."],refs:[["ASNT – NDT methods overview","https://www.asnt.org/what-is-nondestructive-testing/methods"]]},
{subtitle:"Acoustic emission testing and structural monitoring",principle:"AE detects transient elastic waves released by active sources in a material or structure. Sources include crack growth, fibre breakage, friction, leakage or other rapid energy releases. Sensors detect waves; timing and signal characteristics help locate and assess activity during loading or operation.",physics:"A sudden source emits elastic waves that propagate through the material and arrive at sensors at different times. Arrival-time differences can estimate source location when geometry and wave velocity are known. Attenuation, reflections, mode conversion and dispersion affect signals. AE responds to activity during the test, not necessarily every dormant flaw.",equipment:["Piezoelectric AE sensors with suitable frequency response.","Couplant and sensor mounting hardware for stable acoustic contact.","Preamplifiers, filters, acquisition channels and threshold controls.","Controlled source check, such as an approved pencil-lead break.","Load / pressure instrumentation and synchronised data acquisition.","Software for hits, events, location and trend review."],workflow:["Define structure, loading / operating condition and monitoring objective.","Review geometry, materials, expected wave paths and sensor access.","Prepare surfaces and mount sensors consistently.","Verify channel response, background noise, threshold and location using a controlled source check.","Load or monitor within an approved test plan while recording AE and operating parameters.","Review locations, activity trends and signal quality; correlate with follow-up NDT."],variables:["Sensor frequency response, sensitivity, position and spacing.","Couplant, mounting pressure and surface preparation.","Threshold, gain, filters and noise discrimination.","Material attenuation, thickness, joints, boundaries and velocity.","Loading rate, temperature, friction and environmental noise.","Source mechanism and orientation."],interpretation:"AE data may include hits, events, counts, amplitude, energy, duration, rise time, frequency content and source location. No single feature uniquely identifies a crack. Interpret activity against load / time, verify channels and distinguish structural activity from noise. Follow-up UT or RT may be needed to characterise a source.",example:"During a controlled pressure test, AE sensors may detect clusters of activity at a region as load increases. The cluster is a reason to investigate, not an automatic reject decision. Assess it under approved test criteria and complementary NDT.",limits:["Dormant flaws may produce no AE during the monitoring window.","Attenuation, geometry and coupling affect location accuracy.","Noise can resemble AE; thresholds and verification are essential.","AE usually needs complementary NDT to size and characterise a source."],safety:["Pressure, proof or loading tests require an approved safety plan and exclusion zone.","Secure sensors and cables; do not compromise operational safety for sensor access."],terms:["Hit: one detected threshold-crossing signal at a sensor channel.","Event: grouped hits attributed to one source event.","Source location: estimated origin of detected elastic-wave activity.","Threshold: level above which a signal is recorded.","Kaiser effect: reduced AE activity below a previous maximum load in some materials and conditions."],refs:[["ASNT – NDT methods overview","https://www.asnt.org/what-is-nondestructive-testing/methods"]]},
{subtitle:"Infrared thermography for NDT",principle:"Infrared thermography measures infrared radiation emitted by a surface and converts it into a temperature-related image called a thermogram. Surface temperature patterns can reveal changes in heat flow caused by disbonds, delaminations, voids, corrosion or moisture when thermal contrast and technique are suitable.",physics:"Heat moves by conduction, convection and radiation. A defect can interrupt or alter heat flow, creating a surface temperature difference over time. A camera measures radiance, not temperature directly; emissivity, reflected apparent temperature, distance, atmosphere and calibration affect the estimate.",equipment:["Infrared camera with suitable detector resolution, sensitivity and temperature range.","Reference temperature / emissivity aids and contact thermometer where appropriate.","Controlled heat source for active thermography, such as flash, lamp or induction.","Environmental monitoring for ambient temperature, wind, reflections and moisture.","Image-analysis software for thermograms and time sequences."],workflow:["Define objective, material, defect type, depth and accessible surface.","Select passive or active technique, camera, lens and excitation arrangement.","Set emissivity and reflected-temperature parameters appropriately.","Acquire baseline and thermal sequence with controlled focus, distance and environment.","Review temperature-time response and compare with sound reference regions.","Document sequence, camera settings, limitations and confirm findings where required."],variables:["Emissivity and reflected radiation from surroundings.","Camera resolution, focus, lens, distance and angle.","Heat input energy, duration, uniformity and time after excitation.","Material thermal diffusivity, thickness, anisotropy and surface coating.","Wind, ambient temperature, moisture and boundary conditions.","Defect depth, size, orientation and thermal contact."],interpretation:"A thermogram displays apparent surface-temperature patterns. A hot or cold region is not automatically a defect: reflections, emissivity changes, thickness changes and environmental effects can create contrast. Review time sequences, compare adjacent sound areas and repeat under controlled conditions.",example:"In a composite panel, a controlled heat pulse can produce a different surface cooling rate over a shallow disbond than over a well-bonded region. The contrast evolves with time; selecting the correct acquisition window and comparing sound reference areas are essential.",limits:["Thermography detects surface thermal response, not a direct image of an internal flaw.","Deep, small or thermally weak defects may not produce measurable contrast.","Emissivity, reflections and environmental changes can create false indications.","Depth or size estimates require a validated method and reference specimens."],safety:["Control hot lamps, flash equipment, induction heaters and hot surfaces.","Follow electrical and laser safety where specialised excitation equipment is used.","Do not view the sun or high-intensity sources through optical equipment."],terms:["Thermogram: image representing apparent temperature / radiance distribution.","Emissivity: efficiency of a surface at emitting thermal radiation relative to a blackbody.","Active thermography: uses external heating or cooling to create a response.","Passive thermography: observes naturally occurring thermal patterns.","Thermal diffusivity: measure of how quickly temperature disturbances spread."],refs:[["ASNT – NDT methods overview","https://www.asnt.org/what-is-nondestructive-testing/methods"]]},
{subtitle:"Computed radiography and digital radiography",principle:"Digital radiography converts transmitted X-ray intensity into a digital image. Computed radiography (CR) stores the latent image in a photostimulable phosphor imaging plate read by a laser scanner. Direct radiography (DR) uses a digital detector panel to convert incident X-ray energy into electrical charge, directly or through a scintillator.",physics:"Detector pixels convert exposure into a signal with finite spatial resolution, dynamic range and noise. Image quality depends on contrast-to-noise, signal-to-noise, basic spatial resolution, unsharpness, detector response, scatter and exposure. Processing can improve viewing but cannot restore information never captured.",equipment:["X-ray source and controlled exposure system.","CR imaging plate, cassette and laser reader, or DR flat-panel detector.","Image acquisition software and calibrated display / monitor.","IQI / duplex wire IQI and system quality checks where specified.","Identification markers, geometry aids and traceable storage system.","Radiation survey instruments, barriers and dosimeters."],workflow:["Select the approved digital technique for material, thickness and inspection volume.","Verify detector / plate condition, calibration, erasure and system performance.","Set exposure geometry, source energy, detector distance and IQI placement.","Acquire image with exposure settings that achieve required image quality.","Review raw data and quality metrics before applying permitted processing.","Interpret, archive original and processed images, retain metadata and report."],variables:["Detector type, pixel size, scintillator and image-plate properties.","Exposure, source energy, scatter and geometric unsharpness.","Detector calibration, gain, bad pixels, lag and plate artefacts.","Image processing, window / level and display monitor characteristics.","IQI type and placement, image sampling and spatial resolution.","Compression, file format, metadata and traceability."],interpretation:"Assess image quality against the procedure before evaluating indications. Look for detector artefacts, plate scratches, bad pixels, saturation, underexposure, scatter and processing artefacts. Use controlled window / level to aid viewing, but retain the original image. Processing must not conceal or manufacture features.",example:"A CR plate exposed behind a weld is scanned by a reader, which converts the stored latent image into pixel values. The radiographer checks IQI visibility, basic spatial resolution and image quality before interpretation; a sharpened display is not a substitute for compliant acquisition.",limits:["Detector pixel size and system unsharpness limit resolution.","Saturation, noise, artefacts and scatter can mask indications.","Processing may alter appearance; original data and audit trail must be preserved.","Digital images still require radiation safety and qualified interpretation."],safety:["All X-ray exposures must be performed under the radiation protection programme by authorised personnel.","Maintain controlled areas, barriers, warning systems, dosimetry and surveys.","Handle imaging plates and detector panels carefully."],terms:["CR: computed radiography using a photostimulable imaging plate and reader.","DR: digital radiography using a digital detector panel.","SNR: signal-to-noise ratio.","CNR: contrast-to-noise ratio.","Basic spatial resolution: ability of the system to resolve fine detail."],refs:[["TWI – Radiographic image quality","https://www.twi-global.com/technical-knowledge/faqs/faq-how-is-the-quality-a-radiograph-assessed"],["ASNT – NDT methods","https://www.asnt.org/what-is-nondestructive-testing/methods"]]},
{subtitle:"NDT foundations and method selection",principle:"NDT applies scientific examination methods to materials, components and structures without impairing intended future use. Each technique responds to a different physical property: sound propagation, radiation attenuation, magnetic flux leakage, capillary action, optical visibility, electromagnetic induction, thermal response or elastic-wave activity.",physics:"A discontinuity is an interruption or variation in material structure or geometry. A defect is a discontinuity judged unacceptable against a specified criterion. An indication is the response observed by an NDT method. A relevant indication is associated with a condition of interest; evaluation determines significance using the governing code, specification or acceptance criteria.",equipment:["Inspection procedure and component drawings / material details.","Method-specific equipment, probes, sources, detectors, reference blocks and calibration tools.","Environmental, access and safety controls appropriate to the technique.","Traceable records for calibration, equipment checks, personnel, coverage and results.","Reference standards and acceptance criteria from the governing code / specification."],workflow:["Understand component function, material, geometry, service conditions and possible damage mechanisms.","Define objective: surface, near-surface, volumetric, leak tightness or monitoring.","Select method(s) based on flaw location, orientation, size, material, access, coverage and sensitivity.","Review procedure, code, acceptance criteria, personnel authorisation and safety controls.","Verify equipment, calibration, surface condition and coverage; perform and document.","Evaluate indications against stated criteria, record limitations and arrange complementary examination where needed."],variables:["Material and geometry determine which physical methods can interact with the target region.","Flaw type, size, orientation and location influence probability of detection.","Surface access, coating, temperature, cleanliness and operating condition affect setup.","Required sensitivity, inspection speed, cost, safety and data retention affect selection.","Personnel competence and procedure quality influence reliability and repeatability."],interpretation:"Keep four ideas separate: a discontinuity is a physical feature; an indication is what the method shows; evaluation compares the indication with criteria; acceptance or rejection is a decision under the applicable specification or authorised engineering process. NDT personnel must not invent criteria or transfer limits from one standard or product to another.",example:"For a ferromagnetic steel weld, VT may identify visible profile conditions, MT may be selected for surface and near-surface cracks, and UT or RT may be selected for internal examination depending on geometry and requirements. One method does not automatically replace the others.",limits:["No single method detects every discontinuity in every material and geometry.","Selection must consider flaw orientation, depth, surface access and required sensitivity.","A good instrument response cannot compensate for an unsuitable procedure or incomplete coverage.","NDT findings do not alone establish fitness for service unless the engineering assessment requires and uses them."],safety:["Safety is method-specific: radiation, pressure, chemicals, electricity, UV-A, heat and access hazards require distinct controls.","Stop work when inspection conditions differ materially from the approved procedure or risk assessment."],terms:["Discontinuity: interruption or variation in material structure or geometry.","Indication: response produced by an examination method.","Relevant indication: indication attributable to a discontinuity requiring evaluation.","Acceptance criteria: documented limits used to judge acceptability.","Traceability: linking a result to equipment, procedure, calibration, personnel and component."],refs:[["ASNT – What is NDT?","https://www.asnt.org/what-is-nondestructive-testing"],["ASNT – NDT methods overview","https://www.asnt.org/what-is-nondestructive-testing/methods"]]}
];

[
{p:["Non-destructive testing is a group of examination methods used to collect information about a material or component without making it unfit for its intended use. NDT is used during manufacture, fabrication, in-service inspection, maintenance and failure investigation. The purpose is not simply to find a flaw: it is to obtain reliable evidence about a defined examination volume and compare that evidence with requirements established by a design code, product specification, contract or engineering assessment.","A sound NDT programme starts before the instrument is switched on. The examiner needs to understand the component drawing, material, manufacturing route, likely damage mechanisms, geometry, access, service conditions and the type of discontinuity that matters. Method selection then follows the physical interaction available: sound, radiation, magnetic flux, liquid wetting, visible light, electromagnetic induction, thermal response or elastic-wave activity.","NDT terminology must be used carefully. A discontinuity is a physical interruption or variation. An indication is the response produced by the examination. Evaluation determines whether the indication is relevant and how it compares with specified criteria. A defect is a condition that does not meet the applicable acceptance requirements. A detectable indication is therefore not automatically rejectable."],focus:["Separate detection, characterisation, evaluation and acceptance decisions.","Define the examination volume and coverage before selecting the method.","Use a written procedure, qualified personnel and traceable records."],example:"For a pressure-vessel weld, visual examination may check surface profile, MT may be used for surface-breaking cracks in ferromagnetic steel, and UT or RT may be selected for volumetric examination. The required combination depends on the construction code, thickness, joint geometry and inspection stage."},
{p:["Ultrasonic testing introduces high-frequency mechanical waves into a test object and observes the energy that returns or passes through it. Most conventional flaw detectors use pulse-echo operation: the instrument sends a short electrical pulse to a probe, the piezoelectric element vibrates, and the resulting sound enters the component through a couplant. Reflected sound returns to the probe and is converted back into an electrical signal.","An echo occurs when the travelling wave encounters a boundary or discontinuity that changes acoustic impedance. The amount of energy reflected depends on the impedance contrast, the angle of incidence, the surface condition and the size and orientation of the reflector. A large air gap produces a strong reflection because the impedance difference between solid material and air is very large. A planar crack may return a strong echo when its face is favourably oriented, but may be difficult to detect when the beam strikes it at an unsuitable angle.","The instrument displays amplitude against time or sound path. The horizontal position of an echo is related to the distance travelled by sound, provided material velocity and zero are correctly set. Signal amplitude is influenced by reflector size, orientation, surface condition, beam characteristics, attenuation, coupling and gain. This is why calibration and a defined scan procedure are essential."],focus:["Pulse-echo uses the returning signal; through-transmission measures energy received on the opposite side.","Acoustic impedance controls reflection at material boundaries.","Time-of-flight gives location only after velocity and instrument zero are established."],example:"A lamination parallel to a plate surface can reflect a normal-beam signal strongly. A small side-drilled hole in a calibration block produces a known reference response that can be used to establish range or sensitivity according to the procedure."},
{p:["Ultrasound is a mechanical wave, so it requires a material medium. The two principal bulk-wave modes used in conventional inspection are longitudinal and shear waves. In a longitudinal wave, particles oscillate parallel to the direction of propagation. In a shear wave, particles oscillate perpendicular to the propagation direction. Surface waves and guided waves are also used in specialised applications.","Wave velocity is governed by the elastic and density properties of the material and by the wave mode. Frequency, velocity and wavelength are related by v = fλ. For a fixed material and wave mode, raising frequency reduces wavelength. Shorter wavelengths can improve the ability to resolve small reflectors, but attenuation and scattering often increase, so the best frequency is a compromise rather than simply the highest available.","At an interface, part of the energy may reflect and part may transmit. When a wave enters a material at an oblique angle, refraction follows Snell's law. Longitudinal and shear waves may be generated through mode conversion. Beam direction, refraction, attenuation, grain scattering, diffraction and boundary reflections must all be considered when planning a sound path through a component."],focus:["Use the correct velocity for the material and wave mode.","Snell's law relates incident and refracted angles to wave velocities.","Frequency selection balances resolution against penetration and attenuation."],example:"At 5 MHz in steel with a longitudinal velocity of 5,920 m/s, wavelength is approximately 1.184 mm. A 2.25 MHz probe in the same material has a longer wavelength, approximately 2.63 mm. These are illustrative values; the actual velocity must be established for the material and procedure."},
{p:["A conventional ultrasonic probe contains a piezoelectric element that converts electrical energy into mechanical vibration and converts returning vibration into an electrical signal. The element is supported by backing material, matching layers and a protective wear face. The housing, cable and connector are part of the measurement chain and can affect reliability if damaged or poorly connected.","Straight-beam probes transmit primarily longitudinal waves normal to the surface. Angle-beam probes use a wedge to introduce a refracted shear wave or another specified mode into the test piece. Dual-element probes use separate transmitting and receiving elements, often with a small roof angle; they are useful in thickness applications where near-surface response needs improvement. Immersion probes use water as the coupling medium and may be focused to concentrate beam energy at a selected depth.","Important probe parameters include nominal frequency, element diameter, bandwidth, damping, near-field length, beam divergence, focal distance and refracted angle. A smaller element generally has a broader beam, while a larger element can provide a narrower beam but may be difficult to use on small curved surfaces. Probe selection must match the material, thickness, geometry and target discontinuity."],focus:["Match probe mode and angle to likely reflector orientation.","Understand nominal frequency, element size, bandwidth and beam profile.","Inspect cable, wedge, wear face and probe identification before use."],example:"A 4 MHz 70-degree angle-beam probe may be selected for a weld examination where the procedure requires a shear-wave beam to interrogate the weld volume. The probe label alone does not guarantee the actual refracted angle; wedge condition, material velocity and calibration must be checked."},
{p:["An ultrasonic instrument has a pulser, receiver, gain stages, filters, time base, display and control circuits. The pulser excites the probe. The receiver amplifies and conditions returning signals. The time base converts elapsed time into a horizontal display scale. Gates select a portion of the A-scan for measurement or alarm, while gain changes the displayed signal amplitude.","Calibration is not a single universal adjustment. Range or time-base calibration positions known reflectors at the correct screen locations. Zero or probe-delay calibration compensates for delays in the probe, wedge, protective face and couplant. Velocity calibration establishes the relationship between time and distance for the test material. Sensitivity calibration establishes a defined response from a specified reference reflector. Transfer correction may be needed when reference and test surfaces or materials produce different responses.","A calibration block must be suitable for the examination method and procedure. Check that the block material, thickness, curvature, reflectors and acoustic properties are appropriate. Record equipment identity, probe, wedge, cable, block identification, temperature where relevant, settings, calibration responses and any correction. Recheck calibration at the required interval, after relevant equipment changes and whenever the procedure requires it."],focus:["Range, zero, velocity and sensitivity are different calibration tasks.","Use the specified reference block and reflector, not an arbitrary metal sample.","Document calibration before and after scanning when required."],example:"If a known 25 mm sound path is positioned at 50% of the display using the wrong material velocity, the echo may look stable but the displayed distance will be wrong. A reference measurement checks the instrument scale, not merely the screen appearance."},
{p:["An A-scan plots signal amplitude vertically and time or sound path horizontally. The initial pulse is associated with the excitation and near-surface response. Back-wall echoes arise from the far boundary of the component. Intermediate echoes may come from discontinuities, geometry, mode conversion or multiple reflections. Their position and behaviour must be compared with the expected sound path and component drawing.","A gate is an evaluation window placed over a selected region of the A-scan. Within the gate, the instrument may measure peak amplitude, time-of-flight or thickness and may trigger an alarm. Gate start, width and threshold are application-specific. A gate does not identify a defect by itself; it simply defines where and how the signal is measured.","During scanning, move the probe in a controlled pattern and observe how the indication changes with position. A real reflector usually has a spatial response that can be followed or mapped. Coupling loss, surface roughness and probe rocking can cause unstable signals. Confirm questionable responses using repeat passes, alternative directions or complementary probes as permitted by the procedure."],focus:["Read horizontal position and vertical amplitude separately.","Distinguish initial pulse, geometry echoes and candidate discontinuity echoes.","Use probe movement and multiple views to confirm an indication."],example:"A mid-wall echo that moves across the screen as the instrument range is changed is interpreted differently from a fixed electrical noise spike. A back-wall echo that reduces when the probe passes over a lamination can provide supporting evidence, but the exact response depends on geometry and setup."},
{p:["Pulse-echo thickness measurement uses the time required for sound to travel from the probe to the back wall and return. For a simple parallel-sided component, thickness is d = vt/2, where v is the calibrated sound velocity and t is the measured round-trip time. The division by two is essential because the pulse travels through the thickness twice.","A thickness gauge may use a single-echo, multiple-echo or through-coating technique. Single-echo operation measures the first back-wall return and is sensitive to correct zero and velocity. Multiple-echo techniques use repeated back-wall echoes and can sometimes exclude a coating layer, but only under suitable conditions and with an instrument designed for that mode. Dual-element probes are often used for corrosion surveys because they can improve near-surface measurement behaviour on rough or corroded surfaces.","Reliable thickness readings require a clean contact area, suitable probe selection, stable coupling and calibration over a representative thickness range. Curvature, roughness, pitting, laminations, temperature, coatings, grain structure and back-wall condition can cause errors or no reading. A single spot measurement may not represent remaining wall thickness; use a documented grid or scanning plan where corrosion mapping is required."],focus:["Understand single echo, multiple echo and coating modes.","Check calibration over the expected range and material.","Use repeatable measurement locations for corrosion mapping."],example:"For steel at 5,920 m/s and a measured round-trip time of 6.76 µs, the estimated thickness is about 20.0 mm. This calculation assumes the correct velocity and zero; an instrument should be calibrated with a suitable reference of known thickness."},
{p:["Ultrasonic indications may arise from cracks, lack of fusion, lack of penetration, inclusions, porosity clusters, laminations, corrosion, geometric transitions or changes in material structure. The sound beam must interact with the reflector in a way that sends enough energy back to the receiving probe. Planar defects can be highly directional, so a single scan direction may not provide reliable coverage.","Detection and sizing are different tasks. Detection establishes that a response exists; characterisation considers its likely nature and location; sizing estimates its dimensions using an approved technique. Amplitude is influenced by many factors and is not a direct measurement of flaw height or severity. Acceptance depends on the governing code, product specification and written procedure, not an informal threshold.","Common limitations include near-surface dead zones, coarse-grained attenuation, anisotropy, complex geometry, poor surface condition, restricted access, couplant variation and unfavourable reflector orientation. Good practice includes planning multiple scan directions, checking volume coverage, using representative reference blocks, recording limitations and seeking complementary methods where the examination objective cannot be achieved by UT alone."],focus:["Plan beam directions to address likely flaw orientations.","Separate indication detection from sizing and acceptance.","Record limitations and incomplete coverage explicitly."],example:"A lack-of-fusion plane that is nearly parallel to the sound beam may return little energy to the probe. A second scan direction can make the beam strike the plane more favourably. This illustrates why coverage and scan direction are as important as gain."}
