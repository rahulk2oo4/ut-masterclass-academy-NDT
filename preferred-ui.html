<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NDT Masterclass Academy</title>
<style>
:root{--maroon:#2d0a14;--wine:#571629;--wine2:#69243b;--orange:#c65d24;--peach:#f4b183;--cream:#fff8f3;--ink:#46101f;--muted:#887a7b;--line:#eadbd4;--pale:#fff0e5;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream)}button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:312px minmax(0,1fr)}.sidebar{background:var(--maroon);color:white;padding:28px 22px 24px;min-height:100vh;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:16px;padding:5px 12px 0}.logo{width:53px;height:53px;border-radius:17px;background:var(--orange);display:grid;place-items:center;font-weight:850;font-size:19px;letter-spacing:-1px}.brand-title{font-size:17px;font-weight:800;line-height:1.35}.brand-sub{font-size:13px;line-height:2.15;margin-top:3px;color:#f5dfe0}.nav-group{margin-top:53px}.nav-label{font-size:12px;font-weight:850;letter-spacing:2px;color:#c9a9ad;padding:0 16px;margin-bottom:12px}.nav{display:grid;gap:4px}.nav button{border:0;color:#fff;background:transparent;text-align:left;display:flex;align-items:center;gap:20px;padding:17px 20px;border-radius:14px;font-size:15px;min-height:56px}.nav button:hover{background:#47202b}.nav button.active{background:#44202b;box-shadow:inset 4px 0 var(--peach)}.ico{width:16px;color:#f5a36f;text-align:center;font-size:17px}.side-note{border:1px solid #54303a;border-radius:19px;padding:20px 18px;margin:45px 5px 0;font-size:14px;line-height:1.8;color:#f7e5e3}.side-note strong{display:block;color:white;margin-bottom:8px}
.main{min-width:0}.topbar{height:92px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 44px 0 45px;background:rgba(255,248,243,.94)}.crumb{font-size:14px;color:var(--muted)}.crumb b{color:var(--ink)}.profile{display:flex;align-items:center;gap:13px;font-size:14px}.avatar{width:44px;height:44px;border-radius:50%;background:#f5dfd3;display:grid;place-items:center;font-weight:800}.btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:15px 20px;border-radius:14px;font-size:14px;font-weight:750}.btn.primary{background:var(--orange);color:white;border-color:var(--orange)}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.content{padding:38px 44px 60px;max-width:1800px;margin:auto}.hero{min-height:405px;border-radius:29px;background:radial-gradient(circle at 82% 36%,#9a554f 0,#74404a 8%,transparent 8.2%),radial-gradient(circle at 82% 36%,transparent 0 14%,#733044 14.1% 17%,transparent 17.1%),radial-gradient(circle at 82% 5%,transparent 0 15%,#67263b 15.1% 18%,transparent 18.1%),linear-gradient(115deg,#4b1021 0%,#58192e 55%,#68233a 100%);color:white;padding:45px 44px;display:flex;align-items:center;justify-content:space-between;gap:30px;position:relative;overflow:hidden;box-shadow:0 18px 50px #5420340b}.hero-copy{max-width:820px;position:relative;z-index:1}.eyebrow{font-size:13px;font-weight:900;letter-spacing:2px;color:var(--peach);margin:0 0 22px}.hero h1{font-size:clamp(32px,3vw,52px);line-height:1.2;letter-spacing:-1.8px;margin:0 0 18px;font-weight:850;max-width:800px}.hero p{font-size:18px;line-height:1.7;color:#f2dfe3;max-width:760px;margin:0 0 26px}.btn.light{background:white;border-color:white;color:var(--ink);padding:17px 21px}.hero-art{width:310px;min-width:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;position:relative;z-index:1}.orb{width:180px;height:180px;border:1px solid #ffffff55;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 19px #ffffff08,0 0 0 38px #ffffff05;background:radial-gradient(circle at 40% 35%,#c1836b55,transparent 65%);font-size:32px}.art-caption{font-size:13px;color:#f5e0e4}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:26px}.stat{border:1px solid var(--line);border-radius:20px;background:#fff;padding:23px 24px 22px;min-height:174px;box-shadow:0 16px 35px #5a26300a}.stat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:#8b7c7d;font-size:14px}.stat-icon{width:40px;height:40px;border-radius:12px;background:var(--pale);color:var(--orange);display:grid;place-items:center;font-size:17px}.stat-number{font-size:34px;font-weight:850;line-height:1.2;margin:13px 0 13px;letter-spacing:-1px}.stat-foot{font-size:13px;color:#897c7d}.section-head{display:flex;justify-content:space-between;align-items:center;margin:45px 0 19px;gap:20px}.section-head h2{font-size:24px;letter-spacing:-.6px;margin:0}.text-link{border:0;background:none;color:var(--orange);font-weight:800}.method-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.method{background:#fff;border:1px solid var(--line);border-radius:19px;padding:23px;display:flex;flex-direction:column;min-height:200px}.method-tag{font-size:11px;letter-spacing:1.4px;font-weight:850;color:var(--orange)}.method h3{font-size:19px;margin:13px 0 9px}.method p{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 20px}.method .btn{margin-top:auto;align-self:flex-start;padding:12px 15px}.page-title{font-size:32px;letter-spacing:-1px;margin:6px 0 8px}.page-desc{color:var(--muted);line-height:1.65;margin:0 0 25px}.toolbar{display:flex;gap:12px;margin:22px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;background:white;padding:13px 15px;color:var(--ink)}.lesson-list{display:grid;gap:12px}.lesson-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.lesson-row h3{margin:0 0 6px;font-size:16px}.lesson-row p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.pill{background:var(--pale);color:var(--orange);border-radius:30px;padding:7px 11px;font-size:12px;font-weight:750;white-space:nowrap}.lesson-body{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;line-height:1.8}.lesson-body h3{margin-top:25px}.formula-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.formula-card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px}.formula{font-size:22px;font-weight:800;margin:15px 0;color:var(--wine)}.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.calc input{width:100px;padding:10px;border:1px solid var(--line);border-radius:9px}.result{font-weight:800;color:var(--orange);margin-top:12px}.question{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;margin-bottom:14px}.question h3{margin:0 0 15px;font-size:17px}.option{display:block;margin:10px 0;color:#66575a}.option input{margin-right:9px;accent-color:var(--orange)}.notice{padding:15px 17px;border-radius:12px;background:#fff0e5;color:var(--ink);margin:16px 0;line-height:1.6}.certificate{border:8px double #7c3044;background:white;padding:35px;text-align:center;max-width:780px;margin:10px auto}.certificate h2{font-size:31px;color:var(--wine)}.certificate .cert-name{font-size:27px;font-weight:800;margin:25px}.empty{padding:30px;text-align:center;border:1px dashed #d9bfb6;border-radius:16px;color:var(--muted);background:#fff}
@media(max-width:1200px){.app{grid-template-columns:270px minmax(0,1fr)}.content{padding:28px}.topbar{padding:0 28px}.hero{padding:35px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.method-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-art{width:230px;min-width:180px}.orb{width:145px;height:145px}}
@media(max-width:760px){.app{display:block}.sidebar{position:relative;height:auto;min-height:0;padding:18px}.brand{padding:0 4px}.nav-group{margin-top:24px}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{padding:12px;font-size:13px;gap:9px;min-height:46px}.nav-label{padding:0 5px}.side-note{display:none}.topbar{height:auto;min-height:70px;padding:14px 18px}.profile{gap:8px}.profile .set-name{display:none}.content{padding:20px 16px 40px}.hero{min-height:0;padding:27px 23px;border-radius:21px}.hero-art{display:none}.hero h1{font-size:34px;letter-spacing:-1px}.hero p{font-size:15px}.stats{gap:10px}.stat{padding:16px;min-height:150px}.stat-number{font-size:28px}.stat-top{font-size:12px}.stat-icon{width:32px;height:32px}.method-grid,.formula-grid{grid-template-columns:1fr}.section-head{margin-top:32px}.section-head h2{font-size:21px}.lesson-row{align-items:flex-start;padding:15px}.lesson-row .btn{padding:10px}.page-title{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">NDT</div><div><div class="brand-title">NDT MASTERCLASS</div><div class="brand-sub">THEORY LEARNING<br>ACADEMY</div></div></div>
  <div class="nav-group"><div class="nav-label">LEARNING SPACE</div><nav class="nav" id="learningNav">
    <button class="active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="courses"><span class="ico">▤</span>Course library</button>

<main class="main">
<header class="topbar"><div class="crumb">Academy / <b id="crumb">Dashboard</b></div><div class="profile"><div class="avatar" id="avatar">R</div><span id="userName">Rahul</span><button class="btn set-name" id="setName">Set name</button><button class="btn primary" id="signOut">Sign out</button></div></header>
<div class="content" id="view"></div>
</main>
</div>
<script>
const methods=[
{name:"Ultrasonic Testing (UT)",short:"UT FUNDAMENTALS",desc:"Sound waves, probes, calibration, signal interpretation and conventional ultrasonic inspection.",lessons:["Introduction to NDT","Principles of ultrasonic testing","Sound waves and propagation","Ultrasonic probes and transducers","Instrument controls and calibration","A-scan interpretation","Thickness measurement","Defects, limitations and safety"]},
{name:"Phased Array UT (PAUT)",short:"ADVANCED UT",desc:"Understand phased-array probes, beam steering, focal laws, scan plans and encoded inspection.",lessons:["PAUT fundamentals","Array probes and elements","Beam steering and focusing","Focal laws","S-scan and sectorial views","Calibration and sensitivity","Scan plans and reporting"]},
{name:"Time of Flight Diffraction (TOFD)",short:"ADVANCED UT",desc:"Learn TOFD setup, lateral waves, back-wall signals, diffraction tips and sizing concepts.",lessons:["TOFD principles","Probe arrangement","Lateral and back-wall waves","Calibration and PCS","Image interpretation","Defect sizing and limitations"]},
{name:"Radiographic Testing (RT)",short:"RADIOGRAPHY",desc:"Radiation basics, image quality, exposure variables, film/digital systems and safety.",lessons:["Radiographic principles","X-ray and gamma sources","Image quality indicators","Exposure and geometry","Film and digital radiography","Interpretation and safety"]},
{name:"Magnetic Particle Testing (MT)",short:"SURFACE METHODS",desc:"Magnetisation, field direction, particles, indications and demagnetisation.",lessons:["MT principles","Magnetic fields","Magnetisation methods","Particles and media","Indication interpretation","Limitations and safety"]},
{name:"Liquid Penetrant Testing (PT)",short:"SURFACE METHODS",desc:"Surface preparation, penetrant systems, dwell time, removal, development and evaluation.",lessons:["PT principles","Materials and penetrants","Surface preparation","Process sequence","Indication evaluation","Limitations and safety"]},
{name:"Visual Testing (VT)",short:"FOUNDATION",desc:"Visual inspection principles, lighting, viewing conditions, tools and documentation.",lessons:["Visual inspection basics","Lighting and viewing","Optical aids","Surface conditions","Acceptance and reporting"]},
{name:"Eddy Current Testing (ECT)",short:"ELECTROMAGNETIC",desc:"Electromagnetic induction, coils, impedance, lift-off, conductivity and signal analysis.",lessons:["ECT principles","Electromagnetic induction","Coils and impedance","Frequency and skin effect","Calibration and interpretation","Applications and limitations"]}
];
const lessonText={
"Introduction to NDT":"Non-destructive testing (NDT) evaluates a material, component or assembly without impairing its future usefulness. It supports quality assurance, maintenance and fitness-for-service decisions. Common methods include UT, RT, MT, PT, VT and ECT.",
"Principles of ultrasonic testing":"Ultrasonic testing introduces high-frequency mechanical waves into a test object and analyses reflected or transmitted energy. Changes in acoustic impedance at boundaries can produce reflections. Results depend on material, geometry, probe characteristics, coupling and instrument settings.",
"Sound waves and propagation":"Ultrasound propagates as mechanical vibration. Longitudinal waves involve particle motion parallel to propagation; shear waves involve motion perpendicular to propagation. Velocity depends on material properties and wave mode. Interfaces can cause reflection, transmission, refraction and mode conversion.",
"Ultrasonic probes and transducers":"A transducer converts electrical energy into mechanical vibration and returning vibration into an electrical signal. Probe selection considers frequency, element size, bandwidth, beam spread, near field, resolution and material attenuation. Couplant helps transfer sound across the probe-to-part interface.",
"Instrument controls and calibration":"Calibration establishes the relationship between instrument indications and known reference distances or responses. Verify range, zero, velocity and sensitivity with suitable reference blocks and documented procedures. Calibration must represent the inspection geometry and applicable code or specification.",
"A-scan interpretation":"An A-scan displays signal amplitude against time or sound path. The initial pulse, back-wall response and intermediate indications are interpreted using calibrated range, expected geometry and scan movement. Amplitude alone does not identify defect type; evaluation requires context and procedure requirements."
};
let completed=JSON.parse(localStorage.getItem("ndtAcademyCompleted")||"[]");
let certificates=JSON.parse(localStorage.getItem("ndtAcademyCertificates")||"[]");
let learner=localStorage.getItem("ndtAcademyName")||"Rahul";
let currentMethod=0,currentLesson="",examQuestions=[],examAnswers={};
const view=document.getElementById("view");
function save(){localStorage.setItem("ndtAcademyCompleted",JSON.stringify(completed));localStorage.setItem("ndtAcademyCertificates",JSON.stringify(certificates))}
function go(page){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const names={dashboard:"Dashboard",courses:"Course library",formulas:"Formula library",practice:"Practice questions",exams:"Final examinations",certificates:"Certificates",about:"About the academy"};document.getElementById("crumb").textContent=names[page]||"Lesson";({dashboard,courses,formulas,practice,exams,certificates:showCertificates,about})[page]?.();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function dashboard(){view.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">YOUR THEORY LEARNING JOURNEY</div><h1>Build your NDT knowledge, one concept at a time.</h1><p>Explore structured theory lessons, understand inspection principles, practise technical questions and review core equations in one learning space.</p><button class="btn light" id="explore">Explore courses&nbsp; →</button></div><div class="hero-art"><div class="orb">⌁</div><div class="art-caption">LEARN · UNDERSTAND · REVIEW</div></div></section><section class="stats"><div class="stat"><div class="stat-top">Available methods <span class="stat-icon">▤</span></div><div class="stat-number">08</div><div class="stat-foot">Structured theory pathways</div></div><div class="stat"><div class="stat-top">Lessons completed <span class="stat-icon">✓</span></div><div class="stat-number">${completed.length}</div><div class="stat-foot">Saved on this browser</div></div><div class="stat"><div class="stat-top">Formula tools <span class="stat-icon">ƒ</span></div><div class="stat-number">06</div><div class="stat-foot">Interactive calculation cards</div></div><div class="stat"><div class="stat-top">Certificates <span class="stat-icon">♧</span></div><div class="stat-number">${certificates.length}</div><div class="stat-foot">Educational completion records</div></div></section><div class="section-head"><h2>Explore NDT methods</h2><button class="text-link" id="allMethods">View all methods&nbsp; →</button></div><div class="method-grid">${methods.slice(0,3).map((m,i)=>methodCard(m,i)).join("")}</div>`;document.getElementById("explore").onclick=()=>go("courses");document.getElementById("allMethods").onclick=()=>go("courses");wireMethodButtons()}
function methodCard(m,i){return `<article class="method"><div class="method-tag">${m.short}</div><h3>${m.name}</h3><p>${m.desc}</p><button class="btn" data-method="${i}">Start learning&nbsp; →</button></article>`}
function courses(){view.innerHTML=`<h1 class="page-title">Course library</h1><p class="page-desc">Choose an NDT method and progress through structured theory lessons. Your lesson progress is saved in this browser.</p><div class="toolbar"><input id="courseSearch" placeholder="Search methods or lessons…" aria-label="Search methods or lessons"></div><div class="method-grid" id="courseGrid">${methods.map((m,i)=>methodCard(m,i)).join("")}</div>`;wireMethodButtons();document.getElementById("courseSearch").oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll("#courseGrid .method").forEach((el)=>el.style.display=el.innerText.toLowerCase().includes(q)?"flex":"none")}}
function wireMethodButtons(){document.querySelectorAll("[data-method]").forEach(b=>b.onclick=()=>openMethod(+b.dataset.method))}
function openMethod(i){currentMethod=i;const m=methods[i];view.innerHTML=`<button class="text-link" id="backCourses">← Course library</button><h1 class="page-title" style="margin-top:18px">${m.name}</h1><p class="page-desc">${m.desc}</p><div class="lesson-list">${m.lessons.map((l,j)=>{const id=i+"-"+j;return `<div class="lesson-row"><div><h3>${j+1}. ${l}</h3><p>${completed.includes(id)?"Completed · Progress saved":"Theory lesson · Self-paced learning"}</p></div><button class="btn ${completed.includes(id)?"":"primary"}" data-lesson="${j}">${completed.includes(id)?"Review lesson":"Start lesson →"}</button></div>`}).join("")}</div>`;document.getElementById("backCourses").onclick=()=>go("courses");document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>openLesson(i,+b.dataset.lesson))}
function openLesson(mi,li){currentMethod=mi;const m=methods[mi],name=m.lessons[li],id=mi+"-"+li;currentLesson=id;const text=lessonText[name]||`${name} is an important part of ${m.name}. Learn the purpose of the method, its basic operating principles, equipment and procedure, relevant variables, common indications, limitations and safety considerations. In practice, always follow the approved inspection procedure, applicable code and acceptance criteria. Record the equipment, calibration checks, inspection conditions and results clearly.`;view.innerHTML=`<button class="text-link" id="backMethod">← Back to ${m.name}</button><div class="lesson-body" style="margin-top:18px"><div class="method-tag">THEORY LESSON · ${String(li+1).padStart(2,"0")} / ${m.lessons.length}</div><h1 class="page-title" style="margin-top:12px">${name}</h1><p class="page-desc">${m.name}</p><p>${text}</p><h3>Key learning points</h3><ul><li>Understand the basic principle and purpose of the topic.</li><li>Recognise equipment, procedure variables and their effect on results.</li><li>Interpret indications in context and understand method limitations.</li><li>Apply approved procedures, safety requirements and acceptance criteria.</li></ul><div class="notice"><b>Learning note:</b> This academy is for theory learning and knowledge development. It does not provide an employer qualification or an ISO 9712 / ASNT Level II or Level III certification.</div><button class="btn primary" id="completeLesson">${completed.includes(id)?"Lesson completed ✓":"Mark lesson complete ✓"}</button> <button class="btn" id="nextLesson">Next lesson →</button></div>`;document.getElementById("backMethod").onclick=()=>openMethod(mi);document.getElementById("completeLesson").onclick=()=>{if(!completed.includes(id))completed.push(id);save();openLesson(mi,li);};document.getElementById("nextLesson").onclick=()=>{if(li+1<m.lessons.length)openLesson(mi,li+1);else openMethod(mi)}}
const formulaData=[{name:"Wave velocity",formula:"v = f × λ",desc:"Calculate wave velocity from frequency and wavelength.",fields:["Frequency (MHz)","Wavelength (mm)"],calc:a=>a[0]*1e6*a[1]/1000+" m/s",hint:"For consistent units: MHz × mm gives m/s."},{name:"Sound path",formula:"Distance = velocity × time / 2",desc:"Pulse-echo reflector distance using round-trip time.",fields:["Velocity (m/s)","Time (µs)"],calc:a=>(a[0]*a[1]*1e-6/2*1000).toFixed(3)+" mm",hint:"Time is round-trip time; divide by two."},{name:"Wavelength",formula:"λ = v / f",desc:"Find wavelength for a material and frequency.",fields:["Velocity (m/s)","Frequency (MHz)"],calc:a=>(a[0]/(a[1]*1e6)*1000).toFixed(3)+" mm",hint:"Wavelength affects resolution and scattering."},{name:"Decibel change",formula:"ΔdB = 20 log₁₀(A₂/A₁)",desc:"Compare two signal amplitudes.",fields:["Initial amplitude","Final amplitude"],calc:a=>(20*Math.log10(a[1]/a[0])).toFixed(2)+" dB",hint:"Use the same amplitude units and nonzero values."},{name:"Thickness",formula:"d = v × t / 2",desc:"Estimate thickness from pulse-echo transit time.",fields:["Velocity (m/s)","Round-trip time (µs)"],calc:a=>(a[0]*a[1]/2e6*1000).toFixed(3)+" mm",hint:"Correct for zero offset and calibrate on a reference."},{name:"Near field (approx.)",formula:"N ≈ D² / (4λ)",desc:"Approximate near-field length for a circular element.",fields:["Element diameter (mm)","Wavelength (mm)"],calc:a=>(a[0]*a[0]/(4*a[1])).toFixed(3)+" mm",hint:"Approximation for a circular piston in a uniform medium."}];
function formulas(){view.innerHTML=`<h1 class="page-title">Formula library</h1><p class="page-desc">Interactive calculation tools for common ultrasonic testing fundamentals. Check units and verify calculations against your approved procedure.</p><div class="formula-grid">${formulaData.map((f,i)=>`<article class="formula-card"><div class="method-tag">CALCULATOR ${String(i+1).padStart(2,"0")}</div><h3>${f.name}</h3><div class="formula">${f.formula}</div><p class="page-desc">${f.desc}</p><div class="calc">${f.fields.map((x,j)=>`<label style="font-size:12px;color:var(--muted)">${x}<br><input type="number" step="any" id="f${i}-${j}" placeholder="Value"></label>`).join("")}<button class="btn primary" data-calc="${i}">Calculate</button></div><div class="result" id="result${i}"></div><p class="stat-foot">${f.hint}</p></article>`).join("")}</div>`;document.querySelectorAll("[data-calc]").forEach(b=>b.onclick=()=>{const i=+b.dataset.calc,a=[0,1].map(j=>Number(document.getElementById("f"+i+"-"+j).value));const out=document.getElementById("result"+i);if(a.some(v=>!Number.isFinite(v))||a.some(v=>v<=0)){out.textContent="Enter two positive values.";return}out.textContent="Result: "+formulaData[i].calc(a)})}
const qs=[{q:"What is the primary purpose of non-destructive testing?",o:["To destroy a sample in a controlled way","To evaluate a component without impairing future usefulness","To change the material properties","To measure only surface colour"],a:1,e:"NDT assesses material or component condition while preserving its intended usefulness."},{q:"In pulse-echo UT, a reflector distance is commonly calculated using:",o:["Velocity × round-trip time","Velocity × round-trip time ÷ 2","Frequency × time","Amplitude × wavelength"],a:1,e:"The pulse travels to the reflector and back, so the measured round-trip time is halved."},{q:"What does a typical A-scan display?",o:["Amplitude against time or sound path","Only a top-view photograph","Temperature against pressure","Hardness against density"],a:0,e:"A-scan presents signal amplitude versus time or calibrated sound path."},{q:"Why is couplant used in contact ultrasonic testing?",o:["To increase material hardness","To remove all internal defects","To improve sound transmission across the interface","To replace calibration"],a:2,e:"Couplant reduces the air gap and improves acoustic energy transfer."},{q:"Which wave has particle motion parallel to its propagation direction?",o:["Longitudinal wave","Shear wave","Surface wave only","No mechanical wave"],a:0,e:"In a longitudinal wave, particle vibration is parallel to the propagation direction."},{q:"What should be used to evaluate indications?",o:["Amplitude alone in every case","A guess based on colour","Approved procedure and applicable acceptance criteria","Only the operator's memory"],a:2,e:"Evaluation depends on procedure, calibration, geometry, signal characteristics and applicable criteria."}];
function practice(){view.innerHTML=`<h1 class="page-title">Practice questions</h1><p class="page-desc">Test your understanding of core NDT and ultrasonic testing concepts. Select an answer for each question and check your score.</p><form id="practiceForm">${qs.map((q,i)=>`<article class="question"><h3>${i+1}. ${q.q}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${o}</label>`).join("")}</article>`).join("")}<button class="btn primary" type="submit">Check answers</button></form><div id="practiceResult"></div>`;document.getElementById("practiceForm").onsubmit=e=>{e.preventDefault();let score=0;const notes=qs.map((q,i)=>{const a=new FormData(e.target).get("q"+i);if(Number(a)===q.a)score++;return `<p><b>${i+1}. ${Number(a)===q.a?"Correct":"Review"}:</b> ${q.e}</p>`}).join("");document.getElementById("practiceResult").innerHTML=`<div class="lesson-body" style="margin-top:18px"><h2>Score: ${score} / ${qs.length}</h2>${notes}</div>`}}
function exams(){view.innerHTML=`<h1 class="page-title">Final examinations</h1><p class="page-desc">Complete the theory lessons in a method before attempting its final assessment. The learning certificate is educational only and is not an industry qualification.</p><div class="notice">Assessment format: 100 questions · 120 minutes · 50% pass mark. This starter assessment uses a short sample set to demonstrate the examination flow; it is not yet a complete 100-question bank.</div><div class="lesson-list">${methods.map((m,i)=>{const done=m.lessons.every((_,j)=>completed.includes(i+"-"+j));return `<div class="lesson-row"><div><h3>${m.name}</h3><p>${completed.filter(id=>id.startsWith(i+"-")).length} / ${m.lessons.length} lessons completed</p></div><button class="btn ${done?"primary":""}" data-exam="${i}" ${done?"":"disabled"} title="${done?"Start assessment":"Complete all lessons first"}">${done?"Start exam →":"Lessons required"}</button></div>`}).join("")}</div><div id="examArea"></div>`;document.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>startExam(+b.dataset.exam))}
function startExam(mi){const m=methods[mi];examQuestions=[...qs];examAnswers={};let remaining=120*60;const area=document.getElementById("examArea");area.innerHTML=`<div class="lesson-body" style="margin-top:24px"><div class="section-head"><h2>${m.name} · Final examination</h2><span class="pill" id="timer">120:00</span></div><p>Answer all questions, then submit your assessment.</p><form id="examForm">${examQuestions.map((q,i)=>`<article class="question"><h3>${i+1}. ${q.q}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="e${i}" value="${j}">${o}</label>`).join("")}</article>`).join("")}<button class="btn primary" type="submit">Finish examination</button></form><div id="examResult"></div></div>`;let ended=false;const interval=setInterval(()=>{if(ended){clearInterval(interval);return}remaining--;const t=document.getElementById("timer");if(!t){clearInterval(interval);return}t.textContent=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0");if(remaining<=0){ended=true;clearInterval(interval);document.getElementById("examForm").requestSubmit()}},1000);document.getElementById("examForm").onsubmit=e=>{e.preventDefault();if(ended&&remaining>0)return;ended=true;clearInterval(interval);let score=0;const data=new FormData(e.target);examQuestions.forEach((q,i)=>{if(Number(data.get("e"+i))===q.a)score++});const pct=Math.round(score/examQuestions.length*100);let msg=pct>=50?"Assessment passed.":"Assessment not passed. Review the lessons and try again.";document.getElementById("examResult").innerHTML=`<div class="notice"><b>${msg}</b><br>Score: ${score} / ${examQuestions.length} (${pct}%).<br><small>This demonstration assessment uses ${examQuestions.length} sample questions, not the full 100-question exam.</small></div>${pct>=50?`<button class="btn primary" id="makeCert">Create learning certificate</button>`:""}`;if(pct>=50)document.getElementById("makeCert").onclick=()=>{certificates.push({method:m.name,score:pct,date:new Date().toLocaleDateString("en-IN")});save();go("certificates")};e.target.querySelectorAll("input,button").forEach(el=>el.disabled=true)}}
function showCertificates(){view.innerHTML=`<h1 class="page-title">Certificates</h1><p class="page-desc">View educational completion records earned in this browser.</p>${certificates.length?certificates.map((c,i)=>`<div class="certificate"><div class="method-tag">NDT MASTERCLASS ACADEMY</div><h2>Certificate of Learning</h2><p>This recognises completion of the theory assessment by</p><div class="cert-name">${escapeHtml(learner)}</div><p>Topic / method completed</p><h3>${escapeHtml(c.method)}</h3><p>Assessment mark: <b>${c.score}%</b> &nbsp; · &nbsp; Completion date: <b>${escapeHtml(c.date)}</b></p><div class="notice">This certificate is for learning and knowledge development only. It is not an NDT Level II / Level III certification, personnel qualification, or accreditation.</div><button class="btn" onclick="window.print()">Print certificate</button></div>`).join(""):'<div class="empty">No certificates yet. Complete all lessons in a method and pass its final assessment to create a learning certificate.</div>'}`;}
function about(){view.innerHTML=`<h1 class="page-title">About the academy</h1><p class="page-desc">NDT Masterclass Academy is a theory-first learning space for building understanding of non-destructive testing methods.</p><div class="lesson-body"><div class="method-tag">OUR PURPOSE</div><h2>Learn. Understand. Review.</h2><p>Explore structured lessons, review formulas and practise core concepts at your own pace. The academy is designed to support independent study and knowledge development.</p><h3>Learning disclaimer</h3><p>Course content and certificates are educational resources only. Completion does not constitute formal NDT personnel certification, qualification or authorisation. Follow relevant standards, employer procedures and supervised practical training requirements.</p><h3>Available learning pathways</h3><ul>${methods.map(m=>"<li>"+m.name+"</li>").join("")}</ul></div>`;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.getElementById("setName").onclick=()=>{const n=prompt("Enter the learner name for your learning records:",learner);if(n&&n.trim()){learner=n.trim();localStorage.setItem("ndtAcademyName",learner);updateProfile();showCertificates()}};
function updateProfile(){document.getElementById("userName").textContent=learner;document.getElementById("avatar").textContent=learner.charAt(0).toUpperCase()}
document.getElementById("signOut").onclick=()=>{if(confirm("Clear this browser's learner name and return to the dashboard? Your lesson progress will be kept.")){learner="Learner";localStorage.setItem("ndtAcademyName",learner);updateProfile();go("dashboard")}};
updateProfile();dashboard();
</script>
</body></html>
