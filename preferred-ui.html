const curriculum={
"01 · NDT foundations and UT overview":{why:"UT is a volumetric method that introduces high-frequency mechanical energy and evaluates returning signals. It is especially useful when access to one side is sufficient, but results depend on material structure, geometry, surface condition and procedure.",points:["NDT assesses condition without intentionally impairing serviceability.","An indication is an observed response; it is not automatically a rejectable defect.","Choose the method based on target discontinuity, material, access, geometry and required sensitivity."]},
"02 · Mechanical waves and particle motion":{why:"Ultrasound is a mechanical disturbance that propagates through a medium. Longitudinal particle motion is parallel to wave travel; shear motion is perpendicular. Mechanical waves need a medium and cannot propagate through a vacuum.",points:["Wave speed is primarily governed by material elastic properties and density.","Boundaries can reflect, transmit, refract or convert wave modes.","Do not confuse wave propagation direction with particle-motion direction."]},
"03 · Frequency, period, wavelength and wave velocity":{why:"Frequency is cycles per second; period is the time for one cycle; wavelength is the distance occupied by one cycle; velocity is propagation distance per unit time. For a given wave mode in a given material, velocity is approximately fixed, so frequency and wavelength vary inversely.",formula:"v = f × λ",points:["Use consistent units before calculating.","Higher frequency means shorter wavelength at the same velocity, often improving resolution while increasing attenuation.","In UT, frequency is commonly MHz, wavelength mm and velocity mm/µs or m/s."]},
"15 · Range, zero and velocity calibration":{why:"Range calibration aligns the instrument time base with known sound paths. Zero correction compensates for delays in the probe, wedge and electronics. Velocity setting maps measured travel time to distance; use suitable reference reflectors and the approved procedure.",points:["Calibrate with a representative block and known geometry.","Verify multiple points across the required range rather than relying on one point.","Recheck after changing probe, wedge, cable, setup or relevant environmental conditions."]},
"17 · Sensitivity setting, DAC, TCG and transfer correction":{why:"Sensitivity establishes the response level used to detect and evaluate reflectors. DAC plots response from equivalent reflectors at different sound paths; TCG adjusts gain with time/range to compensate for path-related amplitude change. Transfer correction accounts for differences between reference and test surfaces/materials when required.",points:["DAC and TCG are not identical display techniques, even when they serve related purposes.","Document reference reflector, gain, range, correction and calibration checks.","Apply only the correction permitted by the procedure or code."]},
"23 · Squirter UT, water column and coupling stability":{why:"Squirter systems use a controlled water stream or column to couple ultrasound from the probe to the component without direct probe contact. Flow stability, nozzle alignment, standoff, water cleanliness, bubbles and robot motion can affect signal quality and time of flight.",points:["Maintain a stable, coherent water path and verify signal/TOF during setup.","Check nozzle-to-probe alignment, leaks, bubbles, mesh/filter cleanliness and flow.","Validate coverage, encoder/index accuracy and calibration on representative reference samples."]},
"01 · PAUT principles and conventional UT comparison":{why:"PAUT uses multiple small elements driven with programmed time delays. The delays shape, steer or focus the beam electronically, allowing multiple angles or focal conditions to be produced from one array assembly.",points:["Focal laws define element delays for the intended beam.","Encoded position and calibration are essential to trustworthy image geometry.","Image appearance alone does not replace procedure-based interpretation."]},
"01 · TOFD principle and diffraction physics":{why:"TOFD uses a transmitter-receiver pair and records diffracted energy from discontinuity tips. Arrival times are used to estimate tip positions; this supports sizing but requires awareness of lateral-wave and back-wall dead zones.",points:["Identify lateral wave, tip-diffracted signals and back-wall response.","Probe centre spacing, velocity and time-base calibration affect sizing.","Near-surface and near-back-wall regions may need complementary techniques."]},
"01 · Radiographic testing principles":{why:"Radiography forms an image from differences in transmitted ionising radiation. Thickness, density, radiation energy and geometry influence attenuation and image contrast. Discontinuities are visible only when their orientation and contrast produce a detectable image.",points:["Image quality depends on technique geometry, exposure and detector/film performance.","Use IQIs and applicable image-quality requirements.","Radiation protection and controlled-area procedures are mandatory."]},
"01 · Ferromagnetism and MT principles":{why:"MT magnetises a ferromagnetic component. A surface or near-surface discontinuity can disturb the magnetic flux and create leakage fields that attract visible or fluorescent particles.",points:["The magnetic field should cross the discontinuity as nearly as practical.","MT is not suitable for all non-ferromagnetic materials.","Field adequacy, surface condition, lighting and demagnetisation may be important."]},
"01 · PT principles and capillary action":{why:"PT detects discontinuities open to the surface. Liquid penetrant enters openings by capillary action; after excess penetrant is removed, developer draws penetrant back out to create a visible or fluorescent indication.",points:["PT cannot reliably reveal a discontinuity sealed below the surface.","Cleaning, dwell time, removal, development and lighting must follow product instructions and procedure.","Over-washing, under-cleaning or insufficient development can mask indications."]},
"01 · Principles, scope and limitations of VT":{why:"VT relies on direct observation or optical aids to evaluate visible conditions. Lighting, access, viewing distance, angle, surface cleanliness and inspector visual capability strongly affect results.",points:["Use suitable lighting and calibrated gauges when dimensions are required.","Record the location, extent and appearance of relevant conditions.","VT cannot detect a hidden condition without suitable access or complementary methods."]},
"01 · Electromagnetic induction fundamentals":{why:"ECT drives alternating current through a coil, creating a changing magnetic field that induces circulating currents in a conductive test object. Changes in conductivity, permeability, geometry, lift-off or cracks alter coil impedance.",points:["Frequency affects penetration depth and sensitivity to different features.","Lift-off and edges can resemble defect signals.","Calibration standards and controlled probe motion are essential for repeatable interpretation."]},
"01 · Leak testing principles and terminology":{why:"Leak testing determines whether gas or liquid passes through a boundary at a rate relevant to the test requirement. Different techniques detect pressure change, bubbles or tracer gas; sensitivity and suitability depend on the system and test conditions.",points:["Define the test boundary, pressure/vacuum, stabilisation time and allowable leak rate.","Temperature changes can mimic pressure decay.","Use a method with demonstrated sensitivity and safe operating limits."]},
"01 · AE principles and active damage sources":{why:"Acoustic emission monitors transient elastic waves generated by active processes such as crack growth, plastic deformation or leakage under load. It is a monitoring method and is strongest when the component is stimulated by a defined load or operating condition.",points:["Noise sources must be distinguished from relevant events.","Sensor location, coupling, attenuation and velocity affect source location.","AE often identifies active sources; complementary NDT may be needed to characterise them."]},
"01 · Infrared radiation and thermal imaging":{why:"Thermography measures infrared radiation and converts it into a thermal image. Passive thermography observes existing temperature patterns; active thermography applies controlled heating or cooling and evaluates the transient response.",points:["Emissivity and reflected apparent temperature can bias readings.","Heating method, camera settings and environment influence contrast.","Thermal patterns support evaluation but require validated interpretation criteria."]},
"01 · Digital radiography overview and terminology":{why:"Digital radiography records radiation with a digital detector or a reusable imaging plate. Image quality depends on detector resolution, exposure, signal-to-noise ratio, contrast, processing and display conditions.",points:["CR uses an imaging plate and reader; DR commonly captures directly with a detector.","Processing can reveal information but can also create misleading artefacts.","Preserve original data, required metadata and traceability."]}
};
openLesson=function(mi,li){
 currentMethod=mi;const m=methods[mi],name=m.lessons[li],id=mi+"-"+li;currentLesson=id;
 const c=curriculum[name]||{};
 const body=c.why||name+" is a core topic within "+m.name+". Study the physical principle, equipment, inspection variables, calibration checks, interpretation rules, limitations and relevant safety requirements. Relate every observation to the approved written procedure, applicable code and acceptance criteria; do not make accept/reject decisions from a generic lesson alone.";
 const points=c.points||["Define the purpose and governing physical principle.","Understand the equipment, setup variables and calibration/verification requirements.","Recognise relevant responses, artefacts, false calls and method limitations.","Record the result and follow the applicable procedure and acceptance criteria."];
 view.innerHTML='<button class="text-link" id="backMethod">← Back to '+m.name+'</button><div class="lesson-body" style="margin-top:18px"><div class="method-tag">LESSON '+String(li+1).padStart(2,"0")+' / '+m.lessons.length+' · THEORY</div><h1 class="page-title" style="margin-top:12px">'+name.replace(/^\d+ · /,"")+'</h1><p class="page-desc">'+m.name+'</p><h3>Learning objective</h3><p>By the end of this lesson, you should be able to explain the core concept, identify its practical variables and describe how it affects inspection reliability.</p><h3>Detailed explanation</h3><p>'+body+'</p>'+(c.formula?'<div class="notice"><b>Core relationship</b><br><span style="font-size:22px;font-weight:850">'+c.formula+'</span><br>Convert all quantities to consistent units before substitution.</div>':'')+'<h3>Key points to master</h3><ul>'+points.map(p=>'<li>'+p+'</li>').join("")+'</ul><h3>Practical example / application</h3><p>Before inspection, identify the target discontinuity and required coverage. Select a suitable method and setup, verify calibration on a reference standard, perform a controlled scan, compare responses with known geometry and reference indications, and document settings, limitations and results. Numerical acceptance must come from the applicable procedure or specification.</p><h3>Common mistakes and troubleshooting</h3><ul><li>Using inconsistent units or an incorrect material/wave-mode value.</li><li>Skipping calibration verification after a setup change.</li><li>Confusing geometric or process-related responses with a flaw without checking scan movement and expected geometry.</li><li>Applying a generic acceptance threshold instead of the specified criteria.</li></ul><h3>Quick self-check</h3><p>Can you explain the principle in your own words, name the important setup variables, identify at least one limitation and describe which calibration or verification confirms the setup?</p><div class="notice"><b>Educational use:</b> This academy supports theory learning and knowledge development. It does not replace supervised practical training, an approved inspection procedure or formal personnel certification.</div><button class="btn primary" id="completeLesson">'+(completed.includes(id)?"Lesson completed ✓":"Mark lesson complete ✓")+'</button> <button class="btn" id="nextLesson">Next lesson →</button></div>';
 document.getElementById("backMethod").onclick=()=>openMethod(mi);
 document.getElementById("completeLesson").onclick=()=>{if(!completed.includes(id))completed.push(id);save();openLesson(mi,li)};
 document.getElementById("nextLesson").onclick=()=>{if(li+1<m.lessons.length)openLesson(mi,li+1);else openMethod(mi)};
};

const units={
 f:[["Hz",1],["kHz",1e3],["MHz",1e6]], l:[["m",1],["cm",.01],["mm",.001],["µm",1e-6]],
 v:[["m/s",1],["mm/s",.001],["mm/µs",1000],["km/s",1000]], t:[["s",1],["ms",1e-3],["µs",1e-6],["ns",1e-9]],

const formulasPlus=[
{cat:"1. Ultrasonic Testing (UT)",name:"Wave velocity / frequency / wavelength",eq:"v = f × λ",vars:[["f","Frequency","f",5e6],["λ","Wavelength","l",.0006],["v","Velocity","v",3000]],solve:{v:x=>x.f*x.λ,f:x=>x.v/x.λ,λ:x=>x.v/x.f},hint:"v = fλ. SI base units: Hz, m, m/s. For UT, MHz + mm commonly yield m/s after correct conversion."},
{cat:"1. Ultrasonic Testing (UT)",name:"Pulse-echo distance / thickness",eq:"d = v × t / 2",vars:[["v","Velocity","v",5900],["t","Round-trip time","t",10e-6],["d","Distance / thickness","l",.0295]],solve:{d:x=>x.v*x.t/2,v:x=>2*x.d/x.t,t:x=>2*x.d/x.v},hint:"Pulse-echo time is round trip, so divide by 2. For a one-way transit time, do not apply this factor."},
{cat:"1. Ultrasonic Testing (UT)",name:"Time of flight from distance",eq:"t = 2d / v",vars:[["d","Distance / thickness","l",.0295],["v","Velocity","v",5900],["t","Round-trip time","t",10e-6]],solve:{t:x=>2*x.d/x.v,d:x=>x.v*x.t/2,v:x=>2*x.d/x.t},hint:"This expression assumes pulse-echo round-trip time."},
{cat:"1. Ultrasonic Testing (UT)",name:"Period and frequency",eq:"T = 1 / f",vars:[["f","Frequency","f",5e6],["T","Period","t",.2e-6]],solve:{T:x=>1/x.f,f:x=>1/x.T},hint:"Frequency in Hz gives period in seconds."},
{cat:"1. Ultrasonic Testing (UT)",name:"Approximate near-field length",eq:"N ≈ D² / (4λ)",vars:[["D","Element diameter","l",.01],["λ","Wavelength","l",.0006],["N","Near-field length","l",.0416667]],solve:{N:x=>x.D*x.D/(4*x.λ),D:x=>Math.sqrt(4*x.N*x.λ),λ:x=>x.D*x.D/(4*x.N)},hint:"Approximation for a circular piston in a uniform medium; real probes and materials may differ."},
{cat:"1. Ultrasonic Testing (UT)",name:"Amplitude ratio in decibels",eq:"ΔdB = 20 log₁₀(A₂/A₁)",vars:[["A₁","Initial amplitude","a",50],["A₂","Final amplitude","a",100],["ΔdB","Amplitude change","db",6.0206]],solve:{"ΔdB":x=>20*Math.log10(x.A2/x.A1),"A₂":x=>x.A1*Math.pow(10,x["ΔdB"]/20),"A₁":x=>x.A2/Math.pow(10,x["ΔdB"]/20)},hint:"Use amplitudes measured on the same scale. The 20 log relationship is for amplitude ratios."},
{cat:"1. Ultrasonic Testing (UT)",name:"Amplitude after gain change",eq:"A₂/A₁ = 10^(ΔdB/20)",vars:[["A₁","Initial amplitude","a",40],["ΔdB","Gain change","db",6],["A₂","Final amplitude","a",79.81]],solve:{"A₂":x=>x.A1*Math.pow(10,x["ΔdB"]/20),"A₁":x=>x.A2/Math.pow(10,x["ΔdB"]/20),"ΔdB":x=>20*Math.log10(x.A2/x.A1)},hint:"A +6 dB change approximately doubles amplitude; −6 dB approximately halves it."},
{cat:"4. Radiographic Testing (RT)",name:"Inverse-square intensity",eq:"I₂ = I₁ × (r₁/r₂)²",vars:[["I₁","Initial intensity","n",100],["r₁","Initial distance","l",1],["r₂","New distance","l",2],["I₂","New intensity","n",25]],solve:{"I₂":x=>x.I1*Math.pow(x.r1/x.r2,2),"I₁":x=>x.I2*Math.pow(x.r2/x.r1,2),"r₂":x=>x.r1*Math.sqrt(x.I1/x.I2),"r₁":x=>x.r2*Math.sqrt(x.I2/x.I1)},hint:"Point-source approximation; use correct source-to-point distances and observe radiation-safety controls."},
{cat:"4. Radiographic Testing (RT)",name:"Exposure reciprocity (approx.)",eq:"I₁t₁ = I₂t₂",vars:[["I₁","Initial intensity","n",1],["t₁","Initial exposure time","t",60],["I₂","New intensity","n",2],["t₂","New exposure time","t",30]],solve:{"t₂":x=>x.I1*x.t1/x.I2,"t₁":x=>x.I2*x.t2/x.I1,"I₂":x=>x.I1*x.t1/x.t2,"I₁":x=>x.I2*x.t2/x.t1},hint:"Approximate reciprocity only; actual radiographic technique also depends on energy, geometry, film/detector and processing."},
{cat:"7. Eddy Current Testing (ET)",name:"Standard depth of penetration",eq:"δ = √(ρ / (π f μ))",vars:[["ρ","Resistivity","n",1.7e-8],["f","Frequency","f",1e5],["μ","Permeability","n",1.256637e-6],["δ","Skin depth","l",.000207]],solve:{δ:x=>Math.sqrt(x.ρ/(Math.PI*x.f*x.μ)),ρ:x=>x.δ*x.δ*Math.PI*x.f*x.μ,f:x=>x.ρ/(Math.PI*x.δ*x.δ*x.μ),μ:x=>x.ρ/(Math.PI*x.δ*x.δ*x.f)},hint:"SI form for a homogeneous conductor under standard assumptions; magnetic permeability and resistivity must be appropriate to the material."},
{cat:"9. Leak Testing (LT)",name:"Leak rate from pressure rise",eq:"Q ≈ V × ΔP / Δt",vars:[["V","Test volume","n",.01],["ΔP","Pressure rise","n",100],["Δt","Elapsed time","t",60],["Q","Leak rate","rate",.016667]],solve:{Q:x=>x.V*x["ΔP"]/x["Δt"],V:x=>x.Q*x["Δt"]/x["ΔP"],"ΔP":x=>x.Q*x["Δt"]/x.V,"Δt":x=>x.V*x["ΔP"]/x.Q},hint:"Simplified gas pressure-rise relation; use compatible SI units and account for temperature, volume and test method."},
{cat:"13. General Engineering and Inspection Calculations",name:"Percentage difference",eq:"% difference = |A − B| / |B| × 100",vars:[["A","Measured value","n",102],["B","Reference value","n",100],["%","Percentage difference","n",2]],solve:{"%":x=>Math.abs(x.A-x.B)/Math.abs(x.B)*100,A:x=>x.B*(1+x["%"]/100),B:x=>x.A/(1+x["%"]/100)},hint:"The rearrangements shown for A and B assume A is above B; use the absolute-value definition when the measured value is below reference."},

{cat:"1. Ultrasonic Testing (UT)",name:"Sound-path horizontal and vertical components",eq:"X = S sin θ ; Y = S cos θ",vars:[["S","Sound path","l",.05],["θ","Beam angle (degrees)","n",45],["X","Horizontal distance","l",.035355],["Y","Vertical depth","l",.035355]],solve:{X:x=>x.S*Math.sin(x["θ"]*Math.PI/180),Y:x=>x.S*Math.cos(x["θ"]*Math.PI/180),S:x=>Math.sqrt(x.X*x.X+x.Y*x.Y),"θ":x=>Math.atan2(x.X,x.Y)*180/Math.PI},hint:"Angle is measured from the surface normal. Assumes a straight ray in a uniform isotropic medium."},
{cat:"1. Ultrasonic Testing (UT)",name:"Acoustic impedance",eq:"Z = ρ × V",vars:[["ρ","Density","n",7850],["V","Wave velocity","v",5900],["Z","Acoustic impedance","n",46315000]],solve:{Z:x=>x.ρ*x.V,ρ:x=>x.Z/x.V,V:x=>x.Z/x.ρ},hint:"Use density in kg/m³ and velocity in m/s; Z is in Rayl (kg·m⁻²·s⁻¹)."},
{cat:"1. Ultrasonic Testing (UT)",name:"Pressure reflection coefficient",eq:"R = (Z₂ − Z₁) / (Z₂ + Z₁)",vars:[["Z₁","Incident impedance","n",46],["Z₂","Second-medium impedance","n",1.5],["R","Pressure coefficient","n",-.937],["I","Reflected intensity fraction","n",.878]],solve:{R:x=>(x.Z2-x.Z1)/(x.Z2+x.Z1),I:x=>Math.pow((x.Z2-x.Z1)/(x.Z2+x.Z1),2),Z2:x=>x.Z1*(1+x.R)/(1-x.R),Z1:x=>x.Z2*(1-x.R)/(1+x.R)},hint:"R is a pressure-amplitude coefficient. Reflected intensity fraction for lossless normal incidence is R², not R."},
{cat:"1. Ultrasonic Testing (UT)",name:"Insertion loss",eq:"IL = 20 log₁₀(A₁/A₂)",vars:[["A₁","Reference amplitude","a",80],["A₂","Measured amplitude","a",40],["IL","Insertion loss (dB)","db",6.0206]],solve:{IL:x=>20*Math.log10(x.A1/x.A2),A2:x=>x.A1/Math.pow(10,x.IL/20),A1:x=>x.A2*Math.pow(10,x.IL/20)},hint:"Use like-for-like amplitude measurements and the amplitude 20 log convention."},
{cat:"1. Ultrasonic Testing (UT)",name:"Skip distance (plate)",eq:"Skip = 2t tan θ",vars:[["t","Plate thickness","l",.02],["θ","Angle from normal (degrees)","n",45],["Skip","Full skip distance","l",.04]],solve:{Skip:x=>2*x.t*Math.tan(x["θ"]*Math.PI/180),t:x=>x.Skip/(2*Math.tan(x["θ"]*Math.PI/180)),"θ":x=>Math.atan(x.Skip/(2*x.t))*180/Math.PI},hint:"For a parallel-sided plate and angle measured from the normal. Half-skip = t tan θ."},
{cat:"2. Phased Array Ultrasonic Testing (PAUT)",name:"Array aperture",eq:"A = (N − 1)p",vars:[["N","Active elements","n",16],["p","Element pitch","l",.0006],["A","Aperture","l",.009]],solve:{A:x=>(x.N-1)*x.p,N:x=>x.A/x.p+1,p:x=>x.A/(x.N-1)},hint:"Centre-to-centre aperture for a contiguous group of equally spaced elements."},
{cat:"2. Phased Array Ultrasonic Testing (PAUT)",name:"PRF-limited frame rate",eq:"Frame rate ≈ PRF / number of beams",vars:[["PRF","Pulse repetition frequency","f",5000],["B","Beams per frame","n",32],["F","Frame rate","f",156.25]],solve:{F:x=>x.PRF/x.B,PRF:x=>x.F*x.B,B:x=>x.PRF/x.F},hint:"Sequential firing approximation; averaging, multiplexing and instrument dead time can reduce actual frame rate."},
{cat:"2. Phased Array Ultrasonic Testing (PAUT)",name:"Focal depth from delay geometry",eq:"tᵢ = (R − rᵢ) / c",vars:[["R","Focal distance","l",.05],["r","Element-to-focus distance","l",.048],["c","Wave velocity","v",5900],["t","Relative delay","t",.339e-6]],solve:{t:x=>(x.R-x.r)/x.c,R:x=>x.t*x.c+x.r,r:x=>x.R-x.t*x.c,c:x=>(x.R-x.r)/x.t},hint:"Single-element path-delay relation only. Real focal laws use element coordinates, wave mode, steering geometry and instrument conventions."},
{cat:"3. Time of Flight Diffraction (TOFD)",name:"Probe centre separation and half PCS",eq:"h = PCS / 2",vars:[["PCS","Probe centre separation","l",.06],["h","Half PCS","l",.03]],solve:{h:x=>x.PCS/2,PCS:x=>2*x.h},hint:"Symmetric TOFD arrangement with scan centre midway between probes."},
{cat:"3. Time of Flight Diffraction (TOFD)",name:"TOFD tip depth (direct-path geometry)",eq:"z = ½ √[(vt)² − PCS²]",vars:[["v","Longitudinal velocity","v",5900],["t","Tip signal travel time","t",10e-6],["PCS","Probe centre separation","l",.04],["z","Tip depth","l",.0245]],solve:{z:x=>.5*Math.sqrt(Math.pow(x.v*x.t,2)-x.PCS*x.PCS)},hint:"Ideal symmetric direct-path geometry. Validate the picked signal, time-zero, wave mode and applicable TOFD procedure."},
{cat:"3. Time of Flight Diffraction (TOFD)",name:"TOFD dead-zone depth estimate",eq:"z ≈ (v × t_dead) / 2",vars:[["v","Longitudinal velocity","v",5900],["t","Dead-zone time interval","t",2e-6],["z","Equivalent depth interval","l",.0059]],solve:{z:x=>x.v*x.t/2,t:x=>2*x.z/x.v,v:x=>2*x.z/x.t},hint:"Pulse-echo equivalent-depth estimate only; TOFD lateral-wave/backwall dead zones depend on setup, pulse length, PCS, thickness and processing."},
{cat:"4. Radiographic Testing (RT)",name:"Radiation attenuation",eq:"I = I₀ e^(−μx)",vars:[["I₀","Incident intensity","n",100],["μ","Linear attenuation coefficient (1/m)","n",10],["x","Material thickness","l",.1],["I","Transmitted intensity","n",36.79]],solve:{I:x=>x.I0*Math.exp(-x.μ*x.x),I0:x=>x.I*Math.exp(x.μ*x.x),μ:x=>Math.log(x.I0/x.I)/x.x,x:x=>Math.log(x.I0/x.I)/x.μ},hint:"Narrow-beam monoenergetic approximation; broad-beam scatter and spectrum effects require more complete treatment."},
{cat:"4. Radiographic Testing (RT)",name:"Optical density",eq:"D = log₁₀(I₀/I)",vars:[["I₀","Incident/reference light intensity","n",100],["I","Transmitted light intensity","n",10],["D","Optical density","n",1]],solve:{D:x=>Math.log10(x.I0/x.I),I:x=>x.I0/Math.pow(10,x.D),I0:x=>x.I*Math.pow(10,x.D)},hint:"Transmission optical density definition for film; densitometer practice and film system requirements govern measurement."},
{cat:"4. Radiographic Testing (RT)",name:"Geometric magnification",eq:"M = SID / SOD",vars:[["SID","Source-to-image distance","l",1],["SOD","Source-to-object distance","l",.9],["M","Magnification","n",1.1111]],solve:{M:x=>x.SID/x.SOD,SID:x=>x.M*x.SOD,SOD:x=>x.SID/x.M},hint:"Ideal projection geometry; distances measured along the central ray."},
{cat:"5. Magnetic Particle Testing (MT)",name:"Magnetic flux density",eq:"B = Φ / A",vars:[["Φ","Magnetic flux","n",.0002],["A","Cross-sectional area","n",.001],["B","Flux density","n",.2]],solve:{B:x=>x["Φ"]/x.A,Φ:x=>x.B*x.A,A:x=>x["Φ"]/x.B},hint:"Average flux density for approximately uniform flux through the stated area."},
{cat:"5. Magnetic Particle Testing (MT)",name:"Magnetomotive force",eq:"MMF = N I",vars:[["N","Coil turns","n",100],["I","Current","n",5],["MMF","Magnetomotive force (A-turn)","n",500]],solve:{MMF:x=>x.N*x.I,N:x=>x.MMF/x.I,I:x=>x.MMF/x.N},hint:"Ideal coil magnetomotive force. Actual field strength depends on magnetic path, leakage and component geometry."},
{cat:"5. Magnetic Particle Testing (MT)",name:"Magnetic field strength (long solenoid approx.)",eq:"H ≈ N I / L",vars:[["N","Turns","n",100],["I","Current (A)","n",5],["L","Magnetic path length","l",.2],["H","Field strength (A/m)","n",2500]],solve:{H:x=>x.N*x.I/x.L,N:x=>x.H*x.L/x.I,I:x=>x.H*x.L/x.N,L:x=>x.N*x.I/x.H},hint:"Long-solenoid idealisation; do not use as a substitute for required field verification on an actual part."},
{cat:"6. Liquid Penetrant Testing (PT)",name:"Capillary pressure",eq:"ΔP = 2γ cos θ / r",vars:[["γ","Surface tension (N/m)","n",.03],["θ","Contact angle (degrees)","n",20],["r","Capillary radius","l",.00001],["ΔP","Capillary pressure (Pa)","n",5638]],solve:{"ΔP":x=>2*x["γ"]*Math.cos(x["θ"]*Math.PI/180)/x.r,"γ":x=>x["ΔP"]*x.r/(2*Math.cos(x["θ"]*Math.PI/180)),r:x=>2*x["γ"]*Math.cos(x["θ"]*Math.PI/180)/x["ΔP"]},hint:"Young–Laplace ideal cylindrical-capillary model; real crack geometry and contact angle vary."},
{cat:"6. Liquid Penetrant Testing (PT)",name:"Capillary rise",eq:"h = 2γ cos θ / (ρ g r)",vars:[["γ","Surface tension","n",.03],["θ","Contact angle (degrees)","n",20],["ρ","Liquid density (kg/m³)","n",800],["g","Gravity (m/s²)","n",9.80665],["r","Capillary radius","l",.00001],["h","Rise height","l",.00088]],solve:{h:x=>2*x["γ"]*Math.cos(x["θ"]*Math.PI/180)/(x["ρ"]*x.g*x.r)},hint:"Ideal static capillary rise; not a direct predictor of penetrant dwell time in irregular flaws."},
{cat:"7. Eddy Current Testing (ET)",name:"Skin depth (standard conductor approximation)",eq:"δ = √[ρ / (π f μ)]",vars:[["ρ","Resistivity (Ω·m)","n",1.7e-8],["f","Frequency","f",100000],["μ","Absolute permeability (H/m)","n",1.256637e-6],["δ","Skin depth","l",.000207]],solve:{δ:x=>Math.sqrt(x["ρ"]/(Math.PI*x.f*x["μ"])),ρ:x=>x.δ*x.δ*Math.PI*x.f*x["μ"],f:x=>x["ρ"]/(Math.PI*x.δ*x.δ*x["μ"]),μ:x=>x["ρ"]/(Math.PI*x.δ*x.δ*x.f)},hint:"Homogeneous linear conductor approximation; use appropriate frequency-dependent resistivity and permeability."},
{cat:"7. Eddy Current Testing (ET)",name:"Angular frequency",eq:"ω = 2πf",vars:[["f","Frequency","f",100000],["ω","Angular frequency (rad/s)","n",628318]],solve:{ω:x=>2*Math.PI*x.f,f:x=>x.ω/(2*Math.PI)},hint:"Angular frequency in rad/s; radians are dimensionless in SI."},
{cat:"7. Eddy Current Testing (ET)",name:"Inductive reactance",eq:"Xᴸ = 2πfL",vars:[["f","Frequency","f",1000],["L","Inductance (H)","n",.01],["X","Inductive reactance (Ω)","n",62.832]],solve:{X:x=>2*Math.PI*x.f*x.L,f:x=>x.X/(2*Math.PI*x.L),L:x=>x.X/(2*Math.PI*x.f)},hint:"Ideal inductor relation; instrument coil losses and parasitics affect measured impedance."},
{cat:"8. Visual Testing (VT)",name:"Magnification",eq:"M = image size / object size",vars:[["image","Image size","l",.02],["object","Object size","l",.01],["M","Magnification","n",2]],solve:{M:x=>x.image/x.object,image:x=>x.M*x.object,object:x=>x.image/x.M},hint:"Image and object dimensions must use the same length units."},
{cat:"8. Visual Testing (VT)",name:"Pixel size on object",eq:"Object pixel size = FOV / pixel count",vars:[["FOV","Field of view width","l",.1],["pixels","Pixel count across FOV","n",1920],["p","Object-space pixel size","l",.00005208]],solve:{p:x=>x.FOV/x.pixels,FOV:x=>x.p*x.pixels,pixels:x=>x.FOV/x.p},hint:"Ideal sampling estimate; optical blur, perspective, calibration and distortion affect actual measurement capability."},
{cat:"9. Leak Testing (LT)",name:"Pressure decay rate",eq:"Rate = (P₁ − P₂) / Δt",vars:[["P₁","Initial pressure (Pa)","n",200000],["P₂","Final pressure (Pa)","n",190000],["Δt","Elapsed time","t",60],["Rate","Pressure decay (Pa/s)","n",166.667]],solve:{Rate:x=>(x["P₁"]-x["P₂"])/x["Δt"],"P₁":x=>x.Rate*x["Δt"]+x["P₂"],"P₂":x=>x["P₁"]-x.Rate*x["Δt"]},hint:"Pressure decay alone is not a universal leak rate; test volume, temperature stability and gas properties matter."},
{cat:"9. Leak Testing (LT)",name:"Ideal gas law",eq:"P V = n R T",vars:[["P","Absolute pressure (Pa)","n",101325],["V","Volume (m³)","l",.01],["n","Amount of substance (mol)","n",.409],["R","Gas constant","n",8.314462618],["T","Absolute temperature (K)","n",298]],solve:{P:x=>x.n*x.R*x.T/x.V,V:x=>x.n*x.R*x.T/x.P,n:x=>x.P*x.V/(x.R*x.T),T:x=>x.P*x.V/(x.n*x.R)},hint:"Ideal gas approximation; use absolute pressure and absolute temperature."},
{cat:"10. Acoustic Emission Testing (AE)",name:"Two-sensor linear source location",eq:"x = (L + v Δt) / 2",vars:[["L","Sensor separation","l",.5],["v","Wave velocity","v",3000],["Δt","Arrival-time difference","t",50e-6],["x","Distance from sensor 1","l",.325]],solve:{x:x=>(x.L+x.v*x["Δt"])/2,L:x=>2*x.x-x.v*x["Δt"],v:x=>(2*x.x-x.L)/x["Δt"],"Δt":x=>(2*x.x-x.L)/x.v},hint:"One-dimensional two-sensor model for a source between sensors; account for wave mode, dispersion and timing thresholds."},
{cat:"10. Acoustic Emission Testing (AE)",name:"RMS signal amplitude",eq:"RMS = √[Σxᵢ² / N]",vars:[["sum","Sum of squared samples","n",400],["N","Number of samples","n",100],["RMS","RMS amplitude","n",2]],solve:{RMS:x=>Math.sqrt(x.sum/x.N),sum:x=>x.RMS*x.RMS*x.N,N:x=>x.sum/(x.RMS*x.RMS)},hint:"For discrete samples over the selected window; instrument filtering and window definition must be stated."},
{cat:"11. Infrared Thermography (IRT)",name:"Thermal diffusivity",eq:"α = k / (ρ cₚ)",vars:[["k","Thermal conductivity (W/m·K)","n",45],["ρ","Density (kg/m³)","n",7800],["cₚ","Specific heat (J/kg·K)","n",460],["α","Thermal diffusivity (m²/s)","n",1.254e-5]],solve:{α:x=>x.k/(x["ρ"]*x["cₚ"]),k:x=>x.α*x["ρ"]*x["cₚ"],"ρ":x=>x.k/(x.α*x["cₚ"]),"cₚ":x=>x.k/(x.α*x["ρ"])},hint:"Use consistent SI material properties at the relevant temperature."},
{cat:"11. Infrared Thermography (IRT)",name:"Fourier number",eq:"Fo = α t / L²",vars:[["α","Thermal diffusivity (m²/s)","n",1e-5],["t","Time","t",10],["L","Characteristic length","l",.01],["Fo","Fourier number","n",1]],solve:{Fo:x=>x.α*x.t/(x.L*x.L),α:x=>x.Fo*x.L*x.L/x.t,t:x=>x.Fo*x.L*x.L/x.α,L:x=>Math.sqrt(x.α*x.t/x.Fo)},hint:"Dimensionless transient-conduction parameter; define characteristic length for the chosen model."},
{cat:"12. Shearography Testing",name:"Displacement gradient",eq:"∂w/∂x ≈ Δw / Δx",vars:[["Δw","Displacement difference","l",.00002],["Δx","Shear distance","l",.01],["g","Displacement gradient","n",.002]],solve:{g:x=>x["Δw"]/x["Δx"],"Δw":x=>x.g*x["Δx"],"Δx":x=>x["Δw"]/x.g},hint:"Finite-difference approximation; phase-to-displacement conversion depends on illumination, observation geometry and wavelength."},
{cat:"12. Shearography Testing",name:"Linear elastic stress",eq:"σ = E ε",vars:[["E","Young's modulus (Pa)","n",200e9],["ε","Normal strain","n",.0005],["σ","Stress (Pa)","n",100e6]],solve:{σ:x=>x.E*x["ε"],E:x=>x.σ/x["ε"],"ε":x=>x.σ/x.E},hint:"Uniaxial linear-elastic relation; use only within the material's elastic range and correct strain component."},
{cat:"13. General Engineering and Inspection Calculations",name:"Normal stress",eq:"σ = F / A",vars:[["F","Force (N)","n",10000],["A","Area (m²)","l",.001],["σ","Stress (Pa)","n",1e7]],solve:{σ:x=>x.F/x.A,F:x=>x.σ*x.A,A:x=>x.F/x.σ},hint:"Average axial stress; local stress concentrations require more detailed analysis."},
{cat:"13. General Engineering and Inspection Calculations",name:"Young's modulus",eq:"E = σ / ε",vars:[["σ","Stress (Pa)","n",100e6],["ε","Strain","n",.0005],["E","Young's modulus (Pa)","n",200e9]],solve:{E:x=>x.σ/x["ε"],σ:x=>x.E*x["ε"],ε:x=>x.σ/x.E},hint:"Linear elastic region, uniaxial loading and engineering stress/strain convention."},
{cat:"13. General Engineering and Inspection Calculations",name:"Density",eq:"ρ = m / V",vars:[["m","Mass (kg)","n",7.85],["V","Volume (m³)","l",.001],["ρ","Density (kg/m³)","n",7850]],solve:{ρ:x=>x.m/x.V,m:x=>x.ρ*x.V,V:x=>x.m/x.ρ},hint:"Bulk density from mass and volume; ensure volume units are cubic metres."},
{cat:"14. Automated NDT and Robotic Scanning",name:"Robot scan speed and scan time",eq:"v = L / t",vars:[["L","Travel distance","l",2],["t","Scan time","t",20],["v","Scan speed","v",.1]],solve:{v:x=>x.L/x.t,L:x=>x.v*x.t,t:x=>x.L/x.v},hint:"Average constant-speed segment. Add acceleration, deceleration and robot settling time for cycle-time planning."},
{cat:"14. Automated NDT and Robotic Scanning",name:"Index pitch and line count",eq:"N ≈ (W − o) / p + 1",vars:[["W","Inspection width","l",.5],["o","Edge overlap allowance","l",.02],["p","Index pitch","l",.01],["N","Approximate scan lines","n",49]],solve:{N:x=>(x.W-x.o)/x.p+1,W:x=>(x.N-1)*x.p+x.o,o:x=>x.W-(x.N-1)*x.p,p:x=>(x.W-x.o)/(x.N-1)},hint:"Approximate line count; actual coverage depends on start/end convention and probe footprint."},
{cat:"14. Automated NDT and Robotic Scanning",name:"Pulse spacing along scan",eq:"Δx = v_scan / PRF",vars:[["v","Scan speed","v",.1],["PRF","Pulse repetition frequency","f",1000],["Δx","Pulse spacing","l",.0001]],solve:{"Δx":x=>x.v/x.PRF,v:x=>x["Δx"]*x.PRF,PRF:x=>x.v/x["Δx"]},hint:"Assumes one acquisition per pulse and constant scan speed; account for multi-beam firing and instrument architecture."}

{cat:"2. Phased Array Ultrasonic Testing (PAUT)",name:"Element pitch from active aperture",eq:"p = A / (N − 1)",vars:[["A","Active aperture","l",.009],["N","Active elements","n",16],["p","Element pitch","l",.0006]],solve:{p:x=>x.A/(x.N-1),A:x=>x.p*(x.N-1),N:x=>x.A/x.p+1},hint:"For equally spaced elements measured centre-to-centre; aperture spans N−1 pitches."},
{cat:"2. Phased Array Ultrasonic Testing (PAUT)",name:"Number of active elements",eq:"N = A / p + 1",vars:[["A","Aperture","l",.009],["p","Element pitch","l",.0006],["N","Active elements","n",16]],solve:{N:x=>x.A/x.p+1,A:x=>(x.N-1)*x.p,p:x=>x.A/(x.N-1)},hint:"Geometric relation for a contiguous array aperture. Actual element selection is integer and instrument constrained."},
{cat:"2. Phased Array Ultrasonic Testing (PAUT)",name:"Steering delay difference (linear approximation)",eq:"Δt = p sin θ / c",vars:[["p","Element pitch","l",.0006],["θ","Steering angle (degrees)","n",45],["c","Wave velocity","v",5900],["Δt","Adjacent-element delay","t",71.9e-9]],solve:{"Δt":x=>x.p*Math.sin(x["θ"]*Math.PI/180)/x.c,p:x=>x["Δt"]*x.c/Math.sin(x["θ"]*Math.PI/180),c:x=>x.p*Math.sin(x["θ"]*Math.PI/180)/x["Δt"],"θ":x=>Math.asin(x["Δt"]*x.c/x.p)*180/Math.PI},hint:"Magnitude of adjacent-element delay for a plane wave approximation. Instrument focal-law conventions and array geometry determine actual delays."},
{cat:"2. Phased Array Ultrasonic Testing (PAUT)",name:"Sectorial scan angular coverage",eq:"Coverage = θmax − θmin",vars:[["θmin","Minimum angle (degrees)","n",40],["θmax","Maximum angle (degrees)","n",70],["C","Angular coverage (degrees)","n",30]],solve:{C:x=>x["θmax"]-x["θmin"],θmax:x=>x.C+x["θmin"],θmin:x=>x["θmax"]-x.C},hint:"Angular span only; verify refracted-angle convention, wedge, material velocity and coverage against the inspection procedure."},
{cat:"2. Phased Array Ultrasonic Testing (PAUT)",name:"Linear scan coverage width",eq:"W = (N − 1)p + footprint",vars:[["N","Index positions","n",20],["p","Index pitch","l",.005],["footprint","Probe footprint","l",.02],["W","Total width","l",.115]],solve:{W:x=>(x.N-1)*x.p+x.footprint,N:x=>(x.W-x.footprint)/x.p+1,p:x=>(x.W-x.footprint)/(x.N-1),footprint:x=>x.W-(x.N-1)*x.p},hint:"Simple contiguous coverage estimate; actual beam footprint and overlap vary with angle, depth and sensitivity."},
{cat:"3. Time of Flight Diffraction (TOFD)",name:"Lateral wave arrival time",eq:"tL = PCS / v",vars:[["PCS","Probe centre separation","l",.06],["v","Longitudinal velocity","v",5900],["tL","Lateral-wave time","t",10.17e-6]],solve:{tL:x=>x.PCS/x.v,PCS:x=>x.tL*x.v,v:x=>x.PCS/x.tL},hint:"Ideal straight lateral path in the test surface; real arrival picking includes wedge delay and instrument zero."},
{cat:"3. Time of Flight Diffraction (TOFD)",name:"Backwall travel time (symmetric direct path)",eq:"tB = 2√[h² + (PCS/2)²] / v",vars:[["h","Wall thickness","l",.025],["PCS","Probe centre separation","l",.06],["v","Longitudinal velocity","v",5900],["tB","Backwall time","t",11.99e-6]],solve:{tB:x=>2*Math.sqrt(x.h*x.h+Math.pow(x.PCS/2,2))/x.v,h:x=>Math.sqrt(Math.pow(x.tB*x.v/2,2)-Math.pow(x.PCS/2,2)),PCS:x=>2*Math.sqrt(Math.pow(x.tB*x.v/2,2)-x.h*x.h),v:x=>2*Math.sqrt(x.h*x.h+Math.pow(x.PCS/2,2))/x.tB},hint:"Symmetric direct-path geometry; ignores wedge delays, mode conversions and refraction effects."},
{cat:"3. Time of Flight Diffraction (TOFD)",name:"TOFD defect height",eq:"H = zupper − zlower",vars:[["zupper","Upper tip depth","l",.008],["zlower","Lower tip depth","l",.018],["H","Defect height","l",.01]],solve:{H:x=>x.zlower-x.zupper,zupper:x=>x.zlower-x.H,zlower:x=>x.H+x.zupper},hint:"Depths must be referenced from the same surface and correctly identified tip signals."},
{cat:"3. Time of Flight Diffraction (TOFD)",name:"Time-to-depth calibration (linear scale)",eq:"z = v Δt / 2",vars:[["v","Wave velocity","v",5900],["Δt","Time interval","t",5e-6],["z","Equivalent depth interval","l",.01475]],solve:{z:x=>x.v*x["Δt"]/2,v:x=>2*x.z/x["Δt"],"Δt":x=>2*x.z/x.v},hint:"Pulse-echo equivalent depth conversion. TOFD sizing normally uses the appropriate diffraction path geometry and calibrated time base."},
{cat:"4. Radiographic Testing (RT)",name:"Half-value layer",eq:"HVL = ln(2) / μ",vars:[["μ","Linear attenuation coefficient (1/m)","n",10],["HVL","Half-value layer","l",.069315]],solve:{HVL:x=>Math.LN2/x["μ"],μ:x=>Math.LN2/x.HVL},hint:"Monoenergetic narrow-beam exponential attenuation model."},
{cat:"4. Radiographic Testing (RT)",name:"Tenth-value layer",eq:"TVL = ln(10) / μ",vars:[["μ","Linear attenuation coefficient (1/m)","n",10],["TVL","Tenth-value layer","l",.230259]],solve:{TVL:x=>Math.LN10/x["μ"],μ:x=>Math.LN10/x.TVL},hint:"Monoenergetic narrow-beam exponential attenuation model; broad-beam buildup changes practical shielding."},
{cat:"4. Radiographic Testing (RT)",name:"Geometric unsharpness",eq:"Ug = F × b / a",vars:[["F","Focal spot size","l",.002],["b","Object-to-film distance","l",.01],["a","Source-to-object distance","l",.5],["Ug","Geometric unsharpness","l",.00004]],solve:{Ug:x=>x.F*x.b/x.a,F:x=>x.Ug*x.a/x.b,b:x=>x.Ug*x.a/x.F,a:x=>x.F*x.b/x.Ug},hint:"Ideal geometric penumbra relation; distances must follow the applicable radiographic geometry convention."},
{cat:"4. Radiographic Testing (RT)",name:"Source-to-object distance",eq:"SOD = SID − OFD",vars:[["SID","Source-to-image distance","l",1],["OFD","Object-to-film distance","l",.01],["SOD","Source-to-object distance","l",.99]],solve:{SOD:x=>x.SID-x.OFD,SID:x=>x.SOD+x.OFD,OFD:x=>x.SID-x.SOD},hint:"Distances measured along the central ray."},
{cat:"4. Radiographic Testing (RT)",name:"Exposure inverse-square correction",eq:"E₂ = E₁ (D₁ / D₂)²",vars:[["E₁","Initial exposure","n",10],["D₁","Initial distance","l",.5],["D₂","New distance","l",1],["E₂","Corrected exposure","n",2.5]],solve:{"E₂":x=>x["E₁"]*Math.pow(x["D₁"]/x["D₂"],2),"E₁":x=>x["E₂"]/Math.pow(x["D₁"]/x["D₂"],2),"D₂":x=>x["D₁"]*Math.sqrt(x["E₁"]/x["E₂"]),"D₁":x=>x["D₂"]*Math.sqrt(x["E₂"]/x["E₁"])},hint:"Point-source inverse-square approximation with unchanged source output and geometry otherwise."},
{cat:"5. Magnetic Particle Testing (MT)",name:"Magnetic field strength in a magnetic path",eq:"H = NI / l",vars:[["N","Turns","n",100],["I","Current (A)","n",5],["l","Magnetic path length","l",.25],["H","Field strength (A/m)","n",2000]],solve:{H:x=>x.N*x.I/x.l,N:x=>x.H*x.l/x.I,I:x=>x.H*x.l/x.N,l:x=>x.N*x.I/x.H},hint:"Ideal uniform closed magnetic path approximation; leakage, air gaps and part geometry affect actual field."},
{cat:"5. Magnetic Particle Testing (MT)",name:"Magnetic flux",eq:"Φ = B A",vars:[["B","Flux density (T)","n",.2],["A","Area (m²)","l",.001],["Φ","Flux (Wb)","n",.0002]],solve:{Φ:x=>x.B*x.A,B:x=>x["Φ"]/x.A,A:x=>x["Φ"]/x.B},hint:"Uniform flux normal to the stated cross-sectional area."},
{cat:"5. Magnetic Particle Testing (MT)",name:"Magnetic reluctance",eq:"ℜ = l / (μ A)",vars:[["l","Magnetic path length","l",.2],["μ","Permeability (H/m)","n",.001],["A","Cross-sectional area","l",.001],["ℜ","Reluctance (A-turn/Wb)","n",200000]],solve:{ℜ:x=>x.l/(x["μ"]*x.A),l:x=>x.ℜ*x["μ"]*x.A,μ:x=>x.l/(x.ℜ*x.A),A:x=>x.l/(x.ℜ*x["μ"])},hint:"Linear uniform magnetic circuit approximation; ferromagnetic permeability is nonlinear and field dependent."},
{cat:"5. Magnetic Particle Testing (MT)",name:"Circular magnetisation field (long conductor)",eq:"H = I / (2πr)",vars:[["I","Current (A)","n",1000],["r","Distance from conductor axis","l",.02],["H","Field strength (A/m)","n",7957.75]],solve:{H:x=>x.I/(2*Math.PI*x.r),I:x=>x.H*2*Math.PI*x.r,r:x=>x.I/(2*Math.PI*x.H)},hint:"Ampere-law idealisation for a long straight conductor; actual component current path and geometry matter."},
{cat:"5. Magnetic Particle Testing (MT)",name:"Coil magnetisation field estimate",eq:"H ≈ NI / L",vars:[["N","Coil turns","n",5],["I","Current (A)","n",1000],["L","Effective coil length","l",.2],["H","Field estimate (A/m)","n",25000]],solve:{H:x=>x.N*x.I/x.L,N:x=>x.H*x.L/x.I,I:x=>x.H*x.L/x.N,L:x=>x.N*x.I/x.H},hint:"Simplified solenoid estimate, not a universal coil-shot formula; follow equipment and procedure requirements."},
{cat:"5. Magnetic Particle Testing (MT)",name:"Yoke lifting-force ratio",eq:"R = Ftest / Frequired",vars:[["Ftest","Measured lifting force (N)","n",45],["Frequired","Required lifting force (N)","n",44],["R","Force ratio","n",1.023]],solve:{R:x=>x.Ftest/x.Frequired,Ftest:x=>x.R*x.Frequired,Frequired:x=>x.Ftest/x.R},hint:"A pass/fail threshold is standard- and yoke-type-specific; use the applicable procedure, not a generic threshold."},

<script>

f:[["Hz",1],["kHz",1e3],["MHz",1e6]],

{id:"wave",cat:"UT Fundamentals",name:"Wave relationship",equation:"v = f × λ",desc:"Relates sound velocity, frequency and wavelength.",vars:[

{id:"thickness",cat:"UT Fundamentals",name:"Pulse-echo distance / thickness",equation:"d = (v × t) ÷ 2",desc:"Use round-trip pulse-echo time. The factor of 2 accounts for the outgoing and returning path.",vars:[

{id:"v",label:"Sound velocity",unit:"v",base:"m/s",defaultUnit:"m/s",factor:1},
{id:"t",label:"Round-trip time",unit:"t",base:"s",defaultUnit:"µs",factor:1}
],solve:{d:x=>x.v*x.t/2,v:x=>2*x.d/x.t,t:x=>2*x.d/x.v},forms:{d:"d = (v × t) ÷ 2",v:"v = (2 × d) ÷ t",t:"t = (2 × d) ÷ v"}},
{id:"period",cat:"UT Fundamentals",name:"Frequency and period",equation:"T = 1 ÷ f",desc:"Frequency and period are reciprocals.",vars:[
{id:"T",label:"Period",unit:"t",base:"s",defaultUnit:"µs",factor:1},
{id:"f",label:"Frequency",unit:"f",base:"Hz",defaultUnit:"MHz",factor:1}
],solve:{T:x=>1/x.f,f:x=>1/x.T},forms:{T:"T = 1 ÷ f",f:"f = 1 ÷ T"}},
{id:"nearfield",cat:"UT Beam",name:"Approximate near-field length",equation:"N ≈ D² ÷ (4 × λ)",desc:"Approximation for a circular piston in a uniform medium.",vars:[
{id:"N",label:"Near-field length",unit:"l",base:"m",defaultUnit:"mm",factor:1},
{id:"D",label:"Probe diameter",unit:"l",base:"m",defaultUnit:"mm",factor:1},
{id:"l",label:"Wavelength",unit:"l",base:"m",defaultUnit:"mm",factor:1}
],solve:{N:x=>x.D*x.D/(4*x.l),D:x=>Math.sqrt(4*x.N*x.l),l:x=>x.D*x.D/(4*x.N)},forms:{N:"N ≈ D² ÷ (4λ)",D:"D ≈ √(4Nλ)",l:"λ ≈ D² ÷ (4N)"}},

{id:"A2",label:"Final amplitude",unit:"a",base:"relative amplitude",defaultUnit:"relative amplitude",factor:1}

],solve:{I2:x=>x.I1*(x.r1/x.r2)**2,I1:x=>x.I2*(x.r2/x.r1)**2,r1:x=>x.r2*Math.sqrt(x.I2/x.I1),r2:x=>x.r1*Math.sqrt(x.I1/x.I2)},forms:{I2:"I₂ = I₁ × (r₁ ÷ r₂)²",I1:"I₁ = I₂ ÷ (r₁ ÷ r₂)²",r1:"r₁ = r₂ × √(I₂ ÷ I₁)",r2:"r₂ = r₁ × √(I₁ ÷ I₂)"}}
];

/* Expanded NDT engineering formula catalogue. All calculator entries use SI base-unit conversion. */
const extraLibrary=[
{id:"ut-angle",cat:"1. Ultrasonic Testing (UT)",name:"Angle-beam sound path and skip",equation:"x = s sin θ ; z = s cos θ ; skip = 2t tan θ",desc:"Flat-plate angle-beam geometry. θ is measured from the surface normal; skip assumes a parallel-sided plate and a single leg.",vars:[{id:"s",label:"Sound path",unit:"l",base:"m",defaultUnit:"mm"},{id:"theta",label:"Beam angle from normal (degrees)",unit:"n",base:"degree",defaultUnit:"dimensionless"},{id:"x",label:"Horizontal distance",unit:"l",base:"m",defaultUnit:"mm"}],solve:{x:q=>q.s*Math.sin(q.theta*Math.PI/180),s:q=>q.x/Math.sin(q.theta*Math.PI/180),theta:q=>Math.asin(q.x/q.s)*180/Math.PI},forms:{x:"x = s sin θ",s:"s = x ÷ sin θ",theta:"θ = sin⁻¹(x ÷ s)"},example:{known:{s:50,theta:45},units:{s:"mm"},unknown:"x"}},
{id:"ut-reflection",cat:"1. Ultrasonic Testing (UT)",name:"Pressure-amplitude reflection coefficient",equation:"Rₚ = (Z₂ − Z₁) ÷ (Z₂ + Z₁)",desc:"Normal-incidence pressure-amplitude coefficient at an ideal boundary. Intensity reflectance is Rₚ² for lossless media; do not confuse the two.",vars:[{id:"R",label:"Pressure reflection coefficient",unit:"n",base:"ratio",defaultUnit:"dimensionless"},{id:"Z1",label:"Incident-medium acoustic impedance",unit:"n",base:"MRayl",defaultUnit:"dimensionless"},{id:"Z2",label:"Second-medium acoustic impedance",unit:"n",base:"MRayl",defaultUnit:"dimensionless"}],solve:{R:q=>(q.Z2-q.Z1)/(q.Z2+q.Z1),Z2:q=>q.Z1*(1+q.R)/(1-q.R),Z1:q=>q.Z2*(1-q.R)/(1+q.R)},forms:{R:"Rₚ = (Z₂ − Z₁) ÷ (Z₂ + Z₁)",Z1:"Z₁ = Z₂(1 − Rₚ) ÷ (1 + Rₚ)",Z2:"Z₂ = Z₁(1 + Rₚ) ÷ (1 − Rₚ)"}},
{id:"paut-pitch",cat:"2. Phased Array Ultrasonic Testing (PAUT)",name:"Array aperture and active elements",equation:"A = (N − 1)p",desc:"Centre-to-centre active aperture for N equally spaced elements of pitch p.",vars:[{id:"A",label:"Active aperture",unit:"l",base:"m",defaultUnit:"mm"},{id:"N",label:"Active element count",unit:"n",base:"count",defaultUnit:"dimensionless"},{id:"p",label:"Element pitch",unit:"l",base:"m",defaultUnit:"mm"}],solve:{A:q=>(q.N-1)*q.p,N:q=>q.A/q.p+1,p:q=>q.A/(q.N-1)},forms:{A:"A = (N − 1)p",N:"N = A ÷ p + 1",p:"p = A ÷ (N − 1)"}},
{id:"paut-prf",cat:"2. Phased Array Ultrasonic Testing (PAUT)",name:"Pulse repetition frequency and frame rate",equation:"f_frame = PRF ÷ B",desc:"Approximate frame rate when B beams are fired sequentially once per frame, without additional averaging or multiplexing constraints.",vars:[{id:"frame",label:"Frame rate",unit:"f",base:"Hz",defaultUnit:"Hz"},{id:"prf",label:"Pulse repetition frequency",unit:"f",base:"Hz",defaultUnit:"Hz"},{id:"B",label:"Beams per frame",unit:"n",base:"count",defaultUnit:"dimensionless"}],solve:{frame:q=>q.prf/q.B,prf:q=>q.frame*q.B,B:q=>q.prf/q.frame},forms:{frame:"f_frame = PRF ÷ B",prf:"PRF = f_frame × B",B:"B = PRF ÷ f_frame"}},
{id:"tofd-pcs",cat:"3. Time of Flight Diffraction (TOFD)",name:"PCS and half probe-centre separation",equation:"h = PCS ÷ 2",desc:"Half-PCS is the horizontal offset from the scan centreline to either probe centre in a symmetric TOFD arrangement.",vars:[{id:"h",label:"Half PCS",unit:"l",base:"m",defaultUnit:"mm"},{id:"pcs",label:"Probe centre separation",unit:"l",base:"m",defaultUnit:"mm"}],solve:{h:q=>q.pcs/2,pcs:q=>2*q.h},forms:{h:"h = PCS ÷ 2",pcs:"PCS = 2h"}},
{id:"tofd-depth",cat:"3. Time of Flight Diffraction (TOFD)",name:"TOFD diffracted-tip depth (symmetric geometry)",equation:"z = ½ √[(v t)² − PCS²]",desc:"Idealised symmetric direct-path geometry: v is material longitudinal velocity, t is measured travel time and PCS is probe-centre separation. Confirm which wave/path is picked and apply instrument time-zero calibration.",vars:[{id:"z",label:"Tip depth",unit:"l",base:"m",defaultUnit:"mm"},{id:"v",label:"Longitudinal velocity",unit:"v",base:"m/s",defaultUnit:"m/s"},{id:"t",label:"Travel time",unit:"t",base:"s",defaultUnit:"µs"},{id:"pcs",label:"Probe centre separation",unit:"l",base:"m",defaultUnit:"mm"}],solve:{z:q=>.5*Math.sqrt(Math.pow(q.v*q.t,2)-q.pcs*q.pcs)},forms:{z:"z = ½ √[(vt)² − PCS²]"},example:{known:{v:5900,t:10,pcs:40},units:{t:"µs",pcs:"mm"},unknown:"z"}},
{id:"rt-hvl",cat:"4. Radiographic Testing (RT)",name:"Half-value layer",equation:"I = I₀ e^(−μx) ; HVL = ln(2) ÷ μ",desc:"Narrow-beam exponential attenuation model. μ is the linear attenuation coefficient for the radiation energy and material.",vars:[{id:"hvl",label:"Half-value layer",unit:"l",base:"m",defaultUnit:"mm"},{id:"mu",label:"Linear attenuation coefficient",unit:"n",base:"1/m",defaultUnit:"dimensionless"}],solve:{hvl:q=>Math.LN2/q.mu,mu:q=>Math.LN2/q.hvl},forms:{hvl:"HVL = ln(2) ÷ μ",mu:"μ = ln(2) ÷ HVL"}},
{id:"rt-ug",cat:"4. Radiographic Testing (RT)",name:"Geometric unsharpness",equation:"U₉ = F × b ÷ a",desc:"Focal-spot size F, object-to-detector distance b and source-to-object distance a. Use consistent length units and the actual exposure geometry.",vars:[{id:"Ug",label:"Geometric unsharpness",unit:"l",base:"m",defaultUnit:"mm"},{id:"F",label:"Focal spot size",unit:"l",base:"m",defaultUnit:"mm"},{id:"b",label:"Object-to-detector distance",unit:"l",base:"m",defaultUnit:"mm"},{id:"a",label:"Source-to-object distance",unit:"l",base:"m",defaultUnit:"mm"}],solve:{Ug:q=>q.F*q.b/q.a,F:q=>q.Ug*q.a/q.b,b:q=>q.Ug*q.a/q.F,a:q=>q.F*q.b/q.Ug},forms:{Ug:"U₉ = Fb ÷ a",F:"F = U₉a ÷ b",b:"b = U₉a ÷ F",a:"a = Fb ÷ U₉"}},
{id:"mt-field",cat:"5. Magnetic Particle Testing (MT)",name:"Magnetic field strength in a solenoid",equation:"H ≈ N I ÷ L",desc:"Ideal long-solenoid approximation. N is turns, I current and L magnetic path length; real yokes and components require geometry-aware field verification.",vars:[{id:"H",label:"Field strength",unit:"n",base:"A/m",defaultUnit:"dimensionless"},{id:"N",label:"Number of turns",unit:"n",base:"turns",defaultUnit:"dimensionless"},{id:"I",label:"Current",unit:"n",base:"A",defaultUnit:"dimensionless"},{id:"L",label:"Magnetic path length",unit:"l",base:"m",defaultUnit:"mm"}],solve:{H:q=>q.N*q.I/q.L,N:q=>q.H*q.L/q.I,I:q=>q.H*q.L/q.N,L:q=>q.N*q.I/q.H},forms:{H:"H ≈ NI ÷ L",N:"N = HL ÷ I",I:"I = HL ÷ N",L:"L = NI ÷ H"}},

{id:"et-skin",cat:"7. Eddy Current Testing (ET)",name:"Skin depth",equation:"δ = √[2ρ ÷ (ωμ)]",desc:"Standard linear-conductor skin-depth approximation for a homogeneous, isotropic conductor; ω = 2πf. Material permeability and conductivity vary with frequency and field.",vars:[{id:"delta",label:"Skin depth",unit:"l",base:"m",defaultUnit:"mm"},{id:"rho",label:"Resistivity",unit:"n",base:"Ω·m",defaultUnit:"dimensionless"},{id:"omega",label:"Angular frequency",unit:"n",base:"rad/s",defaultUnit:"dimensionless"},{id:"mu",label:"Absolute permeability",unit:"n",base:"H/m",defaultUnit:"dimensionless"}],solve:{delta:q=>Math.sqrt(2*q.rho/(q.omega*q.mu)),rho:q=>q.delta*q.delta*q.omega*q.mu/2,omega:q=>2*q.rho/(q.delta*q.delta*q.mu),mu:q=>2*q.rho/(q.delta*q.delta*q.omega)},forms:{delta:"δ = √[2ρ ÷ (ωμ)]",rho:"ρ = δ²ωμ ÷ 2",omega:"ω = 2ρ ÷ (δ²μ)",mu:"μ = 2ρ ÷ (δ²ω)"}},

    if(!view) throw new Error('The academy content area (#view) was not found.');
    view.innerHTML=`<div class="page-head"><h1 class="page-title">Unit Conversion</h1><p class="page-desc">Choose an NDT method first, then select a conversion relevant to that inspection method.</p></div><div class="panel" style="max-width:1050px;margin:20px auto;background:white;border:1px solid var(--line);border-radius:20px;padding:24px"><div class="field-label" style="margin-bottom:10px">1. Select NDT method</div><div id="utMethodTabs" class="ut-method-tabs" role="group" aria-label="Select NDT method"></div><style>.ut-method-tabs{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:8px 0 24px}.ut-method-tab{appearance:none;display:inline-flex;align-items:center;justify-content:center;width:auto;max-width:100%;border:1px solid #ddcfc9;background:#fff;color:#2d0a14;border-radius:999px;padding:11px 16px;text-align:center;font-family:inherit;font-size:13px;font-weight:700;line-height:1.35;white-space:normal;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease,color .18s ease}.ut-method-tab:hover:not(.active){border-color:#c65d24;background:#f4b183;color:#2d0a14;box-shadow:0 0 0 2px rgba(198,93,36,.18),0 0 17px rgba(198,93,36,.38);transform:translateY(-1px)}.ut-method-tab.active{background:#c65d24;color:#fff;border-color:#c65d24;box-shadow:0 3px 12px rgba(198,93,36,.25)}.ut-method-tab:focus-visible{outline:3px solid rgba(198,93,36,.45);outline-offset:3px}@media(max-width:600px){.ut-method-tabs{gap:8px}.ut-method-tab{padding:10px 13px;font-size:12px}}</style><div class="field-label" style="margin:0 0 14px">Available conversions</div><div id="utConversionCards" class="ut-conversion-cards"></div><select id="utConvType" aria-hidden="true" tabindex="-1" style="display:none"></select><style>.ut-conversion-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px;row-gap:2px;margin:0 0 24px}.ut-conversion-card{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;border:1px solid transparent;border-radius:9px;background:transparent;color:#241b19;text-align:left;font:600 14px/1.4 inherit;cursor:pointer;transition:background .18s ease,border-color .18s ease,box-shadow .18s ease}.ut-conversion-card .ut-card-icon{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;flex:0 0 17px;color:#c65d24;font-size:16px}.ut-conversion-card:hover{background:#fff2eb;border-color:#f0c2aa;box-shadow:0 0 0 2px rgba(198,93,36,.10);color:#4a1020}.ut-conversion-card.active{background:#fff0e7;border-color:#c65d24;color:#4a1020}.ut-conversion-card:focus-visible{outline:3px solid rgba(198,93,36,.35);outline-offset:2px}@media(max-width:620px){.ut-conversion-cards{grid-template-columns:1fr;row-gap:4px}}</style><div id="utConvDescription" class="page-desc"></div><div id="utConvStandardNotes" class="notice" style="margin:12px 0 18px;padding:16px;line-height:1.7"></div><div id="utConvFields" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px"></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn primary" id="utConvert" type="button">Convert</button><button class="btn" id="utSwap" type="button">Swap units</button><button class="btn" id="utClear" type="button">Clear</button></div><div id="utConvResult" aria-live="polite" style="margin-top:20px"></div></div><div class="lesson-body" style="max-width:1050px;margin:20px auto"><h3 style="margin-top:0">Conversion notes</h3><p>For sound velocity, 1 mm/µs = 1,000 m/s. For pulse-echo thickness, time is normally round-trip, so thickness = velocity × time ÷ 2. The sound-path/depth converter measures angle from the normal.</p></div>`;
    const methodTabs=document.getElementById('utMethodTabs'),cards=document.getElementById('utConversionCards'),type=document.getElementById('utConvType'),fields=document.getElementById('utConvFields'),result=document.getElementById('utConvResult'),desc=document.getElementById('utConvDescription'),notes=document.getElementById('utConvStandardNotes');
    let selectedMethod='ut';
    methodTabs.innerHTML=methodOptions.map(m=>`<button type="button" class="ut-method-tab${m[0]===selectedMethod?' active':''}" data-method="${m[0]}" aria-pressed="${m[0]===selectedMethod}">${m[1].replace(/^\d+\.\s*/, '')}</button>`).join('');
    methodTabs.addEventListener('click',event=>{const tab=event.target.closest('[data-method]');if(!tab)return;selectedMethod=tab.dataset.method;methodTabs.querySelectorAll('.ut-method-tab').forEach(button=>{const active=button.dataset.method===selectedMethod;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});populate();});
    function draw(){
      const g=groups.find(x=>x.id===type.value); if(!g)return;
      desc.textContent=g.desc; notes.textContent=g.id==='path'?'Use the refracted angle in the material, measured from the normal.':g.id==='period'?'T = 1/f. Example: 5 MHz has a period of 0.2 µs (200 ns).':g.id==='db'?'Amplitude dB = 20 log₁₀(A₂/A₁). A ratio of 2 is approximately +6.02 dB.':g.id==='fsh'?'80% FSH = 0.80 decimal ratio. Screen height is not an acceptance criterion.':g.id==='metric'?'1 inch = 25.4 mm. 1 inch² = 645.16 mm². Choose length-to-length or area-to-area.':'Select the source and target units, enter a value, then choose Convert.';
      let units=g.units;
      fields.innerHTML=`<label style="display:block;font-weight:700">Value<input id="utConvValue" type="number" step="any" placeholder="Enter value" style="display:block;width:100%;padding:13px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)"></label><label style="display:block;font-weight:700">From unit<select id="utConvFrom" class="btn" style="display:block;width:100%;margin-top:8px">${units.map((u,i)=>`<option value="${i}">${u[0]}</option>`).join('')}</select></label><label style="display:block;font-weight:700">To unit<select id="utConvTo" class="btn" style="display:block;width:100%;margin-top:8px">${units.map((u,i)=>`<option value="${i}" ${i===1?'selected':''}>${u[0]}</option>`).join('')}</select></label>`;
      if(g.kind==='path') fields.innerHTML+=`<label style="display:block;font-weight:700">Conversion direction<select id="utPathDirection" class="btn" style="display:block;width:100%;margin-top:8px"><option value="pathToDepth">Beam path → depth</option><option value="depthToPath">Depth → beam path</option></select></label><label style="display:block;font-weight:700">Refracted angle (degrees)<input id="utConvAngle" type="number" step="any" value="45" style="display:block;width:100%;padding:13px;margin-top:8px;border:1px solid var(--line);border-radius:10px"></label>`;
      if(g.kind==='period') fields.insertAdjacentHTML('beforeend','<p class="page-desc" style="grid-column:1/-1">Choose one frequency unit and one time unit.</p>');
      result.innerHTML='';
    }
    function populate(){const allowed=methodConversions[selectedMethod]||[];const visible=groups.filter(g=>allowed.includes(g.id));type.innerHTML=visible.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');const labels={frequency:'Frequency',wavelength:'Wavelength',velocity:'Sound velocity',time:'Time of flight',distance:'Thickness / distance',path:'Sound path ↔ depth',angle:'Angle',db:'dB ↔ amplitude',gain:'Gain change',fsh:'% FSH ↔ ratio',period:'Frequency ↔ period',prf:'PRF',speed:'Scan speed',metric:'Metric ↔ imperial'};cards.innerHTML=visible.map(g=>`<button type="button" class="ut-conversion-card" data-conversion="${g.id}"><span class="ut-card-icon">▦</span><span>${labels[g.id]||g.name}</span></button>`).join('');type.value=visible.length?visible[0].id:'';cards.querySelectorAll('[data-conversion]').forEach(card=>card.classList.toggle('active',card.dataset.conversion===type.value));draw();}
    function convert(){
      const g=groups.find(x=>x.id===type.value),raw=document.getElementById('utConvValue').value,value=Number(raw),from=document.getElementById('utConvFrom'),to=document.getElementById('utConvTo'),a=g.units[Number(from.value)],b=g.units[Number(to.value)];
      if(raw===''||!Number.isFinite(value)){result.innerHTML='<div class="notice">Enter a valid numeric value.</div>';return;}
      let answer=value,explain='';
      if(g.kind==='db'||g.kind==='gain'){
        if((a[0]==='dB'||a[0]==='dB change')&&b[0]==='amplitude ratio'){answer=10**(value/20);explain='Amplitude ratio = 10^(dB ÷ 20).';}
        else if(a[0]==='amplitude ratio'&&(b[0]==='dB'||b[0]==='dB change')){if(value<=0){result.innerHTML='<div class="notice">Amplitude ratio must be greater than zero.</div>';return;}answer=20*Math.log10(value);explain='dB = 20 log₁₀(amplitude ratio).';}
      }else if(g.kind==='temperature'){const c=a[0]==='°C'?value:a[0]==='°F'?(value-32)*5/9:value-273.15;answer=b[0]==='°C'?c:b[0]==='°F'?c*9/5+32:c+273.15;explain='Temperature converted using the appropriate offset and scale.';}else if(g.kind==='angle'){answer=a[0]==='degrees'&&b[0]==='radians'?value*Math.PI/180:value*180/Math.PI;}
      else if(g.kind==='period'){
        const isFreq=['Hz','kHz','MHz'].includes(a[0]),toFreq=['Hz','kHz','MHz'].includes(b[0]);
        if(isFreq===toFreq){result.innerHTML='<div class="notice">Choose one frequency unit and one time unit.</div>';return;}
        const hz=isFreq?value*a[1]:1/(value*a[1]);if(!Number.isFinite(hz)||hz<=0){result.innerHTML='<div class="notice">Frequency and period must be greater than zero.</div>';return;}
        answer=toFreq?hz/b[1]:(1/hz)/b[1];explain='Period = 1 ÷ frequency.';
      }else if(g.kind==='path'){
        const angle=Number(document.getElementById('utConvAngle').value);if(!Number.isFinite(angle)||angle<0||angle>=90){result.innerHTML='<div class="notice">Enter an angle from 0° up to but not including 90°.</div>';return;}
        const mm=value*a[1],rad=angle*Math.PI/180,depth=document.getElementById('utPathDirection').value==='pathToDepth';answer=depth?mm*Math.cos(rad)/b[1]:mm/Math.cos(rad)/b[1];explain=depth?'Depth = beam path × cos(angle).':'Beam path = depth ÷ cos(angle).';
      }else if(g.kind==='metric'){
        const areaA=a[0].includes('²'),areaB=b[0].includes('²');if(areaA!==areaB){result.innerHTML='<div class="notice">Choose length units together or area units together.</div>';return;}answer=value*a[1]/b[1];
      }else answer=value*a[1]/b[1];
      if(!Number.isFinite(answer)){result.innerHTML='<div class="notice">This conversion cannot be calculated. Check the value and units.</div>';return;}
      result.innerHTML=`<div class="notice" style="padding:20px"><div class="method-tag">CONVERSION RESULT</div><h2 style="margin:8px 0;font-size:28px">${Number(answer.toPrecision(8))} ${b[0]}</h2><p>${explain}</p></div>`;
    }
    type.addEventListener('change',()=>{cards.querySelectorAll('[data-conversion]').forEach(card=>card.classList.toggle('active',card.dataset.conversion===type.value));draw();});
    cards.addEventListener('click',event=>{const card=event.target.closest('[data-conversion]');if(!card)return;type.value=card.dataset.conversion;cards.querySelectorAll('[data-conversion]').forEach(item=>item.classList.toggle('active',item===card));draw();});
    document.getElementById('utConvert').addEventListener('click',convert);
    document.getElementById('utSwap').addEventListener('click',()=>{const a=document.getElementById('utConvFrom'),b=document.getElementById('utConvTo'),old=a.value;a.value=b.value;b.value=old;result.innerHTML='';});
    document.getElementById('utClear').addEventListener('click',()=>{document.getElementById('utConvValue').value='';result.innerHTML='';});
    populate();
  }
  window.openNdtUnitConversion=unitConversionPage;
})();</script>

<script>
/* Keep the Formula Library method selector limited to its individual NDT methods. */
(function(){
  function removeAllMethodsTab(){
    const tabs=document.getElementById('formulaMethodTabs');
    if(!tabs) return;
    tabs.querySelectorAll('button,[role="tab"]').forEach(el=>{
      const label=(el.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();
      if(label==='all methods'||label==='all method') el.remove();
    });
  }
  document.addEventListener('DOMContentLoaded',removeAllMethodsTab);
  window.addEventListener('load',removeAllMethodsTab);
  const observer=new MutationObserver(removeAllMethodsTab);
  observer.observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(()=>observer.disconnect(),15000);
})();
</script>
<script>
document.addEventListener('click',function(event){
 const button=event.target.closest('#learningNav [data-page="unit-conversion"]');
 if(!button)return;
 event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
 try{
  if(typeof window.openNdtUnitConversion!=='function')throw new Error('Unit Conversion module did not initialize.');
  document.querySelectorAll('[data-page]').forEach(item=>item.classList.toggle('active',item===button));
  const crumb=document.getElementById('crumb');if(crumb)crumb.textContent='Unit conversion';
  window.openNdtUnitConversion();window.scrollTo(0,0);
 }catch(error){console.error(error);const view=document.getElementById('view');if(view)view.innerHTML='<div class="notice"><strong>Unit Conversion could not open.</strong><p>'+String(error.message||error)+'</p></div>';}
},true);
</script>
