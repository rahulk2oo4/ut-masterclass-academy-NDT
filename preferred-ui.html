<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream)}button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:312px minmax(0,1fr)}.sidebar{background:var(--maroon);color:white;padding:28px 22px 24px;min-height:100vh;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:16px;padding:5px 12px 0}.logo{width:53px;height:53px;border-radius:17px;background:var(--orange);display:grid;place-items:center;font-weight:850;font-size:19px;letter-spacing:-1px}.brand-title{font-size:17px;font-weight:800;line-height:1.35}.brand-sub{font-size:13px;line-height:2.15;margin-top:3px;color:#f5dfe0}.nav-group{margin-top:53px}.nav-label{font-size:12px;font-weight:850;letter-spacing:2px;color:#c9a9ad;padding:0 16px;margin-bottom:12px}.nav{display:grid;gap:4px}.nav button{border:0;color:#fff;background:transparent;text-align:left;display:flex;align-items:center;gap:20px;padding:17px 20px;border-radius:14px;font-size:15px;min-height:56px}.nav button:hover{background:#47202b}.nav button.active{background:#44202b;box-shadow:inset 4px 0 var(--peach)}.ico{width:16px;color:#f5a36f;text-align:center;font-size:17px}.side-note{border:1px solid #54303a;border-radius:19px;padding:20px 18px;margin:45px 5px 0;font-size:14px;line-height:1.8;color:#f7e5e3}.side-note strong{display:block;color:white;margin-bottom:8px}
.main{min-width:0}.topbar{height:92px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 44px 0 45px;background:rgba(255,248,243,.94)}.crumb{font-size:14px;color:var(--muted)}.crumb b{color:var(--ink)}.profile{display:flex;align-items:center;gap:13px;font-size:14px}.avatar{width:44px;height:44px;border-radius:50%;background:#f5dfd3;display:grid;place-items:center;font-weight:800}.btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:15px 20px;border-radius:14px;font-size:14px;font-weight:750}.btn.primary{background:var(--orange);color:white;border-color:var(--orange)}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.content{padding:38px 44px 60px;max-width:1800px;margin:auto}.hero{min-height:405px;border-radius:29px;background:radial-gradient(circle at 82% 36%,#9a554f 0,#74404a 8%,transparent 8.2%),radial-gradient(circle at 82% 36%,transparent 0 14%,#733044 14.1% 17%,transparent 17.1%),radial-gradient(circle at 82% 5%,transparent 0 15%,#67263b 15.1% 18%,transparent 18.1%),linear-gradient(115deg,#4b1021 0%,#58192e 55%,#68233a 100%);color:white;padding:45px 44px;display:flex;align-items:center;justify-content:space-between;gap:30px;position:relative;overflow:hidden;box-shadow:0 18px 50px #5420340b}.hero-copy{max-width:820px;position:relative;z-index:1}.eyebrow{font-size:13px;font-weight:900;letter-spacing:2px;color:var(--peach);margin:0 0 22px}.hero h1{font-size:clamp(32px,3vw,52px);line-height:1.2;letter-spacing:-1.8px;margin:0 0 18px;font-weight:850;max-width:800px}.hero p{font-size:18px;line-height:1.7;color:#f2dfe3;max-width:760px;margin:0 0 26px}.btn.light{background:white;border-color:white;color:var(--ink);padding:17px 21px}.hero-art{width:310px;min-width:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;position:relative;z-index:1}.orb{width:180px;height:180px;border:1px solid #ffffff55;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 19px #ffffff08,0 0 0 38px #ffffff05;background:radial-gradient(circle at 40% 35%,#c1836b55,transparent 65%);font-size:32px}.art-caption{font-size:13px;color:#f5e0e4}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:26px}.stat{border:1px solid var(--line);border-radius:20px;background:#fff;padding:23px 24px 22px;min-height:174px;box-shadow:0 16px 35px #5a26300a}.stat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:#8b7c7d;font-size:14px}.stat-icon{width:40px;height:40px;border-radius:12px;background:var(--pale);color:var(--orange);display:grid;place-items:center;font-size:17px}.stat-number{font-size:34px;font-weight:850;line-height:1.2;margin:13px 0 13px;letter-spacing:-1px}.stat-foot{font-size:13px;color:#897c7d}.section-head{display:flex;justify-content:space-between;align-items:center;margin:45px 0 19px;gap:20px}.section-head h2{font-size:24px;letter-spacing:-.6px;margin:0}.text-link{border:0;background:none;color:var(--orange);font-weight:800}.method-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.method{background:#fff;border:1px solid var(--line);border-radius:19px;padding:23px;display:flex;flex-direction:column;min-height:200px}.method-tag{font-size:11px;letter-spacing:1.4px;font-weight:850;color:var(--orange)}.method h3{font-size:19px;margin:13px 0 9px}.method p{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 20px}.method .btn{margin-top:auto;align-self:flex-start;padding:12px 15px}.page-title{font-size:32px;letter-spacing:-1px;margin:6px 0 8px}.page-desc{color:var(--muted);line-height:1.65;margin:0 0 25px}.toolbar{display:flex;gap:12px;margin:22px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;background:white;padding:13px 15px;color:var(--ink)}.lesson-list{display:grid;gap:12px}.lesson-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.lesson-row h3{margin:0 0 6px;font-size:16px}.lesson-row p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.pill{background:var(--pale);color:var(--orange);border-radius:30px;padding:7px 11px;font-size:12px;font-weight:750;white-space:nowrap}.lesson-body{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;line-height:1.8}.lesson-body h3{margin-top:25px}.formula-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.formula-card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px}.formula{font-size:22px;font-weight:800;margin:15px 0;color:var(--wine)}.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.calc input{width:100px;padding:10px;border:1px solid var(--line);border-radius:9px}.result{font-weight:800;color:var(--orange);margin-top:12px}.question{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;margin-bottom:14px}.question h3{margin:0 0 15px;font-size:17px}.option{display:block;margin:10px 0;color:#66575a}.option input{margin-right:9px;accent-color:var(--orange)}.notice{padding:15px 17px;border-radius:12px;background:#fff0e5;color:var(--ink);margin:16px 0;line-height:1.6}.certificate{border:8px double #7c3044;background:white;padding:35px;text-align:center;max-width:780px;margin:10px auto}.certificate h2{font-size:31px;color:var(--wine)}.certificate .cert-name{font-size:27px;font-weight:800;margin:25px}.empty{padding:30px;text-align:center;border:1px dashed #d9bfb6;border-radius:16px;color:var(--muted);background:#fff}
@media(max-width:1200px){.app{grid-template-columns:270px minmax(0,1fr)}.content{padding:28px}.topbar{padding:0 28px}.hero{padding:35px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.method-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-art{width:230px;min-width:180px}.orb{width:145px;height:145px}}
@media(max-width:760px){.app{display:block}.sidebar{position:relative;height:auto;min-height:0;padding:18px}.brand{padding:0 4px}.nav-group{margin-top:24px}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{padding:12px;font-size:13px;gap:9px;min-height:46px}.nav-label{padding:0 5px}.side-note{display:none}.topbar{height:auto;min-height:70px;padding:14px 18px}.profile{gap:8px}.profile .set-name{display:none}.content{padding:20px 16px 40px}.hero{min-height:0;padding:27px 23px;border-radius:21px}.hero-art{display:none}.hero h1{font-size:34px;letter-spacing:-1px}.hero p{font-size:15px}.stats{gap:10px}.stat{padding:16px;min-height:150px}.stat-number{font-size:28px}.stat-top{font-size:12px}.stat-icon{width:32px;height:32px}.method-grid,.formula-grid{grid-template-columns:1fr}.section-head{margin-top:32px}.section-head h2{font-size:21px}.lesson-row{align-items:flex-start;padding:15px}.lesson-row .btn{padding:10px}.page-title{font-size:27px}}
</style>

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">NDT</div><div><div class="brand-title">NDT MASTERCLASS</div><div class="brand-sub">THEORY LEARNING<br>ACADEMY</div></div></div>
  <div class="nav-group"><div class="nav-label">LEARNING SPACE</div><nav class="nav" id="learningNav">
    <button class="active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="courses"><span class="ico">▤</span>Course library</button>

<main class="main">
<header class="topbar"><div class="crumb">Academy / <b id="crumb">Dashboard</b></div><div class="profile"><div class="avatar" id="avatar">R</div><span id="userName">Rahul</span><button class="btn set-name" id="setName">Set name</button><button class="btn primary" id="signOut">Sign out</button></div></header>
<div class="content" id="view"></div>

<script>
const methods=[
{name:"Ultrasonic Testing (UT)",short:"UT FUNDAMENTALS",desc:"Sound waves, probes, calibration, signal interpretation and conventional ultrasonic inspection.",lessons:["Introduction to NDT","Principles of ultrasonic testing","Sound waves and propagation","Ultrasonic probes and transducers","Instrument controls and calibration","A-scan interpretation","Thickness measurement","Defects, limitations and safety"]},
{name:"Phased Array UT (PAUT)",short:"ADVANCED UT",desc:"Understand phased-array probes, beam steering, focal laws, scan plans and encoded inspection.",lessons:["PAUT fundamentals","Array probes and elements","Beam steering and focusing","Focal laws","S-scan and sectorial views","Calibration and sensitivity","Scan plans and reporting"]},
{name:"Time of Flight Diffraction (TOFD)",short:"ADVANCED UT",desc:"Learn TOFD setup, lateral waves, back-wall signals, diffraction tips and sizing concepts.",lessons:["TOFD principles","Probe arrangement","Lateral and back-wall waves","Calibration and PCS","Image interpretation","Defect sizing and limitations"]},
{name:"Radiographic Testing (RT)",short:"RADIOGRAPHY",desc:"Radiation basics, image quality, exposure variables, film/digital systems and safety.",lessons:["Radiographic principles","X-ray and gamma sources","Image quality indicators","Exposure and geometry","Film and digital radiography","Interpretation and safety"]},
{name:"Magnetic Particle Testing (MT)",short:"SURFACE METHODS",desc:"Magnetisation, field direction, particles, indications and demagnetisation.",lessons:["MT principles","Magnetic fields","Magnetisation methods","Particles and media","Indication interpretation","Limitations and safety"]},
{name:"Liquid Penetrant Testing (PT)",short:"SURFACE METHODS",desc:"Surface preparation, penetrant systems, dwell time, removal, development and evaluation.",lessons:["PT principles","Materials and penetrants","Surface preparation","Process sequence","Indication evaluation","Limitations and safety"]},
{name:"Visual Testing (VT)",short:"FOUNDATION",desc:"Visual inspection principles, lighting, viewing conditions, tools and documentation.",lessons:["Visual inspection basics","Lighting and viewing","Optical aids","Surface conditions","Acceptance and reporting"]},
{name:"Eddy Current Testing (ECT)",short:"ELECTROMAGNETIC",desc:"Electromagnetic induction, coils, impedance, lift-off, conductivity and signal analysis.",lessons:["ECT principles","Electromagnetic induction","Coils and impedance","Frequency and skin effect","Calibration and interpretation","Applications and limitations"]}
];
const lessonText={
"Introduction to NDT":"Non-destructive testing (NDT) evaluates a material, component or assembly without impairing its future usefulness. It supports quality assurance, maintenance and fitness-for-service decisions. Common methods include UT, RT, MT, PT, VT and ECT.",
"Principles of ultrasonic testing":"Ultrasonic testing introduces high-frequency mechanical waves into a test object and analyses reflected or transmitted energy. Changes in acoustic impedance at boundaries can produce reflections. Results depend on material, geometry, probe characteristics, coupling and instrument settings.",
"Sound waves and propagation":"Ultrasound propagates as mechanical vibration. Longitudinal waves involve particle motion parallel to propagation; shear waves involve motion perpendicular to propagation. Velocity depends on material properties and wave mode. Interfaces can cause reflection, transmission, refraction and mode conversion.",
"Ultrasonic probes and transducers":"A transducer converts electrical energy into mechanical vibration and returning vibration into an electrical signal. Probe selection considers frequency, element size, bandwidth, beam spread, near field, resolution and material attenuation. Couplant helps transfer sound across the probe-to-part interface.",
"Instrument controls and calibration":"Calibration establishes the relationship between instrument indications and known reference distances or responses. Verify range, zero, velocity and sensitivity with suitable reference blocks and documented procedures. Calibration must represent the inspection geometry and applicable code or specification.",
"A-scan interpretation":"An A-scan displays signal amplitude against time or sound path. The initial pulse, back-wall response and intermediate indications are interpreted using calibrated range, expected geometry and scan movement. Amplitude alone does not identify defect type; evaluation requires context and procedure requirements."
};
function safeLoadArray(key){try{const value=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(value)?value:[]}catch(error){console.warn("Resetting invalid academy storage:",key,error);return []}}
let completed=safeLoadArray("ndtAcademyCompleted");
let certificates=safeLoadArray("ndtAcademyCertificates");
let learner=localStorage.getItem("ndtAcademyName")||"Rahul";
let currentMethod=0,currentLesson="",examQuestions=[],examAnswers={};
const view=document.getElementById("view");
function save(){localStorage.setItem("ndtAcademyCompleted",JSON.stringify(completed));localStorage.setItem("ndtAcademyCertificates",JSON.stringify(certificates))}
function go(page){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const names={dashboard:"Dashboard",courses:"Course library",formulas:"Formula library",simulation:"UT simulations",practice:"Practice questions",exams:"Final examinations",certificates:"Certificates",about:"About the academy"};document.getElementById("crumb").textContent=names[page]||"Lesson";({dashboard,courses,formulas,simulation,practice,exams,certificates:showCertificates,about})[page]?.();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function dashboard(){view.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">YOUR THEORY LEARNING JOURNEY</div><h1>Build your NDT knowledge, one concept at a time.</h1><p>Explore structured theory lessons, understand inspection principles, practise technical questions and review core equations in one learning space.</p><button class="btn light" id="explore">Explore courses&nbsp; →</button></div><div class="hero-art"><div class="orb">⌁</div><div class="art-caption">LEARN · UNDERSTAND · REVIEW</div></div></section><section class="stats"><div class="stat"><div class="stat-top">Available methods <span class="stat-icon">▤</span></div><div class="stat-number">08</div><div class="stat-foot">Structured theory pathways</div></div><div class="stat"><div class="stat-top">Lessons completed <span class="stat-icon">✓</span></div><div class="stat-number">${completed.length}</div><div class="stat-foot">Saved on this browser</div></div><div class="stat"><div class="stat-top">Formula tools <span class="stat-icon">ƒ</span></div><div class="stat-number">06</div><div class="stat-foot">Interactive calculation cards</div></div><div class="stat"><div class="stat-top">Certificates <span class="stat-icon">♧</span></div><div class="stat-number">${certificates.length}</div><div class="stat-foot">Educational completion records</div></div></section><div class="section-head"><h2>Explore NDT methods</h2><button class="text-link" id="allMethods">View all methods&nbsp; →</button></div><div class="method-grid">${methods.slice(0,3).map((m,i)=>methodCard(m,i)).join("")}</div>`;document.getElementById("explore").onclick=()=>go("courses");document.getElementById("allMethods").onclick=()=>go("courses");wireMethodButtons()}
function methodCard(m,i){return `<article class="method"><div class="method-tag">${m.short}</div><h3>${m.name}</h3><p>${m.desc}</p><button class="btn" data-method="${i}">Start learning&nbsp; →</button></article>`}
function courses(){view.innerHTML=`<h1 class="page-title">Course library</h1><p class="page-desc">Choose an NDT method and progress through structured theory lessons. Your lesson progress is saved in this browser.</p><div class="toolbar"><input id="courseSearch" placeholder="Search methods or lessons…" aria-label="Search methods or lessons"></div><div class="method-grid" id="courseGrid">${methods.map((m,i)=>methodCard(m,i)).join("")}</div>`;wireMethodButtons();document.getElementById("courseSearch").oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll("#courseGrid .method").forEach((el)=>el.style.display=el.innerText.toLowerCase().includes(q)?"flex":"none")}}
function wireMethodButtons(){document.querySelectorAll("[data-method]").forEach(b=>b.onclick=()=>openMethod(+b.dataset.method))}
function openMethod(i){currentMethod=i;const m=methods[i];view.innerHTML=`<button class="text-link" id="backCourses">← Course library</button><h1 class="page-title" style="margin-top:18px">${m.name}</h1><p class="page-desc">${m.desc}</p><div class="lesson-list">${m.lessons.map((l,j)=>{const id=i+"-"+j;return `<div class="lesson-row"><div><h3>${j+1}. ${l}</h3><p>${completed.includes(id)?"Completed · Progress saved":"Theory lesson · Self-paced learning"}</p></div><button class="btn ${completed.includes(id)?"":"primary"}" data-lesson="${j}">${completed.includes(id)?"Review lesson":"Start lesson →"}</button></div>`}).join("")}</div>`;document.getElementById("backCourses").onclick=()=>go("courses");document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>openLesson(i,+b.dataset.lesson))}
function openLesson(mi,li){currentMethod=mi;const m=methods[mi],name=m.lessons[li],id=mi+"-"+li;currentLesson=id;const text=lessonText[name]||`${name} is an important part of ${m.name}. Learn the purpose of the method, its basic operating principles, equipment and procedure, relevant variables, common indications, limitations and safety considerations. In practice, always follow the approved inspection procedure, applicable code and acceptance criteria. Record the equipment, calibration checks, inspection conditions and results clearly.`;view.innerHTML=`<button class="text-link" id="backMethod">← Back to ${m.name}</button><div class="lesson-body" style="margin-top:18px"><div class="method-tag">THEORY LESSON · ${String(li+1).padStart(2,"0")} / ${m.lessons.length}</div><h1 class="page-title" style="margin-top:12px">${name}</h1><p class="page-desc">${m.name}</p><p>${text}</p><h3>Key learning points</h3><ul><li>Understand the basic principle and purpose of the topic.</li><li>Recognise equipment, procedure variables and their effect on results.</li><li>Interpret indications in context and understand method limitations.</li><li>Apply approved procedures, safety requirements and acceptance criteria.</li></ul><div class="notice"><b>Learning note:</b> This academy is for theory learning and knowledge development. It does not provide an employer qualification or an ISO 9712 / ASNT Level II or Level III certification.</div><button class="btn primary" id="completeLesson">${completed.includes(id)?"Lesson completed ✓":"Mark lesson complete ✓"}</button> <button class="btn" id="nextLesson">Next lesson →</button></div>`;document.getElementById("backMethod").onclick=()=>openMethod(mi);document.getElementById("completeLesson").onclick=()=>{if(!completed.includes(id))completed.push(id);save();openLesson(mi,li);};document.getElementById("nextLesson").onclick=()=>{if(li+1<m.lessons.length)openLesson(mi,li+1);else openMethod(mi)}}
const formulaData=[{name:"Wave velocity",formula:"v = f × λ",desc:"Calculate wave velocity from frequency and wavelength.",fields:["Frequency (MHz)","Wavelength (mm)"],calc:a=>a[0]*1e6*a[1]/1000+" m/s",hint:"For consistent units: MHz × mm gives m/s."},{name:"Sound path",formula:"Distance = velocity × time / 2",desc:"Pulse-echo reflector distance using round-trip time.",fields:["Velocity (m/s)","Time (µs)"],calc:a=>(a[0]*a[1]*1e-6/2*1000).toFixed(3)+" mm",hint:"Time is round-trip time; divide by two."},{name:"Wavelength",formula:"λ = v / f",desc:"Find wavelength for a material and frequency.",fields:["Velocity (m/s)","Frequency (MHz)"],calc:a=>(a[0]/(a[1]*1e6)*1000).toFixed(3)+" mm",hint:"Wavelength affects resolution and scattering."},{name:"Decibel change",formula:"ΔdB = 20 log₁₀(A₂/A₁)",desc:"Compare two signal amplitudes.",fields:["Initial amplitude","Final amplitude"],calc:a=>(20*Math.log10(a[1]/a[0])).toFixed(2)+" dB",hint:"Use the same amplitude units and nonzero values."},{name:"Thickness",formula:"d = v × t / 2",desc:"Estimate thickness from pulse-echo transit time.",fields:["Velocity (m/s)","Round-trip time (µs)"],calc:a=>(a[0]*a[1]/2e6*1000).toFixed(3)+" mm",hint:"Correct for zero offset and calibrate on a reference."},{name:"Near field (approx.)",formula:"N ≈ D² / (4λ)",desc:"Approximate near-field length for a circular element.",fields:["Element diameter (mm)","Wavelength (mm)"],calc:a=>(a[0]*a[0]/(4*a[1])).toFixed(3)+" mm",hint:"Approximation for a circular piston in a uniform medium."}];

function simulation(){
view.innerHTML=`<div class="page-head"><div><div class="method-tag">INTERACTIVE LEARNING LAB</div><h1 class="page-title">UT Simulations</h1><p class="page-desc">Explore wave behaviour, beam paths, specimen geometry and pulse-echo reflection with controls you can adjust.</p></div></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:18px">
<section class="formula-card" style="padding:18px"><div class="method-tag">01 · WAVE BEHAVIOUR</div><h3 style="margin:8px 0">Frequency & wavelength</h3><p class="page-desc" style="margin-bottom:12px">Frequency controls how many cycles appear in the same display length. Wavelength is calculated from the selected material velocity.</p>
<label style="font-size:13px;font-weight:700;display:block">Frequency <b id="simFreqText">2.25 MHz</b><input id="simFreq" type="range" min="1" max="10" step=".25" value="2.25" style="display:block;width:100%;accent-color:var(--orange)"></label>
<label style="font-size:13px;font-weight:700;display:block;margin-top:12px">Material velocity <b id="simSpeedText">5,920 m/s</b><input id="simSpeed" type="range" min="1500" max="6400" step="100" value="5920" style="display:block;width:100%;accent-color:var(--orange)"></label>

const freq=document.getElementById('simFreq'),speed=document.getElementById('simSpeed'),angle=document.getElementById('simAngle'),path=document.getElementById('simPath');
function updateWave(){const f=Number(freq.value),v=Number(speed),lambda=v/(f*1e6)*1000;document.getElementById('simFreqText').textContent=f.toFixed(2)+' MHz';document.getElementById('simSpeedText').textContent=v.toLocaleString()+' m/s';const cycles=1.5+(f-1)/9*16;let d='';for(let x=20;x<=500;x+=1){const y=75-43*Math.sin((x-20)/480*cycles*2*Math.PI);d+=(x===20?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';}document.getElementById('wavePath').setAttribute('d',d);const quarter=480/cycles;document.getElementById('waveMark').setAttribute('d','M '+(20+quarter)+' 28 V 122 M '+(20+quarter)+' 28 H '+(20+2*quarter)+' M '+(20+2*quarter)+' 28 V 122');document.getElementById('waveReadout').innerHTML='<b>Calculated wavelength: '+lambda.toFixed(3)+' mm</b><br>λ = velocity ÷ frequency. At fixed velocity, higher frequency produces a shorter wavelength. The waveform now visibly changes with frequency.';}
function updateBeam(){const a=Number(angle.value),p=Number(path.value),rad=a*Math.PI/180,depth=p*Math.cos(rad),run=p*Math.sin(rad),x=40+Math.min(390,run*2.1),y=185-Math.min(140,depth*.7);document.getElementById('simAngleText').textContent=a+'°';document.getElementById('simPathText').textContent=p+' mm';document.getElementById('beamLine').setAttribute('d','M40 35 L'+Math.max(45,Math.min(470,x)).toFixed(1)+' '+Math.max(45,Math.min(185,y)).toFixed(1));document.getElementById('beamTip').setAttribute('cx',Math.max(45,Math.min(470,x)));document.getElementById('beamTip').setAttribute('cy',Math.max(45,Math.min(185,y)));document.getElementById('beamReadout').innerHTML='<b>Depth component: '+depth.toFixed(1)+' mm</b><br>Horizontal component: '+run.toFixed(1)+' mm. For angle measured from the normal, depth = path × cos(angle).';}
freq.addEventListener('input',updateWave);speed.addEventListener('input',updateWave);angle.addEventListener('input',updateBeam);path.addEventListener('input',updateBeam);updateWave();updateBeam();
const snI=document.getElementById('snellIncident'),snV1=document.getElementById('snellV1'),snVL=document.getElementById('snellVL'),snVS=document.getElementById('snellVS');
function updateSnell(){
 const i=Number(snI.value),vw=Number(snV1.value),vl=Number(snVL.value),vs=Number(snVS.value),rad=i*Math.PI/180;
 const qL=(vl/vw)*Math.sin(rad),qS=(vs/vw)*Math.sin(rad);
 const c1=Math.asin(Math.min(1,vw/vl))*180/Math.PI,c2=Math.asin(Math.min(1,vw/vs))*180/Math.PI;
 const lValid=qL<=1,sValid=qS<=1,lAng=lValid?Math.asin(Math.max(-1,Math.min(1,qL)))*180/Math.PI:null,sAng=sValid?Math.asin(Math.max(-1,Math.min(1,qS)))*180/Math.PI:null;
 document.getElementById('snellIncidentText').textContent=i+'°';document.getElementById('snellV1Text').textContent=vw.toLocaleString();document.getElementById('snellVLText').textContent=vl.toLocaleString();document.getElementById('snellVSText').textContent=vs.toLocaleString();
 const point=(ang,len,sign)=>({x:360+sign*Math.sin(ang*Math.PI/180)*len,y:125+Math.cos(ang*Math.PI/180)*len});
 const ip=point(i,105,-1),rp=point(i,105,1);
 document.getElementById('snellIncidentRay').setAttribute('d','M '+ip.x.toFixed(1)+' 20 L 360 125');
 document.getElementById('snellReflectedRay').setAttribute('d','M 360 125 L '+rp.x.toFixed(1)+' 20');
 document.getElementById('snellIncidentLabel').textContent='Incident θi = '+i+'°';document.getElementById('snellReflectedLabel').textContent='Reflected θr = '+i+'°';document.getElementById('snellReflectedLabel').setAttribute('x',Math.min(530,rp.x+8));
 const lEl=document.getElementById('snellLongRay'),sEl=document.getElementById('snellShearRay'),lLab=document.getElementById('snellLongLabel'),sLab=document.getElementById('snellShearLabel');
 if(lValid){const p=point(lAng,135,1);lEl.setAttribute('d','M 360 125 L '+p.x.toFixed(1)+' '+Math.min(278,p.y).toFixed(1));lEl.setAttribute('opacity','1');lLab.textContent='L-wave θL = '+lAng.toFixed(1)+'°';lLab.setAttribute('x',Math.min(570,p.x+8));lLab.setAttribute('y',Math.min(270,p.y-5));}else{lEl.setAttribute('d','M 360 125 L 520 125');lEl.setAttribute('opacity','.25');lLab.textContent='L-wave: beyond 1st critical';lLab.setAttribute('x','385');lLab.setAttribute('y','170');}
 if(sValid){const p=point(sAng,135,-1);sEl.setAttribute('d','M 360 125 L '+p.x.toFixed(1)+' '+Math.min(278,p.y).toFixed(1));sEl.setAttribute('opacity','1');sLab.textContent='S-wave θS = '+sAng.toFixed(1)+'°';sLab.setAttribute('x',Math.max(35,p.x-100));sLab.setAttribute('y',Math.min(270,p.y+15));}else{sEl.setAttribute('d','M 360 125 L 200 125');sEl.setAttribute('opacity','.25');sLab.textContent='S-wave: beyond 2nd critical';sLab.setAttribute('x','45');sLab.setAttribute('y','195');}
 const fmt=x=>x===null?'No propagating transmitted wave':x.toFixed(1)+'°';
 document.getElementById('snellReadout').innerHTML='<b>Incident angle: '+i.toFixed(1)+'° · Reflected angle: '+i.toFixed(1)+'°</b><br><b>Longitudinal refracted angle:</b> '+fmt(lAng)+'<br><b>Shear refracted angle:</b> '+fmt(sAng)+'<br><b>1st critical angle (longitudinal):</b> '+c1.toFixed(1)+'°<br><b>2nd critical angle (shear):</b> '+c2.toFixed(1)+'°<br><span style="color:#c65d24">Snell relation, L:</span> sin θL = (VL/Vwater) sin θi = '+qL.toFixed(3)+'<br><span style="color:#167b70">Snell relation, S:</span> sin θS = (VS/Vwater) sin θi = '+qS.toFixed(3)+'<br><small>At or above each critical angle, that refracted mode no longer propagates into the solid. Reflected angle equals incidence angle.</small>';
}
[snI,snV1,snVL,snVS].forEach(el=>el.addEventListener('input',updateSnell));updateSnell();
const geo=document.getElementById('simGeometry'),dtype=document.getElementById('simDefectType'),dx=document.getElementById('simDefectX'),dy=document.getElementById('simDefectY'),ds=document.getElementById('simDefectSize'),probeSide=document.getElementById('simProbeSide'),probePos=document.getElementById('simProbePos'),probeAngle=document.getElementById('simProbeAngle'),reflectorTilt=document.getElementById('simReflectorTilt'),atten=document.getElementById('simAtten'),coupling=document.getElementById('simCoupling');let specimenTimer=null,ascanFrozen=false,ascanSweepTimer=null;
function updateLiveAscan(){
 const velocity=Number(document.getElementById('ascanVel').value),gain=Number(document.getElementById('ascanGain').value),depthPct=Number(dy.value)/100,depthMm=(geo.value==='plate'?100:180)*depthPct;
 const tilt=Number(reflectorTilt.value),angleDeg=Number(probeAngle.value),couple=Number(coupling.value)/100,attenDb=Number(atten.value),size=Number(ds.value);
 const orientation=Math.max(.06,Math.abs(Math.cos((tilt-angleDeg)*Math.PI/180)));
 const pathCm=(depthMm/10)*2,attenFactor=Math.pow(10,-(attenDb*pathCm)/20);
 const sizeFactor=Math.min(1,size/16),geometryFactor=geo.value==='pipe'?.78:geo.value==='plate'?.92:1;
 const amp=Math.max(0,Math.min(0.96,0.88*gain*orientation*couple*attenFactor*sizeFactor*geometryFactor));
 const tofUs=2*(depthMm/1000)/velocity*1e6;
 const xDef=72+Math.min(565,Math.max(0,tofUs/Math.max(1,(2*.18/3000*1e6))*565));
 const xBack=642;
 function pulse(x,amplitude,cycles,phase=0){let d='';for(let j=-34;j<=34;j++){const xx=x+j;if(xx<43||xx>691)continue;const env=Math.exp(-(j*j)/(2*10*10)),yy=190-amplitude*env*Math.sin(j*.72+phase);d+=(d?'L':'M')+xx.toFixed(1)+' '+yy.toFixed(1)+' ';}return d;}
 let trace='M42 190 ';for(let x=43;x<=692;x+=2){let y=190;if(Math.abs(x-52)<36)y-=Math.exp(-Math.pow((x-52)/8,2))*54;if(Math.abs(x-xDef)<42)y-=amp*145*Math.exp(-Math.pow((x-xDef)/11,2))*Math.sin((x-xDef)*.72);if(Math.abs(x-xBack)<42)y-=Math.min(.8,.72*gain*attenFactor)*145*Math.exp(-Math.pow((x-xBack)/11,2))*Math.sin((x-xBack)*.72);trace+='L'+x+' '+y.toFixed(2)+' ';}
 document.getElementById('liveAscanTrace').setAttribute('d',trace);

const curriculum={
"01 · NDT foundations and UT overview":{why:"UT is a volumetric method that introduces high-frequency mechanical energy and evaluates returning signals. It is especially useful when access to one side is sufficient, but results depend on material structure, geometry, surface condition and procedure.",points:["NDT assesses condition without intentionally impairing serviceability.","An indication is an observed response; it is not automatically a rejectable defect.","Choose the method based on target discontinuity, material, access, geometry and required sensitivity."]},
"02 · Mechanical waves and particle motion":{why:"Ultrasound is a mechanical disturbance that propagates through a medium. Longitudinal particle motion is parallel to wave travel; shear motion is perpendicular. Mechanical waves need a medium and cannot propagate through a vacuum.",points:["Wave speed is primarily governed by material elastic properties and density.","Boundaries can reflect, transmit, refract or convert wave modes.","Do not confuse wave propagation direction with particle-motion direction."]},
"03 · Frequency, period, wavelength and wave velocity":{why:"Frequency is cycles per second; period is the time for one cycle; wavelength is the distance occupied by one cycle; velocity is propagation distance per unit time. For a given wave mode in a given material, velocity is approximately fixed, so frequency and wavelength vary inversely.",formula:"v = f × λ",points:["Use consistent units before calculating.","Higher frequency means shorter wavelength at the same velocity, often improving resolution while increasing attenuation.","In UT, frequency is commonly MHz, wavelength mm and velocity mm/µs or m/s."]},
"15 · Range, zero and velocity calibration":{why:"Range calibration aligns the instrument time base with known sound paths. Zero correction compensates for delays in the probe, wedge and electronics. Velocity setting maps measured travel time to distance; use suitable reference reflectors and the approved procedure.",points:["Calibrate with a representative block and known geometry.","Verify multiple points across the required range rather than relying on one point.","Recheck after changing probe, wedge, cable, setup or relevant environmental conditions."]},
"17 · Sensitivity setting, DAC, TCG and transfer correction":{why:"Sensitivity establishes the response level used to detect and evaluate reflectors. DAC plots response from equivalent reflectors at different sound paths; TCG adjusts gain with time/range to compensate for path-related amplitude change. Transfer correction accounts for differences between reference and test surfaces/materials when required.",points:["DAC and TCG are not identical display techniques, even when they serve related purposes.","Document reference reflector, gain, range, correction and calibration checks.","Apply only the correction permitted by the procedure or code."]},
"23 · Squirter UT, water column and coupling stability":{why:"Squirter systems use a controlled water stream or column to couple ultrasound from the probe to the component without direct probe contact. Flow stability, nozzle alignment, standoff, water cleanliness, bubbles and robot motion can affect signal quality and time of flight.",points:["Maintain a stable, coherent water path and verify signal/TOF during setup.","Check nozzle-to-probe alignment, leaks, bubbles, mesh/filter cleanliness and flow.","Validate coverage, encoder/index accuracy and calibration on representative reference samples."]},
"01 · PAUT principles and conventional UT comparison":{why:"PAUT uses multiple small elements driven with programmed time delays. The delays shape, steer or focus the beam electronically, allowing multiple angles or focal conditions to be produced from one array assembly.",points:["Focal laws define element delays for the intended beam.","Encoded position and calibration are essential to trustworthy image geometry.","Image appearance alone does not replace procedure-based interpretation."]},
"01 · TOFD principle and diffraction physics":{why:"TOFD uses a transmitter-receiver pair and records diffracted energy from discontinuity tips. Arrival times are used to estimate tip positions; this supports sizing but requires awareness of lateral-wave and back-wall dead zones.",points:["Identify lateral wave, tip-diffracted signals and back-wall response.","Probe centre spacing, velocity and time-base calibration affect sizing.","Near-surface and near-back-wall regions may need complementary techniques."]},
"01 · Radiographic testing principles":{why:"Radiography forms an image from differences in transmitted ionising radiation. Thickness, density, radiation energy and geometry influence attenuation and image contrast. Discontinuities are visible only when their orientation and contrast produce a detectable image.",points:["Image quality depends on technique geometry, exposure and detector/film performance.","Use IQIs and applicable image-quality requirements.","Radiation protection and controlled-area procedures are mandatory."]},
"01 · Ferromagnetism and MT principles":{why:"MT magnetises a ferromagnetic component. A surface or near-surface discontinuity can disturb the magnetic flux and create leakage fields that attract visible or fluorescent particles.",points:["The magnetic field should cross the discontinuity as nearly as practical.","MT is not suitable for all non-ferromagnetic materials.","Field adequacy, surface condition, lighting and demagnetisation may be important."]},
"01 · PT principles and capillary action":{why:"PT detects discontinuities open to the surface. Liquid penetrant enters openings by capillary action; after excess penetrant is removed, developer draws penetrant back out to create a visible or fluorescent indication.",points:["PT cannot reliably reveal a discontinuity sealed below the surface.","Cleaning, dwell time, removal, development and lighting must follow product instructions and procedure.","Over-washing, under-cleaning or insufficient development can mask indications."]},
"01 · Principles, scope and limitations of VT":{why:"VT relies on direct observation or optical aids to evaluate visible conditions. Lighting, access, viewing distance, angle, surface cleanliness and inspector visual capability strongly affect results.",points:["Use suitable lighting and calibrated gauges when dimensions are required.","Record the location, extent and appearance of relevant conditions.","VT cannot detect a hidden condition without suitable access or complementary methods."]},
"01 · Electromagnetic induction fundamentals":{why:"ECT drives alternating current through a coil, creating a changing magnetic field that induces circulating currents in a conductive test object. Changes in conductivity, permeability, geometry, lift-off or cracks alter coil impedance.",points:["Frequency affects penetration depth and sensitivity to different features.","Lift-off and edges can resemble defect signals.","Calibration standards and controlled probe motion are essential for repeatable interpretation."]},
"01 · Leak testing principles and terminology":{why:"Leak testing determines whether gas or liquid passes through a boundary at a rate relevant to the test requirement. Different techniques detect pressure change, bubbles or tracer gas; sensitivity and suitability depend on the system and test conditions.",points:["Define the test boundary, pressure/vacuum, stabilisation time and allowable leak rate.","Temperature changes can mimic pressure decay.","Use a method with demonstrated sensitivity and safe operating limits."]},
"01 · AE principles and active damage sources":{why:"Acoustic emission monitors transient elastic waves generated by active processes such as crack growth, plastic deformation or leakage under load. It is a monitoring method and is strongest when the component is stimulated by a defined load or operating condition.",points:["Noise sources must be distinguished from relevant events.","Sensor location, coupling, attenuation and velocity affect source location.","AE often identifies active sources; complementary NDT may be needed to characterise them."]},
"01 · Infrared radiation and thermal imaging":{why:"Thermography measures infrared radiation and converts it into a thermal image. Passive thermography observes existing temperature patterns; active thermography applies controlled heating or cooling and evaluates the transient response.",points:["Emissivity and reflected apparent temperature can bias readings.","Heating method, camera settings and environment influence contrast.","Thermal patterns support evaluation but require validated interpretation criteria."]},
"01 · Digital radiography overview and terminology":{why:"Digital radiography records radiation with a digital detector or a reusable imaging plate. Image quality depends on detector resolution, exposure, signal-to-noise ratio, contrast, processing and display conditions.",points:["CR uses an imaging plate and reader; DR commonly captures directly with a detector.","Processing can reveal information but can also create misleading artefacts.","Preserve original data, required metadata and traceability."]}
};

 const points=c.points||["Define the purpose and governing physical principle.","Understand the equipment, setup variables and calibration/verification requirements.","Recognise relevant responses, artefacts, false calls and method limitations.","Record the result and follow the applicable procedure and acceptance criteria."];
 view.innerHTML='<button class="text-link" id="backMethod">← Back to '+m.name+'</button><div class="lesson-body" style="margin-top:18px"><div class="method-tag">LESSON '+String(li+1).padStart(2,"0")+' / '+m.lessons.length+' · THEORY</div><h1 class="page-title" style="margin-top:12px">'+name.replace(/^\d+ · /,"")+'</h1><p class="page-desc">'+m.name+'</p><h3>Learning objective</h3><p>By the end of this lesson, you should be able to explain the core concept, identify its practical variables and describe how it affects inspection reliability.</p><h3>Detailed explanation</h3><p>'+body+'</p>'+(c.formula?'<div class="notice"><b>Core relationship</b><br><span style="font-size:22px;font-weight:850">'+c.formula+'</span><br>Convert all quantities to consistent units before substitution.</div>':'')+'<h3>Key points to master</h3><ul>'+points.map(p=>'<li>'+p+'</li>').join("")+'</ul><h3>Practical example / application</h3><p>Before inspection, identify the target discontinuity and required coverage. Select a suitable method and setup, verify calibration on a reference standard, perform a controlled scan, compare responses with known geometry and reference indications, and document settings, limitations and results. Numerical acceptance must come from the applicable procedure or specification.</p><h3>Common mistakes and troubleshooting</h3><ul><li>Using inconsistent units or an incorrect material/wave-mode value.</li><li>Skipping calibration verification after a setup change.</li><li>Confusing geometric or process-related responses with a flaw without checking scan movement and expected geometry.</li><li>Applying a generic acceptance threshold instead of the specified criteria.</li></ul><h3>Quick self-check</h3><p>Can you explain the principle in your own words, name the important setup variables, identify at least one limitation and describe which calibration or verification confirms the setup?</p><div class="notice"><b>Educational use:</b> This academy supports theory learning and knowledge development. It does not replace supervised practical training, an approved inspection procedure or formal personnel certification.</div><button class="btn primary" id="completeLesson">'+(completed.includes(id)?"Lesson completed ✓":"Mark lesson complete ✓")+'</button> <button class="btn" id="nextLesson">Next lesson →</button></div>';
 document.getElementById("backMethod").onclick=()=>openMethod(mi);
 document.getElementById("completeLesson").onclick=()=>{if(!completed.includes(id))completed.push(id);save();openLesson(mi,li)};
 document.getElementById("nextLesson").onclick=()=>{if(li+1<m.lessons.length)openLesson(mi,li+1);else openMethod(mi)};
};

{cat:"UT fundamentals",name:"Wave velocity / frequency / wavelength",eq:"v = f × λ",vars:[["f","Frequency","f",5e6],["λ","Wavelength","l",.0006],["v","Velocity","v",3000]],solve:{v:x=>x.f*x.λ,f:x=>x.v/x.λ,λ:x=>x.v/x.f},hint:"v = fλ. SI base units: Hz, m, m/s. For UT, MHz + mm commonly yield m/s after correct conversion."},
{cat:"UT fundamentals",name:"Pulse-echo distance / thickness",eq:"d = v × t / 2",vars:[["v","Velocity","v",5900],["t","Round-trip time","t",10e-6],["d","Distance / thickness","l",.0295]],solve:{d:x=>x.v*x.t/2,v:x=>2*x.d/x.t,t:x=>2*x.d/x.v},hint:"Pulse-echo time is round trip, so divide by 2. For a one-way transit time, do not apply this factor."},
{cat:"UT fundamentals",name:"Time of flight from distance",eq:"t = 2d / v",vars:[["d","Distance / thickness","l",.0295],["v","Velocity","v",5900],["t","Round-trip time","t",10e-6]],solve:{t:x=>2*x.d/x.v,d:x=>x.v*x.t/2,v:x=>2*x.d/x.t},hint:"This expression assumes pulse-echo round-trip time."},
{cat:"UT fundamentals",name:"Period and frequency",eq:"T = 1 / f",vars:[["f","Frequency","f",5e6],["T","Period","t",.2e-6]],solve:{T:x=>1/x.f,f:x=>1/x.T},hint:"Frequency in Hz gives period in seconds."},
{cat:"UT beam",name:"Approximate near-field length",eq:"N ≈ D² / (4λ)",vars:[["D","Element diameter","l",.01],["λ","Wavelength","l",.0006],["N","Near-field length","l",.0416667]],solve:{N:x=>x.D*x.D/(4*x.λ),D:x=>Math.sqrt(4*x.N*x.λ),λ:x=>x.D*x.D/(4*x.N)},hint:"Approximation for a circular piston in a uniform medium; real probes and materials may differ."},
{cat:"UT signal",name:"Amplitude ratio in decibels",eq:"ΔdB = 20 log₁₀(A₂/A₁)",vars:[["A₁","Initial amplitude","a",50],["A₂","Final amplitude","a",100],["ΔdB","Amplitude change","db",6.0206]],solve:{"ΔdB":x=>20*Math.log10(x.A2/x.A1),"A₂":x=>x.A1*Math.pow(10,x["ΔdB"]/20),"A₁":x=>x.A2/Math.pow(10,x["ΔdB"]/20)},hint:"Use amplitudes measured on the same scale. The 20 log relationship is for amplitude ratios."},
{cat:"UT signal",name:"Amplitude after gain change",eq:"A₂/A₁ = 10^(ΔdB/20)",vars:[["A₁","Initial amplitude","a",40],["ΔdB","Gain change","db",6],["A₂","Final amplitude","a",79.81]],solve:{"A₂":x=>x.A1*Math.pow(10,x["ΔdB"]/20),"A₁":x=>x.A2/Math.pow(10,x["ΔdB"]/20),"ΔdB":x=>20*Math.log10(x.A2/x.A1)},hint:"A +6 dB change approximately doubles amplitude; −6 dB approximately halves it."},
{cat:"Radiography",name:"Inverse-square intensity",eq:"I₂ = I₁ × (r₁/r₂)²",vars:[["I₁","Initial intensity","n",100],["r₁","Initial distance","l",1],["r₂","New distance","l",2],["I₂","New intensity","n",25]],solve:{"I₂":x=>x.I1*Math.pow(x.r1/x.r2,2),"I₁":x=>x.I2*Math.pow(x.r2/x.r1,2),"r₂":x=>x.r1*Math.sqrt(x.I1/x.I2),"r₁":x=>x.r2*Math.sqrt(x.I2/x.I1)},hint:"Point-source approximation; use correct source-to-point distances and observe radiation-safety controls."},

 const render=()=>{const q=document.getElementById("formulaSearch").value.toLowerCase(),cat=document.getElementById("formulaCategory").value;const items=all.filter(f=>(cat==="all"||f.cat===cat)&&(f.name+" "+f.eq+" "+f.cat).toLowerCase().includes(q));document.getElementById("formulaCards").innerHTML=items.map((f,ix)=>{if(f.legacy){return '<article class="formula-card"><div class="method-tag">'+f.cat.toUpperCase()+'</div><h3>'+f.name+'</h3><div class="formula">'+f.eq+'</div><p class="page-desc">'+f.legacy.desc+'</p><button class="btn primary" data-legacy="'+f.index+'">Open unit-aware solver</button><div id="legacySolver'+f.index+'"></div></article>'}return '<article class="formula-card"><div class="method-tag">'+f.cat.toUpperCase()+'</div><h3>'+f.name+'</h3><div class="formula">'+f.eq+'</div><p class="page-desc">'+f.hint+'</p><label>Unknown to calculate<select class="btn" id="unknown'+ix+'" style="display:block;width:100%;margin-top:6px">'+f.vars.map(v=>'<option value="'+v[0]+'">'+v[1]+' ('+v[0]+')</option>').join("")+'</select></label><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px">'+f.vars.map(v=>'<label style="font-size:12px;color:var(--muted)">'+v[1]+' '+(v[0]=== "%"?"":"("+v[0]+")")+'<input type="number" step="any" id="val'+ix+v[0]+'" placeholder="Known value" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;margin-top:5px"><select id="unit'+ix+v[0]+'" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;margin-top:5px">'+(units[v[2]]||units.n).map(u=>'<option value="'+u[1]+'">'+u[0]+'</option>').join("")+'</select></label>').join("")+'</div><button class="btn primary" style="margin-top:13px" data-solve="'+ix+'">Calculate unknown</button><div class="result" id="solved'+ix+'"></div></article>'}).join("")||'<div class="empty">No formulas match this search.</div>';
 document.querySelectorAll("[data-solve]").forEach(b=>b.onclick=()=>{const f=items[+b.dataset.solve];if(!f||f.legacy)return;const ix=+b.dataset.solve,unknown=document.getElementById("unknown"+ix).value,x={};let bad=[];f.vars.forEach(v=>{if(v[0]===unknown)return;const raw=document.getElementById("val"+ix+v[0]).value;if(raw===""||!Number.isFinite(Number(raw))){bad.push(v[1]);return}x[v[0]]=Number(raw)*Number(document.getElementById("unit"+ix+v[0]).value)});const out=document.getElementById("solved"+ix);if(bad.length){out.textContent="Enter known values for: "+bad.join(", ");return}if(Object.values(x).some(v=>!Number.isFinite(v))){out.textContent="Check the entered values.";return}try{const result=f.solve[unknown](x);if(!Number.isFinite(result)){out.textContent="Cannot calculate: check zero values and formula assumptions.";return}const target=f.vars.find(v=>v[0]===unknown),unitSel=document.getElementById("unit"+ix+unknown),factor=Number(unitSel.value),display=result/factor;out.innerHTML='<b>Result: '+display.toPrecision(7)+' '+unitSel.options[unitSel.selectedIndex].text+'</b><p style="font-weight:400;color:var(--muted)">Working: substitute the known values in consistent base units, solve for '+target[1]+', then convert the result to the selected output unit.</p>'}catch(e){out.textContent="Unable to solve with these values. Check inputs and formula assumptions."}});
 document.querySelectorAll("[data-legacy]").forEach(b=>b.onclick=()=>{const i=+b.dataset.legacy,card=document.getElementById("legacySolver"+i);const maps={
0:{name:"Wave velocity / frequency / wavelength",vars:[["f","Frequency","f"],["λ","Wavelength","l"],["v","Velocity","v"]],solve:{v:x=>x.f*x.λ,f:x=>x.v/x.λ,λ:x=>x.v/x.f},defaults:{f:5e6,λ:.0006,v:3000}},

4:{name:"Thickness",vars:[["v","Velocity","v"],["t","Round-trip time","t"],["d","Thickness","l"]],solve:{d:x=>x.v*x.t/2,v:x=>2*x.d/x.t,t:x=>2*x.d/x.v},defaults:{v:5900,t:10e-6,d:.0295}},

<script>
/* Replace the multi-card formula page with one formula / one interactive rearrangement workspace. */
(function(){
const unitSets={
f:[["Hz",1],["kHz",1e3],["MHz",1e6]],
l:[["m",1],["cm",.01],["mm",.001],["µm",1e-6]],
v:[["m/s",1],["km/s",1e3],["mm/s",.001],["mm/µs",1000]],
t:[["s",1],["ms",1e-3],["µs",1e-6],["ns",1e-9]],
d:[["m",1],["cm",.01],["mm",.001]],
a:[["relative amplitude",1],["% FSH",.01]],

};
const library=[
{id:"wave",cat:"UT Fundamentals",name:"Wave relationship",equation:"v = f × λ",desc:"Relates sound velocity, frequency and wavelength.",vars:[
{id:"v",label:"Velocity",unit:"v",base:"m/s",defaultUnit:"m/s",factor:1},
{id:"f",label:"Frequency",unit:"f",base:"Hz",defaultUnit:"MHz",factor:1},
{id:"l",label:"Wavelength",unit:"l",base:"m",defaultUnit:"mm",factor:1}
],solve:{v:x=>x.f*x.l,f:x=>x.v/x.l,l:x=>x.v/x.f},forms:{v:"v = f × λ",f:"f = v ÷ λ",l:"λ = v ÷ f"},example:{known:{f:5,l:0.6},units:{f:"MHz",l:"mm"},unknown:"v"}},
{id:"thickness",cat:"UT Fundamentals",name:"Pulse-echo distance / thickness",equation:"d = (v × t) ÷ 2",desc:"Use round-trip pulse-echo time. The factor of 2 accounts for the outgoing and returning path.",vars:[
{id:"d",label:"Distance / thickness",unit:"d",base:"m",defaultUnit:"mm",factor:1},
{id:"v",label:"Sound velocity",unit:"v",base:"m/s",defaultUnit:"m/s",factor:1},
{id:"t",label:"Round-trip time",unit:"t",base:"s",defaultUnit:"µs",factor:1}
],solve:{d:x=>x.v*x.t/2,v:x=>2*x.d/x.t,t:x=>2*x.d/x.v},forms:{d:"d = (v × t) ÷ 2",v:"v = (2 × d) ÷ t",t:"t = (2 × d) ÷ v"}},
{id:"period",cat:"UT Fundamentals",name:"Frequency and period",equation:"T = 1 ÷ f",desc:"Frequency and period are reciprocals.",vars:[
{id:"T",label:"Period",unit:"t",base:"s",defaultUnit:"µs",factor:1},
{id:"f",label:"Frequency",unit:"f",base:"Hz",defaultUnit:"MHz",factor:1}
],solve:{T:x=>1/x.f,f:x=>1/x.T},forms:{T:"T = 1 ÷ f",f:"f = 1 ÷ T"}},
{id:"nearfield",cat:"UT Beam",name:"Approximate near-field length",equation:"N ≈ D² ÷ (4 × λ)",desc:"Approximation for a circular piston in a uniform medium.",vars:[
{id:"N",label:"Near-field length",unit:"l",base:"m",defaultUnit:"mm",factor:1},
{id:"D",label:"Probe diameter",unit:"l",base:"m",defaultUnit:"mm",factor:1},
{id:"l",label:"Wavelength",unit:"l",base:"m",defaultUnit:"mm",factor:1}
],solve:{N:x=>x.D*x.D/(4*x.l),D:x=>Math.sqrt(4*x.N*x.l),l:x=>x.D*x.D/(4*x.N)},forms:{N:"N ≈ D² ÷ (4λ)",D:"D ≈ √(4Nλ)",l:"λ ≈ D² ÷ (4N)"}},
{id:"db",cat:"UT Signal",name:"Amplitude ratio and decibels",equation:"ΔdB = 20 log₁₀(A₂ ÷ A₁)",desc:"For amplitude ratios measured on the same scale.",vars:[
{id:"db",label:"Amplitude change",unit:"db",base:"dB",defaultUnit:"dB",factor:1},
{id:"A1",label:"Initial amplitude",unit:"a",base:"relative amplitude",defaultUnit:"relative amplitude",factor:1},
{id:"A2",label:"Final amplitude",unit:"a",base:"relative amplitude",defaultUnit:"relative amplitude",factor:1}
],solve:{db:x=>20*Math.log10(x.A2/x.A1),A2:x=>x.A1*Math.pow(10,x.db/20),A1:x=>x.A2/Math.pow(10,x.db/20)},forms:{db:"ΔdB = 20 log₁₀(A₂ ÷ A₁)",A2:"A₂ = A₁ × 10^(ΔdB ÷ 20)",A1:"A₁ = A₂ ÷ 10^(ΔdB ÷ 20)"}},
{id:"inverse",cat:"Radiography",name:"Inverse-square intensity",equation:"I₂ = I₁ × (r₁ ÷ r₂)²",desc:"Point-source approximation for intensity versus distance.",vars:[
{id:"I2",label:"New intensity",unit:"n",base:"relative",defaultUnit:"dimensionless",factor:1},
{id:"I1",label:"Initial intensity",unit:"n",base:"relative",defaultUnit:"dimensionless",factor:1},
{id:"r1",label:"Initial distance",unit:"l",base:"m",defaultUnit:"m",factor:1},
{id:"r2",label:"New distance",unit:"l",base:"m",defaultUnit:"m",factor:1}
],solve:{I2:x=>x.I1*(x.r1/x.r2)**2,I1:x=>x.I2*(x.r2/x.r1)**2,r1:x=>x.r2*Math.sqrt(x.I2/x.I1),r2:x=>x.r1*Math.sqrt(x.I1/x.I2)},forms:{I2:"I₂ = I₁ × (r₁ ÷ r₂)²",I1:"I₁ = I₂ ÷ (r₁ ÷ r₂)²",r1:"r₁ = r₂ × √(I₂ ÷ I₁)",r2:"r₂ = r₁ × √(I₁ ÷ I₂)"}}
];
window.formulas=function(){
view.innerHTML='<div class="page-head"><div><h1 class="page-title">Formula Library</h1><p class="page-desc">One formula at a time. Choose the formula, select what you know, select the unknown, and solve with unit conversion.</p></div></div><div class="formula-workspace" style="max-width:1000px;margin:24px auto"><div class="panel" style="padding:24px"><label class="field-label" for="oneFormula">1. Choose a formula</label><select id="oneFormula" class="btn" style="display:block;width:100%;text-align:left;margin:8px 0 20px">'+library.map(f=>'<option value="'+f.id+'">'+f.cat+' — '+f.name+'</option>').join("")+'</select><div id="oneFormulaBody"></div></div></div>';
const body=document.getElementById("oneFormulaBody");
function draw(id,preset){
const f=library.find(x=>x.id===id)||library[0];const selected=preset||f.vars[f.vars.length-1].id;
body.innerHTML='<div style="background:var(--warm,#FFF8F3);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px"><div class="method-tag">'+f.cat.toUpperCase()+'</div><h2 style="margin:8px 0 6px">'+f.name+'</h2><p class="page-desc">'+f.desc+'</p><div class="formula" style="font-size:25px;margin:16px 0">'+f.equation+'</div></div><label class="field-label" for="unknownOne">2. What value do you want to find?</label><select id="unknownOne" class="btn" style="display:block;width:100%;text-align:left;margin:8px 0 18px">'+f.vars.map(v=>'<option value="'+v.id+'" '+(v.id===selected?'selected':'')+'>Find '+v.label+'</option>').join("")+'</select><div id="knownInputs" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px"></div><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px"><button class="btn primary" id="solveOne">Calculate unknown</button><button class="btn" id="exampleOne">Load example</button><button class="btn" id="resetOne">Reset values</button></div><div id="oneResult" style="margin-top:18px"></div><p class="page-desc" style="margin-top:18px">Unit conversion is applied before calculation. Use material-appropriate values and verify the formula assumptions against your procedure.</p>';
const unknown=document.getElementById("unknownOne"),inputs=document.getElementById("knownInputs");
function drawInputs(){const u=unknown.value;inputs.innerHTML=f.vars.filter(v=>v.id!==u).map(v=>'<label style="display:block;border:1px solid var(--line);border-radius:12px;padding:12px"><span style="font-weight:700;color:var(--ink)">'+v.label+' <span style="font-weight:400;color:var(--muted)">('+v.id+')</span></span><input id="value_'+v.id+'" type="number" step="any" placeholder="Enter known value" style="display:block;width:100%;padding:11px;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:white;color:#24151A"><select id="unit_'+v.id+'" style="display:block;width:100%;padding:10px;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:white;color:#24151A">'+(unitSets[v.unit]||unitSets.n).map(u=>'<option value="'+u[1]+'" '+(u[0]===v.defaultUnit?'selected':'')+'>'+u[0]+'</option>').join("")+'</select></label>').join("");document.getElementById("oneResult").innerHTML=""}
unknown.onchange=drawInputs;drawInputs();
document.getElementById("solveOne").onclick=()=>{
const u=unknown.value,x={},missing=[];
f.vars.filter(v=>v.id!==u).forEach(v=>{const raw=document.getElementById("value_"+v.id).value;if(raw===""||!Number.isFinite(Number(raw))){missing.push(v.label);return}x[v.id]=Number(raw)*Number(document.getElementById("unit_"+v.id).value)});
const out=document.getElementById("oneResult");if(missing.length){out.innerHTML='<div class="notice">Please enter all known values: '+missing.join(", ")+'.</div>';return}
if(Object.values(x).some(n=>!Number.isFinite(n))){out.innerHTML='<div class="notice">Check your inputs and units.</div>';return}
const ans=f.solve[u](x);if(!Number.isFinite(ans)){out.innerHTML='<div class="notice">Cannot calculate this result. Check for zero values or values outside the formula assumptions.</div>';return}
const target=f.vars.find(v=>v.id===u);
out.innerHTML='<div class="notice" style="padding:20px"><div class="method-tag">CALCULATION RESULT</div><h2 style="margin:8px 0"> '+target.label+' = '+formatNum(ans/Number((()=>{const select=document.getElementById("outUnit");return select?select.value:1})()))+'</h2><div style="margin-top:12px"><label for="outUnit" class="field-label">Result unit</label><select id="outUnit" class="btn" style="display:block;width:100%;margin-top:6px">'+(unitSets[target.unit]||unitSets.n).map(q=>'<option value="'+q[1]+'" '+(q[0]===target.defaultUnit?'selected':'')+'>'+q[0]+'</option>').join("")+'</select></div><p style="margin-top:14px"><b>Rearranged formula</b><br><span style="font-size:20px">'+f.forms[u]+'</span></p><p><b>Known values used</b><br>'+f.vars.filter(v=>v.id!==u).map(v=>v.label+': '+document.getElementById("value_"+v.id).value+' '+document.getElementById("unit_"+v.id).selectedOptions[0].text).join("<br>")+'</p><p><b>Working</b><br>1. Convert known values to base units.<br>2. Rearrange the selected formula to isolate '+target.label+'.<br>3. Substitute known values and calculate.<br>4. Convert the answer to your selected result unit.</p></div>';
const result=document.getElementById("oneResult"),unit=document.getElementById("outUnit"),paint=()=>{result.querySelector("h2").textContent=target.label+" = "+formatNum(ans/Number(unit.value))+" "+unit.selectedOptions[0].text};paint();unit.onchange=paint;
};
document.getElementById("exampleOne").onclick=()=>{
const example=f.example;if(!example){const u=unknown.value;const vars=f.vars.filter(v=>v.id!==u);vars.forEach((v,i)=>{document.getElementById("value_"+v.id).value=([2,10,1][i]||1);});document.getElementById("oneResult").innerHTML='<div class="notice">Example values loaded. Review the values and units, then calculate.</div>';return}
unknown.value=example.unknown;drawInputs();Object.entries(example.known).forEach(([k,val])=>{const el=document.getElementById("value_"+k);if(el)el.value=val;const us=document.getElementById("unit_"+k);if(us&&example.units[k])us.value=String((unitSets[f.vars.find(v=>v.id===k).unit]||[]).find(u=>u[0]===example.units[k])?.[1]||1)});document.getElementById("oneResult").innerHTML='<div class="notice">Example loaded: Frequency = 5 MHz, wavelength = 0.6 mm. Unknown: velocity. Press <b>Calculate unknown</b> to see the answer and working.</div>';
};
document.getElementById("resetOne").onclick=()=>draw(f.id,unknown.value);

document.getElementById("oneFormula").onchange=e=>draw(e.target.value);
draw(library[0].id,"v");
};
})();
</script>

    {id:'velocity',name:'Sound velocity',units:[['m/s',1],['mm/µs',1000],['km/s',1000]],kind:'linear',desc:'Note: 1 mm/µs equals 1000 m/s, which equals 1 km/s.',notes:'1 mm/µs = 1,000 m/s = 1 km/s. 5,920 m/s = 5.92 mm/µs = 5.92 km/s. Typical steel longitudinal-wave velocity is about 5.9 km/s; use the material/procedure value for actual calculations.'},

    {id:'distance',name:'Distance / thickness',units:[['m',1],['cm',.01],['mm',.001],['µm',1e-6],['inch',.0254]],kind:'linear',desc:'For wall thickness, sound path and dimensions.',notes:'1 m = 100 cm = 1,000 mm. 1 cm = 10 mm; 1 mm = 1,000 µm. 1 inch = 25.4 mm. For pulse-echo thickness: thickness = velocity × round-trip time ÷ 2.'},
    {id:'angle',name:'Angle',units:[['degrees',1],['radians',Math.PI/180]],kind:'angle',desc:'Angles are converted using degrees and radians.',notes:'180° = π radians ≈ 3.14159 rad; 90° = π/2 rad ≈ 1.5708 rad; 45° = π/4 rad ≈ 0.7854 rad. Radians = degrees × π/180.'},

    {id:'gain',name:'Gain change ↔ amplitude ratio',units:[['dB change',1],['amplitude ratio',1]],kind:'gain',desc:'For amplitude ratios: ratio = 10^(dB change / 20).',notes:'+6 dB ≈ 2× amplitude; +12 dB ≈ 4×; −6 dB ≈ 0.5×; −20 dB = 0.1×. Formula: amplitude ratio = 10^(dB change/20). Real instruments may round displayed dB values.'},
    {id:'period',name:'Frequency ↔ period',units:[['Hz',1],['kHz',1e3],['MHz',1e6],['s',1],['ms',1e-3],['µs',1e-6],['ns',1e-9]],kind:'period',desc:'Frequency and period are reciprocals. Select a frequency unit on the source and a time unit on the target, or vice versa.',notes:'Period T = 1/f. 1 MHz = 1,000,000 Hz, so its period is 1 µs. 5 MHz → 0.2 µs (200 ns); 2.25 MHz → about 0.444 µs. This is the cycle period, not necessarily the measured echo TOF.'},
    {id:'path',name:'Sound path ↔ depth',units:[['mm',1],['cm',10],['m',1000]],kind:'path',desc:'For angle-beam UT, assumes refracted angle measured from the normal. Depth = beam path × cos(angle).',notes:'At 45° from the normal, depth = beam path × 0.7071. Example: 100 mm beam path gives about 70.7 mm depth. Conversely, beam path = depth ÷ cos(angle). Confirm your instrument’s angle convention and use the refracted angle in the material.'},
    {id:'metric',name:'Metric ↔ imperial dimensions',units:[['mm',1],['inch',25.4],['mm²',1],['inch²',645.16]],kind:'metric',desc:'Choose length units for length conversions and area units for area conversions.',notes:'1 inch = 25.4 mm; 1 mm ≈ 0.03937 inch. For area, 1 inch² = 645.16 mm² (square the length conversion factor). 10 mm × 10 mm = 100 mm², not 10 mm².'}
  ];
  function unitConversionPage(){
    const view=document.getElementById('view');
    view.innerHTML='<div class="page-head"><h1 class="page-title">Unit Conversion</h1><p class="page-desc">UT-focused converters for frequency, wavelength, sound velocity, time of flight, dimensions, angle, amplitude, dB, gain and beam geometry.</p></div><div class="panel" style="max-width:1050px;margin:20px auto;background:white;border:1px solid var(--line);border-radius:20px;padding:24px"><label class="field-label" for="utConvType">1. Choose conversion</label><select id="utConvType" class="btn" style="display:block;width:100%;margin:8px 0 20px">'+groups.map(g=>'<option value="'+g.id+'">'+g.name+'</option>').join('')+'</select><div id="utConvDescription" class="page-desc"></div><div id="utConvStandardNotes" class="notice" style="margin:12px 0 18px;padding:16px;line-height:1.7"><strong>Standard conversion notes</strong></div><div id="utConvFields" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px"></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn primary" id="utConvert">Convert</button><button class="btn" id="utSwap">Swap units</button><button class="btn" id="utClear">Clear</button></div><div id="utConvResult" aria-live="polite" style="margin-top:20px"></div></div><div class="lesson-body" style="max-width:1050px;margin:20px auto"><h3 style="margin-top:0">Conversion notes</h3><p>For sound velocity, 1 mm/µs = 1000 m/s. For pulse-echo thickness calculations, the measured time is normally round-trip time, so thickness = velocity × time ÷ 2. The sound-path/depth converter uses the angle from the normal; verify the angle convention used by your instrument or procedure.</p></div>';
    const type=document.getElementById('utConvType'),fields=document.getElementById('utConvFields'),result=document.getElementById('utConvResult'),desc=document.getElementById('utConvDescription');
    function draw(){
      const g=groups.find(x=>x.id===type.value); desc.textContent=g.desc;
      document.getElementById('utConvStandardNotes').innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px"><strong style="font-size:14px">Quick notes</strong><span style="font-size:11px;color:var(--muted)">Standard conversions</span></div><div style="display:flex;flex-wrap:wrap;gap:7px">'+g.notes.split('. ').filter(Boolean).map(line=>'<span style="display:inline-flex;align-items:center;background:var(--paper,#fff8f3);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.45">'+line.replace(/\\.$/,'')+'</span>').join('')+'</div>';
      let units=g.units;
      if(g.kind==='period') units=[['Hz',1],['kHz',1e3],['MHz',1e6],['s',1],['ms',1e-3],['µs',1e-6],['ns',1e-9]];
      fields.innerHTML='<label style="display:block;font-weight:700">Value<input id="utConvValue" type="number" step="any" placeholder="Enter value" style="display:block;width:100%;padding:13px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)"></label><label style="display:block;font-weight:700">From unit<select id="utConvFrom" class="btn" style="display:block;width:100%;margin-top:8px">'+units.map((u,i)=>'<option value="'+i+'">'+u[0]+'</option>').join('')+'</select></label><label style="display:block;font-weight:700">To unit<select id="utConvTo" class="btn" style="display:block;width:100%;margin-top:8px">'+units.map((u,i)=>'<option value="'+i+'" '+(i===1?'selected':'')+'>'+u[0]+'</option>').join('')+'</select></label>';
      if(g.kind==='path') fields.innerHTML+='<label style="display:block;font-weight:700">Conversion direction<select id="utPathDirection" class="btn" style="display:block;width:100%;margin-top:8px"><option value="pathToDepth">Beam path → depth</option><option value="depthToPath">Depth → beam path</option></select></label><label style="display:block;font-weight:700">Refracted angle (degrees)<input id="utConvAngle" type="number" step="any" value="45" style="display:block;width:100%;padding:13px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)"></label>';
      if(g.kind==='period') fields.innerHTML+='<p class="page-desc" style="grid-column:1/-1">Select Hz/kHz/MHz to convert frequency into s/ms/µs/ns (or select a time unit to convert period into frequency).</p>';
      result.innerHTML='';
    }
    function convert(){
      const g=groups.find(x=>x.id===type.value),value=Number(document.getElementById('utConvValue').value),from=document.getElementById('utConvFrom'),to=document.getElementById('utConvTo'),a=g.units[Number(from.value)],b=g.units[Number(to.value)];
      if(document.getElementById('utConvValue').value===''||!Number.isFinite(value)){result.innerHTML='<div class="notice">Enter a valid numeric value.</div>';return}
      let answer,explain='';
      if(g.kind==='db'){
        if(a[0]==='dB'&&b[0]==='amplitude ratio'){answer=Math.pow(10,value/20);explain='Amplitude ratio = 10^(dB ÷ 20).'}
        else if(a[0]==='amplitude ratio'&&b[0]==='dB'){if(value<=0){result.innerHTML='<div class="notice">Amplitude ratio must be greater than zero to convert to dB.</div>';return}answer=20*Math.log10(value);explain='dB = 20 log₁₀(amplitude ratio).'}
        else answer=value;
      } else if(g.kind==='gain'){
        if(a[0]==='dB change'&&b[0]==='amplitude ratio'){answer=Math.pow(10,value/20);explain='Amplitude ratio = 10^(dB change ÷ 20).'}
        else if(a[0]==='amplitude ratio'&&b[0]==='dB change'){if(value<=0){result.innerHTML='<div class="notice">Amplitude ratio must be greater than zero.</div>';return}answer=20*Math.log10(value);explain='dB change = 20 log₁₀(amplitude ratio).'}
        else answer=value;
      } else if(g.kind==='angle'){
        answer=a[0]==='degrees'&&b[0]==='radians'?value*Math.PI/180:value*180/Math.PI;
      } else if(g.kind==='period'){
        const isFreq=['Hz','kHz','MHz'].includes(a[0]),toFreq=['Hz','kHz','MHz'].includes(b[0]);
        if(isFreq===toFreq){result.innerHTML='<div class="notice">Choose a frequency unit as one unit and a time unit as the other.</div>';return}
        const hz=isFreq?value*a[1]:1/(value*a[1]);
        if(!Number.isFinite(hz)||hz<=0){result.innerHTML='<div class="notice">Frequency and period must be greater than zero.</div>';return}
        answer=toFreq?hz/b[1]:(1/hz)/b[1];explain='Period = 1 ÷ frequency; frequency = 1 ÷ period.';
      } else if(g.kind==='path'){
        const angle=Number(document.getElementById('utConvAngle').value);
        if(!Number.isFinite(angle)||angle<0||angle>=90){result.innerHTML='<div class="notice">Enter an angle from 0° up to but not including 90°.</div>';return}
        const mm=value*a[1],rad=angle*Math.PI/180,direction=document.getElementById('utPathDirection').value;
        answer=direction==='pathToDepth'?(mm*Math.cos(rad))/b[1]:(mm/Math.cos(rad))/b[1];
        explain=direction==='pathToDepth'?'Depth = beam path × cos(angle). Angle is measured from the normal.':'Beam path = depth ÷ cos(angle). Angle is measured from the normal.';
      } else if(g.kind==='metric'){
        const areaA=a[0].includes('²'),areaB=b[0].includes('²');
        if(areaA!==areaB){result.innerHTML='<div class="notice">Choose length units together (mm/inch) or area units together (mm²/inch²).</div>';return}
        answer=value*a[1]/b[1];
      } else {
        answer=value*a[1]/b[1];
      }
      if(!Number.isFinite(answer)){result.innerHTML='<div class="notice">This conversion cannot be calculated. Check the value and selected units.</div>';return}
      result.innerHTML='<div class="notice" style="padding:20px"><div class="method-tag">CONVERSION RESULT</div><h2 style="margin:8px 0;font-size:28px">'+answer.toPrecision(8).replace(/(?:\.0+|(?:(\.\d*?)0+))$/,'$1')+' '+b[0]+'</h2><p>'+explain+'</p></div>';
    }
    document.getElementById('utConvert').onclick=convert;
    document.getElementById('utSwap').onclick=()=>{const a=document.getElementById('utConvFrom'),b=document.getElementById('utConvTo'),old=a.value;a.value=b.value;b.value=old;result.innerHTML='';};
    document.getElementById('utClear').onclick=()=>{document.getElementById('utConvValue').value='';result.innerHTML='';};
    type.onchange=draw; draw();
  }
})();
</script>

</body></html>
