{p:["Phased-array ultrasonic testing uses a probe containing many small piezoelectric elements, each connected to electronic pulser and receiver channels. By firing elements with calculated time delays, the instrument controls the shape and direction of the combined sound beam. This allows many beam angles or focal positions to be generated from one array probe and supports encoded imaging of welds and components.","PAUT does not remove the fundamentals of conventional UT. Sound velocity, acoustic impedance, refraction, attenuation, coupling, reflector orientation and calibration still govern the examination. The important difference is electronic control of the aperture and element timing. The operator must understand how the instrument's displayed sector, linear scan or volume relates to the real component geometry.","A PAUT examination is built around a scan plan. The plan specifies probe and wedge, element pitch, active aperture, focal laws, angle range, focal depth, scan index, direction, encoder resolution and required coverage. An attractive image is not proof of complete coverage; the beam model and calibration need verification."],focus:["Explain why an array can generate multiple beams electronically.","Separate probe design, focal-law design and scan-plan design.","Recognise that PAUT still requires conventional UT calibration principles."],example:"A single linear array can produce a sectorial range of refracted shear-wave angles to interrogate a butt weld. The selected angles must cover the weld bevel, root and adjacent parent material for the specific joint design."},
{p:["A linear array is made from multiple small piezoelectric elements arranged in a row. Element pitch is the centre-to-centre distance between adjacent elements; element width, kerf, elevation and frequency are also important. The instrument activates a group of elements called an aperture. The active aperture size influences beam width, sensitivity and focusing capability.","A small pitch can support a larger steering range before grating lobes become significant, while a larger aperture generally provides a narrower beam and greater directivity. Elevation is the element dimension perpendicular to the array axis and influences beam behaviour in the passive plane. Probe construction, matching layers and backing influence bandwidth and pulse duration.","Arrays may be linear, matrix, annular or other geometries. A linear array primarily controls beams in one plane; a matrix array can steer in two dimensions but requires more complex electronics and data handling. Select the array geometry to match the volume and scan constraints, not simply the largest channel count."],focus:["Know pitch, kerf, element width, elevation and aperture.","Understand active elements versus total elements.","Relate probe geometry to steering range and beam quality."],example:"If a probe contains 64 elements but the focal law uses an aperture of 16 elements, only that selected group participates in that beam. Moving the active aperture along the array produces an electronic scan."},
{p:["Beam steering is created by applying progressive delays to elements across the array. The wavelets combine so that the resulting wavefront travels in a chosen direction. Focusing uses a different delay pattern: the element signals are timed so their wavelets arrive in phase at a selected focal point. A combination of steering and focusing creates a beam at a defined angle and depth.","Refraction through a wedge must be included in the delay calculation. The software uses probe geometry, wedge velocity, component velocity and Snell's law to calculate element delays. Small errors in wedge velocity, wedge dimensions, temperature or material velocity can shift the refracted beam or focal point. Beam verification on a reference block is therefore important.","Real arrays also generate unwanted side lobes and, under some pitch and steering conditions, grating lobes. These are secondary regions of beam energy that can create responses or reduce signal-to-noise performance. Probe selection and focal-law design must keep these effects within acceptable limits for the application."],focus:["Progressive delays steer the beam; curved delay patterns focus it.","Wedge and test-material velocities are part of the beam model.","Grating lobes and side lobes can cause unwanted responses."],example:"For a sectorial scan, the instrument calculates one delay law for each required angle. When the angle changes, the delay pattern changes. Calibration checks that the beam actually reaches the intended reference reflectors."},
{p:["A focal law is the set of element delays and active aperture used to create one beam. A focal-law group may contain multiple angles, multiple focal depths or translated apertures. The law determines when each element is fired and, in receive operation, how signals are combined. The instrument uses these laws to construct the displayed image.","Focal-law setup begins with the component geometry and inspection objective. The user enters or verifies probe model, wedge, element pitch, element count, wedge velocity, test-material velocity, refracted angles, aperture and focal range. Software calculations should be checked against the actual probe and wedge certificates and the component drawing.","A technically possible focal law is not automatically a suitable examination. Very high steering angles, inappropriate apertures, focal depths beyond the useful field or incorrect material assumptions can produce weak or distorted beams. Verify coverage and sensitivity at representative reflectors and document the focal-law file used for the examination."],focus:["A focal law defines one beam's firing and receive timing.","Law groups must be matched to the actual probe, wedge and component.","Verify the intended sound path and coverage rather than trusting software defaults."],example:"A weld inspection group may contain beams at 40°, 45°, 50°, 55°, 60° and 65°. Each angle has its own delay law. These example angles are not a universal requirement; the approved scan plan determines the actual range."},
{p:["A sectorial scan, commonly called an S-scan, displays data acquired at multiple beam angles from a probe position. The image is often shown as a fan-shaped sector with colour or brightness representing amplitude. An electronic scan, or E-scan, activates successive apertures along the array to create a translated beam along the probe length. A combined scan can use both approaches.","The displayed image is a geometric reconstruction based on focal laws and calibration. The operator must know whether the axes represent depth, sound path, surface distance or another coordinate. Wedge delay, velocity, index, probe orientation and component geometry influence the location displayed. The A-scan at a selected pixel should be available for confirming the underlying signal.","Interpret the image by relating indications to weld bevel, root, cap, sidewall and parent material. Compare neighbouring angles and adjacent scan positions. A bright arc or linear feature could be a flaw, geometry echo, mode conversion or artefact. Use the scan plan and reference block responses to establish which regions are covered and where blind zones remain."],focus:["Understand the axes and coordinate convention of each scan view.","Correlate a coloured image feature with the underlying A-scan.","Check adjacent angles and positions before classifying an indication."],example:"A weld-root response may appear as a strong curved feature in an S-scan because the root geometry reflects sound over several angles. Its position and repeatability should be compared with the joint drawing and reference responses before calling it a flaw."},
{p:["PAUT calibration verifies that the instrument, probe, wedge, focal laws and encoder produce a known response under the specified setup. Typical tasks include wedge-delay or zero calibration, range calibration, sensitivity setting, beam-angle and index-point checks, and verification of encoder direction and resolution. The exact checks depend on the code, procedure and application.","A calibration block should have known material properties, thickness, geometry and reflectors suited to the examination. A side-drilled hole, notch, radius or other reflector may be used for a particular check. The calibration response is used to set a reference level or verify that a beam reaches the expected position. Do not substitute an arbitrary block or change a focal-law file without assessing the effect.","Calibration must be repeated after changes that can affect the result, such as changing probe or wedge, cable, focal-law set, instrument settings or examination conditions, as required by the procedure. Record the block ID, probe serial number, wedge, law group, calibration values, time and operator. A system check at the end of the examination helps identify drift."],focus:["Verify wedge delay, range, sensitivity, index and encoder as applicable.","Use the correct block and reflector for each calibration task.","Record pre-scan and post-scan checks and investigate drift."],example:"If a reference reflector appears at an incorrect depth in the S-scan, check velocity, wedge delay and focal-law assumptions before changing gain. Gain changes amplitude; it does not correct a depth-position error."},
{p:["An encoded PAUT scan combines ultrasonic data with measured probe position. The scanner or encoder reports distance as the probe moves, and the instrument associates each A-scan or focal-law group with a location. The resulting data can be displayed as sectorial, linear, C-scan or other views depending on acquisition and software.","A scan plan defines the weld centreline, scan surfaces, probe offset, index, skew, travel direction, scan speed, overlap and the zones interrogated by each beam. For complex joints, more than one scan position or probe may be needed to cover the full weld volume. The procedure should identify which flaws and orientations the scan is designed to detect.","Before scanning, check mechanical stability, couplant, encoder direction, probe tracking, surface access and acquisition settings. During scanning monitor coupling and data quality. After scanning verify coverage, inspect missing or clipped data, review calibration and retain the raw data and report. Encoded data is only useful when its position reference is reliable."],focus:["A scan plan is a coverage argument, not just a probe travel path.","Check encoder direction, resolution, coupling and probe tracking.","Retain raw data and show any uninspected or poorly coupled region."],example:"A weld can be scanned from one side using multiple focal-law groups, but if the cap geometry blocks the required beam path a second side or an additional scan may be needed. Coverage should be demonstrated using the actual joint geometry."}

{p:["TOFD uses two ultrasonic probes in a pitch-catch arrangement, typically positioned on opposite sides of a weld. One probe transmits and the other receives. In an undamaged region the receiver detects a lateral wave travelling near the surface and a back-wall reflection travelling through the component. A discontinuity can produce diffracted signals from its upper and lower tips.","Unlike conventional pulse-echo methods that often rely on reflected energy from the flaw face, TOFD detects energy scattered from crack tips. The timing of these signals is used to calculate depth. This gives TOFD a useful capability for sizing crack-like discontinuities, although performance is influenced by tip signal quality, geometry and dead zones.","TOFD is commonly collected as a B-scan: the horizontal axis represents encoded scan position and the vertical axis represents time or depth. As probes travel along a weld, the diffracted responses form patterns that can be interpreted to estimate location and height. TOFD should be applied with the required calibration, scan plan and complementary technique where necessary."],focus:["Identify transmitter, receiver, lateral wave and back-wall response.","Understand tip diffraction rather than relying only on reflection from a flaw face.","Know why TOFD B-scan is useful for sizing and recording."],example:"A planar weld crack can generate diffraction from its upper and lower extremities. If both tip signals are resolved and the geometry is calibrated, the vertical separation can be estimated."},
{p:["TOFD normally uses two probes with the same nominal angle and frequency, one transmitting and one receiving. The probes are separated by a distance called probe centre separation (PCS). The beam spread and PCS are selected to cover the required wall thickness and flaw-height range. The probe pair is usually positioned symmetrically around the weld centreline, subject to the written scan plan.","Probe frequency affects penetration, resolution and attenuation. Higher frequencies may resolve small details better but can suffer greater attenuation in coarse-grained materials. The wedge introduces sound at the required angle and must be appropriate for the surface contour and material. Probe and wedge selection is tied to thickness, material, access and required coverage.","The scanner maintains probe alignment and separation while moving along the weld. Skew, offset, separation changes, surface curvature and coupling variations can shift the signals and corrupt the displayed image. The scan arrangement should be checked at the start and monitored during acquisition."],focus:["PCS is measured between probe centres, not wedge edges.","Keep probe pair centred and aligned with the weld scan line.","Select probe frequency and beam spread for the part thickness and material."],example:"For a thicker weld, a wider PCS or different beam angle may be needed to provide suitable coverage. The required values should be calculated and confirmed from the procedure and reference block, not copied from a different thickness."},
{p:["The lateral wave is the direct wave travelling along or close to the examination surface between transmitter and receiver. It usually appears as the earliest major signal. The back-wall wave travels through the component and reflects from the opposite surface, so it appears later. Both provide reference responses that help interpret the time-of-flight image.","A crack tip scatters sound. The receiver can detect energy diffracted from the upper and lower tips. Because the path length changes as the probe pair passes the flaw, the tip responses often trace characteristic hyperbolic patterns in the B-scan. The upper tip indicates the shallow extent and the lower tip indicates the deeper extent, where both are resolved.","Dead zones occur near the scanning surface and near the back wall because strong reference signals and their associated signal behaviour can mask nearby flaw-tip signals. The size of these zones depends on probe, setup, thickness, material and acquisition settings. Complementary pulse-echo or another method may be required to cover regions that TOFD cannot reliably examine."],focus:["Learn to identify the lateral-wave and back-wall reference signals first.","Tip diffraction produces the signals used for sizing.","Understand lateral-wave and back-wall dead zones."],example:"A small surface-breaking crack may have its upper tip hidden within the lateral-wave dead zone while its lower tip is visible. In that case the full through-wall height cannot be reliably sized from the TOFD image alone."},
{p:["Probe centre separation is the distance between the acoustic centres of the transmitter and receiver. It controls the travel geometry and affects which depths are covered by the selected beams. TOFD calculations require accurate PCS, material velocity and time-base information. If PCS is wrong, calculated tip depth can be systematically shifted.","Calibration checks establish the instrument time base, material velocity and probe arrangement. A reference block with known geometry or reflectors can be used to confirm the setup response. Encoder calibration relates scanner movement to distance along the weld. The actual arrangement should be measured and recorded; relying on nominal wedge dimensions can introduce error.","Temperature, wedge wear, surface curvature, material velocity variation and probe replacement can affect the geometry. Recalibrate when the procedure requires it and whenever the setup changes. Calibration validity must be traceable to the data acquisition."],focus:["Measure and record actual PCS.","Verify material velocity, time base and encoder scale.","Recheck calibration after probe, wedge or geometry changes."],example:"If the two probes are moved farther apart than the programmed PCS, the displayed tip depths may no longer represent the true component geometry even if the lateral and back-wall signals remain visible."},
{p:["A TOFD B-scan displays a series of A-scans against encoded position. The lateral wave and back-wall response provide landmarks. Tip-diffracted signals appear between these references and may form curved or hyperbolic patterns as the probe pair moves along a flaw. The image should be read with the component geometry, scan direction and calibration information.","Interpretation involves identifying the upper and lower tip signals, checking their continuity and shape, separating them from geometric or mode-converted responses, and estimating flaw location. Review the raw A-scan at selected positions to verify that the image feature is a real signal and not a processing artefact. Check signal quality at the start and end of the flaw response.","Image processing can help display weak signals, but it must not create false confidence. Preserve original data and document gain, filters, thresholds, scan speed and any processing. When a tip signal is not clear, state the limitation rather than reporting a precise size unsupported by the data."],focus:["Interpret with reference waves and component geometry.","Use raw A-scans to verify features in the B-scan.","Document weak, unresolved or masked tip signals."],example:"A hyperbolic signal near the weld fusion face may be a tip diffraction response or geometry response. Its behaviour across the scan, position relative to the weld drawing and confirmation from the A-scan help decide how it should be evaluated."},
{p:["TOFD sizing uses the measured arrival time of diffracted signals and a geometric model of the transmitter-to-tip-to-receiver path. The instrument or validated analysis software converts time to depth using the calibrated sound velocity and actual PCS. When upper and lower tips are detected, the difference between their depths gives an estimate of through-wall height.","Sizing uncertainty comes from signal picking, time-base calibration, velocity, PCS, probe position, material anisotropy, signal-to-noise and the shape of the crack tip. Some flaws do not produce clear diffraction from both ends. In those cases, a sizing statement must identify which tip was resolved and which part of the flaw extent remains uncertain.","TOFD is particularly useful for crack-like flaws, but it does not replace every other ultrasonic technique. Near-surface and near-back-wall regions may require pulse-echo or another supplementary examination. Acceptance and repair decisions must follow the governing construction code or fitness-for-service process."],focus:["Tip depth is calculated from time-of-flight and scan geometry.","Sizing uncertainty must be reported and considered.","Supplement TOFD when dead zones or weak tip signals limit coverage."],example:"If the upper tip is estimated at 6 mm below the top surface and the lower tip at 18 mm, the apparent flaw height is 12 mm, subject to the sizing uncertainty and calibration validity of that examination."}

{p:["Radiographic testing forms an image by passing ionising radiation through a component and recording the radiation that emerges on the opposite side. The source may be an X-ray generator or a sealed gamma-emitting isotope. The detector may be film, a computed-radiography plate or a digital detector. The image records differences in transmitted intensity caused by changes in material thickness, density and composition.","Radiographic testing is a projection technique. Features are superimposed along the beam direction, so the location and orientation of a discontinuity relative to the beam are important. Volumetric features such as gas pores may be easier to see than tight planar flaws aligned unfavourably with the radiation path. Image quality, source energy, geometry and scatter influence detectability.","A radiographic technique is planned before exposure. The radiographer selects source, energy, exposure, source-to-object distance, object-to-detector distance, detector type, IQI and markers. The examination must be performed under radiation-safety controls by authorised personnel. A good radiograph requires both adequate image quality and traceable identity."],focus:["Understand radiation transmission and attenuation.","Recognise projection and superimposition limitations.","Treat radiation safety and exclusion controls as essential parts of the method."],example:"A gas pore in a weld can create a rounded area of reduced attenuation and appear as a darker feature on conventional film. A tight lack-of-fusion plane may be difficult to detect if its orientation produces little thickness change along the beam."},
{p:["Industrial X-rays are generated when accelerated electrons strike a target inside an X-ray tube. The tube voltage influences photon energy and penetration; tube current and exposure time influence the number of photons produced. Gamma radiography uses radioactive isotopes that emit photons as they decay. Unlike an X-ray set, a gamma source cannot be switched off; its source must be shielded and controlled using an approved system.","Source selection depends on material, thickness, access, image-quality requirements, exposure time and site controls. Higher photon energy generally increases penetration but can reduce subject contrast. A small focal spot helps reduce geometric unsharpness. Gamma source activity changes with time, so exposure calculations and source records must account for decay and current activity.","Radiation intensity decreases with distance and is attenuated by the component and surrounding materials. Scatter adds unwanted exposure to the detector and reduces contrast. Collimation, suitable geometry, shielding and exposure planning help control scatter and radiation dose. The source type and technique should be selected using the approved procedure, not a simple rule based only on thickness."],focus:["Differentiate X-ray generation from isotope-based gamma emission.","Understand the effects of kV, mA, exposure time, source size and activity.","Plan energy, geometry and shielding for the actual examination."],example:"An X-ray tube allows the operator to select voltage and current for a specific wall thickness. A gamma source has a fixed characteristic energy and is selected from available isotope options under the radiographic procedure."},
{p:["An image quality indicator is placed in the radiographic exposure to demonstrate the sensitivity achieved by the technique. Depending on the standard and application, an IQI may contain wires or holes of defined sizes. Its visibility is evidence that the image system and exposure achieved a stated level of image quality under the test conditions.","An IQI is not a defect standard and does not prove that every flaw of the same size will be detected. Its result depends on material equivalence, placement, source-to-object geometry, detector contact, image quality and the relevant standard. The exact IQI type, location, side, identification and required visible element are specified by the applicable procedure or code.","Other image-quality checks can include density or signal level, basic spatial resolution, contrast, sharpness, coverage, identification and absence of unacceptable artefacts. The radiographer should assess the image before interpretation and reject or repeat exposures that do not meet the applicable quality requirements."],focus:["IQI demonstrates technique image quality, not component acceptance.","Follow the specified IQI type, placement and required visible element.","Assess coverage, sharpness, density / signal and artefacts as well."],example:"If the required IQI wire is not visible, the image may fail the stated technique quality requirement even if a large pore is visible. The examination may need correction or repeat exposure according to the procedure."},
{p:["Radiographic sharpness is affected by source size and geometry. A finite focal spot produces geometric unsharpness because rays from different parts of the source project slightly different edges. Increasing source-to-object distance or reducing object-to-detector distance generally reduces this contribution. Detector or film contact and detector inherent unsharpness also matter.","The source-to-object distance (SOD), object-to-detector distance (ODD) and source-to-detector distance (SDD) define the imaging geometry. The geometric unsharpness relationship is commonly expressed as Ug = f × ODD / SOD, where f is the effective source size, provided the distances are defined consistently. The relationship illustrates why a small source and suitable geometry improve sharpness.","Exposure technique also depends on radiation energy, material thickness, scatter, detector response and required density or signal. Use collimation and shielding to limit scatter, place IQIs and markers correctly, and ensure the required area is fully covered. Geometry choices must comply with the applicable technique standard."],focus:["Understand source size and object-detector distance effects.","Use geometry to control geometric unsharpness.","Control scatter and document technique dimensions."],example:"For a fixed source size, doubling the object-to-detector gap increases geometric unsharpness if SOD remains unchanged. Keeping the detector close to the component is therefore a common way to improve sharpness."},
{p:["Film radiography uses a photographic emulsion that changes with radiation exposure and is chemically processed to produce a visible image. Film type, screens, exposure, processing time, temperature, chemistry and handling influence density, contrast and graininess. Processing artefacts such as scratches, pressure marks, chemical stains or fog can be mistaken for indications.","Digital radiography uses a detector that converts incoming radiation into pixel values. The detector may use a scintillator that converts X-rays to light followed by a photodiode array, or a direct conversion material. Computed radiography stores a latent image in a photostimulable plate which is read by a laser scanner. These systems have different detector response, dynamic range, spatial resolution and workflow requirements.","Digital images require detector calibration, bad-pixel correction, image-quality checks, controlled display and traceable storage. Window and level can improve visualisation but should not alter the original data or conceal indications. Keep original acquisition data and permitted processed versions with the technique and identification metadata."],focus:["Distinguish film, computed radiography and direct digital detectors.","Recognise processing and detector artefacts.","Preserve original image data and acquisition metadata."],example:"A scratched CR plate may produce a line-like artefact that appears repeatedly in later images. Plate inspection, erasure and reader checks help distinguish such artefacts from a component indication."},
{p:["Radiographic interpretation begins with verifying image quality, identification and coverage. The interpreter then examines density or pixel value, indication shape, size, position, alignment and distribution. Rounded indications may be consistent with gas pores; elongated or irregular indications may be consistent with slag or other conditions, but appearance alone is not always conclusive.","Planar flaws such as lack of fusion or cracks can be difficult to detect if the beam is nearly parallel to the flaw plane. Changing the exposure angle may improve sensitivity. Overlapping component features, backing bars, root geometry and thickness changes can produce superimposed features. The interpreter must understand the weld profile and exposure direction.","Acceptance evaluation compares the relevant radiographic indication with the applicable code or product specification. Do not invent numerical acceptance limits or borrow limits from a different product class. The report should identify the technique, image quality, indication location and evaluation basis."],focus:["Verify image quality before interpreting indications.","Relate feature shape and orientation to weld geometry and beam direction.","Apply the exact governing acceptance criteria."],example:"A row of rounded indications near the weld centreline may suggest porosity, but a row of individual indications can also relate to another process condition. The interpretation must consider spacing, shape, weld position and the governing acceptance standard."},
{p:["Radiography uses ionising radiation that can damage living tissue. The radiation source must be controlled under a formal radiation protection programme. The work area is established and cleared, barriers and warning systems are checked, exposure is performed by authorised personnel, and survey instruments confirm the area is safe before re-entry.","X-ray equipment should have functioning controls, warning indicators and interlocks as required. Gamma radiography requires source-specific controls, exposure devices, source guide tubes, locks, surveys and emergency arrangements. A source that does not retract or an unexpected radiation reading is an emergency: personnel must follow the site's radiation emergency plan and must not improvise a recovery.","Interpretation and reporting must preserve traceability. Record component identity, weld number, exposure location, source, detector, technique, IQI, image quality, date, personnel, results and limitations. Film or digital images should be stored so that they remain legible and linked to the original component and exposure."],focus:["Only authorised radiography personnel may operate sources.","Use controlled area, dosimetry, surveys, warning systems and emergency plans.","Maintain complete image identity and exposure traceability."],example:"Before an exposure, the team confirms the exclusion area is clear and warning systems are functioning. After source return, the survey meter is used under the procedure to verify the source is shielded before personnel approach."}

{p:["Magnetic particle testing detects surface and near-surface discontinuities in ferromagnetic materials. The component is magnetised, and a discontinuity that interrupts the magnetic flux creates a leakage field at the surface. Ferromagnetic particles applied to the surface are attracted to this field and form a visible or fluorescent indication.","The method is suitable for materials that can be strongly magnetised, such as many carbon and low-alloy steels, iron, cobalt and nickel-based ferromagnetic alloys. It is not suitable for ordinary aluminium, copper or austenitic stainless steel. The depth and orientation of a flaw, magnetic field strength, surface condition and particle mobility all affect the indication.","MT is not a direct image of the crack. The particle pattern forms where leakage flux is sufficient to attract particles. It therefore requires careful magnetisation direction, field-strength verification, cleaning, particle application and interpretation. More than one field direction is often needed to provide coverage for differently oriented flaws."],focus:["MT requires ferromagnetic material.","A leakage field attracts particles at surface or near-surface discontinuities.","Field direction and strength control detection capability."],example:"A transverse surface crack in a steel shaft produces leakage when the shaft is magnetised longitudinally. If the field is parallel to the crack, the leakage response may be weak."},
{p:["Magnetic flux follows a path through a ferromagnetic component. When the flux encounters an air gap or discontinuity, some field lines are forced out of the surface and return to the material nearby. This is called flux leakage. Particles are attracted to the leakage field and build up into a pattern that can be observed.","The strength of leakage depends on the amount of flux intercepted by the discontinuity, the discontinuity orientation, its depth and its proximity to the surface. A flaw that crosses the field direction creates more interruption than one aligned with the field. A weak field may fail to produce an indication; an excessive or poorly controlled field can create background particle accumulation.","MT uses longitudinal and circular magnetisation arrangements. Longitudinal fields are often produced with coils or yokes; circular fields can be produced by passing current through a component or a central conductor. The correct method depends on geometry and the orientation of likely discontinuities."],focus:["Flux leakage forms where magnetic flux is disturbed.","Flaw orientation relative to field strongly affects sensitivity.","Select magnetisation arrangement based on component shape and expected flaw direction."],example:"For a shaft, a circular magnetic field is useful for finding longitudinal cracks, while a longitudinal field is useful for transverse cracks. Both directions may be required for complete examination."},
{p:["Longitudinal magnetisation produces a magnetic field along the length of the component. It can be created using a coil, yoke or suitable magnetic circuit. Circular magnetisation produces flux around the circumference or around a current path; it can be created by direct current flow or a central conductor. These are different field arrangements and should not be confused with the shape of the component.","The selected field should cross the expected crack direction. For a shaft, a longitudinal field is often used to reveal transverse cracks, while circular magnetisation is useful for longitudinal cracks. For complex components, a written technique may require multiple magnetising steps and overlapping examinations.","Field strength is verified using the method required by the procedure, such as a field indicator or an approved measurement arrangement. Current type and value, pole spacing, coil turns, contact arrangement and part geometry influence the field. Avoid arcing, local overheating and electrical hazards when using prods or direct current methods."],focus:["Distinguish circular and longitudinal magnetisation.","Orient the field approximately transverse to likely flaws.","Verify field adequacy and overlap for the whole area."],example:"When using a yoke on a weld, repositioning the yoke changes the field direction. A second examination at approximately 90 degrees may be necessary to reveal cracks that were parallel to the first field."},
{p:["Magnetic particles may be applied as dry powder or as particles suspended in a liquid carrier. They may be visible-colour particles used with suitable white-light conditions or fluorescent particles used under controlled UV-A lighting and ambient-light conditions. Contrast paint may be used when permitted to improve the background against visible particles.","The continuous technique applies particles while the magnetising field is active, allowing particles to move toward leakage fields as they form. A residual technique applies particles after magnetisation and depends on sufficient residual magnetism in the component. The correct technique depends on material retentivity, flaw type, equipment and procedure.","Particle concentration, suspension condition, contamination, application rate, lighting, surface roughness and timing all influence the result. Equipment checks and bath checks should follow the applicable process instructions. Particles should remain mobile enough to form a clear indication and should not leave excessive background that masks relevant indications."],focus:["Know dry versus wet and visible versus fluorescent media.","Distinguish continuous and residual magnetisation techniques.","Control particle suspension, lighting and background."],example:"A fluorescent wet method can provide high contrast on a clean steel weld under suitable UV-A and ambient-light conditions. If the suspension is contaminated or the surface is heavily coated, background may obscure relevant indications."},
{p:["MT interpretation is based on particle accumulation patterns. Linear indications may be associated with cracks, seams or laps; rounded or diffuse patterns may be associated with porosity, inclusions or geometry-related leakage. However, shape alone is not sufficient. The inspector considers location, orientation, repeatability, field direction and component geometry.","Non-relevant indications can occur at abrupt section changes, keyways, threads, weld toes and other locations where the magnetic field naturally concentrates. Magnetic writing can occur when particles are attracted to residual fields created by contact or handling. Background particle build-up can also result from excessive field strength or poor suspension condition.","A suspected indication should be examined using the procedure's evaluation steps. The inspector may clean, re-magnetise in another direction or use an alternative arrangement to clarify its behaviour. Record the indication location, length, orientation, appearance, method, field direction and evaluation outcome."],focus:["Differentiate relevant, non-relevant and false indications.","Use a second field direction or repeat examination to investigate uncertain patterns.","Evaluate only against the relevant acceptance criteria."],example:"A continuous line of particles at a sharp weld toe may be a geometric non-relevant indication. A linear pattern that persists in a favourable field direction and follows a crack-like path requires evaluation under the applicable procedure."},
{p:["MT is limited to ferromagnetic materials and is most sensitive to surface and near-surface flaws. Thick non-magnetic coatings, scale, roughness and poor contact can reduce sensitivity. Subsurface detection becomes less reliable as flaw depth increases, and the method does not provide a direct measurement of flaw depth.","After examination, demagnetisation may be required because residual magnetism can affect subsequent machining, welding, instrument operation or service. Demagnetisation may use decreasing alternating fields or another approved method. Verify residual field where the application requires it. Clean and protect the component after particle removal.","Electrical current, hot surfaces, UV-A sources, cleaning chemicals and confined-space exposure create hazards. Inspect cables and equipment, avoid arcing, use suitable PPE and follow chemical safety information. Document material suitability, magnetising method, current or field check, particle medium, lighting, coverage and indications."],focus:["Recognise material and depth limitations.","Demagnetise and post-clean when required.","Control electrical, UV-A and chemical hazards."],example:"A stainless-steel component made from a non-ferromagnetic austenitic grade cannot be reliably examined by ordinary MT. A suitable alternative such as PT or another method should be selected based on the inspection objective."}

{p:["Liquid penetrant testing reveals discontinuities that are open to the surface. A low-viscosity liquid wets the surface and enters narrow openings by capillary action. After a controlled dwell period, excess penetrant is removed from the surface. Developer then draws retained penetrant back out of openings, creating a visible or fluorescent indication.","The method can be used on many metallic and non-metallic, non-porous materials when the penetrant system is compatible. Unlike MT, PT does not require ferromagnetic material. However, PT cannot detect a flaw that is fully subsurface or whose opening is blocked by paint, oxide, grease, smeared metal or other contamination.","The process is a system: pre-cleaning, penetrant application, dwell, excess removal, drying where required, developer application, development, inspection, evaluation and post-cleaning. Skipping or shortening a process step can reduce sensitivity. The required dwell and development times are specified by the procedure and product system; they are not universal constants."],focus:["PT detects only flaws open to the inspected surface.","Capillary action and wetting allow penetrant to enter openings.","Process control and surface cleanliness determine reliability."],example:"A fine fatigue crack in an aluminium bracket may retain fluorescent penetrant. After removal and developer application, the bleed-out can form a bright linear indication under the correct UV-A conditions."},
{p:["Penetrant materials are designed to wet the test surface and enter small openings. Visible dye penetrants commonly produce a red indication against a white developer background. Fluorescent penetrants use dyes that emit visible light under UV-A illumination. Sensitivity levels and product classifications are established by the applicable standard and manufacturer system.","Penetrant may be water-washable, solvent-removable or post-emulsifiable. These categories describe how excess surface penetrant is removed. A post-emulsifiable system uses a separate emulsifier step to make surface penetrant removable; time and concentration control are important because over-emulsification can remove penetrant from flaws.","Developer may be dry powder, water-soluble, water-suspendable or non-aqueous wet, depending on the process. It acts as a blotter, drawing penetrant out of openings and spreading it to improve visibility. Use compatible products as a complete system and follow temperature, dwell, removal, drying and inspection requirements."],focus:["Distinguish visible and fluorescent systems.","Know water-washable, solvent-removable and post-emulsifiable removal methods.","Use compatible penetrant, remover and developer products."],example:"A water-washable fluorescent process may be convenient for a suitable component, while a solvent-removable visible system may suit a local field inspection. The choice depends on procedure, surface and sensitivity requirement."},
{p:["Surface preparation is one of the most important PT steps. Oil, grease, paint, rust, scale, water, dirt and chemical residues can prevent penetrant from entering an opening or cause background. Cleaning must expose the surface without closing the flaw mouth or damaging the component.","Mechanical operations such as grinding, wire brushing, peening or aggressive blasting can smear ductile metal over a crack opening. If such work is performed, the procedure may require an additional chemical etch or other preparation to reopen the discontinuity. The exact method must be compatible with component material and service restrictions.","After cleaning, the surface must be dry before penetrant is applied unless the selected process explicitly allows otherwise. Temperature also matters because penetrant viscosity and performance change outside the qualified range. Record any inaccessible, coated or contaminated area that could not be properly examined."],focus:["Remove contaminants without smearing metal over the flaw opening.","Dry the surface as required by the process.","Confirm material and chemical compatibility before preparation."],example:"A machined crack in a ductile aluminium surface may be closed by heavy polishing or peening. PT performed without appropriate preparation could produce a weak or absent indication even though a crack remains."},
{p:["The normal PT sequence begins with pre-cleaning and drying. Penetrant is applied to cover the examination surface and allowed to dwell for the time specified in the procedure. The penetrant is then removed from the surface without removing it from discontinuities. For some processes, a controlled emulsifier stage is required before washing.","After excess penetrant removal, the part is dried if the process requires it. A thin, even developer layer is applied and allowed to develop. During development, penetrant is drawn from discontinuities to the surface. The inspector then examines the area under the specified visible-light or UV-A conditions and within the required temperature range.","The sequence finishes with evaluation, recording and post-cleaning. Excessive washing can remove penetrant from a flaw; inadequate washing leaves background. Too thick a developer layer can obscure detail, while insufficient development time may not allow an indication to form. Follow the system manufacturer's instructions and written procedure."],focus:["Follow the exact order of operations for the selected penetrant system.","Control dwell, removal, drying and development time.","Inspect using the specified light conditions and record indications before post-cleaning."],example:"If penetrant is water-washable, the operator controls the wash pressure and distance to remove background without flushing penetrant from narrow cracks. The allowable settings come from the product process and procedure."},
{p:["PT indications are the patterns formed by penetrant bleed-out. A linear indication has a length significantly greater than its width and may be associated with a crack, seam or lap. Rounded indications can be associated with porosity or other rounded openings. Multiple small indications may form a clustered pattern. These descriptions are visual classifications, not guaranteed identification of the underlying defect mechanism.","The inspector evaluates location, orientation, size, spacing, pattern and repeatability. Relevant indications must be distinguished from non-relevant conditions such as surface roughness, geometry, contamination or excessive background. The same component may produce different patterns depending on surface preparation, dwell, removal and developer.","PT does not measure flaw depth. The apparent indication size is influenced by bleed-out and developer action and may be larger than the opening itself. Acceptance is determined by the applicable code or product specification. Record the examination area, system, batch or product details when required, process times, lighting conditions and indication dimensions."],focus:["Classify linear, rounded and clustered indications carefully.","Do not equate bleed-out size with true flaw depth.","Apply product-specific acceptance criteria and document the process."],example:"Several small rounded indications in a casting surface may suggest surface-open porosity. A sharp, continuous linear indication in a highly stressed region may require evaluation as a crack-like condition. The acceptance decision still comes from the governing specification."},
{p:["PT is highly dependent on surface access and process control. It cannot reveal fully subsurface flaws, and tightly closed discontinuities may not admit penetrant. Rough, porous or contaminated surfaces can create excessive background and reduce contrast. Thick coatings usually prevent the process from working unless removed in a controlled way.","Temperature, penetrant viscosity, dwell, removal, developer thickness, lighting and observer adaptation all affect sensitivity. Fluorescent inspection requires controlled UV-A intensity and ambient visible light. Visible dye inspection requires suitable white-light intensity. The inspector should check the light source and conditions at the examination surface, not rely only on the lamp label.","Penetrants, removers and developers may contain flammable solvents or chemicals that require ventilation, compatible gloves, eye protection and appropriate waste disposal. Avoid skin contact and inhalation. Post-cleaning is important where penetrant residues could affect subsequent coating, welding, sealing or service."],focus:["Recognise subsurface and closed-crack limitations.","Control background, lighting and temperature.","Follow chemical handling, ventilation and waste-disposal requirements."],example:"A rough casting may produce general fluorescent background that hides small relevant indications. The correct response is to assess surface suitability and preparation, not simply increase lamp intensity."}

{p:["Visual testing is the direct or remote examination of a component using the human eye or optical devices. It is often the first NDT method applied because it can identify obvious damage, corrosion, deformation, leakage, weld profile conditions and surface discontinuities. VT also checks whether the component is ready for another NDT method, for example whether a surface is sufficiently clean for PT or MT.","An effective VT examination has a defined scope, viewing method, lighting, access, inspection distance, viewing angle and acceptance criteria. Direct VT requires line of sight; remote VT uses mirrors, borescopes, videoscopes, cameras or robotic devices. A casual glance is not a controlled inspection and may not provide adequate coverage or measurement evidence.","The inspector records observations in a way that can be understood and verified later. Record exact location, direction, dimensions, component identity, surface condition and image reference. If access or lighting is inadequate, record the limitation and arrange additional access or another suitable method."],focus:["VT is a method with defined conditions, not simply looking at a part.","Direct and remote VT have different access and optical limitations.","Documentation and measurement are part of the examination."],example:"A weld VT may check the joint for visible cracks, undercut, overlap, porosity, arc strikes, misalignment and profile. A weld gauge can quantify selected dimensions against the drawing and acceptance standard."},
{p:["Illumination allows features to be distinguished from the surrounding surface. The amount of light, direction of incidence, contrast, reflected glare and shadows determine whether a small feature is visible. Diffuse lighting can reduce strong reflections on polished surfaces, while directional lighting can highlight surface texture or profile changes.","Viewing distance and angle affect apparent feature size and shape. The eye or camera must be focused on the examination surface and positioned to see the relevant area. Minimum illumination and maximum viewing distance may be specified by the procedure or standard. Use a calibrated light meter when the procedure requires a measured illumination level.","Human factors matter. Visual acuity, colour vision where required, fatigue, adaptation to dark or bright conditions and inspection duration affect consistency. Personnel should meet the applicable vision and qualification requirements and take breaks where needed. The work area should be arranged to avoid glare, reflections and obstructed views."],focus:["Control lighting direction, intensity and glare.","Maintain suitable viewing distance and angle.","Consider visual acuity, fatigue and adaptation."],example:"A shallow undercut on a dark weld surface may be difficult to see under flat, low-angle lighting. Adjusting the light direction can create a shadow that makes the edge easier to distinguish, while measurement still requires an appropriate gauge."},
{p:["Optical aids extend the inspector's ability to access or resolve a feature. Magnifiers increase apparent angular size but do not create detail that the optics cannot resolve. Mirrors allow indirect viewing around an obstruction. Borescopes and videoscopes provide remote access through small openings and may include articulation, illumination and image capture.","A device should be selected for its working distance, field of view, depth of field, resolution, probe diameter, articulation range and environmental rating. A wide field of view helps navigation but may reduce the apparent size of a small feature. A narrow field of view can provide detail but makes orientation and coverage harder.","Measurement attachments, calibrated scales or stereo systems may allow dimensional evaluation when the device and method support it. Image distortion, lens contamination, focus error, perspective and non-normal viewing can affect measurements. Preserve scale and orientation references with recorded images."],focus:["Choose optical aids based on access, resolution and field of view.","Understand distortion, focus and viewing-angle limitations.","Use calibrated measurement aids for dimensions."],example:"A videoscope can inspect the internal surface of a pipe bend through a small access opening. The image should include orientation and location information so a recorded indication can be found again."},
{p:["Surface condition determines what the inspector can see. Oil, grease, dust, corrosion products, paint, scale, water and weld spatter may hide discontinuities or mimic them. Cleaning should remove the material that obstructs examination while preserving evidence and avoiding damage to the component.","Surface preparation must be selected for the material and inspection objective. For an in-service component, cleaning may be restricted by coatings, corrosion protection or contamination. The inspector should not grind or remove material unless authorised. Record any remaining coating, deposits or inaccessible surface area that may affect the result.","A surface feature should be assessed in context. Scratches, tool marks, weld ripples, corrosion pits and cracks can have similar visual appearances at first glance. Use magnification, measurement, alternate lighting and complementary NDT when necessary. Do not infer subsurface depth from surface appearance alone."],focus:["Prepare the surface without damaging or altering evidence.","Recognise how coatings and deposits limit visibility.","Use suitable magnification and complementary NDT for uncertain features."],example:"A linear dark mark on a weld toe may be a surface crack, a scratch or a shadow. Cleaning, changing light direction, magnification and an appropriate follow-up NDT method can help distinguish them."},
{p:["VT evaluation compares observed conditions with the relevant drawing, workmanship standard, product specification or acceptance criteria. Typical weld features include reinforcement, throat or leg size, undercut, overlap, misalignment, root penetration profile, visible porosity and surface cracks. Dimensional tools must be appropriate to the feature and used in a repeatable way.","A report should identify component, inspection area, surface condition, viewing method, light conditions where required, tools used, measurements, photographs and limitations. Photographs should be linked to a component location and include a scale or reference when dimensions matter. A photo without traceability may be difficult to interpret later.","VT acceptance criteria vary by product and construction standard. The inspector should not invent a permissible size or apply a criterion from a different code. Where a condition is beyond the inspector's authority, record the observation and refer it to the responsible engineering or quality authority."],focus:["Measure relevant profile and dimensions using proper gauges.","Record location and scale with photographs.","Use the correct product-specific acceptance criteria."],example:"A weld gauge may be used to measure undercut depth or fillet leg length. The measurement is then compared with the exact acceptance requirement stated in the project specification or code."}

[
{p:["Eddy current testing is based on electromagnetic induction. An alternating current in a probe coil creates a changing magnetic field. When the coil is brought near an electrically conductive test material, the changing field induces circulating currents in the material. These currents generate their own magnetic field, which interacts with the probe coil and changes its electrical impedance.","A discontinuity interrupts or redirects the current flow and alters the coil response. Changes in material conductivity, permeability, thickness, geometry, temperature and probe lift-off can produce similar impedance changes. The instrument therefore requires balancing and calibration using reference standards representative of the material and inspection condition.","ECT is used for surface and near-surface flaw detection, sorting, conductivity measurement, coating or thickness applications and tubing inspection. It does not require couplant, and it can be fast, but it is limited to electrically conductive materials and has reduced sensitivity with depth."],focus:["Alternating coil current induces eddy currents in the conductor.","A flaw changes the current pattern and coil impedance.","Separate flaw response from lift-off, edge and material-property effects."],example:"A fatigue crack in an aluminium aircraft skin interrupts local eddy-current flow. A surface probe detects an impedance change as it passes the crack, provided probe orientation and calibration are suitable."},
{p:["The probe coil is an inductor carrying alternating current. Its changing magnetic field produces eddy currents in the specimen, and the specimen's response changes the coil's effective resistance and inductance. The instrument presents the change as an impedance-plane signal, commonly with horizontal and vertical components corresponding to resistance and reactance changes.","The phase angle of a signal can help distinguish different causes of impedance change. A lift-off response often follows a different phase direction from a crack response on a properly calibrated display. However, phase relationships depend on probe, frequency, material, geometry and instrument setup; do not transfer phase rules from one application without calibration.","Probe designs include absolute coils, differential coils, reflection probes, surface probes, pencil probes and encircling coils. Absolute probes respond to local changes in the test material; differential probes compare two coil regions and can suppress gradual changes while highlighting local variations. The selected design depends on the part geometry and flaw target."],focus:["Understand impedance as resistance plus reactance response.","Use phase as a discriminating feature after calibration.","Select absolute, differential or encircling probes for the geometry."],example:"A differential probe can respond strongly when one coil passes over a local crack while the paired coil remains over sound material. A gradual conductivity change across the whole part may produce less differential response."},
{p:["Absolute probes use a coil response referenced to the local material condition. Differential probes often use two sensing regions connected so that common changes cancel while local changes create an output. Reflection probes use separate drive and receive coils or windings. Encircling coils surround a rod or tube and are widely used for rapid production testing.","Probe frequency, coil diameter, core, shielding, fill factor and orientation affect sensitivity and penetration. A smaller coil can provide better local resolution but may be more sensitive to lift-off and require more scan time. A larger coil covers a wider area but can average small local features. Probe choice should be based on representative calibration standards.","For tubing, encircling coils can scan rapidly but may have limits related to support plates, tube ends and geometry. Rotating pancake coil or array methods can provide additional coverage for certain applications. A surface probe may be scanned manually or encoded with controlled lift-off and orientation."],focus:["Match coil design to plate, tube, rod or local surface geometry.","Understand fill factor and probe size effects.","Check probe orientation and lift-off during scanning."],example:"An encircling coil can inspect a conductive tube over a long length, while a small pencil probe may be more suitable for checking a local crack near a fastener hole on a panel."},
{p:["The standard depth of penetration, or skin depth, is the depth at which the eddy-current density falls to about 37% of its surface value for a simple uniform conductor. It is commonly expressed as δ = 1/√(πfµσ), where f is frequency, µ is magnetic permeability and σ is electrical conductivity. The equation shows that penetration becomes shallower as frequency, permeability or conductivity increases.","Higher frequencies generally favour surface flaws and small features because current is concentrated near the surface. Lower frequencies allow greater penetration but may reduce sensitivity to small shallow flaws. The appropriate frequency also depends on material thickness, crack depth, probe design, signal-to-noise and the required inspection speed.","Ferromagnetic materials can be difficult because permeability may vary with stress, heat treatment, microstructure and magnetisation. This can create strong background changes. Special probes, magnetic saturation, lower frequency or other techniques may be needed under a validated procedure."],focus:["Know the skin-depth relationship and its variables.","Higher frequency generally gives shallower penetration.","Permeability variation can complicate ferromagnetic inspection."],example:"If frequency is increased by a factor of four while other variables remain constant, the theoretical skin depth reduces by a factor of two. This illustrates the frequency trade-off, not a complete probe performance prediction."},
{p:["Calibration uses standards with known material, geometry and artificial discontinuities representative of the inspection. The instrument is balanced to a reference condition, then gain, phase, frequency, filters and alarm thresholds are adjusted to produce the required response. Verify more than one reflector where the procedure requires response linearity or sensitivity checks.","Lift-off is the separation between the probe and test surface. A coating, probe wobble, roughness or curvature changes lift-off and can produce a signal similar to a flaw. Edge effect arises when the probe approaches an edge or abrupt geometry change. Conductivity changes due to alloy or heat treatment may also alter the response.","During inspection, maintain probe pressure, orientation, speed and lift-off. Recheck balance and reference response at specified intervals and after relevant changes. Record the standard, probe, frequency, gain, phase rotation, calibration features, scan speed and instrument identity."],focus:["Use representative standards and a repeatable balance point.","Recognise lift-off, edge and conductivity effects.","Record phase, frequency, gain and reference response."],example:"A coating-thickness variation can shift the impedance trace even if the underlying aluminium is sound. A reference standard with representative coating and lift-off helps determine whether the flaw response can be separated reliably."},
{p:["ECT interpretation uses both amplitude and phase on a calibrated impedance display. A signal's direction, shape and magnitude are compared with reference responses from known notches, holes, edges or material conditions. The operator observes how the signal changes as the probe crosses an indication and may use multiple frequencies or probe orientations to separate flaw response from nuisance effects.","The same indication may look different if probe orientation changes relative to a crack. A crack parallel to the dominant eddy-current path may produce a weaker response than one that interrupts the current flow. Scanning direction should therefore be selected to create suitable interaction with the expected flaw orientation.","ECT is limited by depth penetration, conductivity and permeability changes, geometry and lift-off. A strong signal is not a direct flaw-depth measurement. Sizing requires a validated application-specific calibration and analysis method. Acceptance is determined by the applicable component specification."],focus:["Interpret phase and amplitude relative to a known standard.","Check crack orientation and scan direction.","Do not infer depth from signal amplitude without validated sizing."],example:"A reference notch signal is first established, then the probe is scanned over the part. A response with a similar phase trajectory may indicate a relevant flaw, but confirmation requires checking location, repeatability and possible geometry effects."}

[
{p:["Leak testing examines whether a containment boundary allows gas or liquid to escape or enter. The test creates a pressure difference across the boundary and detects the resulting flow or pressure change. Common approaches include bubble testing, pressure decay, vacuum testing, tracer-gas detection and mass-spectrometer methods. They differ in sensitivity, localisation ability, speed and suitable product geometry.","Leak rate is not the same as pressure loss alone. Pressure change depends on test volume, gas temperature, compressibility, boundary compliance and stabilisation. A pressure-decay test must account for these effects before attributing a change to leakage. A tracer-gas detector can identify local escape paths, but background gas and fixture leakage must be controlled.","Method selection begins with the required leak rate, test medium, pressure rating, product volume, material, access and acceptance criterion. Choose a method that can demonstrate the required sensitivity with a calibrated reference and a stable test setup."],focus:["Distinguish leak detection, localisation and leak-rate measurement.","Understand pressure differential and gas / liquid flow.","Select a method based on required sensitivity and product geometry."],example:"A sealed electronics enclosure may be screened by pressure decay for gross leakage, then locally examined with tracer gas if a more sensitive leak search is required. The second test must use a defined tracer concentration and detector calibration."},
{p:["A positive-pressure test places the component above ambient pressure, while a vacuum test reduces pressure inside the component or test enclosure. A pressure-hold test monitors whether pressure remains stable over a defined period. A pressure-decay test measures a change and may calculate an equivalent leakage rate under specified conditions.","Temperature stabilisation is important because gas pressure changes with temperature even when no leak exists. A flexible container may change volume as pressure changes. Test volume, gas properties, ambient conditions and gauge resolution affect the ability to detect a small leak. The fixture itself must be leak-tight and verified before testing the component.","The test pressure and hold time must come from the governing specification or approved procedure. Do not exceed the rating of the part, test rig, plugs, hoses or fittings. Use pressure relief, guards, remote operation and an exclusion zone where the stored energy warrants it."],focus:["Pressure change can be caused by temperature, volume or leakage.","Stabilise and check the test rig before evaluating the component.","Never invent test pressure or hold time; use the approved procedure."],example:"If a component is pressurised immediately after being filled with warm gas, subsequent cooling can produce a pressure drop that resembles leakage. A stabilisation period helps separate thermal effects from a true leak."},
{p:["Bubble testing applies a suitable liquid film to a pressurised component or immerses the component in a liquid. Gas passing through a leak forms visible bubbles. The method is useful for localising leaks when the suspected area is accessible and the pressure differential is suitable.","The bubble solution must wet the surface and form stable bubbles. Very small leaks may require observation time, suitable lighting and a validated solution. Excessive pressure can cause the liquid film to break or create misleading behaviour. Immersion testing also requires attention to trapped air, component orientation and water compatibility.","Bubble testing can locate a leak but does not automatically give a precise standard leak rate. The report should state test pressure, medium, solution, observation conditions, location and the acceptance requirement. After testing, clean and dry the component as required."],focus:["Use a suitable bubble-forming solution and controlled pressure.","Observe long enough for bubbles to form and localise the path.","Do not confuse bubble detection with quantitative leak-rate measurement."],example:"A pressurised welded enclosure may be brushed with bubble solution along a seam. Repeated bubble formation at one location provides evidence of a leak path; the exact leak rate requires a suitable quantitative technique."},
{p:["Tracer-gas methods introduce a detectable gas into the component or test enclosure and use a detector to identify gas escaping through a leak path. Helium is common because it is inert, has a small molecular size and can be detected with high sensitivity by a mass-spectrometer leak detector. Other tracer gases may be used when compatible with the product and detector.","In vacuum-mode testing, the part or enclosure is evacuated and tracer gas is applied to the outside or introduced into the test volume according to the method. In sniffing mode, tracer gas inside a pressurised component escapes and is sampled by a probe outside. The detector response depends on probe distance, speed, gas concentration, background and system configuration.","Tracer-gas methods need calibration with a reference leak and background control. Helium background in the environment can cause an elevated zero or slow recovery. The detector and test configuration should be checked for response time, sensitivity, leak rate units and stability before the examination."],focus:["Distinguish vacuum and sniffing modes.","Control tracer concentration, probe movement and background.","Verify detector response using a calibrated reference leak."],example:"In a helium sniff test, a sealed part is filled with a specified helium mixture. A detector probe is moved steadily around the seals; a local increase in helium response can identify a leak location."},
{p:["Leak-test instruments include pressure gauges, absolute-pressure sensors, vacuum gauges, mass-flow meters, bubble solutions, tracer-gas detectors and mass spectrometers. Instrument selection depends on whether the test is qualitative, quantitative, localising or monitoring. The measuring range and resolution must be appropriate for the required leak rate and pressure.","Calibration checks compare the instrument response with a known standard or reference leak. A zero check confirms background response; a span or sensitivity check verifies response to a known input. Reference leak values may depend on temperature, pressure, gas type and calibration conditions. The detector response time and recovery time influence the speed at which a probe can be scanned.","A complete procedure defines test boundary, medium, pressure or vacuum, stabilisation time, measurement period, detector setup, calibration checks, acceptance criteria and reporting units. Record environmental conditions where they can affect the result. A calibrated gauge does not by itself validate the entire test setup."],focus:["Choose instrument range and resolution for the required leak rate.","Perform zero and reference-leak checks as applicable.","Record pressure, temperature, gas, time and measurement units."],example:"A detector may show a response to a known reference leak before a test. If the check fails, a low response on the component cannot be treated as evidence that the component is leak-tight."},
{p:["Leak-test results must be interpreted in the context of the test configuration. A pressure drop can result from a leak, temperature change, gas permeation, flexible-wall movement or fixture leakage. A tracer-gas signal can arise from the component, test hose, valve, background contamination or residual gas from a previous test. Localisation requires a stable background and a controlled probe technique.","Leak rate units must be stated clearly. Depending on the method, results may be expressed as pressure change per time, volumetric flow or pressure-volume per time. These are not interchangeable without the required conditions and conversion. Always report the gas, pressure, temperature and reference conditions used for a quantitative result.","Safety is central to leak testing because compressed gas and vacuum can store energy or cause implosion. Use rated components, restraints, relief devices and guarding. Be cautious with oxygen, flammable gases, toxic gases and asphyxiants. Depressurise in a controlled way before disconnecting fittings."],focus:["Separate component leaks from rig leaks and background.","State leak-rate units and reference conditions.","Control stored pressure, vacuum and gas-related hazards."],example:"A detector response near a valve fitting should first be checked as a possible rig leak. The fitting can be isolated or tested separately before attributing the response to the component itself."}
