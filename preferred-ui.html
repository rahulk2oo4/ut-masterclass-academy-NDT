.main{min-width:0}.topbar{height:92px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 44px 0 45px;background:rgba(255,248,243,.94)}.crumb{font-size:14px;color:var(--muted)}.crumb b{color:var(--ink)}.profile{display:flex;align-items:center;gap:13px;font-size:14px}.avatar{width:44px;height:44px;border-radius:50%;background:#f5dfd3;display:grid;place-items:center;font-weight:800}.btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:15px 20px;border-radius:14px;font-size:14px;font-weight:750}.btn.primary{background:var(--orange);color:white;border-color:var(--orange)}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.content{padding:38px 44px 60px;max-width:1800px;margin:auto}.hero{min-height:405px;border-radius:29px;background:radial-gradient(circle at 82% 36%,#9a554f 0,#74404a 8%,transparent 8.2%),radial-gradient(circle at 82% 36%,transparent 0 14%,#733044 14.1% 17%,transparent 17.1%),radial-gradient(circle at 82% 5%,transparent 0 15%,#67263b 15.1% 18%,transparent 18.1%),linear-gradient(115deg,#4b1021 0%,#58192e 55%,#68233a 100%);color:white;padding:45px 44px;display:flex;align-items:center;justify-content:space-between;gap:30px;position:relative;overflow:hidden;box-shadow:0 18px 50px #5420340b}.hero-copy{max-width:820px;position:relative;z-index:1}.eyebrow{font-size:13px;font-weight:900;letter-spacing:2px;color:var(--peach);margin:0 0 22px}.hero h1{font-size:clamp(32px,3vw,52px);line-height:1.2;letter-spacing:-1.8px;margin:0 0 18px;font-weight:850;max-width:800px}.hero p{font-size:18px;line-height:1.7;color:#f2dfe3;max-width:760px;margin:0 0 26px}.btn.light{background:white;border-color:white;color:var(--ink);padding:17px 21px}.hero-art{width:310px;min-width:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;position:relative;z-index:1}.orb{width:180px;height:180px;border:1px solid #ffffff55;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 19px #ffffff08,0 0 0 38px #ffffff05;background:radial-gradient(circle at 40% 35%,#c1836b55,transparent 65%);font-size:32px}.art-caption{font-size:13px;color:#f5e0e4}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:26px}.stat{border:1px solid var(--line);border-radius:20px;background:#fff;padding:23px 24px 22px;min-height:174px;box-shadow:0 16px 35px #5a26300a}.stat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:#8b7c7d;font-size:14px}.stat-icon{width:40px;height:40px;border-radius:12px;background:var(--pale);color:var(--orange);display:grid;place-items:center;font-size:17px}.stat-number{font-size:34px;font-weight:850;line-height:1.2;margin:13px 0 13px;letter-spacing:-1px}.stat-foot{font-size:13px;color:#897c7d}.section-head{display:flex;justify-content:space-between;align-items:center;margin:45px 0 19px;gap:20px}.section-head h2{font-size:24px;letter-spacing:-.6px;margin:0}.text-link{border:0;background:none;color:var(--orange);font-weight:800}.method-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.method{background:#fff;border:1px solid var(--line);border-radius:19px;padding:23px;display:flex;flex-direction:column;min-height:200px}.method-tag{font-size:11px;letter-spacing:1.4px;font-weight:850;color:var(--orange)}.method h3{font-size:19px;margin:13px 0 9px}.method p{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 20px}.method .btn{margin-top:auto;align-self:flex-start;padding:12px 15px}.page-title{font-size:32px;letter-spacing:-1px;margin:6px 0 8px}.page-desc{color:var(--muted);line-height:1.65;margin:0 0 25px}.toolbar{display:flex;gap:12px;margin:22px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;background:white;padding:13px 15px;color:var(--ink)}.lesson-list{display:grid;gap:12px}.lesson-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.lesson-row h3{margin:0 0 6px;font-size:16px}.lesson-row p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.pill{background:var(--pale);color:var(--orange);border-radius:30px;padding:7px 11px;font-size:12px;font-weight:750;white-space:nowrap}.lesson-body{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;line-height:1.8}.lesson-body h3{margin-top:25px}.formula-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.formula-card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px}.formula{font-size:22px;font-weight:800;margin:15px 0;color:var(--wine)}.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.calc input{width:100px;padding:10px;border:1px solid var(--line);border-radius:9px}.result{font-weight:800;color:var(--orange);margin-top:12px}.question{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;margin-bottom:14px}.question h3{margin:0 0 15px;font-size:17px}.option{display:block;margin:10px 0;color:#66575a}.option input{margin-right:9px;accent-color:var(--orange)}.notice{padding:15px 17px;border-radius:12px;background:#fff0e5;color:var(--ink);margin:16px 0;line-height:1.6}.certificate{border:8px double #7c3044;background:white;padding:35px;text-align:center;max-width:780px;margin:10px auto}.certificate h2{font-size:31px;color:var(--wine)}.certificate .cert-name{font-size:27px;font-weight:800;margin:25px}.empty{padding:30px;text-align:center;border:1px dashed #d9bfb6;border-radius:16px;color:var(--muted);background:#fff}
@media(max-width:1200px){.app{grid-template-columns:270px minmax(0,1fr)}.content{padding:28px}.topbar{padding:0 28px}.hero{padding:35px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.method-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-art{width:230px;min-width:180px}.orb{width:145px;height:145px}}

</style>

<style>.formula-method-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}.formula-method-tabs .btn{font-size:12px;padding:9px 12px;white-space:normal;border:1px solid rgba(74,16,32,.22);background:#fff;color:var(--maroon,#4A1020);transition:background .18s ease,color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease;cursor:pointer}

<script>
const methods=[
{name:"Ultrasonic Testing (UT)",short:"UT FUNDAMENTALS",desc:"Sound waves, probes, calibration, signal interpretation and conventional ultrasonic inspection.",lessons:["Introduction to NDT","Principles of ultrasonic testing","Sound waves and propagation","Ultrasonic probes and transducers","Instrument controls and calibration","A-scan interpretation","Thickness measurement","Defects, limitations and safety"]},
{name:"Phased Array UT (PAUT)",short:"ADVANCED UT",desc:"Understand phased-array probes, beam steering, focal laws, scan plans and encoded inspection.",lessons:["PAUT fundamentals","Array probes and elements","Beam steering and focusing","Focal laws","S-scan and sectorial views","Calibration and sensitivity","Scan plans and reporting"]},
{name:"Time of Flight Diffraction (TOFD)",short:"ADVANCED UT",desc:"Learn TOFD setup, lateral waves, back-wall signals, diffraction tips and sizing concepts.",lessons:["TOFD principles","Probe arrangement","Lateral and back-wall waves","Calibration and PCS","Image interpretation","Defect sizing and limitations"]},
{name:"Radiographic Testing (RT)",short:"RADIOGRAPHY",desc:"Radiation basics, image quality, exposure variables, film/digital systems and safety.",lessons:["Radiographic principles","X-ray and gamma sources","Image quality indicators","Exposure and geometry","Film and digital radiography","Interpretation and safety"]},
{name:"Magnetic Particle Testing (MT)",short:"SURFACE METHODS",desc:"Magnetisation, field direction, particles, indications and demagnetisation.",lessons:["MT principles","Magnetic fields","Magnetisation methods","Particles and media","Indication interpretation","Limitations and safety"]},
{name:"Liquid Penetrant Testing (PT)",short:"SURFACE METHODS",desc:"Surface preparation, penetrant systems, dwell time, removal, development and evaluation.",lessons:["PT principles","Materials and penetrants","Surface preparation","Process sequence","Indication evaluation","Limitations and safety"]},
{name:"Visual Testing (VT)",short:"FOUNDATION",desc:"Visual inspection principles, lighting, viewing conditions, tools and documentation.",lessons:["Visual inspection basics","Lighting and viewing","Optical aids","Surface conditions","Acceptance and reporting"]},
{name:"Eddy Current Testing (ECT)",short:"ELECTROMAGNETIC",desc:"Electromagnetic induction, coils, impedance, lift-off, conductivity and signal analysis.",lessons:["ECT principles","Electromagnetic induction","Coils and impedance","Frequency and skin effect","Calibration and interpretation","Applications and limitations"]}
];
const lessonText={
"Introduction to NDT":"Non-destructive testing (NDT) evaluates a material, component or assembly without impairing its future usefulness. It supports quality assurance, maintenance and fitness-for-service decisions. Common methods include UT, RT, MT, PT, VT and ECT.",
"Principles of ultrasonic testing":"Ultrasonic testing introduces high-frequency mechanical waves into a test object and analyses reflected or transmitted energy. Changes in acoustic impedance at boundaries can produce reflections. Results depend on material, geometry, probe characteristics, coupling and instrument settings.",
"Sound waves and propagation":"Ultrasound propagates as mechanical vibration. Longitudinal waves involve particle motion parallel to propagation; shear waves involve motion perpendicular to propagation. Velocity depends on material properties and wave mode. Interfaces can cause reflection, transmission, refraction and mode conversion.",
"Ultrasonic probes and transducers":"A transducer converts electrical energy into mechanical vibration and returning vibration into an electrical signal. Probe selection considers frequency, element size, bandwidth, beam spread, near field, resolution and material attenuation. Couplant helps transfer sound across the probe-to-part interface.",
"Instrument controls and calibration":"Calibration establishes the relationship between instrument indications and known reference distances or responses. Verify range, zero, velocity and sensitivity with suitable reference blocks and documented procedures. Calibration must represent the inspection geometry and applicable code or specification.",
"A-scan interpretation":"An A-scan displays signal amplitude against time or sound path. The initial pulse, back-wall response and intermediate indications are interpreted using calibrated range, expected geometry and scan movement. Amplitude alone does not identify defect type; evaluation requires context and procedure requirements."
};
function safeLoadArray(key){try{const value=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(value)?value:[]}catch(error){console.warn("Resetting invalid academy storage:",key,error);return []}}
let completed=safeLoadArray("ndtAcademyCompleted");
let certificates=safeLoadArray("ndtAcademyCertificates");
let learner=localStorage.getItem("ndtAcademyName")||"Rahul";
let currentMethod=0,currentLesson="",examQuestions=[],examAnswers={};
const view=document.getElementById("view");
function save(){localStorage.setItem("ndtAcademyCompleted",JSON.stringify(completed));localStorage.setItem("ndtAcademyCertificates",JSON.stringify(certificates))}
function go(page){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const names={dashboard:"Dashboard",courses:"Course library",formulas:"Formula library",simulation:"UT simulations",standardBlock:"Standard Block — IIW Type 1 (V1)",practice:"Practice questions",exams:"Final examinations",certificates:"Certificates",about:"About NDT"};document.getElementById("crumb").textContent=names[page]||"Lesson";({dashboard,courses,formulas,simulation,standardBlock,practice,exams,certificates:showCertificates,about})[page]?.();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function standardBlock(){
const blocks=[
{name:"IIW Type 1 (V1)",category:"Conventional UT",purpose:"General UT calibration; checking shear/longitudinal probes and, with the prescribed method, wedge exit point and refracted angle.",use:"Range/time-base checks, probe index and angle checks, resolution and sensitivity checks.",image:"https://www.ndetech.org.in/admin/images/category/1594883714_IIW-Type-1-Block.jpg"},
{name:"IIW Type 2 (V2)",category:"Conventional UT",purpose:"Compact reference block used for selected angle-beam checks and range/sensitivity work.",use:"Portable checks of probe index, angle and time base according to the relevant procedure.",image:"https://www.ndetech.org.in/admin/images/category/1594883688_IIW-Type-2-Block.jpg"},
{name:"K1 / Calibration Block No. 1",category:"Conventional UT",purpose:"Reference block for checking ultrasonic flaw detector setups and reference responses.",use:"Range checks and sensitivity-related checks using its specified radii, holes and markings.",image:"https://www.ndetech.org.in/admin/images/category/1594883698_Calibration-Block-No-1.jpg"},
{name:"V2 (A4) Block",category:"Conventional UT",purpose:"Small block for selected on-site checks of miniature angle-beam probes.",use:"Probe index, time base, beam angle and gain checks under the applicable method.",image:"https://www.ndetech.org.in/admin/images/category/1594883704_V2-A4-Calibration-Block.jpg"},
{name:"Step Wedge / Thickness Block",category:"Conventional UT",purpose:"Block with known thickness steps for ultrasonic thickness-gauge checks.",use:"Thickness calibration and linearity checks over the step range.",image:"https://www.ndetech.org.in/admin/images/category/1594883648_5-Step-Calibration-Block.jpg"},
{name:"ASTM E2491 PAUT Assessment Block",category:"PAUT",purpose:"General-purpose phased-array assessment block for beam characterization and system performance evaluation.",use:"Beam characterization, resolution/focusing assessment, steering checks and DAC-related evaluation as specified.",image:"https://ndetech.org.in/admin/images/category/1594117017_ASTM%20E2491%20Phased%20Array%20Assessment%20Block.jpg"},
{name:"PAUT IIW ISO 19675 Block",category:"PAUT",purpose:"Phased-array calibration block designed to ISO 19675.",use:"PAUT system calibration tasks defined by the applicable standard and procedure.",image:"https://ndetech.org.in/admin/images/category/1594117908_PAUT%20IIW%20BLOCK%20ISO%2019675.jpg"},
{name:"Phased Array Navships Block",category:"PAUT",purpose:"Phased-array version of the NAVSHIPS reference block with a selected hole arrangement.",use:"PAUT response and beam checks using the specified geometry.",image:"https://ndetech.org.in/admin/images/category/1594137157_Phased%20Array%20Navships%20Test%20Block.jpg"},
{name:"PAUT Type A (IIW-Type) Block",category:"PAUT",purpose:"IIW-style block specially adapted for phased-array applications.",use:"Beam-angle verification, wedge delay, sensitivity and DAC/TCG setup where prescribed.",image:"https://ndetech.org.in/admin/images/category/1594883667_Phased%20Array%20Type%20A%20Block.jpg"},
{name:"PAUT Standard Calibration Block",category:"PAUT",purpose:"Reference block for common phased-array calibration tasks across specified thickness ranges.",use:"Angle/exit-point verification, wedge delay, sensitivity, velocity and DAC/TCG checks as applicable.",image:"https://ndetech.org.in/admin/images/category/1594883327_Phased%20Array%20Calibration%20Standard%20Blocks.jpg"},
{name:"Contoured Boiler Tube Block",category:"PAUT / curved surfaces",purpose:"Contoured block designed for low-profile PA probes on boiler-tube surfaces.",use:"Calibration checks on the matching tube contour and probe/scanner arrangement.",image:"https://ndetech.org.in/admin/images/category/1594883399_Contoured%20Boiler%20Tube%20Calibration%20Block.jpg"},
{name:"Contoured PAUT Block",category:"PAUT / curved surfaces",purpose:"Custom-contour phased-array block for component geometry that is not flat.",use:"TCG, sensitivity, velocity and wedge-delay checks with contour specified for the component.",image:"https://ndetech.org.in/admin/images/category/1594883408_Contoured%20Phased%20Array%20Calibration%20Block.jpg"},
{name:"PAUT Notch Calibration Block",category:"PAUT",purpose:"Block with specified EDM notches for crack-sizing method checks.",use:"Evaluation of sizing response for OD/ID-connected notches as defined by the procedure.",image:"https://ndetech.org.in/admin/images/category/1594883628_Phased%20Array%20Notch%20Calibration%20Blocks.jpg"},
{name:"AWS-Type PAUT Block",category:"PAUT / weld inspection",purpose:"Phased-array calibration block configured for relevant AWS requirements.",use:"Angle-beam, exit point, wedge-delay, sensitivity and DAC/TCG checks within the applicable scope.",image:"https://ndetech.org.in/admin/images/category/1594883650_AWS-TYPE-Phased-Array-Calibration-Blocks.jpg"},
{name:"ASME-Type PAUT Pipe Block",category:"PAUT / piping",purpose:"Pipe reference block designed around the applicable piping geometry and material requirements.",use:"PAUT calibration on representative pipe geometry, including notch-related DAC/TCG tasks.",image:"https://ndetech.org.in/admin/images/category/1622196219_PHASED%20ARRAY%20ASME%20TYPE%20PIPING%20CALIBRATION%20BLOCK.jpg"}
];
const cats=["All blocks","Conventional UT","PAUT","PAUT / curved surfaces","PAUT / weld inspection","PAUT / piping"];
view.innerHTML='<div class="method-tag">NDT REFERENCE LIBRARY</div><h1 class="page-title">Standard Blocks</h1><p class="page-desc">Browse common ultrasonic reference and calibration blocks, what they are used for, and where they fit in an inspection setup.</p><div class="notice"><b>Important:</b> Block designs, dimensions, material and reflector details vary by standard edition and manufacturer. Use the certified block drawing and governing procedure for real calibration. Block descriptions are provided as educational summaries; dimensions and acceptance criteria vary by standard, edition and block specification.</div><div class="toolbar" id="blockFilters" style="margin:18px 0;display:flex;gap:8px;flex-wrap:wrap">'+cats.map(function(c,i){return '<button type="button" class="btn '+(i===0?'primary':'')+'" data-block-filter="'+c+'">'+c+'</button>'}).join('')+'</div><div id="blockGrid" class="stats" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr));align-items:stretch"></div><div id="blockDetails"></div><p class="stat-foot" style="margin-top:20px">Learning note: Applications shown here are for theory learning. Always follow the governing code, block certificate and approved inspection procedure.</p>';
let activeFilter="All blocks";
function renderBlocks(){

function formulas(){view.innerHTML=`<h1 class="page-title">Formula library</h1><p class="page-desc">UT calculators and an interactive pulse-echo simulator. Verify calculations against your approved procedure.</p><div class="formula-grid">${formulaData.map((f,i)=>`<article class="formula-card"><div class="method-tag">CALCULATOR ${String(i+1).padStart(2,"0")}</div><h3>${f.name}</h3><div class="formula">${f.formula}</div><p class="page-desc">${f.desc}</p><div class="calc">${f.fields.map((x,j)=>`<label style="font-size:12px;color:var(--muted)">${x}<br><input type="number" step="any" id="f${i}-${j}" placeholder="Value"></label>`).join("")}<button class="btn primary" data-calc="${i}">Calculate</button></div><div class="result" id="result${i}"></div><p class="stat-foot">${f.hint}</p></article>`).join("")}</div><section class="panel" style="margin-top:22px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:18px"><div class="method-tag">INTERACTIVE LEARNING</div><h2 style="margin:7px 0">Pulse-Echo A-Scan Simulator</h2><p class="page-desc">Adjust reflector depth, sound velocity and echo amplitude to see how the A-scan changes. This is a simplified learning model, not inspection data.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:15px 0"><label style="font-size:12px;font-weight:700">Reflector depth <span id="simDepthVal">50 mm</span><input id="simDepth" type="range" min="10" max="100" step="5" value="50" style="display:block;width:100%;accent-color:var(--orange)"></label><label style="font-size:12px;font-weight:700">Sound velocity <span id="simVelVal">5,920 m/s</span><input id="simVel" type="range" min="3000" max="6400" step="40" value="5920" style="display:block;width:100%;accent-color:var(--orange)"></label><label style="font-size:12px;font-weight:700">Echo amplitude <span id="simAmpVal">80% FSH</span><input id="simAmp" type="range" min="20" max="100" step="5" value="80" style="display:block;width:100%;accent-color:var(--orange)"></label></div><div style="background:#21171c;border-radius:12px;padding:8px"><svg id="utSimSvg" viewBox="0 0 720 220" role="img" aria-label="Simplified ultrasonic A-scan" style="display:block;width:100%;height:auto"><rect x="40" y="16" width="660" height="170" fill="#21171c" stroke="#65434e"/><path d="M40 58H700 M40 100H700 M40 143H700 M205 16V186 M370 16V186 M535 16V186" stroke="#59414a" stroke-width="1"/><path id="utSimWave" d="" fill="none" stroke="#f4b183" stroke-width="2.5" stroke-linejoin="round"/><text x="40" y="207" fill="#f7e9ee" font-size="12">0 µs</text><text id="utSimEndLabel" x="700" y="207" fill="#f7e9ee" font-size="12" text-anchor="end">40 µs</text><text x="370" y="219" fill="#f7e9ee" font-size="11" text-anchor="middle">TIME OF FLIGHT (µs)</text></svg></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px;margin-top:12px"><div style="background:var(--paper);padding:10px;border-radius:9px"><div class="stat-foot">Round-trip TOF</div><strong id="simTof" style="color:var(--wine)">16.89 µs</strong></div><div style="background:var(--paper);padding:10px;border-radius:9px"><div class="stat-foot">Calculated depth</div><strong id="simCalcDepth" style="color:var(--wine)">50.0 mm</strong></div><div style="background:var(--paper);padding:10px;border-radius:9px"><div class="stat-foot">Echo amplitude</div><strong id="simCalcAmp" style="color:var(--wine)">80% FSH</strong></div></div><p class="stat-foot" style="margin-top:10px">Formula: depth = velocity × round-trip TOF ÷ 2. Real A-scans also depend on probe, gain, coupling, material and geometry.</p></section>`;document.querySelectorAll("[data-calc]").forEach(b=>b.onclick=()=>{const i=+b.dataset.calc,a=[0,1].map(j=>Number(document.getElementById("f"+i+"-"+j).value));const out=document.getElementById("result"+i);if(a.some(v=>!Number.isFinite(v))||a.some(v=>v<=0)){out.textContent="Enter two positive values.";return}out.textContent="Result: "+formulaData[i].calc(a)});const depth=document.getElementById("simDepth"),vel=document.getElementById("simVel"),amp=document.getElementById("simAmp");function updateSim(){const d=+depth.value,v=+vel.value,a=+amp.value,tof=2*d/v*1000;document.getElementById("simDepthVal").textContent=d+" mm";document.getElementById("simVelVal").textContent=v.toLocaleString()+" m/s";document.getElementById("simAmpVal").textContent=a+"% FSH";document.getElementById("simTof").textContent=tof.toFixed(2)+" µs";document.getElementById("simCalcDepth").textContent=d.toFixed(1)+" mm";document.getElementById("simCalcAmp").textContent=a+"% FSH";const end=Math.max(30,Math.ceil(tof*1.5/10)*10),x0=40,x1=700,base=186,peak=x0+tof/end*(x1-x0),h=a*1.35;document.getElementById("utSimEndLabel").textContent=end+" µs";document.getElementById("utSimWave").setAttribute("d",`M ${x0} ${base} L ${x0+8} ${base} L ${x0+12} ${base-75} L ${x0+16} ${base+5} L ${x0+20} ${base} L ${peak-12} ${base} L ${peak-5} ${base} L ${peak} ${base-h} L ${peak+5} ${base} L ${peak+12} ${base} L ${x1} ${base}`)}depth.oninput=updateSim;vel.oninput=updateSim;amp.oninput=updateSim;updateSim()}

<div class="about-ndt">
<section class="about-hero"><div><div class="about-kicker">KNOW THE SCIENCE • UNDERSTAND THE INDUSTRY</div><h1>About NDT &amp; NDE</h1><p>Non-Destructive Testing (NDT), also known as Non-Destructive Examination (NDE), evaluates materials, components and structures without damaging their future usefulness. It supports quality, reliability, maintenance and public safety.</p><p>Explore the history, methods, industrial applications, careers, certification and inspection scope.</p></div><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Ultrasonic_pipeline_test.jpg" alt="NDT technician performing phased array ultrasonic testing on a steel pipe weld" loading="lazy"></section>
<section class="about-section"><div class="about-kicker">01 / THE BASICS</div><h2>What are NDT and NDE?</h2><p>NDT uses sound, radiation, magnetism, capillary action, electrical conductivity and heat flow to detect or measure discontinuities while leaving the item fit for intended use. NDE is a closely related term emphasising examination and evaluation; terminology varies by industry and standard.</p><div class="about-grid">
<article class="about-card"><img src="https://www.weldqc.com/hs-fs/hubfs/WeldQC/AdobeStock_570930561.jpeg?name=AdobeStock_570930561.jpeg&width=2000" alt="Ultrasonic weld inspection" loading="lazy"><div><h3>Find hidden conditions</h3><p>Reveal surface and internal indications that may not be visible during ordinary visual examination.</p></div></article>
<article class="about-card"><img src="https://www.tuv.com/content-media-files/master-content/services/industrial-services/1176-tuv-rheinland-non-destructive-testing-of-welds/tuv-rheinland-non-destructive-testing-of-welds_core_1_5_1.jpg" alt="Industrial piping NDT" loading="lazy"><div><h3>Protect asset integrity</h3><p>Support manufacturing quality, in-service inspection, maintenance planning and repair decisions.</p></div></article>
<article class="about-card"><img src="https://www.hamadinspections.com/images/features/ndt.png" alt="Digital ultrasonic weld inspection" loading="lazy"><div><h3>Evidence-based decisions</h3><p>Results depend on competent people, calibrated equipment, procedures, traceability and acceptance criteria.</p></div></article></div></section>
<section class="about-section"><div class="about-kicker">02 / HISTORY &amp; EVOLUTION</div><h2>NDT: Past, present and future</h2><div class="about-timeline"><div class="about-era"><b>EARLY PRACTICE</b><p>Visual examination and oil-and-whiting / penetrant-style techniques helped reveal surface flaws in industrial and railway components.</p></div><div class="about-era"><b>EARLY 1900s – MID-CENTURY</b><p>X-ray discovery enabled industrial radiography. Ultrasonic, magnetic particle and penetrant methods matured into practical tools.</p></div><div class="about-era"><b>DIGITAL ERA</b><p>Digital radiography, PAUT, TOFD, encoded scanners and data storage improved inspection coverage and repeatability.</p></div><div class="about-era"><b>THE FUTURE</b><p>Robotic scanning, automation, advanced sensors, analytics and AI-assisted review are expanding capability. Expert judgement remains essential.</p></div></div><div class="about-links"><a href="https://isnt.in/about/genesis.php" target="_blank" rel="noopener">ISNT – Genesis of NDT</a><a href="https://www.asnt.org/standards-publications/blog/ndt-method-overview-visual-testing" target="_blank" rel="noopener">ASNT – NDT history</a><a href="https://www.asnt.org/what-is-nondestructive-testing/methods" target="_blank" rel="noopener">ASNT – Methods</a></div></section>
<section class="about-section"><div class="about-kicker">03 / METHODS</div><h2>Major NDT methods</h2><div class="about-methods about-method-gallery">
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Visual_inspection_of_compressor_blades-090108-F-9919G-746.jpg?width=720" alt="Visual inspection of compressor blades" loading="lazy"><b>VT – Visual Testing</b><span>Visual examination of surface condition, geometry, corrosion and visible weld features.</span><a href="https://www.google.com/search?tbm=isch&q=VT%20%E2%80%93%20Visual%20Testing%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://jororwxhjlijln5q-static.micyjz.com/cloud/loBpoKqilpSRkjnlnjqjiq/What-is-Penetrant-Testing1.jpg" alt="Liquid penetrant inspection procedure illustration" loading="lazy"><b>PT – Liquid Penetrant</b><span>Reveals surface-breaking discontinuities in non-porous materials.</span><a href="https://www.google.com/search?tbm=isch&q=PT%20%E2%80%93%20Liquid%20Penetrant%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://www.apecinspect.com.au/img/magnetic-particle-inspection-nondestructive-examination-ferromagnetic-materials.webp" alt="Magnetic particle inspection of cast component" loading="lazy"><b>MT – Magnetic Particle</b><span>Finds surface and near-surface flaws in ferromagnetic materials.</span><a href="https://www.google.com/search?tbm=isch&q=MT%20%E2%80%93%20Magnetic%20Particle%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://www.csmmuhendislik.com/images/radyografik/Radyografi%20film%20%C3%A7ekimi%202.JPEG" alt="Industrial radiography X-ray inspection room" loading="lazy"><b>RT – Radiographic Testing</b><span>Uses X-rays or gamma rays to create images of internal features.</span><a href="https://www.google.com/search?tbm=isch&q=RT%20%E2%80%93%20Radiographic%20Testing%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://media.licdn.com/dms/image/v2/D4E12AQGhB2PELiuppQ/article-cover_image-shrink_720_1280/B4EZxCq6GpG0AI-/0/1770645076370?e=2147483647&t=pxrYS4FiAEvBbypfoq0rJTeoRamz4-vXwzGRNu7rNkM&v=beta" alt="Technician performing nondestructive inspection" loading="lazy"><b>UT – Ultrasonic Testing</b><span>Uses high-frequency sound to inspect internal reflectors, thickness and welds.</span><a href="https://www.google.com/search?tbm=isch&q=UT%20%E2%80%93%20Ultrasonic%20Testing%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/TOFD-ManuallyGuidedSensors.jpg?width=1000" alt="Time of flight diffraction weld inspection diagram" loading="lazy"><b>TOFD</b><span>Uses diffracted signals from flaw tips for weld examination and sizing.</span><a href="https://www.google.com/search?tbm=isch&q=TOFD%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://www.twi-global.com/locations/south-east-asia/images/paut.jpg" alt="Ultrasonic pulse echo weld inspection schematic" loading="lazy"><b>PAUT – Phased Array UT</b><span>Electronically steers and focuses ultrasonic beams for encoded inspection imaging.</span><a href="https://www.asnt.org/what-is-nondestructive-testing/methods" target="_blank" rel="noopener">Method and image references</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/AB_EMAT.jpg?width=720" alt="Electromagnetic acoustic transducer equipment" loading="lazy"><b>ET – Eddy Current / Electromagnetic</b><span>Evaluates conductive materials, tubing and surface or near-surface flaws.</span><a href="https://www.google.com/search?tbm=isch&q=ET%20%E2%80%93%20Eddy%20Current%20%2F%20Electromagnetic%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Absolute_pressure_decay_schematics.png?width=720" alt="Pressure decay leak testing schematic" loading="lazy"><b>LT – Leak Testing</b><span>Detects leakage and evaluates leak rate using pressure, vacuum, tracer gas or other techniques.</span><a href="https://commons.wikimedia.org/wiki/Category:Nondestructive_testing" target="_blank" rel="noopener">Diagram reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/AE_event.jpg?width=720" alt="Acoustic emission signal event data" loading="lazy"><b>AE – Acoustic Emission</b><span>Monitors transient elastic waves generated by active damage mechanisms under load.</span><a href="https://commons.wikimedia.org/wiki/Category:Nondestructive_testing" target="_blank" rel="noopener">Data image reference</a></article>
<article class="about-method"><img src="https://dam-assets.fluke.com/s3fs-public/F-tis75plus_16a_c.jpg" alt="Infrared thermography inspection" loading="lazy"><b>IRT – Infrared Thermography</b><span>Uses thermal patterns to identify anomalies in components and structures.</span><a href="https://www.google.com/search?tbm=isch&q=IRT%20%E2%80%93%20Infrared%20Thermography%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Steinbichler_Intact_Tire-Testing.jpg?width=1000" alt="Shearography nondestructive testing" loading="lazy"><b>Shearography</b><span>Optical method for mapping deformation and detecting defects in composites and bonded structures.</span><a href="https://www.google.com/search?tbm=isch&q=Shearography%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/GWS_FTM_scan.jpg?width=720" alt="Guided wave inspection scan" loading="lazy"><b>Guided Wave Testing</b><span>Long-range screening of pipes and other structures using guided ultrasonic modes.</span><a href="https://www.google.com/search?tbm=isch&q=Guided%20Wave%20Testing%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/MFL_pipeline_NDT_diagram.gif?width=720" alt="Magnetic flux leakage pipeline inspection diagram" loading="lazy"><b>MFL – Magnetic Flux Leakage</b><span>Uses magnetic flux leakage signals to screen ferromagnetic components, including storage tank floors and pipelines.</span><a href="https://commons.wikimedia.org/wiki/Category:Nondestructive_testing" target="_blank" rel="noopener">Diagram reference</a></article>
</div></section>
<section class="about-section"><div class="about-kicker">04 / INDUSTRIAL SCOPE</div><h2>Where is NDT used?</h2><div class="about-grid">
<article class="about-card"><img src="https://images.unsplash.com/photo-1516937941344-00b4e0337589?auto=format&fit=crop&w=1200&q=85" alt="Ultrasonic pipe inspection" loading="lazy"><div><h3>Oil, gas &amp; petrochemical</h3><p>Pipeline welds, pressure vessels, storage tanks, corrosion mapping and refinery equipment.</p></div></article>
<article class="about-card"><img src="https://static.wixstatic.com/media/f278f7_d86b0b2f641b4986870b61319846c82b~mv2.jpeg/v1/fill/w_980%2Ch_735%2Cal_c%2Cq_85%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/f278f7_d86b0b2f641b4986870b61319846c82b~mv2.jpeg" alt="Advanced ultrasonic inspection" loading="lazy"><div><h3>Manufacturing &amp; heavy engineering</h3><p>Castings, forgings, weldments, machined parts and pressure equipment.</p></div></article>
<article class="about-card"><img src="https://irp.cdn-website.com/358e7c58/dms3rep/multi/Gemini_Generated_Image_j301cxj301cxj301.png" alt="NDT equipment in workshop" loading="lazy"><div><h3>Aerospace &amp; defence</h3><p>Aircraft structures, composites, bonded assemblies and turbine components.</p></div></article>
<article class="about-card"><img src="https://www.tuv.com/content-media-files/master-content/services/industrial-services/1176-tuv-rheinland-non-destructive-testing-of-welds/tuv-rheinland-non-destructive-testing-of-welds_core_1_5_1.jpg" alt="Power plant pipe inspection" loading="lazy"><div><h3>Power &amp; energy</h3><p>Boilers, turbines, heat exchangers, power-plant piping and renewable assets.</p></div></article>
<article class="about-card"><img src="https://www.hamadinspections.com/images/features/ndt.png" alt="Digital weld inspection" loading="lazy"><div><h3>Infrastructure &amp; transport</h3><p>Bridges, rail wheels and axles, metro systems, ships and lifting equipment.</p></div></article>
<article class="about-card"><img src="https://assets.onestopndt.com/p/uploads/ndt-articles/original/ndt-technician-ultrasonic-testing-free-certification%281%2920260615151057.png" alt="NDT technician training" loading="lazy"><div><h3>Training, labs &amp; R&amp;D</h3><p>Method development, reference standards, calibration, materials research and automation.</p></div></article></div><div class="about-links"><a href="https://www.asnt.org/what-is-nondestructive-testing/industries" target="_blank" rel="noopener">ASNT – Industry applications</a><a href="https://www.tcreng.com/services/non-destructive-testing/conventional-ndt/" target="_blank" rel="noopener">Inspection scope example</a><a href="https://nabcb.qci.org.in/prcb/pr-005/" target="_blank" rel="noopener">NABCB – India scope</a></div></section>
<section class="about-section"><div class="about-kicker">05 / CAREERS</div><h2>NDT jobs and career pathways</h2><p>NDT careers combine engineering knowledge, practical inspection skills, safety awareness, documentation and interpretation. Work may be site-based, workshop-based, laboratory-based or focused on technical support and system design.</p><div class="about-roles"><div class="about-role"><b>Trainee / Assistant</b><p>Learn safety, materials, equipment handling and calibration support under supervision.</p></div><div class="about-role"><b>Technician / Inspector</b><p>Perform assigned inspections, record indications and prepare reports within authorisation.</p></div><div class="about-role"><b>Level II / Specialist</b><p>Set up and conduct examinations, evaluate results within certified scope and guide others.</p></div><div class="about-role"><b>Level III / Technical Authority</b><p>Develop procedures, select methods, interpret codes and oversee NDT programmes.</p></div><div class="about-role"><b>Automation / Application Engineer</b><p>Integrate scanners, robots, probes, encoders and acquisition software.</p></div><div class="about-role"><b>Other directions</b><p>QA/QC, asset integrity, vendor inspection, training, consulting, technical sales and R&amp;D.</p></div></div><div class="about-links"><a href="https://www.asnt.org/what-is-nondestructive-testing/career-pathways" target="_blank" rel="noopener">ASNT – Career pathways</a><a href="https://nationalcareers.service.gov.uk/job-profiles/non-destructive-testing-technician" target="_blank" rel="noopener">NDT technician job profile</a><a href="https://in.indeed.com/q-ultrasonic-ndt-testing-jobs.html" target="_blank" rel="noopener">Search NDT jobs in India</a><a href="https://www.twi-global.com/locations/india/news-and-events/news/2026/advance-your-career-with-automated-ultrasonic-testing-aut" target="_blank" rel="noopener">Advanced UT / AUT training</a></div></section>
<section class="about-section"><div class="about-kicker">06 / CERTIFICATION</div><h2>NDT certification and qualification</h2><p>Personnel qualification is method-specific and may also be limited by product sector or technique. Routes differ by scheme and employer. Verify the certification body, standard, method, level, sector, validity and employer authorisation.</p><div class="about-grid"><article class="about-card"><div><h3>Level 1</h3><p>Performs defined inspections using approved instructions and supervision required by the scheme.</p></div></article><article class="about-card"><div><h3>Level 2</h3><p>Within certified scope, may set up equipment, conduct examinations, interpret and evaluate results and report.</p></div></article><article class="about-card"><div><h3>Level 3</h3><p>Provides technical authority within scope, including method selection, procedure validation and oversight.</p></div></article></div><div class="about-note"><b>Important:</b> This academy’s learning certificate is not an industrial personnel certification. Training, experience, vision, examinations and employer authorisation may apply. One certificate does not automatically authorise every sector or technique.</div><div class="about-links"><a href="https://www.iso.org/standard/75614.html" target="_blank" rel="noopener">ISO 9712:2021 – official standard</a><a href="https://www.asnt.org/certification" target="_blank" rel="noopener">ASNT certification</a><a href="https://nabcb.qci.org.in/prcb/pr-005/" target="_blank" rel="noopener">NABCB / QCI India</a><a href="https://www.bripc.org/?page_id=18139" target="_blank" rel="noopener">ISO 9712 scheme example</a></div></section>
<section class="about-section"><div class="about-kicker">07 / INSPECTION SCOPE</div><h2>What does an NDT scope include?</h2><div class="about-list"><ul><li><b>Method:</b> UT, PAUT, TOFD, RT, MT, PT, ET, VT, LT, AE, thermography or another defined method.</li><li><b>Product / material:</b> welds, castings, forgings, plates, bars, pipes, tubes, composites or components.</li><li><b>Technique:</b> straight beam, angle beam, immersion, encoded PAUT, film or digital radiography.</li><li><b>Objective:</b> flaw detection, thickness, corrosion mapping, lamination, bond inspection or condition monitoring.</li><li><b>Code and acceptance criteria:</b> governing standard, specification, procedure and acceptance level.</li><li><b>Practical boundaries:</b> access, surface condition, geometry, material, thickness, equipment, calibration and coverage.</li></ul></div></section>

<section class="about-section"><div class="about-kicker">09 / INSIDE AN INSPECTION</div><h2>How an NDT inspection is planned and performed</h2><p>A reliable inspection is a controlled engineering activity, not simply a test instrument reading. The method and technique must be selected for the component, expected damage mechanism, geometry, access and required detection capability.</p><div class="about-grid">
<article class="about-card"><div><h3>1. Review the requirement</h3><p>Identify the component, material, manufacturing history, service conditions, damage mechanisms, governing code, inspection extent and acceptance criteria.</p></div></article>
<article class="about-card"><div><h3>2. Select the method</h3><p>Choose one or more methods based on defect type, location, orientation, material, thickness, access, sensitivity and practical limitations.</p></div></article>
<article class="about-card"><div><h3>3. Prepare the component</h3><p>Confirm access, surface condition, temperature, cleanliness, isolation and safety controls. Record any restrictions that could affect coverage.</p></div></article>
<article class="about-card"><div><h3>4. Verify equipment</h3><p>Check instrument condition, probe or sensor, cables, software, reference standards, calibration status and essential settings before use.</p></div></article>
<article class="about-card"><div><h3>5. Perform the examination</h3><p>Follow the approved written procedure and scan plan. Maintain coverage, overlap, coupling or contact, scan speed and required sensitivity.</p></div></article>
<article class="about-card"><div><h3>6. Evaluate and report</h3><p>Review indications against the applicable acceptance criteria, document limitations and coverage, retain required data and issue a traceable report.</p></div></article>
</div></section>
<section class="about-section"><div class="about-kicker">10 / MATERIALS & DISCONTINUITIES</div><h2>What can NDT detect?</h2><p>NDT looks for discontinuities and condition changes. A discontinuity is not automatically a rejectable defect: its significance depends on type, size, orientation, location, service conditions and the governing acceptance criteria.</p><div class="about-grid">
<article class="about-card"><div><h3>Cracks</h3><p>Planar separations that may occur in welds, parent material, heat-affected zones, castings, forgings and in-service components. Orientation strongly affects detectability.</p></div></article>
<article class="about-card"><div><h3>Porosity & gas holes</h3><p>Rounded cavities formed by trapped gas or process conditions. Radiography is commonly useful; ultrasonic response depends on size, distribution and material.</p></div></article>
<article class="about-card"><div><h3>Slag & inclusions</h3><p>Non-metallic material trapped during manufacture. Shape, orientation and acoustic or radiographic contrast influence detection.</p></div></article>
<article class="about-card"><div><h3>Lack of fusion / penetration</h3><p>Weld discontinuities associated with incomplete joining or root penetration. Their planar geometry makes technique, beam angle and scan coverage important.</p></div></article>
<article class="about-card"><div><h3>Corrosion & erosion</h3><p>Wall thinning, pitting and local metal loss. Thickness UT, corrosion mapping, profile radiography and MFL may be used according to asset and geometry.</p></div></article>
<article class="about-card"><div><h3>Lamination & delamination</h3><p>Planar separations in rolled products or composite layers. Straight-beam UT, immersion C-scan, thermography or shearography may be selected.</p></div></article>
<article class="about-card"><div><h3>Bonding defects</h3><p>Disbonds, adhesive voids and weak bonds in bonded structures. Method selection depends on material stack-up, access, defect size and validation data.</p></div></article>
<article class="about-card"><div><h3>Fatigue & service damage</h3><p>Damage can initiate and grow under cyclic loading, vibration, temperature or corrosive environments. Risk-based inspection and trend monitoring help assess change.</p></div></article>
<article class="about-card"><div><h3>Dimensional & material changes</h3><p>Thickness, geometry, conductivity, hardness-related response, heat treatment and material mix-ups can be evaluated using suitable measurement methods.</p></div></article>
</div><div class="about-note"><b>Important distinction:</b> NDT reports observations and evaluations within a defined scope. Fitness-for-service and remaining-life decisions may require engineering assessment beyond the NDT result.</div></section>
<section class="about-section"><div class="about-kicker">11 / EQUIPMENT & REFERENCE STANDARDS</div><h2>Common NDT equipment and calibration items</h2><div class="about-list"><ul>
<li><b>Inspection instrument:</b> UT flaw detector, thickness gauge, PAUT unit, TOFD system, radiography source and detector, yoke, penetrant materials, eddy-current instrument, thermal camera or leak detector.</li>
<li><b>Probes and sensors:</b> straight-beam, angle-beam, dual-element, immersion, phased-array, TOFD, EMAT, eddy-current coils, AE sensors and infrared optics.</li>
<li><b>Reference blocks and standards:</b> blocks and test pieces selected for the method, material, geometry and procedure. Examples in UT include IIW/V1, V2 and material- or application-specific blocks; the correct block is determined by the governing procedure.</li>
<li><b>Accessories:</b> couplant, wedges, cables, scanners, encoders, fixtures, calibration shims, IQIs, densitometers, UV-A sources, field indicators and environmental monitors as applicable.</li>
<li><b>Calibration and verification:</b> establish instrument response and verify relevant parameters using traceable standards at the required intervals and after conditions that could invalidate settings.</li>
<li><b>Data integrity:</b> maintain equipment identification, software and setup details, calibration records, raw data, scan plans, image files and report revisions.</li>
</ul></div></section>
<section class="about-section"><div class="about-kicker">12 / SAFETY & QUALITY</div><h2>Safety, quality assurance and professional practice</h2><div class="about-grid">
<article class="about-card"><div><h3>Radiation protection</h3><p>Radiography requires controlled areas, trained authorised personnel, monitoring, warning systems, exposure controls and compliance with applicable radiation regulations.</p></div></article>
<article class="about-card"><div><h3>Electrical & mechanical safety</h3><p>Inspect cables and equipment, secure scanners, manage pinch points and moving robots, isolate machinery when required and follow site permit systems.</p></div></article>
<article class="about-card"><div><h3>Chemical & environmental safety</h3><p>Review safety data sheets for penetrants, cleaners, developers and couplants. Provide ventilation, PPE, spill controls and responsible waste handling.</p></div></article>
<article class="about-card"><div><h3>Working at height & confined spaces</h3><p>Use approved access systems, rescue plans, gas monitoring and permits. NDT competence does not replace task-specific safety training.</p></div></article>
<article class="about-card"><div><h3>Quality assurance</h3><p>Use approved procedures, qualified personnel, verified equipment, controlled documents, traceable records and independent review where required.</p></div></article>
<article class="about-card"><div><h3>Ethics & reporting</h3><p>Report actual findings accurately, identify limitations, avoid unsupported acceptance statements and escalate uncertain or out-of-scope conditions.</p></div></article>
</div></section>
<section class="about-section"><div class="about-kicker">13 / ADVANCED & AUTOMATED NDT</div><h2>Modern inspection technologies</h2><div class="about-grid">
<article class="about-card"><div><h3>Immersion & squirter UT</h3><p>Water provides acoustic coupling between the probe and component. Immersion systems scan in a water tank; squirter systems deliver a controlled water column to the surface. Encoders and motion systems create position-referenced C-scan data.</p></div></article>
<article class="about-card"><div><h3>Robotic inspection</h3><p>Industrial robots carry probes or scanners along programmed paths. Calibration of robot frames, tool centre point, part coordinates, encoder synchronisation and collision-safe paths are essential.</p></div></article>
<article class="about-card"><div><h3>Composite inspection</h3><p>Composite laminates, sandwich panels, bonded joints and honeycomb structures may require UT, immersion C-scan, thermography, shearography or other validated techniques.</p></div></article>
<article class="about-card"><div><h3>Digital radiography</h3><p>Digital detector arrays and computed radiography can reduce film handling and support image processing, archiving and electronic review. Image quality and technique requirements still apply.</p></div></article>
<article class="about-card"><div><h3>Encoded data & C-scan</h3><p>Position-synchronised acquisition maps signal features across a surface. Data quality depends on calibration, encoder accuracy, scan pitch, coupling, sampling and coverage.</p></div></article>
<article class="about-card"><div><h3>AI-assisted analysis</h3><p>Machine learning may assist image sorting, anomaly highlighting and repeatable data review. It must be validated for the application and cannot independently replace qualified evaluation or acceptance criteria.</p></div></article>
</div></section>
<section class="about-section"><div class="about-kicker">14 / CAREER DEVELOPMENT</div><h2>Skills to build for a successful NDT career</h2><div class="about-list"><ul>
<li><b>Engineering foundation:</b> materials, manufacturing processes, welding, metallurgy, mechanics, corrosion and basic mathematics.</li>
<li><b>Method knowledge:</b> physics and principles of each method, equipment controls, probes, calibration, sensitivity, limitations and common false calls.</li>
<li><b>Practical ability:</b> surface preparation, safe equipment handling, systematic scanning, reference block use, data acquisition and repeatability.</li>
<li><b>Interpretation:</b> understand indications, discontinuity morphology, signal behaviour, imaging, sizing uncertainty and acceptance criteria.</li>
<li><b>Documentation:</b> write clear reports, sketches, scan plans, calibration records, traceability details and non-conformance observations.</li>
<li><b>Professional skills:</b> communication, teamwork, site discipline, problem-solving, digital literacy and continuous learning.</li>
<li><b>Specialisation options:</b> weld inspection, pressure equipment, aerospace composites, rail, corrosion monitoring, automated UT, PAUT/TOFD, radiography or NDT systems engineering.</li>
</ul></div></section>
<section class="about-section"><div class="about-kicker">15 / HOW TO CHOOSE A METHOD</div><h2>Method selection: practical comparison</h2><div class="about-list"><p>No single NDT method detects every discontinuity in every material. A method must be selected and demonstrated for the intended application.</p><ul>
<li><b>Surface-breaking flaws:</b> VT, PT or MT (MT only for ferromagnetic materials); ET may be suitable for conductive materials.</li>
<li><b>Internal planar flaws:</b> UT, PAUT or TOFD may be effective when beam direction and access are suitable; RT may complement them.</li>
<li><b>Volumetric flaws:</b> RT and UT can be used depending on material, geometry, flaw morphology and code requirements.</li>
<li><b>Wall thickness / corrosion:</b> conventional UT, corrosion mapping, profile radiography or MFL may be suitable.</li>
<li><b>Composite delamination / disbond:</b> UT, immersion C-scan, thermography or shearography may be selected after application-specific validation.</li>
<li><b>Leakage:</b> use a leak test suited to the fluid, pressure, component volume and required leak-rate sensitivity.</li>
<li><b>Active damage under load:</b> AE can monitor activity, often with targeted follow-up NDT to characterise the source.</li>
</ul></div></section>
<section class="about-section"><div class="about-kicker">08 / REFERENCE LIBRARY</div><h2>Trusted NDT resources</h2><div class="about-list"><p>These independent organisations and technical resources support further learning.</p><div class="about-links"><a href="https://www.asnt.org/" target="_blank" rel="noopener">ASNT</a><a href="https://isnt.in/" target="_blank" rel="noopener">Indian Society for NDT</a><a href="https://www.iso.org/" target="_blank" rel="noopener">ISO</a><a href="https://nabcb.qci.org.in/" target="_blank" rel="noopener">NABCB / QCI India</a><a href="https://www.twi-global.com/" target="_blank" rel="noopener">TWI</a><a href="https://www.nde-ed.org/" target="_blank" rel="noopener">NDE-Ed</a><a href="https://www.asme.org/" target="_blank" rel="noopener">ASME</a><a href="https://www.astm.org/" target="_blank" rel="noopener">ASTM International</a></div><p class="about-small">Image references: DSPAUT, WeldQC, TÜV Rheinland, Hamad Inspections, Armor NDT and OneStopNDT. Images are externally hosted; availability and usage rights are controlled by their respective websites.</p></div></section>

const aboutDetailText={"VT – Visual Testing":"VT is the first-line examination method. Inspectors assess surface condition, weld profile, alignment, corrosion, deformation and visible discontinuities. Good lighting, access, surface cleanliness, viewing distance and calibrated gauges matter.","PT – Liquid Penetrant":"PT reveals discontinuities open to the surface in clean, non-porous materials. The sequence is pre-cleaning, penetrant application, dwell, excess penetrant removal, developer application and interpretation. It cannot reveal defects that do not break the surface.","MT – Magnetic Particle":"MT is for ferromagnetic materials. The component is magnetised and particles gather at leakage fields created by surface or near-surface discontinuities. Select suitable magnetisation directions and adequate field strength; demagnetisation and post-cleaning may be required.","RT – Radiographic Testing":"RT passes X-rays or gamma rays through a component onto a detector or film. Differences in thickness and density create image contrast. Technique selection, exposure, image quality indicators, geometric unsharpness and radiation safety are essential.","UT – Ultrasonic Testing":"Conventional UT sends high-frequency sound into a component and evaluates reflected signals. A pulse-echo setup includes a probe, couplant, instrument, calibration/reference block and scan plan. UT is used for thickness measurement, weld examination, laminations and internal discontinuities. Geometry, material structure and beam direction affect detectability.","TOFD":"Time of Flight Diffraction uses diffracted waves from discontinuity tips. A transmitter and receiver are commonly placed on opposite sides of a weld. Signal timing supports height sizing and through-wall position assessment. Near-surface dead zones and orientation effects need consideration.","PAUT – Phased Array UT":"A phased-array probe contains multiple elements pulsed with controlled time delays. Electronic steering and focusing create multiple beam angles. Encoded scans can produce sectorial and linear data views. Calibration, wedge delay, sensitivity, coverage and scan index must follow the procedure.","ET – Eddy Current / Electromagnetic":"ET uses an alternating magnetic field to induce currents in conductive materials. Cracks, conductivity changes, lift-off and thickness variations alter the probe response. Applications include tubing, surface crack detection and material sorting.","LT – Leak Testing":"LT checks whether a component or system allows fluid or gas to escape. Methods include pressure decay, vacuum box, bubble testing, tracer gas and mass spectrometry. Select a method based on sensitivity, test volume, pressure, safety and acceptable leak rate.","AE – Acoustic Emission":"AE detects transient elastic waves released by active sources such as crack growth, fibre breakage or friction under stress. Sensors are coupled to the structure and signals are evaluated during loading or operation. Follow-up examination may be needed to characterise a source.","IRT – Infrared Thermography":"IRT measures emitted infrared energy and converts it into a temperature map. Active thermography applies external heating or cooling; passive thermography observes naturally occurring temperature patterns. Emissivity, reflections and environmental conditions influence interpretation.","Shearography":"Shearography is a laser-based optical method that measures surface strain or displacement gradients, often while a component is stressed by heat, vacuum or mechanical loading. Defects such as disbonds and delaminations can disturb the strain pattern.","Guided Wave Testing":"Guided waves travel along a structure and interact with corrosion, wall loss, supports and welds. Transducer rings can screen long lengths of pipe from one location. It is generally a screening method; indications usually require local follow-up inspection.","MFL – Magnetic Flux Leakage":"MFL magnetises a ferromagnetic component close to saturation. Metal loss disturbs the magnetic field and leakage sensors detect the change. It is used for tank floors and pipelines; lift-off, magnetisation and scan speed affect results.","Level 1":"A Level 1 person works to written instructions and under required supervision. Typical duties include equipment checks, calibration checks, carrying out the test and recording results. Evaluation and reporting authority are limited by the scheme and employer authorisation.","Level 2":"A Level 2 person is generally qualified to set up and calibrate equipment, perform and supervise testing, interpret and evaluate results, and report them within the certified method and sector scope.","Level 3":"A Level 3 person has the highest technical responsibility within the certified scope. Duties may include selecting methods, establishing and validating procedures, interpreting codes and standards, and overseeing NDT programmes.","EARLY PRACTICE":"Before modern instruments, inspection relied heavily on visual examination and simple surface-revealing techniques. The need to find hidden defects without destroying parts drove the development of scientific NDT methods.","EARLY 1900s – MID-CENTURY":"The discovery of X-rays enabled radiographic examination. Ultrasonic methods developed from early acoustic and sonar research, while magnetic particle and penetrant testing became practical industrial methods.","DIGITAL ERA":"Digital detectors, phased-array electronics, TOFD, encoded scanners and computerised data analysis improved inspection coverage, storage and review. Modern inspections increasingly retain traceable digital records.","THE FUTURE":"Robotics, automated scanning, advanced sensors, digital twins and machine-learning-assisted analysis are expanding inspection capability. Procedure control, validation, data quality and qualified human judgement remain essential."};

 const rich={
 "VT – Visual Testing":[
 ["Definition","Visual testing is the direct or remote examination of a component using the unaided eye or optical aids. It is often the first inspection step and can reveal conditions that guide the selection of other NDT methods."],
 ["Principle and technique","The inspector observes surface features under suitable illumination and viewing conditions. Direct VT uses line-of-sight access; remote VT may use mirrors, borescopes, cameras or robotic vision. Inspection aids can include weld gauges, pit-depth gauges, magnifiers and reference photographs."],
 ["Typical workflow","Review drawings and acceptance criteria; clean the inspection area; confirm lighting, access and viewing distance; inspect systematically; measure relevant features; record locations and evidence; compare results with the specified criteria."],
 ["Applications","Weld fit-up and profile, corrosion, pitting, deformation, leaks, coating condition, casting surface condition, machinery condition and general in-service examinations."],
 ["Strengths and limitations","VT is fast, low-cost and widely applicable, but it cannot reveal hidden internal flaws and is limited by access, lighting, surface cleanliness, eyesight and viewing angle."],

 "PT – Liquid Penetrant":[
 ["Definition","Liquid penetrant testing detects discontinuities that are open to the surface of non-porous materials. It is based on capillary action drawing a low-viscosity liquid into a surface-breaking opening."],
 ["Principle and materials","The penetrant enters a surface-connected discontinuity during dwell. After controlled removal of excess penetrant, developer draws penetrant back to the surface and creates an indication. Systems may be visible-colour or fluorescent; water-washable, post-emulsifiable or solvent-removable."],
 ["Typical workflow","Pre-clean and dry; verify product and temperature requirements; apply penetrant; allow specified dwell; remove excess without flushing penetrant from flaws; dry if required; apply developer; observe within the specified development time; interpret, record and post-clean."],
 ["Applications","Weld toes and caps, castings, forgings, machined parts, non-ferromagnetic alloys and other non-porous components where surface-breaking flaws are relevant."],
 ["Strengths and limitations","PT can reveal very fine surface openings over complex shapes, but cannot detect subsurface flaws. Porous or dirty surfaces, poor cleaning, excessive removal, unsuitable temperature and rough surfaces can cause unreliable results."],
 ["Quality and reporting","Control dwell and development times, consumable batch and expiry, surface temperature, lighting or UV-A conditions, background contamination and process checks. Record indication location, type, size and evaluation against the specified criteria."]
 ],
 "MT – Magnetic Particle":[
 ["Definition","Magnetic particle testing detects surface and near-surface discontinuities in ferromagnetic materials by observing magnetic flux leakage."],
 ["Principle","When a ferromagnetic part is magnetised, a discontinuity that interrupts the magnetic path causes leakage flux. Applied dry powder or wet suspension particles gather at this leakage field and form a visible or fluorescent indication."],
 ["Magnetisation techniques","Common approaches include yokes, prods, coils, central conductors and bench units. Field direction is critical: a flaw is most readily detected when it lies approximately transverse to the magnetic field. Two approximately perpendicular magnetisation directions may be required."],
 ["Typical workflow","Prepare the surface; select particles and technique; verify equipment and field adequacy; magnetise and apply particles using the specified continuous or residual method; inspect under suitable white or UV-A light; interpret; demagnetise and post-clean where required."],
 ["Applications","Welds, forgings, castings, rails, shafts, gears and other ferromagnetic components. It is not suitable for aluminium, austenitic stainless steel and other non-ferromagnetic materials."],
 ["Limitations and quality","Coatings, rough surfaces, geometry, residual magnetism and inadequate field strength can mask or distort indications. Verify field direction and adequacy using approved indicators and document the technique and examination coverage."]
 ],
 "RT – Radiographic Testing":[
 ["Definition","Radiographic testing creates an image from radiation transmitted through an object. Variations in material thickness, density and composition change the radiation reaching film or a digital detector."],
 ["Principle and image formation","An X-ray generator or gamma source emits ionising radiation. The component attenuates the beam; the detector records a two-dimensional projection. Discontinuity visibility depends on orientation to the beam, thickness change, contrast, scatter and geometric unsharpness."],
 ["Equipment and technique","Typical equipment includes an X-ray set or sealed gamma source, film or digital detector, image quality indicators, identification markers, collimation and exposure controls. Technique design considers source-to-object and object-to-detector distances, exposure, material thickness and required image quality."],
 ["Typical workflow","Review the code and technique sheet; establish a controlled radiation area; position source, object, detector and IQI; expose; process or acquire the image; verify image quality; interpret; archive and report."],
 ["Applications","Welds, castings, pressure equipment, aerospace components, pipelines and manufactured parts where volumetric imaging is appropriate."],
 ["Safety and limitations","Ionising radiation presents serious hazards. Only authorised, trained personnel should conduct radiography under applicable regulations and radiation protection arrangements. Planar flaws parallel to the beam may be difficult to detect; access, thickness, geometry and radiation controls can constrain use."]
 ],
 "UT – Ultrasonic Testing":[
 ["Definition","Conventional ultrasonic testing uses high-frequency mechanical waves to examine material. In pulse-echo testing, the probe transmits a pulse and receives reflections from interfaces, discontinuities or the back wall."],
 ["Core physics","Sound velocity, frequency and wavelength are related by v = f × λ. Reflection occurs at acoustic-impedance boundaries. Beam behaviour includes reflection, refraction, mode conversion, attenuation, near field, beam spread and diffraction."],
 ["Equipment","A typical system includes a flaw detector, piezoelectric probe, cable, couplant, reference/calibration block and examination procedure. Probes may be straight-beam, angle-beam, dual-element or immersion types. Selection depends on material, geometry, frequency and target discontinuity."],
 ["Calibration and scanning","Verify range, zero or probe delay, sensitivity and relevant transfer corrections using suitable reference reflectors. For angle-beam work, verify wedge and refracted angle. Scan with the required overlap, index, direction and coverage; maintain coupling and monitor instrument settings."],
 ["Applications","Thickness measurement, weld examination, plate and billet testing, corrosion mapping, forgings, castings, rails and composite laminates."],
 ["Interpretation and limitations","Signal amplitude and time-of-flight are affected by flaw size, orientation, surface condition, geometry, attenuation and coupling. UT is highly useful for planar flaws but requires skill and suitable access; coarse-grained or complex materials can challenge inspection."]
 ],
 "TOFD":[
 ["Definition","Time of Flight Diffraction is an ultrasonic weld examination technique that uses diffracted signals from the tips of a discontinuity to estimate its through-wall position and height."],
 ["Probe arrangement and signals","A transmitter and receiver are commonly placed on opposite sides of a weld. The lateral wave travels near the surface, the back-wall signal reflects from the far surface, and flaw-tip diffraction signals occur between them. Time-of-flight is converted to position using the sound path and calibrated velocity."],
 ["Procedure and calibration","Set probe separation, probe centre spacing, scan index and range according to the technique. Calibrate time base and velocity, verify probe characteristics and scan position, then acquire encoded data with consistent coupling and coverage."],
 ["Applications","Weld inspection and sizing, especially where reliable through-wall height estimation and permanent encoded records are needed."],
 ["Limitations","Near-surface and back-wall dead zones, geometry, coarse-grained material, poor coupling and complex weld profiles can affect detection. Complementary techniques such as pulse-echo or PAUT may be needed."]
 ],
 "PAUT – Phased Array UT":[
 ["Definition","Phased array ultrasonic testing uses a probe containing multiple individually controlled elements. Electronic timing delays create and steer ultrasonic beams at selected angles and focal laws."],
 ["How it works","The instrument applies programmed delays to each element. The wavefront can be steered, focused and swept through a range of angles. Data may be displayed as A-scan, S-scan/sectorial, E-scan/linear or encoded C-scan views, depending on system and setup."],
 ["System components","Phased-array instrument, array probe, wedge or immersion arrangement, encoder or scanner, calibration blocks, couplant and analysis software. Element count, pitch, frequency, aperture, wedge and focal laws influence coverage."],
 ["Procedure essentials","Verify probe and wedge identification, element condition, wedge delay, refracted angle, sensitivity, range, focal laws, scan plan, encoder calibration and coverage. Acquire data using the qualified procedure and retain raw encoded files."],
 ["Applications","Welds, pressure equipment, pipelines, corrosion mapping, complex components and automated inspection of aerospace structures."],
 ["Limitations","PAUT does not automatically guarantee complete coverage. Shadowing, geometry, poor coupling, incorrect focal laws, element failure, calibration errors and unsuitable scan plans can create missed or misleading indications."]
 ],
 "ET – Eddy Current / Electromagnetic":[
 ["Definition","Eddy current testing uses electromagnetic induction to examine electrically conductive materials without direct electrical contact."],
 ["Principle","Alternating current in a probe coil creates a changing magnetic field, inducing circulating currents in the test material. Discontinuities and changes in conductivity, permeability, thickness or probe lift-off alter coil impedance."],
 ["Equipment and variables","The system includes an eddy-current instrument, probe or coil, reference standards and suitable fixtures. Frequency, coil design, phase, gain, filters, fill factor and lift-off compensation influence response."],
 ["Applications","Heat-exchanger tubing, aircraft structures, surface crack detection, conductivity and alloy sorting, coating thickness and near-surface examination."],
 ["Limitations and quality","ET is limited to conductive materials and is sensitive to lift-off, edges, geometry, permeability and surface condition. Reference standards should represent the material, geometry and target flaw; probe handling and scan speed must be controlled."]
 ],
 "LT – Leak Testing":[
 ["Definition","Leak testing determines whether gas or liquid passes through a boundary and, where required, measures the leak rate."],
 ["Methods","Common methods include bubble testing, pressure or vacuum decay, hydrostatic or pneumatic pressure tests, tracer gas and helium mass spectrometry. Method selection depends on sensitivity, volume, fluid, pressure and test configuration."],
 ["Procedure","Define allowable leak rate and test boundary; assess hazards; isolate and prepare the system; select and verify the instrument; stabilise pressure or vacuum; perform the test; account for temperature and background effects; record the result."],
 ["Applications and limitations","Pressure vessels, piping, valves, heat exchangers, vacuum systems, fuel systems and sealed components. Temperature drift, permeation, trapped gas, outgassing and poor connections can cause false results."]
 ],
 "AE – Acoustic Emission":[
 ["Definition","Acoustic emission monitoring detects transient elastic waves generated by active changes in a material, such as crack growth, fibre breakage, corrosion activity or friction."],
 ["System and principle","Piezoelectric sensors are coupled to the structure. Preamplifiers and acquisition electronics record transient waveforms and features such as amplitude, counts, energy, duration and arrival time. Multiple sensors can support source location."],
 ["Typical use","AE is often performed while a structure is loaded, pressurised or operating so active sources can be detected. Sensor placement, coupling, threshold, noise discrimination and loading sequence are planned before testing."],
 ["Applications and limitations","Pressure vessels, tanks, composite structures, bridges and process equipment. AE is generally a global monitoring or screening method; it does not by itself provide a complete defect map or definitive flaw sizing. Follow-up NDT may be required."]

 "IRT – Infrared Thermography":[

 ["Equipment and controls","Thermal camera, suitable lens, controlled stimulus for active testing, calibration references and analysis software. Emissivity, reflected apparent temperature, distance, angle, focus, wind and surface finish influence readings."],
 ["Applications and limitations","Electrical and mechanical condition monitoring, building envelopes, composite inspection and process monitoring. Thermal contrast does not uniquely identify a defect; confirmation and application-specific validation may be necessary."]
 ],
 "Shearography":[

 ["Principle and workflow","A coherent laser illuminates the surface and an imaging system records a speckle pattern. Images taken before and during controlled stressing are compared to produce fringe patterns. Local strain anomalies may indicate disbonds, delaminations or other structural changes."],
 ["Applications","Composite panels, honeycomb structures, bonded repairs, tyres and large-area aerospace components."],
 ["Limitations","The component must be stressed appropriately and safely. Vibration, surface reflectivity, environmental disturbance and complex geometry affect results. Indications require interpretation and validated acceptance criteria."]
 ],
 "Guided Wave Testing":[
 ["Definition","Guided wave testing uses waves that propagate along a structure, such as a pipe wall, allowing long lengths to be screened from a limited number of test locations."],
 ["Principle and equipment","A transducer collar excites selected wave modes. Reflections occur at changes in cross-section, supports, welds, corrosion and other features. Signal amplitude and time-of-flight help locate changes along the structure."],
