{p:["Acoustic emission testing is a passive NDT method that listens for transient elastic waves released by active sources in a material or structure. Sources can include crack growth, plastic deformation, fibre breakage, friction, leakage and other rapid energy releases. Sensors attached to the structure detect these waves while the component is loaded or operating.","AE differs from methods that actively send energy into a part. The structure itself generates the measured event. A quiet structure may contain a dormant flaw that produces no AE during the test, so absence of activity does not prove absence of damage. AE is most useful when the inspection can stimulate or observe sources that are active under defined conditions.","A typical AE system contains sensors, couplant, preamplifiers, cables, acquisition channels, threshold and filtering controls, timing, source-location algorithms and data-analysis software. A successful examination requires a defined loading plan, sensor placement, noise control, system checks and trained interpretation."],focus:["AE listens for active events rather than imaging every static flaw.","Understand the loading condition and source activity.","Use AE as part of a defined monitoring plan and complementary NDT strategy."],example:"During a controlled pressure test, a pressure vessel may generate AE when local material processes become active. Event locations and trends identify regions for follow-up examination; AE activity alone is not an automatic reject decision."},
{p:["AE waves propagate through the component from a sudden energy-release source. The wave may contain different modes and frequencies and is altered by attenuation, reflections, boundaries, joints and geometry. Sensor arrival times are compared to estimate where the source occurred, using a known or measured wave velocity and the geometry of the sensor array.","Source mechanisms influence signal characteristics, but no single feature uniquely identifies a crack. Crack growth, friction, leakage and mechanical impacts can generate overlapping waveform features. Material microstructure, thickness, propagation distance and sensor frequency response also influence the signal.","A location algorithm assumes a propagation model. In a simple plate, arrival-time differences between sensors may be used for planar location. In complex structures, wave velocity may vary by direction and mode, requiring a suitable calibration or more advanced location technique."],focus:["Wave mode, attenuation and boundaries influence the detected signal.","Arrival-time differences support source location.","Material and geometry must be included in the location model."],example:"If one sensor detects an event earlier than two others, the differences in arrival time constrain the source region. The location estimate is only as reliable as sensor positions, wave-speed assumptions and signal picking."},
{p:["AE sensors are commonly piezoelectric devices selected for a frequency range and sensitivity. The sensor is coupled to the structure using an approved couplant and held with suitable mounting hardware. A preamplifier placed near the sensor can improve signal transmission over long cable runs by strengthening the signal before further processing.","System channels may include filters, threshold detection, waveform digitisation, hit timing and parameter extraction. The threshold determines which signals are recorded; setting it too low increases noise, while setting it too high can miss weak events. Filters should be selected to reduce known noise without removing important signal content.","Before the examination, sensor channels are checked using a controlled source or approved verification method. Confirm channel response, sensor mounting, cable integrity, preamplifier settings and acquisition timing. A poor sensor bond or cable fault may appear as a quiet region and create a false impression of no activity."],focus:["Select sensor frequency and mounting for the component.","Understand preamplifier, filters, threshold and digitisation.","Verify every channel and sensor location before loading."],example:"A controlled pencil-lead break on the surface near a sensor can be used as a repeatable system check in appropriate procedures. The response verifies a portion of the sensor and channel path but does not replace all calibration requirements."},
{p:["Sensor location is planned so that the required examination region is covered by enough sensors and the wave can reach those sensors with adequate signal-to-noise. Sensor spacing depends on material attenuation, thickness, joints, geometry, source energy and the required location accuracy. A wave that crosses welds, stiffeners or complex boundaries may attenuate or change mode.","Location zones may be established by grouping sensors into coverage areas. Guard sensors can help identify activity outside the intended zone. Sensor mounting positions should be recorded on a drawing or photograph and checked against the actual component. The test plan should include expected loading, background noise and sensor verification.","AE monitoring often combines time, pressure, load or temperature with detected events. The operating condition must be synchronised with AE data; otherwise activity cannot be related reliably to the applied load or service event."],focus:["Plan sensor spacing based on attenuation and geometry.","Map sensor coordinates and verify coverage.","Synchronise AE records with load or operating parameters."],example:"A tank shell monitoring plan may place sensors around the circumference and at selected heights. A source location is then calculated within the mapped sensor zone, subject to the wall's wave-propagation model."},
{p:["AE systems record waveform parameters such as amplitude, rise time, duration, counts, energy, signal strength and frequency content. A hit is a threshold-crossing signal on a channel; an event groups related hits that may originate from one source. The terminology and algorithms vary by system and procedure, so the user must know how the instrument defines each quantity.","Amplitude is the maximum signal level and is commonly reported in decibels relative to a reference. Rise time is the interval from first threshold crossing to peak amplitude. Duration is the time between first and last threshold crossings. Counts are threshold crossings. Energy or signal strength is an instrument-defined measure of signal content and should be interpreted using the system's convention.","Interpretation considers trends, source location, event rate, amplitude, energy and relationship to load. Clustered activity at increasing load may be more significant than isolated events at constant load, but friction, leakage, impacts and electrical noise can mimic structural activity. Use background monitoring, guard sensors and waveform review."],focus:["Know how the instrument defines hits, events, counts and energy.","Trend activity against load and time, not a single parameter alone.","Differentiate structural sources from noise and mechanical activity."],example:"If event activity increases sharply only after a new load level is reached and remains localised, the region may require investigation. A sudden cluster caused by a loose cable or rubbing fixture must be ruled out before structural conclusions are made."},
{p:["AE applications include proof testing and monitoring of pressure vessels, storage tanks, composite structures, pipelines and other components where active damage or deformation may occur. The method can monitor large structures from a distributed sensor system, but it does not provide a direct visual image of the discontinuity.","The examination procedure defines loading rate, hold periods, background recording, sensor layout, source checks, data evaluation and reporting. A test that does not adequately stimulate the relevant damage mechanism may produce little useful activity. Load history and service conditions should be considered when comparing one test with another.","AE findings are commonly followed by localised NDT such as UT, PAUT, TOFD, RT or visual examination to characterise the region. Report activity, location accuracy, load condition, sensor coverage, noise and limitations. Engineering acceptance decisions require the applicable code and responsible assessment."],focus:["AE suitability depends on an active source during the monitoring window.","Use a controlled loading / monitoring plan and background checks.","Follow-up NDT is often needed to characterise a source."],example:"A composite pressure vessel may be monitored during a proof test. AE activity can identify areas requiring follow-up ultrasonic inspection, but it does not by itself determine the size or acceptability of a delamination."}

{p:["Infrared thermography measures infrared radiance from a surface and converts the measurement into a thermal image. In NDT, defects are detected when they change the way heat flows through a component or when a local region has different thermal properties. The technique may use naturally occurring temperature differences or an applied heating or cooling stimulus.","A thermogram is not a direct photograph of internal damage. It shows apparent surface temperature or radiance distribution. An internal disbond, delamination, void or corrosion region may influence the surface temperature pattern, but detectability depends on defect depth, size, thermal contrast, material diffusivity, excitation and observation time.","Thermography is used for composites, electrical systems, buildings, process equipment and condition monitoring. Method selection should identify whether the goal is qualitative detection, comparative assessment or quantitative temperature measurement. Quantitative claims require control of emissivity, reflected temperature, camera calibration and environmental effects."],focus:["A thermal image shows surface response to heat flow.","Distinguish passive from active inspection.","Defect detectability depends on thermal contrast and timing."],example:"A shallow disbond in a composite panel can interrupt heat flow during a controlled heat pulse and create a different cooling curve compared with a sound region."},
{p:["Heat transfer occurs through conduction, convection and radiation. Conduction moves heat through the material; convection exchanges heat between a surface and surrounding fluid; radiation transfers energy electromagnetically. A defect can reduce or redirect heat conduction and create a surface temperature difference that a camera detects.","Thermal diffusivity describes how quickly a temperature disturbance spreads through a material and is related to thermal conductivity, density and specific heat. A high-diffusivity material responds differently from a low-diffusivity material. Defect depth and size influence how quickly the thermal contrast appears and disappears at the surface.","Emissivity is the ratio of radiation emitted by a real surface compared with an ideal blackbody at the same temperature. Low-emissivity reflective surfaces can reflect surrounding hot or cold objects, causing misleading apparent temperatures. Camera settings and measurement geometry must account for emissivity and reflected apparent temperature."],focus:["Separate conduction, convection and radiation.","Understand thermal diffusivity and transient heat flow.","Emissivity and reflected radiation affect temperature measurement."],example:"A polished metal surface can reflect a nearby hot lamp and appear warmer than it actually is. Changing the viewing angle or using a suitable surface reference can help identify a reflection artefact."},
{p:["An infrared camera contains an optical system and detector that measure infrared radiance over a field of view. Important specifications include detector resolution, thermal sensitivity, spectral band, temperature range, frame rate, lens and focus distance. The appropriate camera must resolve the expected defect size at the planned inspection distance.","Before measuring temperature, set or verify emissivity, reflected apparent temperature, distance, atmospheric parameters and focus. A thermal image should include a suitable reference region and environmental record. The camera may require calibration checks and stable thermal conditions according to the manufacturer's guidance and procedure.","An active thermography setup may use lamps, flash, hot air, induction or another controlled energy source. The excitation should be safe and sufficiently uniform for the component. Record the energy input, duration, camera timing and environmental conditions so that results can be compared and reproduced."],focus:["Choose detector and lens resolution for the required defect size.","Focus and set emissivity and reflected temperature deliberately.","Control and document active heating conditions."],example:"A high-resolution camera at a long working distance may not resolve a small composite defect because each pixel covers too large an area. Moving closer or selecting a suitable lens improves spatial sampling."},
{p:["Passive thermography observes naturally occurring temperature differences, such as hot electrical connections, frictional heating, process temperature patterns or in-service thermal gradients. It does not require external heating, but the inspector must understand the operating state and normal thermal behaviour of the system.","Active thermography applies a controlled thermal stimulus and records how the surface heats or cools. Common approaches include pulsed thermography, step heating, lock-in thermography and other modulated methods. Each technique uses a different excitation and analysis approach, and the suitable method depends on the material, thickness, defect depth and inspection time.","Active methods often rely on a time sequence rather than a single image. The thermal contrast can appear, reach a maximum and then fade. The correct acquisition window is important: imaging too early or too late may hide a defect response. The excitation method must not damage or overheat the component."],focus:["Passive methods observe service or natural temperature fields.","Active methods apply heat or cooling and observe transient response.","Choose acquisition timing based on expected heat-flow behaviour."],example:"Pulsed thermography applies a short heat pulse to a composite panel and records the cooling sequence. A shallow disbond may appear as a different cooling rate during a particular time window."},
{p:["Thermogram interpretation begins by checking focus, image scale, emissivity, reflections, uniformity of excitation and environmental conditions. Compare suspect regions with sound reference regions and consider the expected heat-flow pattern. A temperature contrast can result from a defect, but also from surface coating, thickness variation, emissivity, moisture, reflections or airflow.","Time-series methods examine how each pixel or region changes over time. A defect may produce a different heating or cooling slope, phase delay or thermal contrast decay. Data processing can help highlight these differences, but algorithms must be selected and validated for the application. False colour palettes do not change the underlying measurement.","Findings should be repeated or confirmed where possible and reported with the camera settings, excitation conditions, timing, region of interest and limitations. When the goal is defect sizing or depth estimation, use a validated model or reference specimen representing the material and defect geometry."],focus:["Check artefacts before calling a thermal indication.","Use time history and sound reference regions.","Do not infer defect depth from a single colour image."],example:"A dark patch on a thermogram may be a real thermal anomaly or simply a region with different emissivity. A controlled repeat with changed viewing geometry and a reference temperature check can help distinguish the causes."},
{p:["Thermography can reveal delaminations and disbonds in composite panels, moisture and insulation problems in buildings, hot electrical connections, bearing friction and uneven heating in industrial processes. Each application has its own excitation method, expected thermal response, calibration and acceptance approach.","Limitations include poor access, deep defects, low thermal contrast, high thermal diffusivity, wind, reflections, uneven heating, surface coatings and environmental changes. A defect may be invisible if it does not create a sufficient surface response during the observation period. The method is therefore application-specific and often requires representative reference panels.","Safety depends on the excitation source and inspection environment. Hot lamps, flash units, induction heaters, lasers, high voltage and elevated surfaces may introduce hazards. Protect personnel and the component, and ensure that the applied heat does not damage temperature-sensitive materials."],focus:["Use application-specific validation and reference panels.","Recognise environmental and depth limitations.","Control heat-source, electrical, optical and access hazards."],example:"Thermography may identify a suspected disbond area on a composite radome, after which UT or another suitable method may be used for confirmation and characterisation under the approved inspection plan."}

{p:["Digital radiography converts transmitted X-ray energy into a digital image. Computed radiography (CR) uses a photostimulable phosphor imaging plate that stores a latent image and is later scanned by a laser reader. Direct radiography (DR) uses an electronic flat-panel detector that converts radiation into a digital signal during the exposure.","CR behaves like a reusable imaging medium: expose the plate, read it, erase residual signal and return it to service. DR produces an image directly from the detector electronics. These approaches differ in workflow, detector response, spatial resolution, sensitivity, handling, image lag and operational speed.","Digital acquisition does not change the basic radiographic physics. Radiation energy, component thickness, geometry, scatter, source size and exposure still determine the information reaching the detector. A digital system must meet the image-quality requirements for the intended examination; a convenient digital display is not automatically an adequate radiograph."],focus:["Understand CR imaging plates versus DR flat panels.","Digital detectors still depend on radiographic exposure geometry and quality.","The acquisition must meet the applicable technique standard."],example:"A weld radiograph may be acquired on a CR plate, read by a scanner and reviewed as a digital image. The IQI and required image-quality values must still be verified."},
{p:["A CR imaging plate contains a photostimulable phosphor that stores energy when exposed to X-rays. During reading, a laser scans the plate and releases light proportional to the stored exposure. A light detector converts that emission into an electronic signal and then pixel values. The plate is subsequently erased to reduce residual image before reuse.","Plate handling affects image quality. Scratches, dust, fingerprints, bending, contamination, incomplete erasure and storage conditions can create artefacts or reduce performance. Plates should be identified and handled in a way that preserves traceability and prevents damage.","The reader requires system checks and maintenance. Laser power, scanning mechanism, calibration, plate erasure and image processing affect the acquired image. If a plate artefact repeats in multiple exposures, compare its location relative to the plate and component to determine whether it is detector-related."],focus:["Know the exposure, readout and erase cycle.","Protect plates from scratches, contamination and residual image.","Use reader checks and trace plate identity."],example:"A recurring straight line at the same plate coordinate in unrelated component exposures suggests a plate scratch or reader artefact rather than a repeated weld defect."},
{p:["A DR detector panel converts incident X-ray energy into an electrical image. Indirect-conversion detectors use a scintillator to convert X-rays into visible light, then photodiodes convert that light into charge. Direct-conversion detectors convert X-ray energy into charge within a photoconductor. Pixel electronics read and digitise the signal.","Detector specifications include pixel pitch, active area, spatial resolution, dynamic range, dose response, lag, bad-pixel behaviour and image readout time. A smaller pixel pitch can improve sampling but does not alone guarantee better total image resolution; scintillator spread, detector construction, source geometry and noise also matter.","DR panels may be tethered or wireless and may be integrated into fixed or portable systems. Protect the panel from impact, bending, moisture and excessive load. Verify detector calibration, bad-pixel correction, exposure indicator and system status before examination."],focus:["Distinguish direct and indirect conversion.","Understand pixel pitch versus total system resolution.","Protect and verify the detector panel."],example:"An indirect detector uses a scintillator layer to convert X-rays to light before photodiodes read it. Light spread in the scintillator can affect sharpness even when the pixel pitch is small."},
{p:["Digital radiographic image quality is affected by detector response, exposure, signal-to-noise ratio, contrast-to-noise ratio, spatial resolution, scatter and geometric unsharpness. Underexposure may produce noisy images; overexposure can saturate or reduce useful contrast depending on the detector response. The required image quality must be verified before interpretation.","IQIs or duplex wire IQIs may be used to demonstrate required sensitivity or basic spatial resolution, as defined by the relevant standard and technique. Detector calibration and image quality indicators serve different purposes: system calibration characterises detector behaviour, while an IQI demonstrates image quality in the actual exposure arrangement.","The radiographic geometry still matters. Keep the detector as close as practicable to the object where permitted, use suitable source distance and control scatter. Ensure full coverage, correct component identity and required markers. Review the raw image and quality indicators before using permitted image processing."],focus:["Assess SNR, CNR, resolution and geometric unsharpness.","Use required IQI / duplex IQI and detector checks.","Verify image quality before evaluation."],example:"If the required duplex wire pair cannot be resolved, the image may not meet the basic spatial resolution requirement even if the overall image looks sharp on a laptop display."},
{p:["Digital image processing can adjust brightness, contrast, window and level, magnification, inversion and filtering to make features easier to view. The display transformation changes how pixel values are represented; it does not create new physical information. Filtering can suppress noise but may also remove or distort small indications.","The original acquisition data must be preserved. Any processing used for interpretation should be permitted by the procedure and traceable. Avoid aggressive sharpening, smoothing or contrast manipulation that changes an indication's appearance. The display monitor should be suitable for the viewing task and operated in controlled conditions.","Interpretation should include checks for detector artefacts, bad pixels, saturation, underexposure, scatter, plate scratches, image lag and stitching errors. Compare suspicious indications with the unprocessed image and with other views if available. Record the processing applied and the identity of the original image file."],focus:["Distinguish image display adjustment from new image information.","Preserve original acquisition data and trace processed versions.","Check for detector and processing artefacts."],example:"A smoothing filter may make grain noise less visible but can also soften a small pore. The interpreter should compare the original image and ensure the chosen processing is permitted."},
{p:["Digital radiography needs a controlled data workflow. Each image must be linked to the correct component, weld number, exposure position, technique, source, detector, IQI, date and personnel. Images should be stored in an approved format with metadata and access control so they can be retrieved and reviewed later.","Image transfer, compression, resizing, printing and display conversion can alter data. Preserve original pixel information and avoid lossy operations where they are not permitted. Establish naming conventions, backup, retention and audit trail requirements before production inspection begins.","Radiation safety is unchanged by the use of a digital detector. Exposures still require authorised personnel, controlled areas, barriers, warning systems, dosimetry, surveys and emergency arrangements. Detector protection and data security are additional responsibilities, not replacements for radiation protection."],focus:["Maintain image identity, metadata and traceability.","Preserve original image quality and audit trail.","Apply full radiation protection controls for every exposure."],example:"A digital image saved under an incorrect weld number may be technically clear but unusable for traceable acceptance. Verify component identity at acquisition and during final report compilation."}

[
{p:["A discontinuity is a physical interruption or variation in material structure, such as a crack, pore, inclusion, lamination, lack of fusion or geometric irregularity. An indication is the response produced by an NDT method. The indication may be relevant, non-relevant or false. A defect is a condition that fails the acceptance requirements specified for the product or application.","These terms describe different stages of an inspection decision. Detection recognises a response; characterisation considers the likely type, location and dimensions; evaluation compares it with the applicable criteria; acceptance or rejection is the documented disposition. An inspector must not label every indication a defect or declare a component acceptable without the correct criteria and authority.","The origin of a discontinuity may be related to casting, forging, rolling, welding, machining, heat treatment, service fatigue, corrosion, erosion or environmental degradation. Understanding manufacturing route and service conditions helps determine what features are plausible and which NDT methods are suitable."],focus:["Distinguish discontinuity, indication and defect.","Separate detection, characterisation, evaluation and acceptance.","Use manufacturing and service history when interpreting results."],example:"A rounded radiographic indication may be evaluated as a pore. Whether it is acceptable depends on size, distribution, thickness, product type and the applicable acceptance standard."},
{p:["NDT methods are grouped by the physical principle used. VT uses visible light; PT uses liquid penetrant and capillary action; MT uses magnetic flux leakage; RT uses ionising radiation attenuation; UT uses mechanical waves; ET uses electromagnetic induction; LT measures leakage; AE monitors transient elastic-wave activity; and IRT measures infrared radiance.","Some methods are primarily surface-focused, such as PT and MT, while UT and RT can examine internal volumes under suitable conditions. ET can be surface or near-surface depending on frequency and probe; AE monitors active sources over a defined structure; LT tests containment; IRT assesses thermal response. Each method has distinct material and geometry restrictions.","Method selection should be based on the required examination objective rather than habit or equipment availability alone. Often, one method detects a condition and another characterises or confirms it. The combined approach should be specified and validated in the inspection plan."],focus:["Match each method to its physical interaction.","Know material restrictions and typical examination volume.","Use complementary methods where a single technique has blind spots."],example:"PT is suitable for a surface-open crack on a non-porous aluminium component, but not for a fully subsurface flaw. UT or RT may be considered for internal examination depending on the geometry and requirement."},
{p:["Method selection starts with the material: ferromagnetic, conductive, non-conductive, coarse-grained, anisotropic or composite. Next consider discontinuity type, likely orientation, depth, size and whether it is open to the surface. Then consider component thickness, geometry, surface condition, access, temperature, operating state and the required sensitivity.","The inspection objective and acceptance criteria determine the examination volume and technique. If a crack is expected to be planar, select a method and scan arrangement that can interact with its likely orientation. If a pressure boundary needs leak-rate verification, a volumetric NDT method alone may not demonstrate leak tightness. If a composite bond is evaluated, the method must suit the material stack-up and damage mechanism.","Practical constraints include safety, access, time, cost, production rate, equipment availability, personnel qualification and data-recording requirements. A technique that is fast but cannot demonstrate the required sensitivity is not suitable. Document why the chosen method can satisfy the scope and what it cannot examine."],focus:["Consider material, flaw type, depth, orientation and geometry.","Define the inspection objective and acceptance basis before method selection.","Document coverage, limitations and complementary methods."],example:"A crack in a ferromagnetic steel shaft may be examined by MT at the surface and UT for subsurface extent. On a non-ferromagnetic aluminium shaft, MT is not suitable and another combination must be selected."},
{p:["An inspection procedure converts an examination objective into a repeatable set of instructions. It defines scope, material, equipment, probe or source, calibration, essential variables, surface preparation, scan pattern, coverage, data acquisition, evaluation, reporting and safety requirements. The procedure must be suitable for the specific product and governing standard.","Essential variables are those that can affect the validity or sensitivity of the examination. Examples may include probe type or frequency, wedge, focal law, source energy, penetrant process, magnetic field direction, detector type, calibration block, scan speed or couplant. Changes to essential variables require review and may require requalification or recalibration according to the governing procedure.","A procedure should define how to respond to nonconforming conditions, equipment failure, calibration drift, incomplete coverage, poor surface access and unexpected indications. Record the revision used and ensure personnel are working from the current approved version."],focus:["A procedure controls the complete inspection, not only instrument settings.","Know which variables are essential for the chosen method.","Follow change-control, calibration and record requirements."],example:"Changing a PAUT wedge or focal-law set may change beam position and sensitivity. The change must be checked and documented before acquisition continues."},
{p:["Personnel competence includes theory, equipment operation, practical technique, interpretation, safety and familiarity with the applicable written procedure. Certification schemes and employer qualification programmes have defined training, experience and examination requirements. The exact requirements depend on the scheme, sector, method and jurisdiction.","Quality systems provide controls for document revision, calibration, equipment maintenance, personnel authorisation, nonconformance, audit, traceability and report retention. A technically correct measurement can still be unusable if it cannot be linked to the component, inspection procedure, calibration or responsible person.","A self-learning academy can build theoretical understanding and help prepare a learner for practical training, but it cannot independently provide supervised experience, employer authorisation or third-party certification. Learners should use current standards, approved training, practical exercises and qualified supervision."],focus:["Competence combines theory, practical experience and method-specific skill.","Use the certification scheme and employer written practice that actually apply.","Maintain traceable records and controlled documents."],example:"A learner may understand a TOFD B-scan from study notes, but must still develop practical probe handling, calibration, scan execution and interpretation under appropriate supervision before being authorised for production inspection."},
{p:["An NDT report should allow another competent person to understand what was examined, how it was examined, what was found and what limitations existed. It normally identifies component, location, material, drawing or weld reference, examination extent, procedure and revision, equipment and probe, calibration details, inspection conditions, personnel and results.","The report should distinguish observed indications from evaluation and final disposition. Identify the acceptance standard and edition where required. State whether the examination met the required coverage and image or signal quality. Any inaccessible region, coupling issue, detector artefact, calibration drift or other limitation should be documented.","Professional conduct requires objectivity, traceability and clear communication. Do not change results to meet production pressure, conceal missed coverage or invent acceptance criteria. Escalate uncertainty and refer engineering or fitness-for-service decisions to the responsible authority."],focus:["Make results traceable to component, procedure, equipment and calibration.","Separate factual observations from evaluation and disposition.","Report limitations honestly and preserve original records."],example:"A useful UT report identifies weld number, scan surface, probe and wedge, calibration block, range and sensitivity, scan coverage, indication location and length, evaluation standard and final disposition."}
]
];
const chapterGuides=[
[
"NDT protects the component while providing information about its condition. Choose a method based on material, likely discontinuity, location and required sensitivity. Results support quality and maintenance decisions; they do not automatically establish fitness for service.",
"Ultrasonic inspection is based on how sound energy travels and interacts with boundaries. The instrument displays returning energy, while calibration connects signal time and amplitude to known conditions.",
"Longitudinal waves involve particle motion parallel to propagation; shear waves involve motion perpendicular to propagation. Velocity depends on material and mode. Interfaces cause reflection, transmission, refraction and mode conversion.",
"The active element, backing, matching layer, housing and cable influence pulse generation and reception. Frequency, element diameter, bandwidth and damping affect resolution, beam spread and penetration.",
"Calibration establishes response against known dimensions or reflectors. Range / velocity calibration places echoes at correct sound paths; sensitivity calibration sets response level. Recheck after relevant equipment changes.",
"An A-scan plots amplitude vertically and time or sound path horizontally. Identify the initial pulse, known geometry echoes and possible intermediate responses; use probe movement and calibration to investigate.",

],
[

[

function drawGrid(w,h){if(!$('pGrid').checked)return;ctx.strokeStyle='#24414a';ctx.lineWidth=1;for(let x=0;x<=w;x+=w/10){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}for(let y=0;y<=h;y+=h/8){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}}

function startExam(mi){const m=methods[mi];examQuestions=[...qs];examAnswers={};let remaining=120*60;const area=document.getElementById("examArea");area.innerHTML=`<div class="lesson-body" style="margin-top:24px"><div class="section-head"><h2>${m.name} · Final examination</h2><span class="pill" id="timer">120:00</span></div><p>Answer all questions, then submit your assessment.</p><form id="examForm">${examQuestions.map((q,i)=>`<article class="question"><h3>${i+1}. ${q.q}</h3>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="e${i}" value="${j}">${o}</label>`).join("")}</article>`).join("")}<button class="btn primary" type="submit">Finish examination</button></form><div id="examResult"></div></div>`;let ended=false;const interval=setInterval(()=>{if(ended){clearInterval(interval);return}remaining--;const t=document.getElementById("timer");if(!t){clearInterval(interval);return}t.textContent=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0");if(remaining<=0){ended=true;clearInterval(interval);document.getElementById("examForm").requestSubmit()}},1000);document.getElementById("examForm").onsubmit=e=>{e.preventDefault();if(ended&&remaining>0)return;ended=true;clearInterval(interval);let score=0;const data=new FormData(e.target);examQuestions.forEach((q,i)=>{if(Number(data.get("e"+i))===q.a)score++});const pct=Math.round(score/examQuestions.length*100);let msg=pct>=50?"Assessment passed.":"Assessment not passed. Review the lessons and try again.";document.getElementById("examResult").innerHTML=`<div class="notice"><b>${msg}</b><br>Score: ${score} / ${examQuestions.length} (${pct}%).<br><small>This demonstration assessment uses ${examQuestions.length} sample questions, not the full 100-question exam.</small></div>${pct>=50?`<button class="btn primary" id="makeCert">Create learning certificate</button>`:""}`;if(pct>=50)document.getElementById("makeCert").onclick=()=>{certificates.push({method:m.name,score:pct,date:new Date().toLocaleDateString("en-IN")});save();go("certificates")};e.target.querySelectorAll("input,button").forEach(el=>el.disabled=true)}}
function showCertificates(){view.innerHTML=`<h1 class="page-title">Certificates</h1><p class="page-desc">View educational completion records earned in this browser.</p>${certificates.length?certificates.map((c,i)=>`<div class="certificate"><div class="method-tag">NDT MASTERCLASS ACADEMY</div><h2>Certificate of Learning</h2><p>This recognises completion of the theory assessment by</p><div class="cert-name">${escapeHtml(learner)}</div><p>Topic / method completed</p><h3>${escapeHtml(c.method)}</h3><p>Assessment mark: <b>${c.score}%</b> &nbsp; · &nbsp; Completion date: <b>${escapeHtml(c.date)}</b></p><div class="notice">This certificate is for learning and knowledge development only. It is not an NDT Level II / Level III certification, personnel qualification, or accreditation.</div><button class="btn" onclick="window.print()">Print certificate</button></div>`).join(""):'<div class="empty">No certificates yet. Complete all lessons in a method and pass its final assessment to create a learning certificate.</div>'}`;}

<div class="about-ndt">
<section class="about-hero"><div><div class="about-kicker">KNOW THE SCIENCE • UNDERSTAND THE INDUSTRY</div><h1>About NDT &amp; NDE</h1><p>Non-Destructive Testing (NDT), also known as Non-Destructive Examination (NDE), evaluates materials, components and structures without damaging their future usefulness. It supports quality, reliability, maintenance and public safety.</p><p>Explore the history, methods, industrial applications, careers, certification and inspection scope.</p></div><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Ultrasonic_pipeline_test.jpg" alt="NDT technician performing phased array ultrasonic testing on a steel pipe weld" loading="lazy"></section>
<section class="about-section"><div class="about-kicker">01 / THE BASICS</div><h2>What are NDT and NDE?</h2><p>NDT uses sound, radiation, magnetism, capillary action, electrical conductivity and heat flow to detect or measure discontinuities while leaving the item fit for intended use. NDE is a closely related term emphasising examination and evaluation; terminology varies by industry and standard.</p><div class="about-grid">
<article class="about-card"><img src="https://www.weldqc.com/hs-fs/hubfs/WeldQC/AdobeStock_570930561.jpeg?name=AdobeStock_570930561.jpeg&width=2000" alt="Ultrasonic weld inspection" loading="lazy"><div><h3>Find hidden conditions</h3><p>Reveal surface and internal indications that may not be visible during ordinary visual examination.</p></div></article>
<article class="about-card"><img src="https://www.tuv.com/content-media-files/master-content/services/industrial-services/1176-tuv-rheinland-non-destructive-testing-of-welds/tuv-rheinland-non-destructive-testing-of-welds_core_1_5_1.jpg" alt="Industrial piping NDT" loading="lazy"><div><h3>Protect asset integrity</h3><p>Support manufacturing quality, in-service inspection, maintenance planning and repair decisions.</p></div></article>
<article class="about-card"><img src="https://www.hamadinspections.com/images/features/ndt.png" alt="Digital ultrasonic weld inspection" loading="lazy"><div><h3>Evidence-based decisions</h3><p>Results depend on competent people, calibrated equipment, procedures, traceability and acceptance criteria.</p></div></article></div></section>
<section class="about-section"><div class="about-kicker">02 / HISTORY &amp; EVOLUTION</div><h2>NDT: Past, present and future</h2><div class="about-timeline"><div class="about-era"><b>EARLY PRACTICE</b><p>Visual examination and oil-and-whiting / penetrant-style techniques helped reveal surface flaws in industrial and railway components.</p></div><div class="about-era"><b>EARLY 1900s – MID-CENTURY</b><p>X-ray discovery enabled industrial radiography. Ultrasonic, magnetic particle and penetrant methods matured into practical tools.</p></div><div class="about-era"><b>DIGITAL ERA</b><p>Digital radiography, PAUT, TOFD, encoded scanners and data storage improved inspection coverage and repeatability.</p></div><div class="about-era"><b>THE FUTURE</b><p>Robotic scanning, automation, advanced sensors, analytics and AI-assisted review are expanding capability. Expert judgement remains essential.</p></div></div><div class="about-links"><a href="https://isnt.in/about/genesis.php" target="_blank" rel="noopener">ISNT – Genesis of NDT</a><a href="https://www.asnt.org/standards-publications/blog/ndt-method-overview-visual-testing" target="_blank" rel="noopener">ASNT – NDT history</a><a href="https://www.asnt.org/what-is-nondestructive-testing/methods" target="_blank" rel="noopener">ASNT – Methods</a></div></section>
<section class="about-section"><div class="about-kicker">03 / METHODS</div><h2>Major NDT methods</h2><div class="about-methods about-method-gallery">
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Visual_inspection_of_compressor_blades-090108-F-9919G-746.jpg?width=720" alt="Visual inspection of compressor blades" loading="lazy"><b>VT – Visual Testing</b><span>Visual examination of surface condition, geometry, corrosion and visible weld features.</span><a href="https://www.google.com/search?tbm=isch&q=VT%20%E2%80%93%20Visual%20Testing%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://jororwxhjlijln5q-static.micyjz.com/cloud/loBpoKqilpSRkjnlnjqjiq/What-is-Penetrant-Testing1.jpg" alt="Liquid penetrant inspection procedure illustration" loading="lazy"><b>PT – Liquid Penetrant</b><span>Reveals surface-breaking discontinuities in non-porous materials.</span><a href="https://www.google.com/search?tbm=isch&q=PT%20%E2%80%93%20Liquid%20Penetrant%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://www.apecinspect.com.au/img/magnetic-particle-inspection-nondestructive-examination-ferromagnetic-materials.webp" alt="Magnetic particle inspection of cast component" loading="lazy"><b>MT – Magnetic Particle</b><span>Finds surface and near-surface flaws in ferromagnetic materials.</span><a href="https://www.google.com/search?tbm=isch&q=MT%20%E2%80%93%20Magnetic%20Particle%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://www.csmmuhendislik.com/images/radyografik/Radyografi%20film%20%C3%A7ekimi%202.JPEG" alt="Industrial radiography X-ray inspection room" loading="lazy"><b>RT – Radiographic Testing</b><span>Uses X-rays or gamma rays to create images of internal features.</span><a href="https://www.google.com/search?tbm=isch&q=RT%20%E2%80%93%20Radiographic%20Testing%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://media.licdn.com/dms/image/v2/D4E12AQGhB2PELiuppQ/article-cover_image-shrink_720_1280/B4EZxCq6GpG0AI-/0/1770645076370?e=2147483647&t=pxrYS4FiAEvBbypfoq0rJTeoRamz4-vXwzGRNu7rNkM&v=beta" alt="Technician performing nondestructive inspection" loading="lazy"><b>UT – Ultrasonic Testing</b><span>Uses high-frequency sound to inspect internal reflectors, thickness and welds.</span><a href="https://www.google.com/search?tbm=isch&q=UT%20%E2%80%93%20Ultrasonic%20Testing%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/TOFD-ManuallyGuidedSensors.jpg?width=1000" alt="Time of flight diffraction weld inspection diagram" loading="lazy"><b>TOFD</b><span>Uses diffracted signals from flaw tips for weld examination and sizing.</span><a href="https://www.google.com/search?tbm=isch&q=TOFD%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://www.twi-global.com/locations/south-east-asia/images/paut.jpg" alt="Ultrasonic pulse echo weld inspection schematic" loading="lazy"><b>PAUT – Phased Array UT</b><span>Electronically steers and focuses ultrasonic beams for encoded inspection imaging.</span><a href="https://www.asnt.org/what-is-nondestructive-testing/methods" target="_blank" rel="noopener">Method and image references</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/AB_EMAT.jpg?width=720" alt="Electromagnetic acoustic transducer equipment" loading="lazy"><b>ET – Eddy Current / Electromagnetic</b><span>Evaluates conductive materials, tubing and surface or near-surface flaws.</span><a href="https://www.google.com/search?tbm=isch&q=ET%20%E2%80%93%20Eddy%20Current%20%2F%20Electromagnetic%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Absolute_pressure_decay_schematics.png?width=720" alt="Pressure decay leak testing schematic" loading="lazy"><b>LT – Leak Testing</b><span>Detects leakage and evaluates leak rate using pressure, vacuum, tracer gas or other techniques.</span><a href="https://commons.wikimedia.org/wiki/Category:Nondestructive_testing" target="_blank" rel="noopener">Diagram reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/AE_event.jpg?width=720" alt="Acoustic emission signal event data" loading="lazy"><b>AE – Acoustic Emission</b><span>Monitors transient elastic waves generated by active damage mechanisms under load.</span><a href="https://commons.wikimedia.org/wiki/Category:Nondestructive_testing" target="_blank" rel="noopener">Data image reference</a></article>
<article class="about-method"><img src="https://dam-assets.fluke.com/s3fs-public/F-tis75plus_16a_c.jpg" alt="Infrared thermography inspection" loading="lazy"><b>IRT – Infrared Thermography</b><span>Uses thermal patterns to identify anomalies in components and structures.</span><a href="https://www.google.com/search?tbm=isch&q=IRT%20%E2%80%93%20Infrared%20Thermography%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Steinbichler_Intact_Tire-Testing.jpg?width=1000" alt="Shearography nondestructive testing" loading="lazy"><b>Shearography</b><span>Optical method for mapping deformation and detecting defects in composites and bonded structures.</span><a href="https://www.google.com/search?tbm=isch&q=Shearography%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/GWS_FTM_scan.jpg?width=720" alt="Guided wave inspection scan" loading="lazy"><b>Guided Wave Testing</b><span>Long-range screening of pipes and other structures using guided ultrasonic modes.</span><a href="https://www.google.com/search?tbm=isch&q=Guided%20Wave%20Testing%20non%20destructive%20testing%20inspection" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Photo reference</a></article>
<article class="about-method"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/MFL_pipeline_NDT_diagram.gif?width=720" alt="Magnetic flux leakage pipeline inspection diagram" loading="lazy"><b>MFL – Magnetic Flux Leakage</b><span>Uses magnetic flux leakage signals to screen ferromagnetic components, including storage tank floors and pipelines.</span><a href="https://commons.wikimedia.org/wiki/Category:Nondestructive_testing" target="_blank" rel="noopener">Diagram reference</a></article>
</div></section>
<section class="about-section"><div class="about-kicker">04 / INDUSTRIAL SCOPE</div><h2>Where is NDT used?</h2><div class="about-grid">
<article class="about-card"><img src="https://images.unsplash.com/photo-1516937941344-00b4e0337589?auto=format&fit=crop&w=1200&q=85" alt="Ultrasonic pipe inspection" loading="lazy"><div><h3>Oil, gas &amp; petrochemical</h3><p>Pipeline welds, pressure vessels, storage tanks, corrosion mapping and refinery equipment.</p></div></article>
<article class="about-card"><img src="https://static.wixstatic.com/media/f278f7_d86b0b2f641b4986870b61319846c82b~mv2.jpeg/v1/fill/w_980%2Ch_735%2Cal_c%2Cq_85%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/f278f7_d86b0b2f641b4986870b61319846c82b~mv2.jpeg" alt="Advanced ultrasonic inspection" loading="lazy"><div><h3>Manufacturing &amp; heavy engineering</h3><p>Castings, forgings, weldments, machined parts and pressure equipment.</p></div></article>
<article class="about-card"><img src="https://irp.cdn-website.com/358e7c58/dms3rep/multi/Gemini_Generated_Image_j301cxj301cxj301.png" alt="NDT equipment in workshop" loading="lazy"><div><h3>Aerospace &amp; defence</h3><p>Aircraft structures, composites, bonded assemblies and turbine components.</p></div></article>
<article class="about-card"><img src="https://www.tuv.com/content-media-files/master-content/services/industrial-services/1176-tuv-rheinland-non-destructive-testing-of-welds/tuv-rheinland-non-destructive-testing-of-welds_core_1_5_1.jpg" alt="Power plant pipe inspection" loading="lazy"><div><h3>Power &amp; energy</h3><p>Boilers, turbines, heat exchangers, power-plant piping and renewable assets.</p></div></article>
<article class="about-card"><img src="https://www.hamadinspections.com/images/features/ndt.png" alt="Digital weld inspection" loading="lazy"><div><h3>Infrastructure &amp; transport</h3><p>Bridges, rail wheels and axles, metro systems, ships and lifting equipment.</p></div></article>
<article class="about-card"><img src="https://assets.onestopndt.com/p/uploads/ndt-articles/original/ndt-technician-ultrasonic-testing-free-certification%281%2920260615151057.png" alt="NDT technician training" loading="lazy"><div><h3>Training, labs &amp; R&amp;D</h3><p>Method development, reference standards, calibration, materials research and automation.</p></div></article></div><div class="about-links"><a href="https://www.asnt.org/what-is-nondestructive-testing/industries" target="_blank" rel="noopener">ASNT – Industry applications</a><a href="https://www.tcreng.com/services/non-destructive-testing/conventional-ndt/" target="_blank" rel="noopener">Inspection scope example</a><a href="https://nabcb.qci.org.in/prcb/pr-005/" target="_blank" rel="noopener">NABCB – India scope</a></div></section>
<section class="about-section"><div class="about-kicker">05 / CAREERS</div><h2>NDT jobs and career pathways</h2><p>NDT careers combine engineering knowledge, practical inspection skills, safety awareness, documentation and interpretation. Work may be site-based, workshop-based, laboratory-based or focused on technical support and system design.</p><div class="about-roles"><div class="about-role"><b>Trainee / Assistant</b><p>Learn safety, materials, equipment handling and calibration support under supervision.</p></div><div class="about-role"><b>Technician / Inspector</b><p>Perform assigned inspections, record indications and prepare reports within authorisation.</p></div><div class="about-role"><b>Level II / Specialist</b><p>Set up and conduct examinations, evaluate results within certified scope and guide others.</p></div><div class="about-role"><b>Level III / Technical Authority</b><p>Develop procedures, select methods, interpret codes and oversee NDT programmes.</p></div><div class="about-role"><b>Automation / Application Engineer</b><p>Integrate scanners, robots, probes, encoders and acquisition software.</p></div><div class="about-role"><b>Other directions</b><p>QA/QC, asset integrity, vendor inspection, training, consulting, technical sales and R&amp;D.</p></div></div><div class="about-links"><a href="https://www.asnt.org/what-is-nondestructive-testing/career-pathways" target="_blank" rel="noopener">ASNT – Career pathways</a><a href="https://nationalcareers.service.gov.uk/job-profiles/non-destructive-testing-technician" target="_blank" rel="noopener">NDT technician job profile</a><a href="https://in.indeed.com/q-ultrasonic-ndt-testing-jobs.html" target="_blank" rel="noopener">Search NDT jobs in India</a><a href="https://www.twi-global.com/locations/india/news-and-events/news/2026/advance-your-career-with-automated-ultrasonic-testing-aut" target="_blank" rel="noopener">Advanced UT / AUT training</a></div></section>
<section class="about-section"><div class="about-kicker">06 / CERTIFICATION</div><h2>NDT certification and qualification</h2><p>Personnel qualification is method-specific and may also be limited by product sector or technique. Routes differ by scheme and employer. Verify the certification body, standard, method, level, sector, validity and employer authorisation.</p><div class="about-grid"><article class="about-card"><div><h3>Level 1</h3><p>Performs defined inspections using approved instructions and supervision required by the scheme.</p></div></article><article class="about-card"><div><h3>Level 2</h3><p>Within certified scope, may set up equipment, conduct examinations, interpret and evaluate results and report.</p></div></article><article class="about-card"><div><h3>Level 3</h3><p>Provides technical authority within scope, including method selection, procedure validation and oversight.</p></div></article></div><div class="about-note"><b>Important:</b> This academy’s learning certificate is not an industrial personnel certification. Training, experience, vision, examinations and employer authorisation may apply. One certificate does not automatically authorise every sector or technique.</div><div class="about-links"><a href="https://www.iso.org/standard/75614.html" target="_blank" rel="noopener">ISO 9712:2021 – official standard</a><a href="https://www.asnt.org/certification" target="_blank" rel="noopener">ASNT certification</a><a href="https://nabcb.qci.org.in/prcb/pr-005/" target="_blank" rel="noopener">NABCB / QCI India</a><a href="https://www.bripc.org/?page_id=18139" target="_blank" rel="noopener">ISO 9712 scheme example</a></div></section>
<section class="about-section"><div class="about-kicker">07 / INSPECTION SCOPE</div><h2>What does an NDT scope include?</h2><div class="about-list"><ul><li><b>Method:</b> UT, PAUT, TOFD, RT, MT, PT, ET, VT, LT, AE, thermography or another defined method.</li><li><b>Product / material:</b> welds, castings, forgings, plates, bars, pipes, tubes, composites or components.</li><li><b>Technique:</b> straight beam, angle beam, immersion, encoded PAUT, film or digital radiography.</li><li><b>Objective:</b> flaw detection, thickness, corrosion mapping, lamination, bond inspection or condition monitoring.</li><li><b>Code and acceptance criteria:</b> governing standard, specification, procedure and acceptance level.</li><li><b>Practical boundaries:</b> access, surface condition, geometry, material, thickness, equipment, calibration and coverage.</li></ul></div></section>

<section class="about-section"><div class="about-kicker">09 / INSIDE AN INSPECTION</div><h2>How an NDT inspection is planned and performed</h2><p>A reliable inspection is a controlled engineering activity, not simply a test instrument reading. The method and technique must be selected for the component, expected damage mechanism, geometry, access and required detection capability.</p><div class="about-grid">
<article class="about-card"><div><h3>1. Review the requirement</h3><p>Identify the component, material, manufacturing history, service conditions, damage mechanisms, governing code, inspection extent and acceptance criteria.</p></div></article>
<article class="about-card"><div><h3>2. Select the method</h3><p>Choose one or more methods based on defect type, location, orientation, material, thickness, access, sensitivity and practical limitations.</p></div></article>
<article class="about-card"><div><h3>3. Prepare the component</h3><p>Confirm access, surface condition, temperature, cleanliness, isolation and safety controls. Record any restrictions that could affect coverage.</p></div></article>
<article class="about-card"><div><h3>4. Verify equipment</h3><p>Check instrument condition, probe or sensor, cables, software, reference standards, calibration status and essential settings before use.</p></div></article>
<article class="about-card"><div><h3>5. Perform the examination</h3><p>Follow the approved written procedure and scan plan. Maintain coverage, overlap, coupling or contact, scan speed and required sensitivity.</p></div></article>
<article class="about-card"><div><h3>6. Evaluate and report</h3><p>Review indications against the applicable acceptance criteria, document limitations and coverage, retain required data and issue a traceable report.</p></div></article>
</div></section>
<section class="about-section"><div class="about-kicker">10 / MATERIALS & DISCONTINUITIES</div><h2>What can NDT detect?</h2><p>NDT looks for discontinuities and condition changes. A discontinuity is not automatically a rejectable defect: its significance depends on type, size, orientation, location, service conditions and the governing acceptance criteria.</p><div class="about-grid">
<article class="about-card"><div><h3>Cracks</h3><p>Planar separations that may occur in welds, parent material, heat-affected zones, castings, forgings and in-service components. Orientation strongly affects detectability.</p></div></article>
<article class="about-card"><div><h3>Porosity & gas holes</h3><p>Rounded cavities formed by trapped gas or process conditions. Radiography is commonly useful; ultrasonic response depends on size, distribution and material.</p></div></article>
<article class="about-card"><div><h3>Slag & inclusions</h3><p>Non-metallic material trapped during manufacture. Shape, orientation and acoustic or radiographic contrast influence detection.</p></div></article>
<article class="about-card"><div><h3>Lack of fusion / penetration</h3><p>Weld discontinuities associated with incomplete joining or root penetration. Their planar geometry makes technique, beam angle and scan coverage important.</p></div></article>
<article class="about-card"><div><h3>Corrosion & erosion</h3><p>Wall thinning, pitting and local metal loss. Thickness UT, corrosion mapping, profile radiography and MFL may be used according to asset and geometry.</p></div></article>
<article class="about-card"><div><h3>Lamination & delamination</h3><p>Planar separations in rolled products or composite layers. Straight-beam UT, immersion C-scan, thermography or shearography may be selected.</p></div></article>
<article class="about-card"><div><h3>Bonding defects</h3><p>Disbonds, adhesive voids and weak bonds in bonded structures. Method selection depends on material stack-up, access, defect size and validation data.</p></div></article>
<article class="about-card"><div><h3>Fatigue & service damage</h3><p>Damage can initiate and grow under cyclic loading, vibration, temperature or corrosive environments. Risk-based inspection and trend monitoring help assess change.</p></div></article>
<article class="about-card"><div><h3>Dimensional & material changes</h3><p>Thickness, geometry, conductivity, hardness-related response, heat treatment and material mix-ups can be evaluated using suitable measurement methods.</p></div></article>
</div><div class="about-note"><b>Important distinction:</b> NDT reports observations and evaluations within a defined scope. Fitness-for-service and remaining-life decisions may require engineering assessment beyond the NDT result.</div></section>
<section class="about-section"><div class="about-kicker">11 / EQUIPMENT & REFERENCE STANDARDS</div><h2>Common NDT equipment and calibration items</h2><div class="about-list"><ul>
<li><b>Inspection instrument:</b> UT flaw detector, thickness gauge, PAUT unit, TOFD system, radiography source and detector, yoke, penetrant materials, eddy-current instrument, thermal camera or leak detector.</li>
<li><b>Probes and sensors:</b> straight-beam, angle-beam, dual-element, immersion, phased-array, TOFD, EMAT, eddy-current coils, AE sensors and infrared optics.</li>
<li><b>Reference blocks and standards:</b> blocks and test pieces selected for the method, material, geometry and procedure. Examples in UT include IIW/V1, V2 and material- or application-specific blocks; the correct block is determined by the governing procedure.</li>
<li><b>Accessories:</b> couplant, wedges, cables, scanners, encoders, fixtures, calibration shims, IQIs, densitometers, UV-A sources, field indicators and environmental monitors as applicable.</li>
<li><b>Calibration and verification:</b> establish instrument response and verify relevant parameters using traceable standards at the required intervals and after conditions that could invalidate settings.</li>
<li><b>Data integrity:</b> maintain equipment identification, software and setup details, calibration records, raw data, scan plans, image files and report revisions.</li>
</ul></div></section>
<section class="about-section"><div class="about-kicker">12 / SAFETY & QUALITY</div><h2>Safety, quality assurance and professional practice</h2><div class="about-grid">
<article class="about-card"><div><h3>Radiation protection</h3><p>Radiography requires controlled areas, trained authorised personnel, monitoring, warning systems, exposure controls and compliance with applicable radiation regulations.</p></div></article>
<article class="about-card"><div><h3>Electrical & mechanical safety</h3><p>Inspect cables and equipment, secure scanners, manage pinch points and moving robots, isolate machinery when required and follow site permit systems.</p></div></article>
<article class="about-card"><div><h3>Chemical & environmental safety</h3><p>Review safety data sheets for penetrants, cleaners, developers and couplants. Provide ventilation, PPE, spill controls and responsible waste handling.</p></div></article>
<article class="about-card"><div><h3>Working at height & confined spaces</h3><p>Use approved access systems, rescue plans, gas monitoring and permits. NDT competence does not replace task-specific safety training.</p></div></article>
<article class="about-card"><div><h3>Quality assurance</h3><p>Use approved procedures, qualified personnel, verified equipment, controlled documents, traceable records and independent review where required.</p></div></article>
<article class="about-card"><div><h3>Ethics & reporting</h3><p>Report actual findings accurately, identify limitations, avoid unsupported acceptance statements and escalate uncertain or out-of-scope conditions.</p></div></article>
</div></section>
<section class="about-section"><div class="about-kicker">13 / ADVANCED & AUTOMATED NDT</div><h2>Modern inspection technologies</h2><div class="about-grid">
<article class="about-card"><div><h3>Immersion & squirter UT</h3><p>Water provides acoustic coupling between the probe and component. Immersion systems scan in a water tank; squirter systems deliver a controlled water column to the surface. Encoders and motion systems create position-referenced C-scan data.</p></div></article>
<article class="about-card"><div><h3>Robotic inspection</h3><p>Industrial robots carry probes or scanners along programmed paths. Calibration of robot frames, tool centre point, part coordinates, encoder synchronisation and collision-safe paths are essential.</p></div></article>
<article class="about-card"><div><h3>Composite inspection</h3><p>Composite laminates, sandwich panels, bonded joints and honeycomb structures may require UT, immersion C-scan, thermography, shearography or other validated techniques.</p></div></article>
<article class="about-card"><div><h3>Digital radiography</h3><p>Digital detector arrays and computed radiography can reduce film handling and support image processing, archiving and electronic review. Image quality and technique requirements still apply.</p></div></article>
<article class="about-card"><div><h3>Encoded data & C-scan</h3><p>Position-synchronised acquisition maps signal features across a surface. Data quality depends on calibration, encoder accuracy, scan pitch, coupling, sampling and coverage.</p></div></article>
<article class="about-card"><div><h3>AI-assisted analysis</h3><p>Machine learning may assist image sorting, anomaly highlighting and repeatable data review. It must be validated for the application and cannot independently replace qualified evaluation or acceptance criteria.</p></div></article>
</div></section>
<section class="about-section"><div class="about-kicker">14 / CAREER DEVELOPMENT</div><h2>Skills to build for a successful NDT career</h2><div class="about-list"><ul>
<li><b>Engineering foundation:</b> materials, manufacturing processes, welding, metallurgy, mechanics, corrosion and basic mathematics.</li>
<li><b>Method knowledge:</b> physics and principles of each method, equipment controls, probes, calibration, sensitivity, limitations and common false calls.</li>
<li><b>Practical ability:</b> surface preparation, safe equipment handling, systematic scanning, reference block use, data acquisition and repeatability.</li>
<li><b>Interpretation:</b> understand indications, discontinuity morphology, signal behaviour, imaging, sizing uncertainty and acceptance criteria.</li>
<li><b>Documentation:</b> write clear reports, sketches, scan plans, calibration records, traceability details and non-conformance observations.</li>
<li><b>Professional skills:</b> communication, teamwork, site discipline, problem-solving, digital literacy and continuous learning.</li>
<li><b>Specialisation options:</b> weld inspection, pressure equipment, aerospace composites, rail, corrosion monitoring, automated UT, PAUT/TOFD, radiography or NDT systems engineering.</li>
</ul></div></section>
<section class="about-section"><div class="about-kicker">15 / HOW TO CHOOSE A METHOD</div><h2>Method selection: practical comparison</h2><div class="about-list"><p>No single NDT method detects every discontinuity in every material. A method must be selected and demonstrated for the intended application.</p><ul>
<li><b>Surface-breaking flaws:</b> VT, PT or MT (MT only for ferromagnetic materials); ET may be suitable for conductive materials.</li>
<li><b>Internal planar flaws:</b> UT, PAUT or TOFD may be effective when beam direction and access are suitable; RT may complement them.</li>
<li><b>Volumetric flaws:</b> RT and UT can be used depending on material, geometry, flaw morphology and code requirements.</li>
<li><b>Wall thickness / corrosion:</b> conventional UT, corrosion mapping, profile radiography or MFL may be suitable.</li>
<li><b>Composite delamination / disbond:</b> UT, immersion C-scan, thermography or shearography may be selected after application-specific validation.</li>
<li><b>Leakage:</b> use a leak test suited to the fluid, pressure, component volume and required leak-rate sensitivity.</li>
<li><b>Active damage under load:</b> AE can monitor activity, often with targeted follow-up NDT to characterise the source.</li>
</ul></div></section>
<section class="about-section"><div class="about-kicker">08 / REFERENCE LIBRARY</div><h2>Trusted NDT resources</h2><div class="about-list"><p>These independent organisations and technical resources support further learning.</p><div class="about-links"><a href="https://www.asnt.org/" target="_blank" rel="noopener">ASNT</a><a href="https://isnt.in/" target="_blank" rel="noopener">Indian Society for NDT</a><a href="https://www.iso.org/" target="_blank" rel="noopener">ISO</a><a href="https://nabcb.qci.org.in/" target="_blank" rel="noopener">NABCB / QCI India</a><a href="https://www.twi-global.com/" target="_blank" rel="noopener">TWI</a><a href="https://www.nde-ed.org/" target="_blank" rel="noopener">NDE-Ed</a><a href="https://www.asme.org/" target="_blank" rel="noopener">ASME</a><a href="https://www.astm.org/" target="_blank" rel="noopener">ASTM International</a></div><p class="about-small">Image references: DSPAUT, WeldQC, TÜV Rheinland, Hamad Inspections, Armor NDT and OneStopNDT. Images are externally hosted; availability and usage rights are controlled by their respective websites.</p></div></section>
<div class="about-note"><b>Academy disclaimer:</b> This page is for theory learning and knowledge development. It does not replace approved procedures, applicable codes, supervised practical training, employer authorisation or formal personnel certification.</div></div>`;
const aboutDetailText={"VT – Visual Testing":"VT is the first-line examination method. Inspectors assess surface condition, weld profile, alignment, corrosion, deformation and visible discontinuities. Good lighting, access, surface cleanliness, viewing distance and calibrated gauges matter.","PT – Liquid Penetrant":"PT reveals discontinuities open to the surface in clean, non-porous materials. The sequence is pre-cleaning, penetrant application, dwell, excess penetrant removal, developer application and interpretation. It cannot reveal defects that do not break the surface.","MT – Magnetic Particle":"MT is for ferromagnetic materials. The component is magnetised and particles gather at leakage fields created by surface or near-surface discontinuities. Select suitable magnetisation directions and adequate field strength; demagnetisation and post-cleaning may be required.","RT – Radiographic Testing":"RT passes X-rays or gamma rays through a component onto a detector or film. Differences in thickness and density create image contrast. Technique selection, exposure, image quality indicators, geometric unsharpness and radiation safety are essential.","UT – Ultrasonic Testing":"Conventional UT sends high-frequency sound into a component and evaluates reflected signals. A pulse-echo setup includes a probe, couplant, instrument, calibration/reference block and scan plan. UT is used for thickness measurement, weld examination, laminations and internal discontinuities. Geometry, material structure and beam direction affect detectability.","TOFD":"Time of Flight Diffraction uses diffracted waves from discontinuity tips. A transmitter and receiver are commonly placed on opposite sides of a weld. Signal timing supports height sizing and through-wall position assessment. Near-surface dead zones and orientation effects need consideration.","PAUT – Phased Array UT":"A phased-array probe contains multiple elements pulsed with controlled time delays. Electronic steering and focusing create multiple beam angles. Encoded scans can produce sectorial and linear data views. Calibration, wedge delay, sensitivity, coverage and scan index must follow the procedure.","ET – Eddy Current / Electromagnetic":"ET uses an alternating magnetic field to induce currents in conductive materials. Cracks, conductivity changes, lift-off and thickness variations alter the probe response. Applications include tubing, surface crack detection and material sorting.","LT – Leak Testing":"LT checks whether a component or system allows fluid or gas to escape. Methods include pressure decay, vacuum box, bubble testing, tracer gas and mass spectrometry. Select a method based on sensitivity, test volume, pressure, safety and acceptable leak rate.","AE – Acoustic Emission":"AE detects transient elastic waves released by active sources such as crack growth, fibre breakage or friction under stress. Sensors are coupled to the structure and signals are evaluated during loading or operation. Follow-up examination may be needed to characterise a source.","IRT – Infrared Thermography":"IRT measures emitted infrared energy and converts it into a temperature map. Active thermography applies external heating or cooling; passive thermography observes naturally occurring temperature patterns. Emissivity, reflections and environmental conditions influence interpretation.","Shearography":"Shearography is a laser-based optical method that measures surface strain or displacement gradients, often while a component is stressed by heat, vacuum or mechanical loading. Defects such as disbonds and delaminations can disturb the strain pattern.","Guided Wave Testing":"Guided waves travel along a structure and interact with corrosion, wall loss, supports and welds. Transducer rings can screen long lengths of pipe from one location. It is generally a screening method; indications usually require local follow-up inspection.","MFL – Magnetic Flux Leakage":"MFL magnetises a ferromagnetic component close to saturation. Metal loss disturbs the magnetic field and leakage sensors detect the change. It is used for tank floors and pipelines; lift-off, magnetisation and scan speed affect results.","Level 1":"A Level 1 person works to written instructions and under required supervision. Typical duties include equipment checks, calibration checks, carrying out the test and recording results. Evaluation and reporting authority are limited by the scheme and employer authorisation.","Level 2":"A Level 2 person is generally qualified to set up and calibrate equipment, perform and supervise testing, interpret and evaluate results, and report them within the certified method and sector scope.","Level 3":"A Level 3 person has the highest technical responsibility within the certified scope. Duties may include selecting methods, establishing and validating procedures, interpreting codes and standards, and overseeing NDT programmes.","EARLY PRACTICE":"Before modern instruments, inspection relied heavily on visual examination and simple surface-revealing techniques. The need to find hidden defects without destroying parts drove the development of scientific NDT methods.","EARLY 1900s – MID-CENTURY":"The discovery of X-rays enabled radiographic examination. Ultrasonic methods developed from early acoustic and sonar research, while magnetic particle and penetrant testing became practical industrial methods.","DIGITAL ERA":"Digital detectors, phased-array electronics, TOFD, encoded scanners and computerised data analysis improved inspection coverage, storage and review. Modern inspections increasingly retain traceable digital records.","THE FUTURE":"Robotics, automated scanning, advanced sensors, digital twins and machine-learning-assisted analysis are expanding inspection capability. Procedure control, validation, data quality and qualified human judgement remain essential."};
