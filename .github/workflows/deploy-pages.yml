name: Deploy UT Masterclass Academy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate required files
        run: |
          test -f index.html
          test -f legacy.html
          test -f academy.css
          test -f academy-data.js
          test -f academy-app.js
          test -f supabase-config.js
          test -f formula-library.js
          test -f academy-sections.js
          test -f admin-dashboard.js
          test -f certificate.html
          test -f verify-certificate.html
          test -f supabase/schema.sql
          test -f supabase/seed.sql
          test -f supabase/functions/final-exam/index.ts
          test -f supabase/functions/verify-certificate/index.ts
          test -f supabase/functions/certificate-pdf/index.ts
          node --check formula-library.js
          node --check academy-sections.js
          node --check admin-dashboard.js
          node --check academy-data.js
          node --check academy-app.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript was found to validate")
          Path("/tmp/utma-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/utma-inline.js
          grep -q "UT Masterclass Academy" index.html
      - name: Prepare static site
        run: |
          mkdir -p _site/supabase/migrations
          cp index.html legacy.html academy.css academy-data.js academy-app.js supabase-config.js formula-library.js academy-sections.js admin-dashboard.js certificate.html verify-certificate.html .nojekyll _site/
          cp supabase/schema.sql supabase/seed.sql _site/supabase/
          cp supabase/migrations/*.sql _site/supabase/migrations/
          cp README.md _site/README.md
          cp .env.example _site/.env.example
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
