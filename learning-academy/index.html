*{box-sizing:border-box}body{margin:0;background:#fff;color:#30272a;font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--orange)}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 15px #2d0a1408}.top-inner{max-width:1200px;margin:auto;padding:13px 22px;display:flex;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:12px;min-width:235px;border:0;background:none;text-align:left;color:var(--maroon)}.brand-mark{display:grid;place-items:center;width:42px;height:42px;background:var(--maroon);color:#fff;border-radius:13px;font-weight:900;letter-spacing:-2px}.brand strong{display:block;font-size:14px;line-height:1.2}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;margin-top:4px}.nav{display:flex;align-items:center;gap:5px;flex:1;justify-content:flex-end}.nav button{border:0;background:transparent;border-radius:9px;padding:9px 11px;color:#5d5154;font-size:12px;font-weight:750}.nav button:hover,.nav button.active{background:#fff0e6;color:var(--maroon)}.mobile{display:none;margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;color:var(--maroon)}main{max-width:1200px;margin:auto;padding:26px 22px 60px}.crumb{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:0 0 20px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:10px 15px;font-size:12px;font-weight:800;text-decoration:none;transition:.15s}.primary{background:var(--orange);color:#fff}.primary:hover{background:#a74718}.outline{background:#fff;border-color:#e4d6d0;color:var(--maroon)}.soft{background:#fff0e6;color:var(--maroon)}.dark{background:var(--maroon);color:#fff}.hero{background:linear-gradient(125deg,#fff8f3,#f wrap:wrap;justify-content:space-between;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.quizbox{max-width:820px;margin:auto;padding:clamp(20px,4vw,35px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.answer{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:13px;margin:9px 0;background:#fff;border:1px solid var(--line);border-radius:10px;color:#30272a}.answer.selected{border-color:var(--orange);background:#fff8f3}.answer.correct{border-color:#8ab79a;background:#f1fbf4}.answer.wrong{border-color:#d28b8b;background:#fff5f5}.answer b{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--grey);font-size:11px}.feedback{padding:14px;border-radius:10px;background:var(--warm);margin-top:13px;font-size:13px}.empty{padding:28px;border:1px dashed #dfc9be;border-radius:14px;text-align:center;color:var(--muted);grid-column:1/-1}.footer{background:var(--deep);color:#fff;padding:28px 22px}.footer-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footer p{margin:4px 0;color:#ead8d9;font-size:11px}.footer strong{font-size:13px}.disclaimer{font-size:11px;color:var(--muted);margin-top:22px}
@media(max-width:950px){.top-inner{flex-wrap:wrap}.mobile{display:block}.nav{display:none;flex:1 0 100%;justify-content:flex-start;flex-wrap:wrap}.nav.open{display:flex}.stats{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(2,minmax(0,1fr))}.lesson-layout{grid-template-columns:1fr}.lesson-aside{position:static;order:-1}.lesson-aside ul{columns:2}}@media(max-width:620px){.top-inner{padding:10px 14px;gap:10px}.brand{min-width:0}.brand strong{font-size:12px}.brand small{font-size:9px}.brand-mark{width:38px;height:38px}main{padding:17px 14px 40px}.two,.three{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.toolbar .small{padding:4px}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:21px}.page-hero{padding:21px}.hero{padding:25px 20px}.hero:after{font-size:170px;bottom:-50px}.module-foot{align-items:flex-start;flex-direction:column}.module-foot .btn{width:100%}.lesson-aside ul{columns:1}.lesson-buttons .btn{flex:1 1 100%}.lesson-content,.lesson-aside{padding:20px}}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const course=[
{id:"intro",phase:"Foundation",time:"35 min",title:"Introduction to NDT",summary:"Understand the role of non-destructive testing in quality, safety and asset integrity.",objectives:["Distinguish NDT, NDE and NDI in common usage.","Explain indications, discontinuities, defects and false calls.","Identify factors used to select a method."],sections:[["What NDT means","Non-destructive testing examines a material or component without impairing its intended future use. NDE often emphasizes characterization and evaluation; NDI is used in some industries for inspection. Terminology varies by sector, so follow the governing procedure."],["Why inspection matters","NDT can help identify manufacturing anomalies, service damage, corrosion, wear and material changes. Results support quality and engineering decisions, but do not replace design analysis, maintenance history or specified acceptance criteria."],["Indication, discontinuity and defect","An indication is a response observed during examination. It may be relevant, non-relevant or false. A discontinuity is a local interruption in material structure or configuration. A defect is a condition that fails defined requirements; never label every indication a defect without evaluation."],["Selecting a method","Consider material, expected discontinuity, location and orientation, component geometry, surface state, access, required sensitivity, environment, production rate, personnel qualification and applicable procedure. Different methods often complement one another."]],key:"A signal is evidence to interpret—not an automatic acceptance or rejection decision."},
{id:"math",phase:"Foundation",time:"50 min",title:"Mathematics for NDT",summary:"Build the unit conversion, algebra, trigonometry and uncertainty skills used in inspection calculations.",objectives:["Convert SI units correctly.","Rearrange equations and check dimensions.","Use basic trigonometry for sound-path geometry."],sections:[["Units first","Write the quantity and unit at every step. Convert MHz to Hz by multiplying by 10⁶, microseconds to seconds by multiplying by 10⁻⁶, and millimetres to metres by multiplying by 10⁻³. Do not mix units inside one equation."],["Rearranging equations","For v = fλ, wavelength is λ = v/f and frequency is f = v/λ. Rearrange first, convert units, then substitute values. Estimate whether the result is physically plausible."],["Basic geometry","For a right triangle, sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse and tan θ = opposite/adjacent. Define whether an angle is measured from the surface or the normal before calculating."],["Uncertainty","A displayed decimal count does not guarantee accuracy. Consider calibration, resolution, coupling, velocity, geometry and repeatability. Report precision appropriate to the measuring system and procedure."]],key:"Dimensional analysis catches many calculation errors before they reach a report."},
{id:"physics",phase:"Foundation",time:"55 min",title:"Physics of Waves",summary:"Understand wave speed, frequency, wavelength, reflection, refraction, attenuation and noise.",objectives:["Relate velocity, frequency and wavelength.","Explain longitudinal and shear wave motion.","Describe reflection, refraction and attenuation."],sections:[["Wave parameters","Velocity v is related to frequency f and wavelength λ by v = fλ. In a fixed material and wave mode, velocity is mainly determined by material properties; increasing frequency reduces wavelength."],["Wave modes","Longitudinal waves involve particle motion approximately parallel to propagation. Transverse or shear waves involve motion approximately perpendicular to propagation. Surface and guided waves have distinct propagation behaviour and application constraints."],["Interfaces and reflection","At an interface, energy may reflect, transmit, refract or convert mode. The response depends on acoustic impedance, incidence angle, interface condition and wave mode. Snell’s law relates angles and velocities for mode conversion."],["Attenuation and noise","Amplitude can decrease through absorption, scattering, beam spread and interface losses. Grain structure, electronics, coupling and geometry can create noise that obscures weak responses. Signal-to-noise ratio and repeatable technique matter."]],key:"Never transfer velocity, angle or calibration from one material or wave mode to another without checking the procedure."},
{id:"materials",phase:"Foundation",time:"55 min",title:"Materials Science & Metallurgy",summary:"Connect material structure, properties, manufacturing and failure to NDT response.",objectives:["Describe common material families.","Explain how grain structure affects UT response.","Recognize manufacturing and service discontinuities."],sections:[["Material families","Metals, polymers, ceramics and composites have different mechanical, thermal, electrical and acoustic properties. Isotropic materials behave similarly in different directions; anisotropic materials can show direction-dependent behaviour."],["Microstructure and processing","Grain size, texture, heat treatment, porosity, fibre orientation and bonding can affect wave propagation, conductivity, permeability or thermal response. Process history is often essential context for interpreting results."],["Discontinuities by origin","Casting can produce shrinkage and porosity; welding can produce lack of fusion or inclusions; forming can produce laps; service can produce fatigue cracking, corrosion and wear. Detectability depends on method and technique."],["Detection versus failure analysis","An NDT response does not alone determine remaining life or structural fitness. Engineering assessment may require dimensions, loading, material data, growth mechanisms and acceptance criteria."]],key:"Know the material and manufacturing history before interpreting an unusual response."},
{id:"ut",phase:"Ultrasonic Testing",time:"60 min",title:"Ultrasonic Testing Fundamentals",summary:"Learn how ultrasonic pulses, echoes, sound paths and time-of-flight support inspection.",objectives:["Explain pulse-echo operation.","Interpret the basic A-scan axes.","Understand probe, couplant, range and sensitivity."],sections:[["Pulse-echo principle","A piezoelectric probe converts an electrical pulse into mechanical vibration. Sound enters the component through couplant. Interfaces and reflectors return some energy; the probe converts received vibration into an electrical signal."],["A-scan display","The horizontal axis represents time or calibrated sound path; the vertical axis represents signal amplitude. A response may arise from a back wall, geometry, a discontinuity, coupling change or noise. Context and repeatability are needed."],["Frequency and wavelength","Wavelength follows λ = v/f. Higher frequency generally gives shorter wavelength and may improve resolution, but often increases attenuation and sensitivity to surface condition or grain scattering. Select the probe for the material and procedure."],["Calibration and scanning","Checks can include range, zero, velocity, sensitivity, probe index and angle, depending on the technique. Reference blocks and checks must match the applicable procedure. Coverage, probe movement and limitations should be documented."],["Common interpretation errors","Do not equate amplitude alone with defect size. Reflector orientation, beam spread, coupling, attenuation and geometry influence the response. Separate calibration verification from actual evaluation against acceptance criteria."]],key:"A stable, calibrated setup and a known sound path are prerequisites for meaningful interpretation."},
{id:"cal",phase:"Ultrasonic Testing",time:"45 min",title:"UT Calibration & A-Scan Interpretation",summary:"Study range, zero, sensitivity, reference reflectors and disciplined signal interpretation.",objectives:["Explain range and zero settings.","Differentiate calibration and sensitivity.","Recognize geometric echoes and noise."],sections:[["Range and zero","Range controls the displayed time or sound-path window. Zero correction accounts for delays in the probe, wedge and instrument setup. Incorrect settings shift the apparent location of reflectors."],["Sensitivity and reference response","Sensitivity establishes how strongly a response is displayed. Reference reflectors and specified levels support repeatable checks; the correct reflector and method depend on the procedure. A larger screen response is not automatically a larger flaw."],["DAC and TCG concepts","Distance-amplitude correction (DAC) records how reference response changes with distance. Time-corrected gain (TCG) adjusts gain with time to compensate for expected distance-related amplitude change. Their use and verification are procedure-specific."],["Signal interpretation","Compare location, shape, repeatability, movement with probe position, expected geometry and reference response. Record uncertain results and escalate ambiguous indications rather than forcing a conclusion."]],key:"Calibration makes readings traceable; acceptance criteria determine what the readings mean."},
{id:"paut",phase:"Advanced Methods",time:"55 min",title:"Phased Array Ultrasonic Testing (PAUT)",summary:"Understand array elements, focal laws, beam steering, sector scans and encoded data.",objectives:["Explain time-delay focal laws.","Distinguish steering and focusing.","Recognize calibration and scan-plan risks."],sections:[["Array principle","A phased-array probe contains multiple small elements. A focal law applies selected timing delays so transmitted wavefronts combine to steer or focus the beam. Elements may transmit and receive under a programmed sequence."],["Scan views","Linear scans and sectorial scans present data using different beam sequences. A displayed image is a representation of acquired responses, not a photograph of a flaw. Probe position, encoder data, calibration and display settings matter."],["Calibration and scan plan","Verify material velocity, wedge delay, index point, sensitivity, focal laws, encoder response and coverage as required by the written procedure. The scan plan must account for weld geometry and expected flaw orientation."],["Limitations","Incorrect wedge parameters, focal laws, probe placement, coupling or encoder calibration can create misleading images or coverage gaps. PAUT does not remove the need for qualified interpretation and procedure compliance."]],key:"A convincing image is only as reliable as its scan plan, calibration and acquired data."},
{id:"tofd",phase:"Advanced Methods",time:"45 min",title:"Time-of-Flight Diffraction (TOFD)",summary:"Study transmitter-receiver geometry, tip diffraction, sizing and near-surface dead zones.",objectives:["Identify lateral and back-wall waves.","Explain tip diffraction and sizing.","Understand dead zones and uncertainty."],sections:[["Geometry","A transmitter and receiver are placed on opposite sides of an examination zone. The probe centre spacing and component geometry determine the sound paths and must be set and checked using the procedure."],["Signals","Typical displays include a lateral wave, diffracted signals from discontinuity tips and a back-wall response. Time differences can support location and sizing when the geometry and velocity model are appropriate."],["Dead zones and uncertainty","Near-surface regions can be difficult to assess because signals overlap or are masked. Geometry, attenuation, coupling, probe separation and ambiguous tip signals affect sizing. Report uncertainty and limitations."],["Encoded records","Stable scanning and position encoding support repeatable records. Data quality, scan coverage, calibration and analyst interpretation all contribute to a defensible result."]],key:"Sizing is a measurement with uncertainty, not a perfectly exact reading."},
{id:"pt",phase:"Surface Methods",time:"35 min",title:"Liquid Penetrant Testing (PT)",summary:"Understand capillary action, process stages, indications and material restrictions.",objectives:["Describe the standard process sequence.","Explain why surface preparation matters.","Recognize penetrant limitations."],sections:[["Principle","Penetrant enters surface-breaking discontinuities by capillary action. A developer helps draw penetrant back to the surface, making indications easier to observe."],["Process control","The process commonly includes pre-cleaning, drying, penetrant application, dwell, excess removal, developer application and inspection. Timing, temperature, cleanliness and compatibility must follow the specified process."],["What it can detect","PT can reveal suitable discontinuities that are open to the surface. It cannot reliably detect subsurface discontinuities that do not connect to the surface."],["Evaluation and safety","Background staining, poor removal, insufficient dwell or unsuitable surface condition can affect interpretation. Use compatible chemicals, required PPE, ventilation and the approved procedure."]],key:"Penetrant testing reveals surface-breaking conditions only."},
{id:"mt",phase:"Surface Methods",time:"35 min",title:"Magnetic Particle Testing (MT)",summary:"Learn magnetic flux leakage, particle accumulation, magnetisation and material limits.",objectives:["Explain flux leakage at discontinuities.","Compare magnetisation directions.","Recognize ferromagnetic material restrictions."],sections:[["Principle","Magnetisation creates magnetic flux in a ferromagnetic component. A surface or near-surface discontinuity can disturb the field and cause flux leakage. Magnetic particles gather where leakage is sufficient."],["Field direction","Detection depends on the relation between discontinuity orientation and magnetic field direction. More than one magnetisation direction may be required to achieve coverage."],["Material restriction","MT is used on ferromagnetic materials. It is not suitable for non-ferromagnetic aluminium or austenitic stainless steel in the same way as ferromagnetic components."],["Process quality","Surface condition, field strength and direction, particle condition, lighting or UV conditions for the selected system, and demagnetisation requirements must be controlled."]],key:"A discontinuity may be missed if the magnetic field is poorly oriented."},
{id:"et",phase:"Electromagnetic Methods",time:"40 min",title:"Eddy Current Testing (ET)",summary:"Understand electromagnetic induction, coil impedance, skin effect and lift-off.",objectives:["Explain induced currents.","Describe frequency and skin effect.","Recognize lift-off and conductivity influences."],sections:[["Induction","An alternating current in a probe coil creates a changing magnetic field. That field induces eddy currents in a conductive test object; the currents produce a secondary field that changes coil impedance."],["Frequency and depth","Higher frequency generally concentrates response nearer the surface; lower frequency tends to increase penetration but can reduce sensitivity to small near-surface changes. Actual response depends on conductivity, permeability, geometry and probe design."],["Influence factors","Lift-off, edge effect, conductivity, permeability, coating thickness, probe orientation and temperature can change the signal. Reference standards and suitable frequency selection help distinguish these effects."],["Applications and limits","ET can support crack detection, conductivity sorting, coating measurement and tube examination when an appropriate technique is qualified. It requires electrical conductivity and careful control of geometry and calibration."]],key:"A signal change can reflect a flaw or a material/setup variable—interpret with references and context."},
{id:"rt",phase:"Radiographic Methods",time:"40 min",title:"Radiographic Testing (RT)",summary:"Understand attenuation, image formation, image quality and radiation safety.",objectives:["Explain differential attenuation.","Describe image quality indicators.","Recognize radiation safety responsibilities."],sections:[["Image formation","X-rays or gamma rays pass through a component and are attenuated according to material thickness, density, composition and beam energy. A detector records the transmitted intensity pattern."],["Image quality","Image quality indicators help demonstrate aspects of image quality under a specified technique. Exposure geometry, source-to-object distance, detector condition, scatter and processing influence the image."],["Interpretation","A radiographic image is a projection; overlapping geometry can hide or confuse features. Technique selection and viewing conditions affect whether a discontinuity is visible."],["Radiation protection","Ionizing radiation requires strict legal controls, trained personnel, controlled areas, monitoring and approved safety procedures. Never conduct radiography without the required authorisation and protection arrangements."]],key:"Radiation safety is mandatory and cannot be replaced by a training webpage."},
{id:"vt",phase:"Surface Methods",time:"25 min",title:"Visual Testing (VT)",summary:"Understand lighting, access, viewing conditions, optical aids and recording.",objectives:["Explain factors that affect visibility.","Identify common visual inspection tools.","Record access and coverage limitations."],sections:[["Visual principle","Visual testing relies on adequate visibility of the surface or feature. Lighting, viewing angle, distance, cleanliness, contrast, access and visual acuity affect reliability."],["Tools","Mirrors, magnifiers, cameras, borescopes, weld gauges and dimensional tools can extend viewing or measurement capability. Tools must be suitable for the required feature and environment."],["Inspection records","Record the area examined, relevant observations, measurements, images where appropriate, and inaccessible or obscured regions. A clean-looking surface is not evidence against subsurface flaws."],["Limitations","Only visible or optically accessible conditions can be assessed. Surface preparation and safe access may be necessary before meaningful examination."]],key:"Good visual inspection is systematic, well-lit and traceable."}
];
let saved={};try{saved=JSON.parse(localStorage.getItem("ndt-academy-standalone-progress-v1")||"{}")}catch(e){saved={}}if(!saved||typeof saved!=="object")saved={};
let page="home",activeId=null,search="",phase="All",quiz=null,choice=null,answered=false,score=0;
const completed=()=>saved.completed&&typeof saved.completed==="object"?saved.completed:(saved.completed={});
function persist(){try{localStorage.setItem("ndt-academy-standalone-progress-v1",JSON.stringify(saved))}catch(e){}}
function progress(){let n=course.filter(m=>completed()[m.id]).length;return {n,p:course.length?Math.round(n/course.length*100):0}}
function header(title,desc){return '<div class="crumb"><button class="btn outline" data-page="academy">← Learning Academy</button><span>›</span><span>'+esc(title)+'</span></div><section class="page-hero"><div class="eyebrow">Self-paced theory course</div><h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></section>'}
function home(){let p=progress();return '<section class="hero"><div class="eyebrow">Understand the science behind every signal</div><h1>Learn NDT from first principles to advanced methods.</h1><p>A fresh, independent learning portal with structured theory modules, practical explanations and knowledge checks. Study at your own pace and track your progress without relying on the previous website’s Learning Academy code.</p><div class="actions"><button class="btn primary" data-page="academy">Start learning →</button><button class="btn outline" data-page="methods">Explore NDT methods</button></div><div class="note">Education only: this academy does not issue ASNT, ISO 9712, PCN, NAS 410 or Level II/III personnel certification.</div></section><div class="stats"><div class="stat"><strong>'+course.length+'</strong><span>Structured theory modules</span></div><div class="stat"><strong>'+p.n+'/'+course.length+'</strong><span>Modules completed</span></div><div class="stat"><strong>'+p.p+'%</strong><span>Course progress</span></div><div class="stat"><strong>11</strong><span>NDT topic areas</span></div></div><div class="grid three"><article class="card"><span class="tag">01 · LEARN</span><h3>Detailed lessons</h3><p>Study objectives, section-by-section explanations and key takeaways across foundations, UT and other methods.</p><div class="actions"><button class="btn primary" data-page="academy">Browse lessons →</button></div></article><article class="card"><span class="tag">02 · EXPLORE</span><h3>Understand each method</h3><p>Compare physical principles, use cases, strengths and limitations of the main NDT methods.</p><div class="actions"><button class="btn outline" data-page="methods">Explore methods →</button></div></article><article class="card"><span class="tag">03 · CHECK</span><h3>Test your knowledge</h3><p>Try a short randomized quiz and read the explanation after each answer.</p><div class="actions"><button class="btn outline" data-page="quiz">Start quiz →</button></div></article></div>'}
function academy(){let p=progress();let phases=["All",...new Set(course.map(m=>m.phase))];let rows=course.filter(m=>(phase==="All"||m.phase===phase)&&(!search||(m.title+" "+m.summary+" "+m.phase+" "+m.sections.map(s=>s.join(" ")).join(" ")).toLowerCase().includes(search.toLowerCase())));return header("Learning Academy","Study the modules in sequence, search by topic, and open any lesson to view its detailed explanation. Your progress is saved locally in this browser.")+'<div class="progress-head"><span><strong>'+p.n+' of '+course.length+'</strong> modules completed</span><strong>'+p.p+'%</strong></div><div class="progress-track"><span style="width:'+p.p+'%"></span></div><div class="toolbar"><input class="field" id="lessonSearch" value="'+esc(search)+'" placeholder="Search modules or concepts…" aria-label="Search lessons"><select id="phaseSelect" aria-label="Filter course phase">'+phases.map(v=>'<option '+(v===phase?'selected':'')+' value="'+esc(v)+'">'+esc(v==="All"?"All course phases":v)+'</option>').join("")+'</select><span class="small" style="align-self:center">'+rows.length+' modules</span></div><div class="grid two">'+rows.map((m,i)=>'<article class="card module-card"><div class="meta"><span class="tag">'+esc(m.phase)+'</span><span class="small">'+esc(m.time)+'</span></div><h3>'+(course.indexOf(m)+1)+'. '+esc(m.title)+'</h3><p class="description">'+esc(m.summary)+'</p><details class="objectives"><summary>Learning objectives</summary><ul>'+m.objectives.map(o=>'<li>'+esc(o)+'</li>').join("")+'</ul></details><div class="module-foot"><span class="small '+(completed()[m.id]?'done':'')+'">'+(completed()[m.id]?'✓ Completed':'○ Not completed')+'</span><button class="btn primary" data-open="'+esc(m.id)+'">Study module →</button></div></article>').join("")+(rows.length?"":'<div class="empty">No modules found. Change your search or select all phases.</div>')+'</div><p class="disclaimer">A completed module is a personal study record, not a personnel qualification.</p>'}
function lesson(id){let m=course.find(x=>x.id===id);if(!m){page="academy";return academy()}activeId=id;let i=course.indexOf(m),prev=course[(i-1+course.length)%course.length],next=course[(i+1)%course.length],done=!!completed()[id];return '<div class="crumb"><button class="btn outline" data-page="academy">← All modules</button><span>›</span><span>'+esc(m.title)+'</span></div><div class="lesson-layout"><article class="lesson-content"><div class="kicker">'+esc(m.phase)+' · '+esc(m.time)+'</div><h1>'+esc(m.title)+'</h1><p class="lesson-lead">'+esc(m.summary)+'</p><div class="note"><strong>Learning objectives</strong><ul>'+m.objectives.map(o=>'<li>'+esc(o)+'</li>').join("")+'</ul></div>'+m.sections.map((s,j)=>'<section class="section-row"><div class="section-num">'+String(j+1).padStart(2,"0")+'</div><div><h2>'+esc(s[0])+'</h2><p>'+esc(s[1])+'</p></div></section>').join("")+'<div class="note"><strong>Key takeaway:</strong> '+esc(m.key)+'</div><div class="lesson-buttons"><button class="btn '+(done?'soft':'primary')+'" data-complete="'+esc(id)+'">'+(done?'✓ Completed — undo':'Mark module complete ✓')+'</button><button class="btn outline" data-open="'+esc(prev.id)+'">← Previous</button><button class="btn primary" data-open="'+esc(next.id)+'">Next module →</button></div><p class="disclaimer">Use the applicable approved procedure, qualification and supervision for real inspection work. This lesson is theory only.</p></article><aside class="lesson-aside"><div class="kicker">Module outline</div><h3>'+esc(m.title)+'</h3><p class="small">'+esc(m.phase)+' · '+esc(m.time)+'</p><ul>'+m.sections.map((s,j)=>'<li><a href="#lesson-section-'+j+'">'+esc(s[0])+'</a></li>').join("")+'</ul><h3>Course progress</h3><div class="progress-head"><span>'+progress().n+' / '+course.length+'</span><strong>'+progress().p+'%</strong></div><div class="progress-track"><span style="width:'+progress().p+'%"></span></div><button class="btn dark" style="width:100%;margin-top:16px" data-page="academy">Return to modules</button></aside></div>'}
function methods(){const methods=[["UT","Ultrasonic Testing","High-frequency sound pulses and returning echoes support thickness measurement and detection of suitable internal reflectors."],["PAUT","Phased Array UT","Multiple array elements and controlled delays steer or focus beams for encoded imaging."],["TOFD","Time-of-Flight Diffraction","Diffracted signals from discontinuity tips support location and sizing under a qualified geometry."],["RT","Radiographic Testing","X-rays or gamma rays create a projection image through differential attenuation; strict radiation safety applies."],["ET","Eddy Current Testing","Electromagnetic induction reveals changes in conductive materials and is sensitive to lift-off and material variables."],["MT","Magnetic Particle Testing","Magnetic flux leakage attracts particles at suitable surface and near-surface discontinuities in ferromagnetic materials."],["PT","Liquid Penetrant Testing","Capillary action reveals suitable discontinuities open to the surface."],["VT","Visual Testing","Systematic viewing, lighting, optical aids and measurement support assessment of visible conditions."],["LT","Leak Testing","Pressure, vacuum, tracer gas or other specified methods detect leakage through a boundary."],["IRT","Infrared Thermography","Thermal patterns and transients help identify anomalies when emissivity, heat flow and environment are controlled."],["AE","Acoustic Emission","Transient elastic waves from active sources are monitored during loading or operation; source location and interpretation require a qualified plan."]];return header("NDT Methods","A quick reference to the physical principle and major limitations of commonly used non-destructive testing methods.")+'<div class="grid three">'+methods.map(m=>'<article class="card"><span class="tag">'+esc(m[0])+'</span><h3>'+esc(m[1])+'</h3><p>'+esc(m[2])+'</p></article>').join("")+'</div><div class="note">Method selection depends on material, geometry, discontinuity type and orientation, access, sensitivity requirements, procedure and applicable code or standard.</div>'}
const questions=[{q:"Which relationship connects wave velocity, frequency and wavelength?",a:["v = fλ","v = f/λ","v = λ/f","v = f + λ"],c:0,w:"Wave velocity equals frequency multiplied by wavelength: v = fλ."},{q:"What does an A-scan's horizontal axis commonly represent?",a:["Only defect size","Time or calibrated sound path","Probe temperature","Material hardness"],c:1,w:"An A-scan displays amplitude against time or calibrated sound path."},{q:"What is the primary limitation of liquid penetrant testing?",a:["It only works on ferromagnetic materials","It requires ionizing radiation","It reveals suitable surface-breaking discontinuities","It always sizes subsurface cracks"],c:2,w:"Penetrant testing requires the discontinuity to be open to the surface."},{q:"What can cause a UT amplitude change besides a flaw?",a:["Only a crack","Coupling, geometry, orientation or attenuation","Only frequency","Nothing else"],c:1,w:"Many material, geometric and setup variables influence amplitude."},{q:"Which method requires a ferromagnetic test material?",a:["PT","RT","MT","VT"],c:2,w:"Magnetic particle testing relies on magnetisation and flux leakage in ferromagnetic materials."},{q:"What does DAC stand for in conventional UT?",a:["Data amplitude calibration","Distance-amplitude correction","Dynamic angle coupling","Direct acoustic conversion"],c:1,w:"DAC represents reference response amplitude as a function of distance."},{q:"What is a key radiation protection requirement for RT?",a:["Operate without a controlled area","Use the approved radiation safety controls and authorisation","Use couplant on every exposure","Only inspect in daylight"],c:1,w:"Radiography requires legally compliant controls, trained personnel and approved safety procedures."},{q:"What is the role of a PAUT focal law?",a:["Set the acceptance code automatically","Assign element timing delays to steer or focus a beam","Measure hardness directly","Remove all noise"],c:1,w:"Focal laws control timing across array elements to form the intended beam."},{q:"What does eddy current testing require?",a:["Electrical conductivity in the test object","Only transparent materials","A magnetic particle bath","An X-ray source"],c:0,w:"ET uses electromagnetic induction in conductive materials."},{q:"Does a self-study completion badge qualify someone to sign NDT reports?",a:["Yes, for every method","Yes, after one quiz","No; qualification and authorisation follow the applicable scheme","Only if printed"],c:2,w:"This learning portal is not a personnel certification provider."},{q:"What is the principal purpose of a reference block?",a:["Replace the procedure","Support specified calibration or verification checks","Guarantee every flaw is detected","Determine material chemistry"],c:1,w:"Reference blocks support the checks defined by the applicable technique and procedure."},{q:"What does a higher frequency generally do to wavelength in the same material and wave mode?",a:["Increase it","Decrease it","Leave it infinite","Make it independent of velocity"],c:1,w:"Since λ = v/f, wavelength decreases as frequency increases when velocity is fixed."}];
function startQuiz(){quiz=questions.map((q,i)=>({...q,orig:i})).sort(()=>Math.random()-.5).slice(0,8);choice=null;answered=false;score=0;quizIndex=0;page="quiz";render()}
let quizIndex=0;
function quizPage(){if(!quiz)startQuiz();let q=quiz[quizIndex];return header("Knowledge Check","Answer each question and review the explanation. This short practice quiz is for learning only, not a certification examination.")+'<div class="quizbox"><div class="meta"><span class="tag">Question '+(quizIndex+1)+' of '+quiz.length+'</span><span class="small">Correct: '+score+'</span></div><div class="progress-track" style="margin:14px 0 20px"><span style="width:'+((quizIndex+(answered?1:0))/quiz.length*100)+'%"></span></div><h2 style="color:var(--maroon);line-height:1.35">'+esc(q.q)+'</h2>'+q.a.map((a,i)=>'<button class="answer '+(choice===i?'selected ':'')+(answered&&i===q.c?'correct ':'')+(answered&&choice===i&&i!==q.c?'wrong':'')+'" data-choice="'+i+'" '+(answered?'disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b><span>'+esc(a)+'</span></button>').join("")+(answered?'<div class="feedback">'+(choice===q.c?'Correct. ':'Review this point. ')+esc(q.w)+'</div>':'')+'<div class="lesson-buttons">'+(answered?'<button class="btn primary" data-quiz-next>'+(quizIndex===quiz.length-1?'View results':'Next question →')+'</button>':'<button class="btn primary" data-submit>Check answer</button>')+'<button class="btn outline" data-quiz-restart>Restart quiz</button></div></div>'}
function progressPage(){let p=progress();return header("My Progress","Your completion data is stored in this browser on this device. Clearing browser storage may remove it.")+'<div class="grid three"><article class="card"><div class="kicker">Modules complete</div><h3 style="font-size:34px">'+p.n+'/'+course.length+'</h3><div class="progress-track"><span style="width:'+p.p+'%"></span></div><p style="margin-top:10px">'+p.p+'% of lessons marked complete.</p></article><article class="card"><div class="kicker">Continue learning</div><h3>Pick up where you left off</h3><p>Open any module and revisit the concepts as often as needed.</p><div class="actions"><button class="btn primary" data-page="academy">Browse modules →</button></div></article><article class="card"><div class="kicker">Qualification reminder</div><h3>Study is not certification</h3><p>Follow the applicable certification scheme, employer written practice and authorisation requirements.</p></article></div><div class="actions"><button class="btn outline" data-export>Export progress</button><button class="btn outline" data-reset>Reset progress</button></div><div class="note">Resetting removes completion data for this standalone learning portal only.</div>'}
function render(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.getAttribute("data-page")===page));if(page==="home")app.innerHTML=home();else if(page==="academy")app.innerHTML=academy();else if(page==="lesson")app.innerHTML=lesson(activeId);else if(page==="methods")app.innerHTML=methods();else if(page==="quiz")app.innerHTML=quizPage();else if(page==="progress")app.innerHTML=progressPage();app.focus({preventScroll:true})}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.hasAttribute("data-page")){page=b.getAttribute("data-page");activeId=null;if(page!=="quiz")quiz=null;document.querySelector("#nav").classList.remove("open");document.querySelector("#mobileNav").setAttribute("aria-expanded","false");render();window.scrollTo(0,0);return}if(b.hasAttribute("data-open")){activeId=b.getAttribute("data-open");page="lesson";render();window.scrollTo(0,0);return}if(b.hasAttribute("data-complete")){let id=b.getAttribute("data-complete");completed()[id]=!completed()[id];persist();render();return}if(b.hasAttribute("data-choice")&&!answered){choice=Number(b.getAttribute("data-choice"));render();return}if(b.hasAttribute("data-submit")){if(choice===null)return;answered=true;if(choice===quiz[quizIndex].c)score++;render();return}if(b.hasAttribute("data-quiz-next")){if(quizIndex===quiz.length-1){let pct=Math.round(score/quiz.length*100);app.innerHTML=header("Quiz Results","Review the learning points and try another question set whenever you are ready.")+'<div class="quizbox"><div class="kicker">Attempt complete</div><h1 style="color:var(--maroon);font-size:42px">'+pct+'%</h1><p>You answered '+score+' of '+quiz.length+' questions correctly.</p><div class="progress-track"><span style="width:'+pct+'%"></span></div><div class="actions"><button class="btn primary" data-quiz-restart>Try another quiz</button><button class="btn outline" data-page="academy">Review lessons</button></div><div class="note">This score is a self-study record and is not an NDT personnel certification result.</div></div>';page="quiz";quiz=null}else{quizIndex++;choice=null;answered=false;render()}return}if(b.hasAttribute("data-quiz-restart")){startQuiz();return}if(b.hasAttribute("data-export")){let blob=new Blob([JSON.stringify({completed:completed(),exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});let u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="ndt-learning-progress.json";a.click();URL.revokeObjectURL(u);return}if(b.hasAttribute("data-reset")){if(confirm("Reset this standalone academy's saved progress?")){saved={completed:{}};persist();render()}return}});
document.addEventListener("input",e=>{if(e.target.id==="lessonSearch"){search=e.target.value;let cursor=e.target.selectionStart;app.innerHTML=academy();let x=$("#lessonSearch");x.focus();x.setSelectionRange(cursor,cursor)}});
document.addEventListener("change",e=>{if(e.target.id==="phaseSelect"){phase=e.target.value;render()}});
$("#mobileNav").addEventListener("click",()=>{let nav=$("#nav"),opened=nav.classList.toggle("open");$("#mobileNav").setAttribute("aria-expanded",String(opened))});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#nav").classList.remove("open");$("#mobileNav").setAttribute("aria-expanded","false")}});
render();
})();
</script></body></html>
